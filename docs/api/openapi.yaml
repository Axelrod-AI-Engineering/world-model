  parameters:
    WorldModelId:
      name: world_model_id
      in: path
      required: true
      description: The world model's id (GET /v1/world-models lists them)
      schema: *id018
    EntityId:
      name: entity_id
      in: path
      required: true
      description: The entity's id
      schema: *id018
    AttributeKey:
      name: attribute_key
      in: path
      required: true
      description: The attribute's key (`operating_profit`) or its full id (`toyota.operating_profit`)
      schema: *id018
    Version:
      name: version
      in: query
      required: false
      description: Read this committed version
      schema:
        type: integer
        minimum: 1
    AsOf:
      name: as_of
      in: query
      required: false
      description: Read the state at the last day closed at or before this time (UTC when no zone)
      schema: *id020
    Limit:
      name: limit
      in: query
      required: false
      description: Page size
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: The `meta.next_cursor` of the previous page
      schema: *id018
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 'Makes a retry safe: the same key with the same body returns the first answer; with another body, 422 idempotency_key_reused'
      schema:
        type: string
        minLength: 1
        maxLength: 255
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The ETag of the version the change was reviewed against (`"<state_hash>"`); required
      schema: *id018
    TraceParent:
      name: traceparent
      in: header
      required: false
      description: A W3C trace context; echoed on the response
      schema: *id018
    Include:
      name: include
      in: query
      required: false
      description: 'What to nest: attributes (the default) and, with relationships, the links into and out of them'
      schema:
        type: string
        enum:
        - attributes
        - relationships
        - attributes,relationships
    VersionRefPath:
      name: version_ref
      in: path
      required: true
      description: A version number, or `latest`
      schema:
        type: string
