components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'A short-lived token core mints per call (docs/design/core-mcp-auth.md): ES256, `typ: at+jwt`, verified
        against the issuer''s JWKS. Claims: `iss` (a trusted issuer), `aud` (this service), `exp` (5 minutes), `iat`, `jti`,
        `sub` (the org user), `org` (the organization: the tenant), `scope` (space-separated), `azp` (core-mcp or core-web),
        `name` (optional), and `act` ({sub, name}) when an agent host drives the call. A token with `act` or `azp: core-mcp`
        never decides a change.'
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: static key
      description: 'A static scoped credential for a non-core caller (WORLD_MODEL_API_KEYS: `caller:key:org:scope+scope`).
        It names a service, not a person, and never carries changes:review.'
    session:
      type: apiKey
      in: cookie
      name: axelrod_session
      description: A person signed in to this service (its review UI and /docs).
  schemas:
    EntityType:
      type: string
      enum:
      - company
      - person
      - agency
      - market
      - macro_factor
      - external_factor
      - other
      description: What an entity is. A security or a sector is modelled as a market or a group, not as its own type.
    RelationshipType:
      type: string
      enum:
      - causal
      - learned_causal
      - accounting
      - identity
      - stock_flow
      description: 'causal: a mechanism with a size; learned_causal: promoted from co-movement; accounting: a part adds to
        its total (fixed weight); identity: a term of a product, ratio or difference (weight derived); stock_flow: a flow
        accumulating into a stock.'
    Calibration:
      type: string
      enum:
      - calibrated
      - uncalibrated
      description: 'uncalibrated: the mechanism and its sign are known, its size is not (effect is null, never 0).'
    Sign:
      type: string
      enum:
      - positive
      - negative
      description: The direction a rise in the source moves the target.
    Direction:
      type: string
      enum:
      - unidirectional
      - bidirectional
      description: Whether the relationship also acts from target to source.
    RelationshipStatus:
      type: string
      enum:
      - active
      - retired
      description: Retired relationships stay as history (valid_to is set).
    Origin:
      type: string
      enum:
      - construction
      - event_parsing
      - frontier_promotion
      - inference
      - human
      - seed
      description: How the object entered the model.
    EpistemicType:
      type: string
      enum:
      - documented
      - observed
      - reported
      - broker
      - guidance
      - model
      - assumption
      - expert_judgment
      - inferred
      description: 'What kind of claim it is: a fact from a filing or data release (documented, observed), a report, a broker
        or company view, a model output, an assumption, or an inference by the model. Facts are kept apart from inferences.'
    EvidenceType:
      type: string
      enum:
      - company_filing
      - data_release
      - news
      - broker_research
      - reviewer
      - model
      - historical_data
      description: The kind of source an evidence record cites.
    CompositionRole:
      type: string
      enum:
      - driving
      - reconciling
      - non_additive
      description: 'driving: its parts'' accounting relationships carry changes into the total; reconciling: observed and
        reconciled against the total, never propagating into it; non_additive: its parts overlap (a view that is not a
        sum).'
    EventType:
      type: string
      enum:
      - news
      - data_release
      - company_filing
      - research
      description: The kind of market event.
    EventChannel:
      type: string
      enum:
      - scraper
      - data_feed
      - user
      description: How the event reached the model.
    SourceType:
      type: string
      enum:
      - broker_research
      - expert_call
      - news
      - central_bank
      - data
      - filing
      - client_model
      - other
      description: Where a document comes from.
    DocumentStatus:
      type: string
      enum:
      - stored
      - parsed
      - extracted
      - imported
      - failed
      description: How far a document has been read.
    SearchMode:
      type: string
      enum:
      - keyword
      - prefix
      - semantic
      - graph
      - hybrid
      description: 'keyword: BM25 over passages; prefix: names, then passages, by word prefix; semantic: embedding similarity;
        graph: the nodes named and their neighbours, then passages mentioning them; hybrid: reciprocal-rank fusion of keyword,
        semantic and graph.'
    HitKind:
      type: string
      enum:
      - chunk
      - entity
      - attribute
      description: What a search hit is.
    ChangeKind:
      type: string
      enum:
      - graph_update
      - refinement
      - frontier_promotion
      - superentity_admission
      - superentity_dissolution
      - missing_relation
      description: What a change proposes.
    ChangeStatus:
      type: string
      enum:
      - pending
      - approved
      - rejected
      - deferred
      - auto_applied
      description: 'pending: waits for a person; approved: committed a version; rejected: never applied; deferred: set aside
        to fold in later; auto_applied: applied under a review policy.'
    JobType:
      type: string
      enum:
      - document_ingestion
      - document_extraction
      - change_proposal
      - simulation
      description: The work a job does.
    JobStatus:
      type: string
      enum:
      - queued
      - running
      - succeeded
      - failed
      description: Where a job is.
    ThesisMode:
      type: string
      enum:
      - scaffolded
      - open_ended
      - template
      description: How the thesis was posed.
    SimulationStatus:
      type: string
      enum:
      - completed
      description: A simulation is stored once it has run; it is immutable.
    ImpactDirection:
      type: string
      enum:
      - positive
      - negative
      description: Which way the event moves the attribute.
    ImpactStatus:
      type: string
      enum:
      - completed
      - pending_review
      - not_imported
      description: 'completed: the event''s changes were approved; pending_review: proposed, waiting for a person; not_imported:
        no change was proposed from it. The impacts are what the event''s operations reach in either case.'
    ExclusionReason:
      type: string
      enum:
      - uncalibrated
      - absent_in_every_scenario
      - outside_the_forecast_networks
      description: Why a reached relationship carries no size in a simulation.
    InputStatus:
      type: string
      enum:
      - found_connected
      - found_not_connected
      - not_yet_reviewed
      - not_disclosed_in_reviewed_sources
      description: Where an input a transition needs stands.
    ContentFormat:
      type: string
      enum:
      - text
      - raw
      description: 'text: the extracted text as JSON; raw: the file as uploaded.'
    Scope:
      type: string
      enum:
      - read
      - documents:write
      - changes:write
      - simulations:write
      - changes:review
      - admin
      description: 'What a credential may do, in four tiers: read (read); propose (documents:write, changes:write, simulations:write);
        approve (changes:review: human only, never on a static key or an agent-driven token); admin (admin).'
    ActorKind:
      type: string
      enum:
      - token
      - key
      - session
      - local
      - system
      description: 'token: a core-minted service token (a person, maybe through an agent); key: a static scoped credential
        (a service, no person); session: a person signed in to this service; local: an open local run; system: the engine
        itself (a review policy, a day''s close).'
    ProblemCode:
      type: string
      enum:
      - invalid_request
      - invalid_json
      - invalid_cursor
      - authentication_required
      - insufficient_scope
      - not_found
      - world_model_not_found
      - version_not_found
      - entity_not_found
      - attribute_not_found
      - relationship_not_found
      - evidence_not_found
      - composition_not_found
      - path_not_found
      - event_not_found
      - document_not_found
      - chunk_not_found
      - file_missing
      - bundle_not_found
      - change_not_found
      - thesis_not_found
      - simulation_not_found
      - concept_not_found
      - group_not_found
      - job_not_found
      - invalid_token
      - issuer_unavailable
      - human_approval_required
      - conflict
      - update_in_progress
      - already_decided
      - not_parsed
      - version_moved
      - payload_too_large
      - too_many_files
      - unsupported_media_type
      - idempotency_key_reused
      - note_required
      - question_not_understood
      - thesis_unbound
      - precondition_required
      description: A stable, machine-readable error code; `type` is https://docs.axelrod.ai/problems/{code}.
    FieldError:
      type: object
      additionalProperties: false
      properties:
        location:
          type: array
          items:
            type:
            - string
            - integer
          description: 'where: body, query, path or header, then the field'
        message: *id018
        type: *id018
      required:
      - location
      - message
      description: One invalid field.
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri
          description: A URI that names the error, stable across releases
        title:
          type: string
          description: A short summary of the error type
        status:
          type: integer
          description: The HTTP status
        detail:
          type: string
          description: What went wrong with this request
        instance:
          type: string
          description: The request path
        code:
          $ref: '#/components/schemas/ProblemCode'
        request_id: *id018
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
          description: Each invalid field (422 invalid_request only)
      required:
      - type
      - title
      - status
      - detail
      - instance
      - code
      - request_id
      description: An RFC 9457 problem details object, served as application/problem+json.
      examples:
      - type: https://docs.axelrod.ai/problems/version_not_found
        title: Version not found
        status: 404
        detail: version 900 is not in this world model (latest 255)
        instance: /v1/world-models/sally_demo/entities/toyota
        code: version_not_found
        request_id: req_4f1c2a9e0b7d4c55
    VersionRef:
      type: object
      additionalProperties: false
      properties:
        number:
          type: integer
          description: The committed version the answer was read from
        state_hash:
          type: string
          description: The hash of that version's state; also the ETag
        committed_at:
          type: string
          format: date-time
          description: When that version was committed
        latest:
          type: integer
          description: The world model's latest version
        clock:
          type: string
          format: date-time
          description: The model's date at that version
      required:
      - number
      - state_hash
      - committed_at
      - latest
      - clock
      description: The state an answer was read from.
      examples:
      - number: 124
        state_hash: f3a1cdfac1e9
        committed_at: '2026-09-01T21:00:00Z'
        latest: 124
        clock: '2026-09-01T21:00:00Z'
    Meta:
      type: object
      additionalProperties: false
      properties:
        request_id: *id018
        version:
          $ref: '#/components/schemas/VersionRef'
      required:
      - request_id
      description: 'About the answer: its request id, and the version it was read from (reads of the model).'
    ListMeta:
      type: object
      additionalProperties: false
      properties:
        request_id: *id018
        version:
          $ref: '#/components/schemas/VersionRef'
        limit:
          type: integer
          description: The page size used
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as `cursor` for the next page; null on the last page
      required:
      - request_id
      - limit
      - next_cursor
      description: About a page of a collection.
    AgentRef:
      type: object
      additionalProperties: false
      properties:
        sub: *id018
        name:
          type:
          - string
          - 'null'
      required:
      - sub
      - name
      description: The agent host acting for the person (the token's act claim).
    Actor:
      type: object
      additionalProperties: false
      properties:
        kind:
          $ref: '#/components/schemas/ActorKind'
        org:
          type: string
          description: The organization
        sub:
          type: string
          description: 'Who: an org user id (token), a caller name (key), a login (session)'
        name:
          type:
          - string
          - 'null'
        azp:
          type:
          - string
          - 'null'
          description: 'Which part of core asked: core-mcp or core-web (tokens)'
        act:
          anyOf:
          - $ref: '#/components/schemas/AgentRef'
          - type: 'null'
        jti:
          type:
          - string
          - 'null'
          description: 'The token''s id: the audit join key'
      required:
      - kind
      - org
      - sub
      - name
      - azp
      - act
      - jti
      description: 'Who acted, as structured fields: never a header the service cannot check.'
      examples:
      - kind: token
        org: acme
        sub: org_user_9
        name: Sally
        azp: core-mcp
        act:
          sub: mcp-client:claude-desktop
          name: Claude Desktop
        jti: 01J9ZK...
    Me:
      type: object
      additionalProperties: false
      properties:
        actor:
          $ref: '#/components/schemas/Actor'
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/Scope'
        world_model_ids: &id022
          type: array
          items: *id018
      required:
      - actor
      - scopes
      - world_model_ids
      description: The credential's identity.
      examples:
      - actor:
          kind: key
          org: sally
          sub: harness
          name: null
          azp: null
          act: null
          jti: null
        scopes:
        - read
        - documents:write
        world_model_ids:
        - sally_demo
    Counts:
      type: object
      additionalProperties: false
      properties:
        entities: &id019
          type: integer
        attributes: *id019
        relationships: *id019
        groups: *id019
        documents: *id019
        bundles: *id019
      required:
      - entities
      - attributes
      - relationships
      - groups
      - documents
      - bundles
      description: How many of each object the world model holds now.
    WorldModel:
      type: object
      additionalProperties: false
      properties:
        id: *id018
        name: *id018
        organization: *id018
        latest_version: *id019
        clock: &id020
          type: string
          format: date-time
        counts:
          $ref: '#/components/schemas/Counts'
      required:
      - id
      - name
      - organization
      - latest_version
      - clock
      - counts
      description: One causal world model. An organization may hold several.
      examples:
      - id: sally_demo
        name: Elevated rates in the US, Japan and Europe
        organization: sally
        latest_version: 2
        clock: '2026-08-02T00:00:00Z'
        counts:
          entities: 35
          attributes: 295
          relationships: 473
          groups: 12
          documents: 0
          bundles: 0
    Version:
      type: object
      additionalProperties: false
      properties:
        number: *id019
        state_hash: *id018
        committed_at: *id020
        cause:
          type: string
          description: 'What committed it: a change, a day''s close, a consolidation'
        change_ids:
          type: array
          items: *id018
          description: The changes whose approval committed this version
      required:
      - number
      - state_hash
      - committed_at
      - cause
      - change_ids
      description: A committed, immutable version of the world model.
      examples:
      - number: 121
        state_hash: a83c03e1
        committed_at: '2026-09-01T00:00:00Z'
        cause: PR-000001
        change_ids:
        - PR-000001
    Level:
      type: object
      additionalProperties: false
      properties:
        mean:
          type: number
          description: The level, in the attribute's unit
        sd:
          type: number
          description: The spread, in its unit
        q05:
          type:
          - number
          - 'null'
        q95:
          type:
          - number
          - 'null'
      required:
      - mean
      - sd
      - q05
      - q95
      description: An attribute's current distribution. q05 and q95 are null for a family without quantiles.
    Observation:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: A content hash
        attribute_id: *id018
        value:
          type: number
          description: The observed value, in the attribute's unit
        valid_at:
          type: string
          format: date-time
          description: When the value applies in the world
        observed_at:
          type: string
          format: date-time
          description: When the model learned it
        event_id:
          type:
          - string
          - 'null'
        epistemic_type:
          $ref: '#/components/schemas/EpistemicType'
      required:
      - id
      - attribute_id
      - value
      - valid_at
      - observed_at
      - event_id
      - epistemic_type
      description: A dated observation of an attribute (bitemporal; append-only).
      examples:
      - id: obs_6f0e2d
        attribute_id: oil.brent
        value: 102.97
        valid_at: '2026-09-01T00:00:00Z'
        observed_at: '2026-09-01T21:00:00Z'
        event_id: IM-D6f8e01eec3-0000
        epistemic_type: observed
    AttributeState:
      type: object
      additionalProperties: false
      properties:
        valid_at: *id020
        recorded_at: *id020
        mean: &id021
          type: number
        sd: *id021
        z:
          type:
          - number
          - 'null'
          description: Deviation from the expected path, in sd
        event_id:
          type:
          - string
          - 'null'
        note:
          type:
          - string
          - 'null'
      required:
      - valid_at
      - recorded_at
      - mean
      - sd
      - z
      - event_id
      - note
      description: The model's state of an attribute at a time (a trajectory point).
    Attribute:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: '`<entity id>.<key>`'
        key:
          type: string
          description: The attribute's key within its entity
        entity_id: *id018
        name: *id018
        aliases: *id022
        unit: *id018
        concept:
          type: string
          description: 'The kind of quantity: policy_rate, revenue_flow, share_price, ...'
        view:
          type: string
          description: The business view it belongs to, if any
        basis:
          type: string
          description: Its accounting basis, if any
        family:
          type: string
          description: Its distribution family
        observed:
          type: boolean
          description: False if no source reports it
        level:
          $ref: '#/components/schemas/Level'
        latest_observation:
          anyOf:
          - $ref: '#/components/schemas/Observation'
          - type: 'null'
        epistemic_type:
          $ref: '#/components/schemas/EpistemicType'
      required:
      - id
      - key
      - entity_id
      - name
      - aliases
      - unit
      - concept
      - view
      - basis
      - family
      - observed
      - level
      - latest_observation
      - epistemic_type
      description: One of an entity's measured quantities.
      examples:
      - id: toyota.operating_profit
        key: operating_profit
        entity_id: toyota
        name: Toyota operating profit
        aliases:
        - OP
        - operating income
        unit: ¥tn/yr
        concept: revenue_flow
        view: ''
        basis: ''
        family: lognormal
        observed: true
        level:
          mean: 3.41
          sd: 0.27
          q05: 2.98
          q95: 3.88
        latest_observation: null
        epistemic_type: documented
    ConceptRef:
      type: object
      additionalProperties: false
      properties:
        id: *id018
        name: *id018
      required:
      - id
      - name
      description: A concept of the taxonomy.
    Entity:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: A stable internal id, never a ticker
        type:
          $ref: '#/components/schemas/EntityType'
        name: *id018
        aliases: *id022
        identifiers:
          type: object
          additionalProperties: *id018
          description: Tickers, ISINs and the like
        description: *id018
        concepts:
