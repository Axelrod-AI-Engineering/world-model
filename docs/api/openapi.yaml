  headers:
    X-Request-Id:
      description: The request's id (yours, if you sent one)
      schema: *id018
    X-Axelrod-API-Version:
      description: The API's major version
      schema:
        type: string
        const: '1'
    ETag:
      description: The state hash of the version read, quoted; send it as If-Match on a decision
      schema: *id018
    Location:
      description: The created resource, or the job to poll
      schema: *id018
    traceparent:
      description: The W3C trace context you sent
      schema: *id018
  responses:
    BadRequest:
      description: The request cannot be used (invalid_request, invalid_json, invalid_cursor)
      headers: &id024
        X-Request-Id: *id002
        X-Axelrod-API-Version: *id003
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: No credential, or not a valid one (authentication_required, invalid_token)
      headers: *id024
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The credential lacks the scope (insufficient_scope), or a decision came from a static key or an agent-driven
        token (human_approval_required)
      headers: *id024
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The world model, version or resource does not exist (…_not_found)
      headers: *id024
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The state forbids it now (update_in_progress, already_decided, not_parsed, conflict)
      headers: *id024
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: If-Match names a version the model has moved past (version_moved)
      headers: *id024
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Too many files or too large a file (too_many_files, payload_too_large)
      headers: *id024
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: The body's media type is not accepted (unsupported_media_type)
      headers: *id024
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: The body or query failed validation (invalid_request, with errors), or cannot be acted on (note_required,
        question_not_understood, thesis_unbound, idempotency_key_reused)
      headers: *id024
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: A decision needs If-Match (precondition_required)
      headers: *id024
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: A token names a signing key and the issuer's JWKS cannot be reached (issuer_unavailable)
      headers: *id024
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
