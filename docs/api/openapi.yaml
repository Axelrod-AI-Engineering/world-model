- name: Relationships
  description: Relationships between attributes, and their evidence.
- name: Taxonomy
  description: Concepts and groups.
- name: Events
  description: Market events and what they did.
- name: Documents
  description: Uploaded files and their passages.
- name: Bundles
  description: Research read into dated items with signals.
- name: Search
  description: Search over passages and names.
- name: Changes
  description: Proposed changes and their review.
- name: Theses
  description: What-if questions.
- name: Simulations
  description: Theses run on a version.
- name: Graph
  description: Subgraphs for agents.
- name: Exports
  description: The model in clients' formats.
- name: Jobs
  description: Asynchronous work.
