# The Axelrod World Model API, v1: the contract. docs/api/README.md's reference is generated from it (scripts/api/reference.py).
openapi: 3.1.0
info:
  title: Axelrod World Model API
  version: 1.0.0
  summary: 'The causal world model as a service: entities, attributes, relationships and evidence, read at a stated version;
    documents into reviewed changes; theses run as simulations.'
  description: 'Every path below is under `/v1`. The organization comes from the credential, never from the request; a world
    model id in the path must belong to it.


    - **Envelope.** A resource answers `{"data": {...}, "meta": {"request_id", "version"}}`; a collection answers `{"data":
    [...], "meta": {"request_id", "version", "limit", "next_cursor"}}`.

    - **Errors** are RFC 9457 problem details (`application/problem+json`) with a stable `code`.

    - **Pinning.** Reads of the model take `version` or `as_of`; `meta.version` names what was served.

    - **Pagination** is by cursor: `limit` and the previous page''s `meta.next_cursor`.

    - **Writes.** POSTs that create take `Idempotency-Key`; long work answers `202` with a job. A decision on a change needs
    `If-Match` with the ETag of the version it was reviewed against.

    - **Identity and tenancy.** The organization and the person come from a verified credential: a core-minted service token,
    a static scoped key, or a session. A world model of another organization answers 404. Each operation''s `x-required-scope`
    names its scope. Approval is human-only: a static key, or a token with `act` or `azp: core-mcp`, gets 403 human_approval_required
    on a decision. Every write is recorded with its actor (org, sub, azp, act, jti) in the audit log.

    - **Facts and inferences.** Every claim carries an `epistemic_type`; theses and simulations never write facts; a change
    becomes fact only when a person approves it.

    - **Headers.** Every response carries `X-Request-Id` and `X-Axelrod-API-Version: 1`; `traceparent` is echoed.

    '
