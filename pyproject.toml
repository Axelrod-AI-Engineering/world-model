[project]
name = "axelrod-world-model-workspace"
version = "0.0.0"
description = "Axelrod: the workspace root. Virtual: it holds the members, the shared lint settings, and the repository-level tests."
requires-python = ">=3.11"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["ingestion", "world_model"]

# The members are in the dev group, so a plain `uv sync` installs both and `uv run axelrod` works from the root.
[tool.uv.sources]
axelrod-ingest = { workspace = true }
axelrod-world-model = { workspace = true }

[dependency-groups]
dev = [
    "axelrod-ingest",
    "axelrod-world-model",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["world_model/src", "world_model/tests", "ingestion/src", "ingestion/tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP007", "UP045", "B904", "E741", "UP017", "UP035", "B905", "B007"]
