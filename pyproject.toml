[project]
name = "axelrod-world-model"
version = "0.1.0"
description = "Axelrod World Model v0: an evidence-backed, event-sourced causal world model with a browser demo."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.6",
    "networkx>=3.2",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "typer>=0.12",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
    "mcp>=2.2,<3",
    "pypdfium2>=5.14",
]

[project.scripts]
axelrod = "axelrod_wm.cli:app"

[project.optional-dependencies]
semantic = [
    "fastembed>=0.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "httpx>=0.27",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axelrod_wm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: long-running tests (full scenario runs)",
]

[tool.coverage.run]
branch = true
source = ["axelrod_wm"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP007", "UP045", "B904", "E741", "UP017", "UP035", "B905", "B007"]
