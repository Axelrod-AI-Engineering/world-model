[project]
name = "axelrod-desk"
version = "0.1.0"
description = "Axelrod export desk: documents in, world-model files out. A shared library that stores each document once and links its copies, a reader that turns each one into cited figures on the reader's own Claude Code plan, one fact per figure with every citation, and builds of a chosen set of companies and sources as v4.1.4 and evaluation exports."
requires-python = ">=3.11"
dependencies = [
    "axelrod-ingest",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[tool.uv.sources]
axelrod-ingest = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
axelrod-desk = "axelrod_desk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axelrod_desk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["axelrod_desk"]

[tool.coverage.report]
show_missing = true
skip_covered = false
