# The oil_shock_demo scenario script (§11.2, §14.6). Times are UTC. A step with `update` requests an
# update run with `until` set to the step's date and `requested_at` set to its time, so the run
# processes every day through the end of that date (§7.8).
id: oil_shock_demo
title: Oil shock, export controls, and a new central bank
start: 2026-01-26
seed: 11
initialization:
  construction_dir: data/construction
  taxonomy_dir: data/taxonomy
  seeds: data/scenarios/oil_shock_demo/superentity_seeds.yaml
  layout: data/scenarios/oil_shock_demo/figure1_layout.yaml
  history:
    from: 2023-01-02
    to: 2026-01-25
    regimes: data/scenarios/oil_shock_demo/history_regimes.yaml
world:
  truth: data/scenarios/oil_shock_demo/truth.yaml
config_overrides: configs/demo.yaml
steps:
  - at: 2026-01-26T00:00:00Z
    caption: "The starting picture: economic ideas in eight categories (the grid) and the real actors around them, central banks, OPEC+, chipmakers, airlines, and banks, grouped into superentities. Hover anything; right-click for options."
  - at: 2026-01-28T20:00:00Z
    update: {}
    caption: "Update through Jan 28: the Fed raises rates. Credit tightening (S1) lights up, and JPMorgan's interest margin widens."
  - at: 2026-02-02T14:00:00Z
    update: {}
    caption: "Update through Feb 2: OPEC+ cuts output. Oil producers gain and airlines' fuel costs jump. News that changes the graph waits for your approval."
  - at: 2026-02-09T15:00:00Z
    update: {}
    caption: "Fuzzy to real: news about chip export controls refines step by step into a concrete new subentity, chip exports, and NVIDIA's China revenue starts to fall."
  - at: 2026-02-16T12:00:00Z
    update:
      user_market_events: [ME-04]
    caption: "You add a news item by hand. The RBI is new to the model: it is created, classified as a central bank, and inherits a central bank's priors."
  - at: 2026-02-23T18:00:00Z
    update: {}
    caption: "A week of daily propagation: values nobody reports, like NVIDIA's capex, drift with the ones they depend on (dotted halos)."
  - at: 2026-03-02T12:00:00Z
    update:
      user_graph_update_events: [UG-01]
    caption: "Export controls rise again, and you draw an edge by hand from the Fed Chair to long-term yields."
  - at: 2026-03-09T22:00:00Z
    update: {}
    caption: "Bank stress: the model recalls bank-run analogs, a historical pattern binds, and deposits leave regional banks for JPMorgan."
  - at: 2026-03-16T03:00:00Z
    update: {}
    caption: "Japan tightens chip-tool exports: Tokyo Electron's China sales take the hit, and the candidate pattern for export controls keeps matching."
  - at: 2026-03-18T20:00:00Z
    update: {}
    caption: "The Fed meets. Its reaction rule decides, and the fold weighs the evidence for and against 'inflation prompts tightening' (e43)."
  - at: 2026-03-23T17:00:00Z
    update: {}
    caption: "Chipmakers cut capex. The link from chip exports to tech capex, pending since February, finally binds."
  - at: 2026-03-30T18:00:00Z
    update: {}
    caption: "The frontier has seen Inflation → Confidence hold a few times, counted at most once every 14 days."
  - at: 2026-04-27T18:00:00Z
    update: {}
    caption: "Four weeks of data. Approve the frontier promotion and the new pattern to see a learned edge and a new superentity."
  - at: 2026-05-04T21:00:00Z
    update: {}
    thesis: [T-00, T-01]
    pin: [T-00]
    caption: "Performance: the baseline, then 'what if oil prices doubled next quarter?', forecast for single values, an actor (ExxonMobil), a sector (airlines), a superentity (S10), and an idea (spending and demand)."
  - at: 2026-05-04T21:00:00Z
    pose_hypothesis: {hypothesis: H-fed-hold, base_thesis: T-01}
    caption: "A decision hypothesis posed as a thesis: what if the Fed holds? Compare T-02 with T-01."
  - at: 2026-05-05T12:00:00Z
    evaluate: {freeze_at: 2026-01-31T23:59:59Z, market_event_ids: [ME-02], horizon_days: 63}
    caption: "Evaluate against history: freeze the model before the oil shock, pose it, and score the forecast."
  - at: 2026-05-05T12:00:00Z
    decision: D-01
    caption: "A mock agent records a recommendation that cites the baseline and the oil scenario."
  - at: 2026-08-03T18:00:00Z
    update: {}
    resolve_decision: D-01
    caption: "A 90-day sweep. The pinned baseline is re-posed, and the decision is scored against what happened."
