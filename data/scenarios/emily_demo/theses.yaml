# Emily's ready-made questions: the three economic scenarios of her Fed-versus-BoJ table, and the simulator's client
# path (BoJ three 25 bp hikes to 2.0%, the Fed six 25 bp cuts). The Ask tab lists them; each forecasts her book.
theses:
  - id: E-T1
    question: "Inflation stays high and growth holds up: the Fed holds longer and the BoJ keeps hiking. What happens to the yen and my names?"
    mode: scaffolded
    horizon_days: 270
    targets: [dollar_yen.usd_jpy, dollar_yen.carry_positioning, us_treasuries.yield_2y, jgbs.yield_30y,
              tokio_marine.international_profit, tokio_marine.share_price, toyota.operating_profit, jpmorgan.net_interest_income]
    target_groups:
      - {kind: superentity, ref: E4}
      - {kind: superentity, ref: E6}
    event:
      kind: hypothetical
      event_type: policy
      occurred_at: 2026-10-15T00:00:00Z
      ops:
        - {op: change_value, target: {kind: concrete, subentity_id: us_economy.core_cpi}, delta: 0.4,
           mode: absolute, persistence: step, at: 2026-10-15T00:00:00Z}
        - {op: change_value, target: {kind: concrete, subentity_id: boj.policy_rate}, delta: 0.5,
           mode: absolute, persistence: step, intervention: true, window_days: 270, at: 2026-10-15T00:00:00Z}
  - id: E-T2
    question: "Growth weakens and inflation cools: the Fed cuts 150 bp while the BoJ holds. How far does the yen rally?"
    mode: scaffolded
    horizon_days: 365
    targets: [dollar_yen.usd_jpy, dollar_yen.carry_positioning, us_treasuries.yield_2y, us_treasuries.yield_10y,
              tokio_marine.international_profit, toyota.operating_profit, komatsu.operating_profit, jpmorgan.net_interest_income]
    target_groups:
      - {kind: superentity, ref: E4}
      - {kind: superentity, ref: E5}
    event:
      kind: hypothetical
      event_type: policy
      occurred_at: 2026-10-15T00:00:00Z
      ops:
        - {op: change_value, target: {kind: concrete, subentity_id: us_economy.gdp_growth}, delta: -1.0,
           mode: absolute, persistence: step, at: 2026-10-15T00:00:00Z}
        - {op: change_value, target: {kind: concrete, subentity_id: federal_reserve.policy_rate}, delta: -1.5,
           mode: absolute, persistence: step, intervention: true, window_days: 365, at: 2026-10-15T00:00:00Z}
        - {op: change_value, target: {kind: concrete, subentity_id: boj.policy_rate}, delta: 0.0,
           mode: absolute, persistence: step, intervention: true, window_days: 365, at: 2026-10-15T00:00:00Z}
  - id: E-T3
    question: "Growth weakens but inflation stays high: oil holds above $110. Who is squeezed?"
    mode: scaffolded
    horizon_days: 365
    targets: [us_economy.headline_cpi, us_economy.gdp_growth, federal_reserve.policy_rate, boj.policy_rate,
              dollar_yen.usd_jpy, komatsu.operating_profit, unicredit.net_interest_income, zurich.operating_profit]
    target_groups:
      - {kind: superentity, ref: E3}
      - {kind: superentity, ref: E1}
    event:
      kind: hypothetical
      event_type: supply_shock
      occurred_at: 2026-10-15T00:00:00Z
      ops:
        - {op: change_value, target: {kind: concrete, subentity_id: oil.brent}, delta: 0.25,
           mode: relative, persistence: step, at: 2026-10-15T00:00:00Z}
        - {op: change_value, target: {kind: concrete, subentity_id: us_economy.gdp_growth}, delta: -0.8,
           mode: absolute, persistence: step, at: 2026-10-15T00:00:00Z}
  - id: E-T4
    question: "The simulator's client path: the BoJ hikes to 2.0% and the Fed cuts six times. Where does USD/JPY end the year, and what does that do to Tokio Marine?"
    mode: scaffolded
    horizon_days: 365
    targets: [dollar_yen.usd_jpy, dollar_yen.carry_positioning, tokio_marine.international_profit,
              tokio_marine.japan_pc_profit, tokio_marine.operating_profit, tokio_marine.share_price]
    target_groups:
      - {kind: entity, ref: tokio_marine}
    event:
      kind: hypothetical
      event_type: policy
      occurred_at: 2026-10-15T00:00:00Z
      ops:
        - {op: change_value, target: {kind: concrete, subentity_id: boj.policy_rate}, delta: 0.75,
           mode: absolute, persistence: step, intervention: true, window_days: 365, at: 2026-10-15T00:00:00Z}
        - {op: change_value, target: {kind: concrete, subentity_id: federal_reserve.policy_rate}, delta: -1.5,
           mode: absolute, persistence: step, intervention: true, window_days: 365, at: 2026-10-15T00:00:00Z}
