# Emily's demo (Oct 11): what an ordinary day with the product looks like for a cross-asset PM. The world model
# starts with her view of the chain (oil -> inflation -> Fed and BoJ -> the rate gap -> the yen -> her names), and
# she brings in the week's research through Import: a bundle of dated, categorized items, in the form a research
# agent would deliver after scraping and sorting sources. Each item is folded in on its own date and waits for her
# review; Predict then forecasts her names. The bundle is the client's and is never committed (data/emily_data).
id: emily_demo
title: "Emily's demo: a PM's book, from research to forecasts"
canvas: seeded
imports: true
imports_dir: data/emily_data
start: 2026-08-03
seed: 13
initialization:
  construction_dir: data/worlds/emily_demo
  taxonomy_dir: data/worlds/emily_demo/taxonomy
  seeds: data/scenarios/emily_demo/superentity_seeds.yaml
config_overrides: configs/emily_demo.yaml
steps: []
