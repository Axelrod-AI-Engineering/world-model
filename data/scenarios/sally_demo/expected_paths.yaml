# Transmission channels Sally's research expects for each thesis (Oct 17): what a forecast's path must show.
# Each channel is a model link (source -> target) with its expected sign under the shock; `order` is how many links
# from the shocked value. `must` channels are ones the research states plainly; `should` are well supported but softer.
# `missing_links` are channels the research argues for that the model has no link for (feedback for the graph).
# Outputs are the thesis targets and the direction the research expects ("?" where it is ambiguous or not covered).
theses:
  S-T1:
    shock: [boj.policy_rate]
    chains:
      - [boj.policy_rate, jgbs.yield_10y, jgbs.yield_30y, tokio_marine.japan_pc_profit, tokio_marine.operating_profit]
      - [boj.policy_rate, jgbs.yield_10y, jgbs.yield_30y, msad.domestic_profit, msad.operating_profit]
      - [boj.policy_rate, dollar_yen.usd_jpy, toyota.operating_profit]
      - [boj.policy_rate, dollar_yen.usd_jpy, komatsu.operating_profit]
      - [boj.policy_rate, dollar_yen.usd_jpy, tokio_marine.international_profit, tokio_marine.operating_profit]
      - [boj.policy_rate, dollar_yen.usd_jpy, msad.international_profit, msad.operating_profit]
      - [boj.policy_rate, dollar_yen.carry_positioning, dollar_yen.usd_jpy]
      - [boj.policy_rate, jgbs.yield_10y, softbank_corp.operating_profit]
    channels:
      - {source: boj.policy_rate, target: jgbs.yield_10y, sign: +, order: 1, level: must, why: "a higher policy rate lifts the front and belly of the government curve"}
      - {source: jgbs.yield_10y, target: jgbs.yield_30y, sign: +, order: 2, level: should, why: "the long end follows, but less than the belly: hikes flatten the curve and term premium drives the super-long end"}
      - {source: boj.policy_rate, target: dollar_yen.usd_jpy, sign: -, order: 1, level: should, why: "a narrower policy-rate gap strengthens the yen; weak and contested while the gap stays wide"}
      - {source: boj.policy_rate, target: dollar_yen.carry_positioning, sign: -, order: 1, level: should, why: "higher funding costs make yen-funded carry less attractive and can force an unwind"}
      - {source: dollar_yen.carry_positioning, target: dollar_yen.usd_jpy, sign: +, order: 2, level: must, why: "closing yen-funded positions means buying yen"}
      - {source: dollar_yen.usd_jpy, target: toyota.operating_profit, sign: +, order: 2, level: must, why: "an exporter's yen profit falls as the yen strengthens"}
      - {source: dollar_yen.usd_jpy, target: komatsu.operating_profit, sign: +, order: 2, level: must, why: "an exporter's yen profit falls as the yen strengthens"}
      - {source: dollar_yen.usd_jpy, target: tokio_marine.international_profit, sign: +, order: 2, level: must, why: "overseas profit translates into fewer yen when the yen strengthens"}
      - {source: dollar_yen.usd_jpy, target: msad.international_profit, sign: +, order: 2, level: should, why: "overseas profit translates into fewer yen when the yen strengthens"}
      - {source: jgbs.yield_30y, target: tokio_marine.japan_pc_profit, sign: +, order: 3, level: must, why: "higher domestic reinvestment yields raise an insurer's investment income"}
      - {source: jgbs.yield_30y, target: msad.domestic_profit, sign: +, order: 3, level: should, why: "higher domestic reinvestment yields raise an insurer's investment income"}
      - {source: tokio_marine.international_profit, target: tokio_marine.operating_profit, sign: +, order: 3, level: should, why: "a segment's profit adds to group profit"}
      - {source: tokio_marine.japan_pc_profit, target: tokio_marine.operating_profit, sign: +, order: 4, level: should, why: "a segment's profit adds to group profit"}
      - {source: msad.international_profit, target: msad.operating_profit, sign: +, order: 3, level: should, why: "a segment's profit adds to group profit"}
      - {source: msad.domestic_profit, target: msad.operating_profit, sign: +, order: 4, level: should, why: "a segment's profit adds to group profit"}
      - {source: jgbs.yield_10y, target: softbank_corp.operating_profit, sign: -, order: 2, level: should, why: "higher yields raise the cost of funding a debt-financed build-out (mostly below operating profit)"}
      - {source: boj.policy_rate, target: japan_capital_markets.equity_index, sign: -, order: 1, level: should, why: "tighter money and a stronger yen weigh on an export-heavy equity market"}
    missing_links:
      - {source: jgbs.yield_10y, target: dollar_yen.usd_jpy, sign: -, level: should, why: "higher domestic yields draw domestic savings home from overseas assets, buying yen"}
    outputs:
      dollar_yen.usd_jpy: down
      jgbs.yield_30y: up
      tokio_marine.operating_profit: "?"      # translation loss vs. domestic reinvestment gain
      msad.operating_profit: "?"             # same trade-off, with a larger domestic book
      toyota.operating_profit: down
      komatsu.operating_profit: down
      softbank_corp.operating_profit: "?"    # the funding squeeze lands mostly in interest expense, below operating profit

  S-T2:
    shock: [federal_reserve.policy_rate]
    chains:
      - [federal_reserve.policy_rate, us_treasuries.yield_2y, us_treasuries.yield_10y, bunds.yield_10y]
      - [federal_reserve.policy_rate, us_treasuries.yield_2y, us_treasuries.yield_10y, tokio_marine.international_profit]
      - [federal_reserve.policy_rate, us_treasuries.yield_2y, us_treasuries.yield_10y, msad.international_profit]
      - [federal_reserve.policy_rate, us_treasuries.yield_2y, dollar_yen.usd_jpy, tokio_marine.international_profit]
      - [federal_reserve.policy_rate, us_treasuries.yield_2y, dollar_yen.usd_jpy, msad.international_profit]
      - [federal_reserve.policy_rate, jpmorgan.net_interest_income]
      - [federal_reserve.policy_rate, citigroup.net_interest_income]
      - [federal_reserve.policy_rate, us_capital_markets.deal_activity, morgan_stanley.ib_fees]
      - [federal_reserve.policy_rate, us_treasuries.yield_2y, us_capital_markets.market_volatility, morgan_stanley.trading_revenue]
    channels:
      - {source: federal_reserve.policy_rate, target: us_treasuries.yield_2y, sign: +, order: 1, level: must, why: "the two-year yield tracks the expected policy path"}
      - {source: us_treasuries.yield_2y, target: us_treasuries.yield_10y, sign: +, order: 2, level: should, why: "the long end follows the front end, by less: policy moves twist the curve"}
      - {source: us_treasuries.yield_10y, target: bunds.yield_10y, sign: +, order: 3, level: should, why: "global long yields move together"}
      - {source: us_treasuries.yield_10y, target: tokio_marine.international_profit, sign: +, order: 3, level: must, why: "lower reinvestment yields cut an insurer's investment income"}
      - {source: us_treasuries.yield_10y, target: msad.international_profit, sign: +, order: 3, level: should, why: "lower reinvestment yields cut an insurer's investment income"}
      - {source: us_treasuries.yield_2y, target: dollar_yen.usd_jpy, sign: +, order: 2, level: must, why: "a narrower US-Japan rate gap strengthens the yen"}
      - {source: dollar_yen.usd_jpy, target: tokio_marine.international_profit, sign: +, order: 3, level: must, why: "overseas profit translates into fewer yen when the yen strengthens"}
      - {source: dollar_yen.usd_jpy, target: msad.international_profit, sign: +, order: 3, level: should, why: "overseas profit translates into fewer yen when the yen strengthens"}
      - {source: federal_reserve.policy_rate, target: jpmorgan.net_interest_income, sign: +, order: 1, level: must, why: "an asset-sensitive bank earns less net interest when short rates fall"}
      - {source: federal_reserve.policy_rate, target: citigroup.net_interest_income, sign: +, order: 1, level: must, why: "an asset-sensitive bank earns less net interest when short rates fall"}
      - {source: federal_reserve.policy_rate, target: us_capital_markets.deal_activity, sign: -, order: 1, level: should, why: "cheaper financing revives deals and issuance"}
      - {source: us_capital_markets.deal_activity, target: morgan_stanley.ib_fees, sign: +, order: 2, level: should, why: "advisory and underwriting fees follow deal volume"}
      - {source: us_capital_markets.deal_activity, target: jpmorgan.ib_fees, sign: +, order: 2, level: should, why: "advisory and underwriting fees follow deal volume"}
      - {source: us_treasuries.yield_2y, target: us_capital_markets.market_volatility, sign: -, order: 2, level: should, why: "a large, fast repricing raises rate volatility whichever way rates move; under a cut that is a negative co-movement"}
      - {source: us_capital_markets.market_volatility, target: morgan_stanley.trading_revenue, sign: +, order: 3, level: should, why: "volatility drives client hedging and trading volumes"}
      - {source: us_treasuries.yield_10y, target: jpmorgan.cet1_ratio, sign: -, order: 3, level: should, why: "lower yields raise the value of fixed-rate bond holdings and so capital"}
    missing_links:
      - {source: us_treasuries.yield_2y, target: dollar_yen.carry_positioning, sign: +, level: should, why: "a narrower rate gap erodes the carry that yen-funded positions earn"}
      - {source: us_treasuries.yield_10y, target: us_capital_markets.deal_activity, sign: -, level: should, why: "higher long yields raise acquisition financing costs and defer issuance"}
      - {source: federal_reserve.policy_rate, target: morgan_stanley.wealth_revenue, sign: +, level: should, why: "a wealth manager's net interest on client cash falls with short rates"}
    outputs:
      us_treasuries.yield_10y: down
      bunds.yield_10y: down
      jpmorgan.net_interest_income: down
      citigroup.net_interest_income: down
      morgan_stanley.trading_revenue: "?"    # more rate volatility vs. lower trading on carry and financing
      tokio_marine.international_profit: down
      msad.international_profit: down
      dollar_yen.usd_jpy: down

  S-T3:
    shock: [dollar_yen.carry_positioning, dollar_yen.usd_jpy]
    chains:
      - [dollar_yen.carry_positioning, us_capital_markets.market_volatility, morgan_stanley.trading_revenue]
      - [dollar_yen.carry_positioning, us_capital_markets.market_volatility, jpmorgan.markets_revenue]
      - [dollar_yen.usd_jpy, toyota.operating_profit]
      - [dollar_yen.usd_jpy, komatsu.operating_profit]
      - [dollar_yen.usd_jpy, tokio_marine.international_profit]
      - [dollar_yen.usd_jpy, msad.international_profit]
      - [dollar_yen.usd_jpy, japan_capital_markets.equity_index]
    channels:
      - {source: dollar_yen.carry_positioning, target: us_capital_markets.market_volatility, sign: -, order: 1, level: must, why: "a forced unwind of leveraged positions spikes cross-asset volatility"}
      - {source: us_capital_markets.market_volatility, target: morgan_stanley.trading_revenue, sign: +, order: 2, level: should, why: "volatility drives client hedging and trading volumes"}
      - {source: us_capital_markets.market_volatility, target: jpmorgan.markets_revenue, sign: +, order: 2, level: should, why: "volatility drives client hedging and trading volumes"}
      - {source: us_capital_markets.market_volatility, target: citigroup.markets_revenue, sign: +, order: 2, level: should, why: "volatility drives client hedging and trading volumes"}
      - {source: us_capital_markets.market_volatility, target: morgan_stanley.wealth_revenue, sign: -, order: 2, level: should, why: "falling asset prices shrink fee-based client assets"}
      - {source: dollar_yen.usd_jpy, target: toyota.operating_profit, sign: +, order: 1, level: must, why: "an exporter's yen profit falls as the yen strengthens"}
      - {source: dollar_yen.usd_jpy, target: komatsu.operating_profit, sign: +, order: 1, level: must, why: "an exporter's yen profit falls as the yen strengthens"}
      - {source: dollar_yen.usd_jpy, target: tokio_marine.international_profit, sign: +, order: 1, level: must, why: "overseas profit translates into fewer yen when the yen strengthens"}
      - {source: dollar_yen.usd_jpy, target: msad.international_profit, sign: +, order: 1, level: should, why: "overseas profit translates into fewer yen when the yen strengthens"}
      - {source: dollar_yen.usd_jpy, target: japan_capital_markets.equity_index, sign: +, order: 1, level: should, why: "a stronger yen cuts exporters' earnings, which lead the index"}
    missing_links: []
    outputs:
      dollar_yen.usd_jpy: down
      us_capital_markets.market_volatility: up
      morgan_stanley.trading_revenue: up
      jpmorgan.markets_revenue: up
      toyota.operating_profit: down
      komatsu.operating_profit: down
      tokio_marine.international_profit: down
      msad.international_profit: down

  S-T4:
    shock: [pboc.loan_prime_rate, china_economy.property_sales]
    chains:
      - [pboc.loan_prime_rate, china_construction_bank.net_interest_margin, china_construction_bank.operating_profit]
      - [china_economy.property_sales, china_construction_bank.npl_ratio, china_construction_bank.operating_profit]
      - [pboc.loan_prime_rate, china_economy.credit_growth, china_construction_bank.operating_profit]
      - [pboc.loan_prime_rate, cgbs.yield_10y, china_construction_bank.net_interest_margin]
      - [china_economy.property_sales, komatsu.construction_demand, komatsu.operating_profit]
    channels:
      - {source: pboc.loan_prime_rate, target: china_construction_bank.net_interest_margin, sign: +, order: 1, level: must, why: "loans reprice off the benchmark faster than deposits, so a cut squeezes the margin"}
      - {source: china_construction_bank.net_interest_margin, target: china_construction_bank.operating_profit, sign: +, order: 2, level: must, why: "the margin is the main driver of a lender's revenue"}
      - {source: china_economy.property_sales, target: china_construction_bank.npl_ratio, sign: -, order: 1, level: must, why: "a steadier housing market improves mortgage and developer loan quality"}
      - {source: china_construction_bank.npl_ratio, target: china_construction_bank.operating_profit, sign: -, order: 2, level: should, why: "fewer bad loans need fewer provisions"}
      - {source: pboc.loan_prime_rate, target: china_economy.credit_growth, sign: -, order: 1, level: should, why: "cheaper loans support credit demand, though modestly when demand is weak"}
      - {source: china_economy.credit_growth, target: china_construction_bank.operating_profit, sign: +, order: 2, level: should, why: "loan growth expands the earning balance sheet"}
      - {source: pboc.loan_prime_rate, target: cgbs.yield_10y, sign: +, order: 1, level: should, why: "government bond yields track the policy rate"}
      - {source: cgbs.yield_10y, target: china_construction_bank.net_interest_margin, sign: +, order: 2, level: should, why: "lower bond yields reduce what a bank earns on its securities book"}
      - {source: china_economy.property_sales, target: komatsu.construction_demand, sign: +, order: 1, level: should, why: "housing starts drive excavator demand; China is a small share of this maker's sales"}
      - {source: komatsu.construction_demand, target: komatsu.operating_profit, sign: +, order: 2, level: should, why: "equipment volume drives the maker's profit"}
    missing_links:
      - {source: china_economy.property_sales, target: china_economy.credit_growth, sign: +, level: should, why: "a housing recovery revives mortgage and household borrowing"}
      - {source: china_economy.property_sales, target: china_economy.gdp_growth, sign: +, level: should, why: "property is a large share of activity; stabilizing it lifts growth and so car demand"}
      - {source: pboc.loan_prime_rate, target: china_economy.gdp_growth, sign: -, level: should, why: "monetary easing supports growth with a lag"}
    outputs:
      pboc.loan_prime_rate: down
      china_economy.property_sales: up
      china_construction_bank.net_interest_margin: down
      china_construction_bank.npl_ratio: down
      china_construction_bank.operating_profit: "?"   # margin squeeze vs. lower provisions and more lending
      komatsu.construction_demand: up
      komatsu.operating_profit: up                      # small
      toyota.vehicle_sales: "?"                         # small up via Chinese demand; weak evidence

  S-T5:
    shock: [ecb.policy_rate]
    chains:
      - [ecb.policy_rate, unicredit.net_interest_income, unicredit.share_price]
      - [ecb.policy_rate, aib_group.net_interest_income, aib_group.share_price]
      - [ecb.policy_rate, bunds.yield_10y, msad.international_profit]
      - [ecb.policy_rate, bunds.yield_10y, unicredit.cet1_ratio, unicredit.share_price]
    channels:
      - {source: ecb.policy_rate, target: unicredit.net_interest_income, sign: +, order: 1, level: must, why: "a deposit-rich bank's net interest falls as policy rates fall"}
      - {source: ecb.policy_rate, target: aib_group.net_interest_income, sign: +, order: 1, level: should, why: "a deposit-rich bank's net interest falls as policy rates fall"}
      - {source: ecb.policy_rate, target: bunds.yield_10y, sign: +, order: 1, level: should, why: "long yields follow the expected policy path"}
      - {source: unicredit.net_interest_income, target: unicredit.share_price, sign: +, order: 2, level: should, why: "lower earnings and payouts lower the share price"}
      - {source: aib_group.net_interest_income, target: aib_group.share_price, sign: +, order: 2, level: should, why: "lower earnings and payouts lower the share price"}
      - {source: bunds.yield_10y, target: msad.international_profit, sign: +, order: 2, level: should, why: "lower reinvestment yields cut an insurer's investment income"}
      - {source: bunds.yield_10y, target: unicredit.cet1_ratio, sign: -, order: 2, level: should, why: "lower yields raise the value of bond holdings and so capital"}
      - {source: unicredit.cet1_ratio, target: unicredit.share_price, sign: +, order: 3, level: should, why: "surplus capital funds buybacks"}
    missing_links:
      - {source: bunds.yield_10y, target: unicredit.net_interest_income, sign: +, level: should, why: "a bank that hedges its deposits by rolling fixed-rate swaps earns less as long rates fall"}
    outputs:
      ecb.policy_rate: down
      bunds.yield_10y: down
      unicredit.net_interest_income: down
      unicredit.share_price: down
      aib_group.net_interest_income: down
      aib_group.share_price: down
      msad.international_profit: down
