# Sally's ready-made questions: the rates, yen, and global-yields scenarios her book is built around. The Ask tab lists
# them; each forecasts the eleven names, and each forecast feeds the scenario table and the agent context.
theses:
  - id: S-T1
    question: "The BoJ hikes to 1.5% while the Fed holds: JGB yields rise and the yen strengthens. Who gains and who is squeezed?"
    mode: scaffolded
    horizon_days: 180
    targets: [dollar_yen.usd_jpy, jgbs.yield_30y, tokio_marine.operating_profit, msad.operating_profit, toyota.operating_profit, komatsu.operating_profit, softbank_corp.operating_profit]
    target_groups:
      - {kind: superentity, ref: G2}
      - {kind: superentity, ref: G3}
    event:
      kind: hypothetical
      event_type: policy
      occurred_at: 2026-10-15T00:00:00Z
      ops:
        - {op: change_value, target: {kind: concrete, subentity_id: boj.policy_rate}, delta: 0.5,
           mode: absolute, persistence: step, intervention: true, window_days: 270, at: 2026-10-15T00:00:00Z}
  - id: S-T2
    question: "Global yields fall: the Fed cuts 100 bp and Treasury and Bund yields drop. What happens to bank interest income and insurers' reinvestment?"
    mode: scaffolded
    horizon_days: 365
    targets: [us_treasuries.yield_10y, bunds.yield_10y, jpmorgan.net_interest_income, citigroup.net_interest_income, morgan_stanley.trading_revenue, tokio_marine.international_profit, msad.international_profit, dollar_yen.usd_jpy]
    target_groups:
      - {kind: superentity, ref: G1}
      - {kind: superentity, ref: G2}
    event:
      kind: hypothetical
      event_type: policy
      occurred_at: 2026-10-15T00:00:00Z
      ops:
        - {op: change_value, target: {kind: concrete, subentity_id: federal_reserve.policy_rate}, delta: -1.0,
           mode: absolute, persistence: step, intervention: true, window_days: 365, at: 2026-10-15T00:00:00Z}
  - id: S-T3
    question: "The yen carry trade unwinds: positioning collapses and USD/JPY falls 8%. Where does it land in the book?"
    mode: scaffolded
    horizon_days: 120
    targets: [dollar_yen.usd_jpy, us_capital_markets.market_volatility, morgan_stanley.trading_revenue, jpmorgan.markets_revenue, toyota.operating_profit, komatsu.operating_profit, tokio_marine.international_profit, msad.international_profit]
    target_groups:
      - {kind: superentity, ref: G3}
      - {kind: superentity, ref: S4}
    event:
      kind: hypothetical
      event_type: policy
      occurred_at: 2026-10-15T00:00:00Z
      ops:
        - {op: change_value, target: {kind: concrete, subentity_id: dollar_yen.carry_positioning}, delta: -2.0,
           mode: standardized, persistence: step, at: 2026-10-15T00:00:00Z}
        - {op: change_value, target: {kind: concrete, subentity_id: dollar_yen.usd_jpy}, delta: -0.08,
           mode: relative, persistence: step, at: 2026-10-15T00:00:00Z}
  - id: S-T4
    question: "China eases: the PBoC cuts the loan prime rate 25 bp and property stabilizes. What does it do to CCB and Komatsu?"
    mode: scaffolded
    horizon_days: 365
    targets: [pboc.loan_prime_rate, china_economy.property_sales, china_construction_bank.net_interest_margin, china_construction_bank.npl_ratio, china_construction_bank.operating_profit, komatsu.construction_demand, komatsu.operating_profit, toyota.vehicle_sales]
    target_groups:
      - {kind: superentity, ref: S6}
      - {kind: entity, ref: komatsu}
    event:
      kind: hypothetical
      event_type: policy
      occurred_at: 2026-10-15T00:00:00Z
      ops:
        - {op: change_value, target: {kind: concrete, subentity_id: pboc.loan_prime_rate}, delta: -0.25,
           mode: absolute, persistence: step, intervention: true, window_days: 365, at: 2026-10-15T00:00:00Z}
        - {op: change_value, target: {kind: concrete, subentity_id: china_economy.property_sales}, delta: 0.08,
           mode: relative, persistence: step, at: 2026-10-15T00:00:00Z}
  - id: S-T5
    question: "The ECB cuts 50 bp more than expected. How exposed are UniCredit and AIB?"
    mode: scaffolded
    horizon_days: 270
    targets: [ecb.policy_rate, bunds.yield_10y, unicredit.net_interest_income, unicredit.share_price, aib_group.net_interest_income, aib_group.share_price, msad.international_profit]
    target_groups:
      - {kind: superentity, ref: S5}
    event:
      kind: hypothetical
      event_type: policy
      occurred_at: 2026-10-15T00:00:00Z
      ops:
        - {op: change_value, target: {kind: concrete, subentity_id: ecb.policy_rate}, delta: -0.5,
           mode: absolute, persistence: step, intervention: true, window_days: 270, at: 2026-10-15T00:00:00Z}
