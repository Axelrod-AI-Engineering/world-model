# Sally's superentities: the configurations a cross-asset PM reasons in, in two levels. The three groups she named
# (banks and capital markets; insurers on Japanese and global yields; Japan rates, growth, the yen, and overseas
# earnings) each hold narrower configurations. Members and interactions of a group are the union of its parts'.
