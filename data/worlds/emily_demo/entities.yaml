# Emily's world (emily_demo): the chain from an oil shock to the names a cross-asset PM holds, through the Fed and
# the BoJ, the US-Japan rate gap, and the yen. It mirrors the client's two workbooks (the yen-rates simulator and the
# Tokio Marine segment forecast): oil -> inflation and growth -> policy paths -> the two-year gap -> USD/JPY -> each
# name's earnings, with JGB and Treasury yields feeding insurers' reinvestment.
#
# Priors are levels at the scenario's start (Aug 3, 2026), close to the earliest levels in the client's research, so
# what an imported article reports reads as news rather than as a many-sd surprise that learning would over-attribute.
# Units are native; scales are one standard unit.
decision_variables: [federal_reserve.policy_rate, boj.policy_rate, ecb.policy_rate]
entities:
  # --- the shock ---------------------------------------------------------------------------------------------------
  - id: oil
    name: Oil
    kind: market
    description: "Brent crude. A sustained move above $100 feeds headline inflation within a quarter and weighs on growth after two."
    category_tags: [MF]
    features: {market: commodity}
    aliases: [crude, brent, oil prices]
    subentities:
      - {id: oil.brent, name: Brent crude, attribute_kind: commodity_price, unit: $/bbl,
         family: lognormal, mean: 92.0, scale: 0.08, aliases: [brent, crude, oil price]}

  # --- the economies -----------------------------------------------------------------------------------------------
  - id: us_economy
    name: US economy
    kind: macro_factor
    description: "US inflation and growth: what the Fed reacts to."
    category_tags: [MF]
    features: {region: US}
    aliases: [US, United States]
    subentities:
      - {id: us_economy.headline_cpi, name: US headline CPI, attribute_kind: inflation_rate, unit: pct y/y,
         family: gaussian, prior: {family: gaussian, mu: 3.3, sigma: 0.3}, scale: 0.3, aliases: [US CPI, US inflation]}
      - {id: us_economy.core_cpi, name: US core CPI, attribute_kind: inflation_rate, unit: pct y/y,
         family: gaussian, prior: {family: gaussian, mu: 3.0, sigma: 0.2}, scale: 0.2, aliases: [core inflation]}
      - {id: us_economy.gdp_growth, name: US real GDP growth, attribute_kind: growth_rate, unit: pct y/y,
         family: gaussian, prior: {family: gaussian, mu: 1.8, sigma: 0.4}, scale: 0.4, aliases: [US growth]}
  - id: japan_economy
    name: Japan economy
    kind: macro_factor
    description: "Japanese inflation and wages: what decides whether the BoJ keeps hiking."
    category_tags: [MF]
    features: {region: JP}
    aliases: [Japan]
    subentities:
      - {id: japan_economy.core_cpi, name: Japan core CPI, attribute_kind: inflation_rate, unit: pct y/y,
         family: gaussian, prior: {family: gaussian, mu: 2.0, sigma: 0.3}, scale: 0.3, aliases: [Japan inflation]}
      - {id: japan_economy.wage_growth, name: Japan wage growth, attribute_kind: growth_rate, unit: pct y/y,
         family: gaussian, prior: {family: gaussian, mu: 3.2, sigma: 0.5}, scale: 0.5, aliases: [shunto, Japanese wages]}
  - id: euro_economy
    name: Euro area economy
    kind: macro_factor
    description: "Euro area inflation: what the ECB reacts to, and so what Italian bank margins follow."
    category_tags: [MF]
    features: {region: EU}
    aliases: [euro area, eurozone]
    subentities:
      - {id: euro_economy.headline_cpi, name: Euro area inflation, attribute_kind: inflation_rate, unit: pct y/y,
         family: gaussian, prior: {family: gaussian, mu: 2.3, sigma: 0.3}, scale: 0.3, aliases: [euro inflation, HICP]}

  # --- the central banks -------------------------------------------------------------------------------------------
  - id: federal_reserve
    name: Federal Reserve
    short: Fed
    kind: agency
    description: "The US central bank. Hold longer, hike, or cut: its path sets the dollar leg of the rate gap."
    category_tags: [MF]
    features: {region: US, function: monetary_policy}
    aliases: [Fed, FOMC]
    subentities:
      - {id: federal_reserve.policy_rate, name: Fed funds rate (midpoint), attribute_kind: policy_rate, unit: pct,
         family: gaussian, prior: {family: gaussian, mu: 3.875, sigma: 0.25}, scale: 0.25, aliases: [fed funds, Fed rate]}
  - id: boj
    name: Bank of Japan
    short: BoJ
    kind: agency
    description: "Japan's central bank, hiking in 25 bp steps. Its path sets the yen leg of the rate gap and the cost of the carry trade's funding."
    category_tags: [MF]
    features: {region: JP, function: monetary_policy}
    aliases: [BoJ, BOJ]
    subentities:
      - {id: boj.policy_rate, name: BoJ policy rate, attribute_kind: policy_rate, unit: pct,
         family: gaussian, prior: {family: gaussian, mu: 1.0, sigma: 0.25}, scale: 0.25, aliases: [BoJ rate, Japan policy rate]}
  - id: ecb
    name: European Central Bank
    short: ECB
    kind: agency
    description: "The euro area's central bank. Its deposit rate drives European banks' interest income."
    category_tags: [MF]
    features: {region: EU, function: monetary_policy}
    aliases: [ECB]
    subentities:
      - {id: ecb.policy_rate, name: ECB deposit rate, attribute_kind: policy_rate, unit: pct,
         family: gaussian, prior: {family: gaussian, mu: 2.25, sigma: 0.25}, scale: 0.25, aliases: [ECB rate]}

  # --- the curves and the yen --------------------------------------------------------------------------------------
  - id: us_treasuries
    name: US Treasuries
    short: UST
    kind: market
    description: "The US yield curve. The two-year follows the Fed's expected path; the five- and ten-year set what insurers reinvest at."
    category_tags: [MF]
    features: {region: US, market: rates}
    aliases: [Treasuries, UST, US yields]
    subentities:
      - {id: us_treasuries.yield_2y, name: UST 2Y yield, attribute_kind: bond_yield, unit: pct,
         family: gaussian, prior: {family: gaussian, mu: 4.2, sigma: 0.2}, scale: 0.2, aliases: [two-year Treasury, US 2-year]}
      - {id: us_treasuries.yield_10y, name: UST 10Y yield, attribute_kind: bond_yield, unit: pct,
         family: gaussian, prior: {family: gaussian, mu: 4.85, sigma: 0.2}, scale: 0.2, aliases: [ten-year Treasury, US 10-year]}
  - id: jgbs
    name: Japanese government bonds
    short: JGB
    kind: market
    description: "The JGB curve. Higher super-long yields lift Japanese insurers' reinvestment income, part of which their liabilities absorb."
    category_tags: [MF]
    features: {region: JP, market: rates}
    aliases: [JGBs, JGB, Japanese yields]
    subentities:
      - {id: jgbs.yield_10y, name: JGB 10Y yield, attribute_kind: bond_yield, unit: pct,
         family: gaussian, prior: {family: gaussian, mu: 1.9, sigma: 0.15}, scale: 0.15, aliases: [ten-year JGB]}
      - {id: jgbs.yield_30y, name: JGB 30Y yield, attribute_kind: bond_yield, unit: pct,
         family: gaussian, prior: {family: gaussian, mu: 3.85, sigma: 0.15}, scale: 0.15, aliases: [thirty-year JGB, super-long JGB]}
  - id: dollar_yen
    name: Dollar-yen
    kind: market
    description: "USD/JPY and the carry trade it funds. A narrowing US-Japan gap strengthens the yen (USD/JPY falls) and can unwind the carry."
    category_tags: [MF]
    features: {market: fx}
    aliases: [USD/JPY, yen, dollar-yen]
    subentities:
      - {id: dollar_yen.usd_jpy, name: USD/JPY, attribute_kind: fx_rate, unit: ¥ per $,
         family: lognormal, mean: 156.0, scale: 0.03, aliases: [dollar-yen, yen, USDJPY]}
      - {id: dollar_yen.carry_positioning, name: Yen carry positioning, attribute_kind: capital_flow, unit: index,
         family: gaussian, prior: {family: gaussian, mu: 0.0, sigma: 1.0}, scale: 1.0, aliases: [carry trade, carry positions]}

  # --- the names ---------------------------------------------------------------------------------------------------
  - id: tokio_marine
    name: Tokio Marine
    kind: company
    description: "Japan's largest P&C insurer, more than half of its profit from abroad. A weaker yen lifts translated overseas profit; higher US and JGB yields lift reinvestment income."
    category_tags: [SC]
    features: {sector: insurance, region: JP}
    aliases: [Tokio Marine Holdings, "8766 JP", TMNF]
    levels: {share_price: 6000.0}
    subentities:
      - {id: tokio_marine.international_profit, name: Tokio Marine international business profit, attribute_kind: revenue_flow,
         unit: ¥bn/yr, family: lognormal, mean: 640.0, scale: 0.06, aliases: [international segment, overseas profit]}
      - {id: tokio_marine.japan_pc_profit, name: Tokio Marine Japan P&C profit, attribute_kind: revenue_flow,
         unit: ¥bn/yr, family: lognormal, mean: 225.0, scale: 0.06, aliases: [domestic P&C, TMNF profit]}
      - {id: tokio_marine.operating_profit, name: Tokio Marine adjusted net income, attribute_kind: revenue_flow,
         unit: ¥bn/yr, family: lognormal, mean: 960.0, scale: 0.05, aliases: [adjusted profit]}
  - id: zurich
    name: Zurich Insurance
    short: Zurich
    kind: company
    description: "A Swiss multi-line insurer with a large US book (Farmers). Higher Treasury yields lift its investment income."
    category_tags: [SC]
    features: {sector: insurance, region: CH}
    aliases: [Zurich Insurance Group, ZURN]
    levels: {share_price: 540.0}
    subentities:
      - {id: zurich.operating_profit, name: Zurich business operating profit, attribute_kind: revenue_flow, unit: $bn/yr,
         family: lognormal, mean: 9.4, scale: 0.05, aliases: [BOP]}
  - id: jpmorgan
    name: JPMorgan Chase
    short: JPMorgan
    kind: company
    description: "The largest US bank. Rates held higher for longer keep its net interest income up."
    category_tags: [SC]
    features: {sector: banking, region: US}
    aliases: [JPM, JPMorgan]
    levels: {share_price: 300.0}
    subentities:
      - {id: jpmorgan.net_interest_income, name: JPMorgan net interest income, attribute_kind: revenue_flow, unit: $bn/yr,
         family: lognormal, mean: 102.0, scale: 0.05, aliases: [NII]}
  - id: citigroup
    name: Citigroup
    short: Citi
    kind: company
    description: "A global US bank in restructuring. Its interest income follows US rates; its services fees follow cross-border flows."
    category_tags: [SC]
    features: {sector: banking, region: US}
    aliases: [Citi, C]
    levels: {share_price: 125.0}
    subentities:
      - {id: citigroup.net_interest_income, name: Citi net interest income, attribute_kind: revenue_flow, unit: $bn/yr,
         family: lognormal, mean: 64.0, scale: 0.05, aliases: [Citi NII]}
  - id: morgan_stanley
    name: Morgan Stanley
    kind: company
    description: "A US investment bank and wealth manager. Trading thrives on rate volatility; a hawkish Fed weighs on dealmaking."
    category_tags: [SC]
    features: {sector: banking, region: US}
    aliases: [MS]
    levels: {share_price: 185.0}
    subentities:
      - {id: morgan_stanley.trading_revenue, name: Morgan Stanley trading revenue, attribute_kind: revenue_flow, unit: $bn/yr,
         family: lognormal, mean: 28.0, scale: 0.08, aliases: [markets revenue]}
  - id: unicredit
    name: UniCredit
    kind: company
    description: "An Italian bank with German and Central European franchises. ECB rates set its net interest income."
    category_tags: [SC]
    features: {sector: banking, region: EU}
    aliases: [UCG]
    levels: {share_price: 80.0}
    subentities:
      - {id: unicredit.net_interest_income, name: UniCredit net interest income, attribute_kind: revenue_flow, unit: €bn/yr,
         family: lognormal, mean: 14.5, scale: 0.04, aliases: [UniCredit NII]}
  - id: toyota
    name: Toyota Motor
    short: Toyota
    kind: company
    description: "Japan's largest exporter. Each yen of USD/JPY moves its operating profit by tens of billions of yen."
    category_tags: [SC]
    features: {sector: autos, region: JP}
    aliases: [Toyota, "7203 JP"]
    levels: {share_price: 2800.0}
    subentities:
      - {id: toyota.operating_profit, name: Toyota operating profit, attribute_kind: revenue_flow, unit: ¥tn/yr,
         family: lognormal, mean: 3.4, scale: 0.08, aliases: [Toyota earnings]}
  - id: komatsu
    name: Komatsu
    kind: company
    description: "A Japanese construction and mining equipment maker. Its profit rides the yen and mining capex."
    category_tags: [SC]
    features: {sector: machinery, region: JP}
    aliases: ["6301 JP"]
    levels: {share_price: 5000.0}
    subentities:
      - {id: komatsu.operating_profit, name: Komatsu operating profit, attribute_kind: revenue_flow, unit: ¥bn/yr,
         family: lognormal, mean: 600.0, scale: 0.08, aliases: [Komatsu earnings]}
      - {id: komatsu.mining_demand, name: Mining equipment demand, attribute_kind: production_flow, unit: index,
         family: lognormal, mean: 100.0, scale: 0.06, aliases: [mining capex]}
  - id: softbank_corp
    name: SoftBank Corp
    kind: company
    description: "SoftBank's Japanese telecom arm, now building AI data centers. Higher JGB yields raise the cost of that build."
    category_tags: [SC]
    features: {sector: telecom, region: JP}
    aliases: ["9434 JP", SoftBank Corp.]
    levels: {share_price: 235.0}
    subentities:
      - {id: softbank_corp.operating_profit, name: SoftBank Corp operating income, attribute_kind: revenue_flow, unit: ¥bn/yr,
         family: lognormal, mean: 1100.0, scale: 0.06, aliases: [SoftBank Corp earnings]}
