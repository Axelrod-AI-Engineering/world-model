                    {input: "forward hedging of export receipts", status: not_disclosed_in_reviewed_sources, searched: [km.wb, km.r1, km.r2, km.x1, km.x2, "corpus: scripts/construction/inputs.py (9 files)", "corpus: hedge", "corpus: forward contract"]}]}}
