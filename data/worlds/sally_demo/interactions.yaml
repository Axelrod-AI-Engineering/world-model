# Sally's world: interactions. m01-m33 come from Emily's world (m24, Zurich, is out of scope); s01- are Sally's. Effects are in target standard units per source standard unit; kernels are mean days
# (duration_days: null is permanent). Effects default to sigma 0.15 and existence to Beta(9, 1). The chain follows
# the client's yen-rates simulator: oil -> inflation/growth (3, 6, 12 months) -> Fed and BoJ separately -> the
# two-year gap -> USD/JPY -> earnings; and the Tokio Marine driver layer: FX translation and reinvestment.
interactions:
  # oil -> inflation and growth
  - {id: m01, source: oil.brent, target: us_economy.headline_cpi, label: raises, effect: {mu: 0.45},
     kernel: {delay_days: 20, lag_days: 75, duration_days: 300}}
  - {id: m02, source: oil.brent, target: japan_economy.core_cpi, label: raises, effect: {mu: 0.3},
     kernel: {delay_days: 30, lag_days: 90, duration_days: 300}}
  - {id: m03, source: oil.brent, target: euro_economy.headline_cpi, label: raises, effect: {mu: 0.4},
     kernel: {delay_days: 20, lag_days: 75, duration_days: 300}}
  - {id: m04, source: oil.brent, target: us_economy.gdp_growth, label: weighs on, effect: {mu: -0.25},
     kernel: {delay_days: 60, lag_days: 180, duration_days: 360}}
  - {id: m05, source: us_economy.headline_cpi, target: us_economy.core_cpi, label: spreads to, effect: {mu: 0.35},
     kernel: {delay_days: 45, lag_days: 120, duration_days: null}}
  # inflation and growth -> policy, separately
  - {id: m06, source: us_economy.core_cpi, target: federal_reserve.policy_rate, label: keeps the Fed tight, effect: {mu: 0.5},
     kernel: {delay_days: 30, lag_days: 60, duration_days: null}}
  - {id: m07, source: us_economy.gdp_growth, target: federal_reserve.policy_rate, label: lets the Fed hold, effect: {mu: 0.35},
     kernel: {delay_days: 30, lag_days: 90, duration_days: null}}
  - {id: m08, source: japan_economy.core_cpi, target: boj.policy_rate, label: pushes the BoJ to hike, effect: {mu: 0.4},
     kernel: {delay_days: 45, lag_days: 90, duration_days: null}}
  - {id: m09, source: japan_economy.wage_growth, target: boj.policy_rate, label: pushes the BoJ to hike, effect: {mu: 0.45},
     kernel: {delay_days: 60, lag_days: 120, duration_days: null}}
  - {id: m10, source: euro_economy.headline_cpi, target: ecb.policy_rate, label: keeps the ECB tight, effect: {mu: 0.45},
     kernel: {delay_days: 30, lag_days: 75, duration_days: null}}
  # policy -> curves
  - {id: m11, source: federal_reserve.policy_rate, target: us_treasuries.yield_2y, label: anchors, effect: {mu: 0.85},
     kernel: {delay_days: 1, lag_days: 10, duration_days: null}}
  - {id: m12, source: us_treasuries.yield_2y, target: us_treasuries.yield_10y, label: lifts, effect: {mu: 0.5},
     kernel: {delay_days: 1, lag_days: 14, duration_days: null}}
  - {id: m13, source: boj.policy_rate, target: jgbs.yield_10y, label: lifts, effect: {mu: 0.6},
     kernel: {delay_days: 1, lag_days: 14, duration_days: null}}
  - {id: m14, source: jgbs.yield_10y, target: jgbs.yield_30y, label: lifts, effect: {mu: 0.6},
     kernel: {delay_days: 1, lag_days: 21, duration_days: null}}
  # the rate gap -> the yen
  - {id: m15, source: us_treasuries.yield_2y, target: dollar_yen.usd_jpy, label: "widens the gap, weakening the yen", effect: {mu: 0.2},
     kernel: {delay_days: 1, lag_days: 20, duration_days: null}}
  - {id: m16, source: boj.policy_rate, target: dollar_yen.usd_jpy, label: "narrows the gap, strengthening the yen", effect: {mu: -0.2},
     kernel: {delay_days: 1, lag_days: 20, duration_days: null}}
  - {id: m17, source: boj.policy_rate, target: dollar_yen.carry_positioning, label: raises carry funding costs, effect: {mu: -0.5},
     kernel: {delay_days: 3, lag_days: 20, duration_days: 180}}
  - {id: m18, source: dollar_yen.carry_positioning, target: dollar_yen.usd_jpy, label: holds the yen down, effect: {mu: 0.35},
     kernel: {delay_days: 1, lag_days: 10, duration_days: 240}}
  # the yen and yields -> the names
  # Tokio Marine (Oct 17): transitions say what each broad link means and where it stops; the business construction
  # behind them is data/worlds/sally_demo/construction/tokio_marine.yaml. m20, m21 are reduced-form summaries of its
  # reinvestment paths (never added to them); m22, m23 are accounting parts of adjusted net income by business.
  - {id: m19, source: dollar_yen.usd_jpy, target: tokio_marine.international_profit, label: translates overseas profit, effect: {mu: 0.45},
     kernel: {delay_days: 30, lag_days: 90, duration_days: null},
     transition: {mechanism: "Overseas profit earned in local currency translates into more yen when the yen is weaker (period-average rate); the local operating result is carried separately by tm-a-intl-translate",
       actor: group reporting, business_unit: International, geography: "US, Europe, Latin America, Asia-Pacific", currency: local into JPY,
       condition: "no hedge of translated earnings; the dollar is the main but not the only currency (s55 carries the euro)",
       condition_observable: "reported growth versus growth ex-FX; disclosed per-yen sensitivity of overseas profit",
       timing: {onset: same quarter (average rate), build: through the fiscal year, persistence: while the rate holds, recognition: quarterly results},
       evidence: {existence: documented, direction: documented, magnitude: documented, timing: documented, sources: [tm.co, tm.seg]},
       breaker: "Japan P&C foreign-currency reserves move the other way (tm-c-fx-reserves); investor-currency return is not issuer translation",
       next_state: international adjusted net income in yen,
       unresolved: [{input: "company per-yen FX sensitivity of overseas profit", status: "found_connected", searched: ["tm.seg"], found_in: ["tm.seg"], note: "the company's per-yen sensitivity (cited page in tm.seg) converts to about m19's size at the construction levels; m19 is kept; the conversion is in the local gap evidence; bound by a citation"}]}}
  - {id: m20, source: us_treasuries.yield_10y, target: tokio_marine.international_profit, label: lifts reinvestment income, effect: {mu: 0.25},
     kernel: {delay_days: 60, lag_days: 180, duration_days: null},
     transition: {mechanism: "Reduced-form summary of the international reinvestment path: higher US yields raise income only on the reinvesting share of the North America fixed-income book, net of the liability unwind; the UST 10Y is not applied to all international assets",
       actor: North America asset management, business_unit: International (North America), geography: US, currency: USD,
       condition: "fixed-rate USD bonds reinvest near that tenor; spreads unchanged; unwind does not absorb all of it",
       condition_observable: "new-money yield; investment income versus insurance finance expense",
       timing: {onset: 2 quarters, build: years (turnover), persistence: to maturity, recognition: accrual},
       evidence: {existence: documented, direction: inferred, magnitude: assumption, timing: assumption, sources: [tm.seg, tm.co, tm.r7]},
       breaker: "credit losses; spread tightening; allocation to loans or floating-rate assets",
       next_state: international adjusted net income,
       unresolved: [{input: "reinvested share per year (North America)", status: "not_disclosed_in_reviewed_sources", searched: ["tm.wb", "tm.seg", "tm.r1", "tm.r2", "tm.r3", "tm.r4", "tm.r5", "tm.r6", "tm.r7", "tm.r8", "tm.corpus", "corpus: reinvested share per year (North America)", "corpus: reinvested", "corpus: reinvestment", "corpus: fixed-rate portfolio"], note: "the client segment model (tm.seg) carries it as its own assumption, marked not disclosed by the company; m20 is the reduced-form summary of tm.path.international_reinvestment and is never added to it once that path is calibrated"},
         {input: "floating-rate share (North America)", status: "not_disclosed_in_reviewed_sources", searched: ["tm.wb", "tm.seg", "tm.r1", "tm.r2", "tm.r3", "tm.r4", "tm.r5", "tm.r6", "tm.r7", "tm.r8", "tm.corpus", "corpus: floating-rate share (North America)", "corpus: floating", "corpus: variable rate", "corpus: loans"], note: "the loan share of one US unit's portfolio is found (tm.seg, a company IR page as cited); the floating share of the North America book is not stated"}]}}
  - {id: m21, source: jgbs.yield_30y, target: tokio_marine.japan_pc_profit, label: lifts reinvestment income, effect: {mu: 0.3},
     kernel: {delay_days: 20, lag_days: 90, duration_days: null},
     transition: {mechanism: "Reduced-form summary of the domestic reinvestment path: super-long JGB yields raise Japan P&C income only on new money invested at that tenor; they do not apply to all domestic assets, and domestic bond income is a small part of the P&C company's interest and dividends",
       actor: Japan P&C asset management, business_unit: Japan P&C, geography: Japan, currency: JPY,
       condition: "new money goes into super-long JGBs; liability unwind does not absorb all of it",
       condition_observable: "tenor mix of purchases; domestic bond income",
       timing: {onset: 1 quarter, build: years (turnover), persistence: to maturity, recognition: accrual},
       evidence: {existence: inferred, direction: inferred, magnitude: assumption, timing: assumption, sources: [tm.wb, tm.seg]},
       breaker: "low turnover; P&C book duration shorter than super-long; allocation to other assets",
       next_state: Japan P&C adjusted net income,
       unresolved: [{input: "reinvested share per year (Japan P&C)", status: "not_disclosed_in_reviewed_sources", searched: ["tm.wb", "tm.seg", "tm.r1", "tm.r2", "tm.r3", "tm.r4", "tm.r5", "tm.r6", "tm.r7", "tm.r8", "tm.corpus", "corpus: reinvested share per year (Japan P&C)", "corpus: reinvested", "corpus: reinvestment", "corpus: share of portfolio reinvested"], note: "tm.seg carries it as its own assumption, marked not disclosed; the sensitivities built on it are not used; m21's size is not supported by asset-level scope: recalibrate m21 once tm.path.domestic_yields can be sized, and never add the two"},
         {input: "tenor mix of new purchases (Japan P&C)", status: "not_disclosed_in_reviewed_sources", searched: ["tm.wb", "tm.seg", "tm.r1", "tm.r2", "tm.r3", "tm.r4", "tm.r5", "tm.r6", "tm.r7", "tm.r8", "tm.corpus", "corpus: tenor mix of new purchases (Japan P&C)", "corpus: super-long", "corpus: tenor", "corpus: 30-year", "corpus: 30Y", "corpus: new money"], note: "no purchase tenor or super-long share in the workbook, the broker notes or tm.seg"}]}}
  - {id: m22, source: tokio_marine.international_profit, target: tokio_marine.operating_profit, label: adds to, edge_type: accounting,
     effect: {mu: 0.8, sigma: 0.001}, kernel: {delay_days: 0, lag_days: 1, duration_days: null},
     transition: {mechanism: "International adjusted net income is one part of group adjusted net income (company definition); weight is its scale over the total's",
       business_unit: International, condition: "same basis (adjusted net income by business, IFRS), period and yen",
       timing: {onset: same reporting period, build: none, persistence: identity, recognition: quarterly results},
       evidence: {existence: documented, direction: documented, magnitude: model, timing: documented, sources: [tm.seg, tm.r1]},
       next_state: group adjusted net income}}
  - {id: m23, source: tokio_marine.japan_pc_profit, target: tokio_marine.operating_profit, label: adds to, edge_type: accounting,
     effect: {mu: 0.28, sigma: 0.001}, kernel: {delay_days: 0, lag_days: 1, duration_days: null},
     transition: {mechanism: "Japan P&C adjusted net income is one part of group adjusted net income (company definition); weight is its scale over the total's",
       business_unit: Japan P&C, condition: "same basis (adjusted net income by business, IFRS), period and yen",
       timing: {onset: same reporting period, build: none, persistence: identity, recognition: quarterly results},
       evidence: {existence: documented, direction: documented, magnitude: model, timing: documented, sources: [tm.seg, tm.r1]},
       next_state: group adjusted net income}}
  - {id: m25, source: federal_reserve.policy_rate, target: jpmorgan.net_interest_income, label: widens margins, state: {asymmetry: {rises: {mu: 0.3569, sigma: 0.0128}, falls: {mu: 0.3648, sigma: 0.0128}}}, note: "sized by least squares over the disclosed earnings-at-risk scenarios (parallel up and down at two dates, jpm.co), jointly with jpm-c-ust10-nii, after netting the channels the model represents exactly (deposit beta through interest-bearing deposits, cash at the Fed): it carries the rest of the short-end response",
     kernel: {delay_days: 30, lag_days: 90, duration_days: null},
     # Oct 18 (conversion, docs/construction/jpmorgan.md G03): the short-end response the identities of jpm.path.rates_nii
     # do not represent (floating loans, securities hedges, mix), sized from the disclosed scenarios net of the represented channels
     transition: {mechanism: "The part of the short-end response the identities do not carry: a higher policy rate raises firmwide NII through floating-rate loans, securities and swaps repricing and the funding mix; deposit costs (the beta through interest-bearing deposits) and cash at the Fed are represented exactly beside it in jpm.path.rates_nii",
       sign: "+", actor: JPMorgan (balance sheet as a whole), business_unit: firmwide, geography: US, currency: USD,
       condition: "deposit betas below one and lagged; balance sheet roughly static", condition_observable: "the company's earnings-at-risk scenarios (12-month pretax earnings, ex Markets)",
       observable: {name: firmwide net interest income, definition: "managed NII incl. Markets NII", units: $bn/yr, frequency: quarterly results, proof_limits: "the disclosed sensitivity excludes Markets and assumes a static balance sheet; the parallel scenario moves short and long rates together"},
       timing: {onset: within the quarter, build: "2-4 quarters as deposit betas catch up", persistence: while the rate holds, recognition: interest income and expense each quarter},
       evidence: {existence: documented, direction: documented, magnitude: inferred, timing: inferred, sources: [jpm.co, jpm.r3, jpm.r8]},
       breaker: "receive-fixed swaps and a shrinking floating book; the size is the disclosed scenarios less the represented deposit and cash channels at construction levels, so it moves if those channels or levels change; the disclosure excludes Markets and assumes a static balance sheet",
       next_state: firmwide net interest income,
       unresolved: [{input: "short-end-only earnings sensitivity on the firmwide (incl. Markets) basis", status: not_disclosed_in_reviewed_sources, searched: [jpm.r3, jpm.r5, jpm.r8, jpm.r9, "corpus: earnings.at.risk|asset.sensitiv|100 ?bps", "corpus: short.term rates|front end|short end"], note: "only the parallel and steeper-curve scenarios are cited; the short end is separated by solving them jointly with the long end"}]}}
  - {id: m26, source: federal_reserve.policy_rate, target: citigroup.net_interest_income, label: widens margins, effect: {mu: 0.1},
     kernel: {delay_days: 30, lag_days: 90, duration_days: null},
     # Oct 18 (construction review, docs/construction/citigroup.md G04): size kept for Sally's expected paths; the steps
     # are cit.path.usd_rates (uncalibrated), never added to it
     transition: {mechanism: "Reduced form: a higher Fed policy rate raises Citi's firm NII; the steps are cit.path.usd_rates (USD deposit spreads in TTS and Wealth against the deposit-cost catch-up, floating loans, card APRs, Treasury cash, and the Markets NII offset) and are never added to this link",
       sign: "+", actor: Citi (balance sheet as a whole), business_unit: firmwide, geography: US, currency: USD,
       condition: "deposit betas below one and lagged; balance sheet roughly static", condition_observable: "the company's interest-rate-exposure disclosure by currency (not in the supplied material)",
       observable: {name: firm net interest income, definition: "reported NII incl. Markets NII", units: $bn/yr, frequency: quarterly results, proof_limits: "the disclosed sensitivity moves all currencies together; a USD-only figure is not disclosed in the sources read"},
       timing: {onset: within the quarter, build: "year two, as the company describes its USD book", persistence: while the rate holds, recognition: interest income and expense each quarter},
       evidence: {existence: documented, direction: guidance, magnitude: assumption, timing: guidance, sources: [cit.v1, cit.co, cit.r6, cit.r4]},
       breaker: "the company calls its USD NII roughly neutral within twelve months, its sensitivity being mainly non-USD (cit-c-nonusd-nii carries that, calibrated from the disclosure); the size here (0.1 sd/sd) is the original record's, not a Citi USD disclosure",
       next_state: firm net interest income,
       unresolved: [{input: "USD-only NII sensitivity", status: not_disclosed_in_reviewed_sources, searched: [cit.v1, cit.wb, cit.r3, cit.r4, cit.r5, cit.r6, "corpus: interest rate exposure", "corpus: roughly neutral|rate neutral"], note: "qualitative only in the call as recorded by the client model"}]}}
  - {id: m28, source: ecb.policy_rate, target: unicredit.net_interest_income, label: sets margins, note: "sized by least squares over the disclosed scenarios parallel_up_50, parallel_down_50 (ucg.co), jointly with s76", effect: {mu: 0.1153, sigma: 0.0063},
     kernel: {delay_days: 30, lag_days: 90, duration_days: null},
     # Oct 18 (construction review, docs/construction/unicredit.md G03): the summary link; its structural steps are
     # ucg.path.rates_nii, never added to it; sized with s76 from the disclosed scenarios (conversion round)
     transition: {mechanism: "Reduced form: a higher ECB deposit rate raises group NII because floating-rate loans reprice off Euribor within a reset while deposit costs follow by the pass-through with a lag (a deposit-rich bank); the steps are ucg.path.rates_nii and are never added to this link",
       sign: "+", actor: UniCredit (balance sheet as a whole), business_unit: group, geography: euro area, currency: EUR,
       condition: "pass-through below one and lagged; balance sheet roughly static", condition_observable: "the company's disclosed NII sensitivity to a parallel rate shift (annualised)",
       observable: {name: group net interest income, definition: "reclassified NII, standalone", units: €bn/yr, frequency: quarterly results, proof_limits: "the disclosed sensitivity is for a parallel shift of the whole curve (short end and the structural hedge together); no short-end-only figure"},
       timing: {onset: within the quarter, build: "2-4 quarters as the pass-through catches up", persistence: while the rate holds, recognition: interest income and expense each quarter},
       evidence: {existence: documented, direction: documented, magnitude: model, timing: inferred, sources: [ucg.co, ucg.wb, ucg.r4]},
       breaker: "the pass-through catching up; deposit migration; sized with s76 by least squares over the disclosed parallel-shift scenarios and the year-one roll of the disclosed hedge (the split is derived, not disclosed; scenarios in the local citations)",
       next_state: group net interest income,
       unresolved: [{input: "short-end-only NII sensitivity (split of the disclosed parallel shift)", status: found_connected, found_in: [ucg.wb], searched: [ucg.wb, ucg.r1, ucg.r2, ucg.r3, ucg.r4, ucg.r5, ucg.r7, "corpus: scripts/construction/inputs.py (10 files)", "corpus: parallel shift|+/-50bp|50bp"], note: "not disclosed as such; derived from the disclosed hedge notional and maturity (its year-one roll) and bound in the scenario calibration with m28 and s76"}]}}
  - id: m29
    source: dollar_yen.usd_jpy
    target: toyota.operating_profit
    label: a weaker yen lifts
    note: "R13 netting (Oct 18, pack round): sized by least squares over eight actual periods of the company's total FX effect on operating income less its US dollar transactional line (which ty_yen_transaction now carries, documented), annualized, against the USD/JPY change (ty.fsum, ty.dk). The remainder pools translation, the euro and other currencies, so it is graded inferred"
    effect: {mu: 0.5419, sigma: 0.0912}
    kernel: {delay_days: 30, lag_days: 90, duration_days: null}
    # Oct 17 (construction review, docs/construction/toyota.md G09): kept calibrated as the aggregate; its transaction,
    # translation and imported-input parts are uncalibrated branches of ty.path.yen, never added to it. Oct 18: the
    # reviewed sources disclose no per-yen sensitivity; the size rests on the client model's per-yen inference from the
    # company's results bridges (magnitude: model), which brackets this effect. Oct 18 (pack round, R13): the company's own
    # walks size the transaction branch (ty_yen_transaction, documented); m29 now carries only the remainder of the total
    # FX effect (translation, euro, other currencies), graded inferred, so the two never count the dollar transaction twice.
    # Translation and imported inputs stay unsized branches inside that remainder
    transition:
      mechanism: "Aggregate yen effect: a weaker yen raises consolidated operating income, mostly through dollar-priced exports from Japan (transaction), plus translation of overseas profits, less dearer imported inputs"
      sign: "+"
      actor: Toyota (exporter and consolidating parent)
      business_unit: group
      geography: Japan and overseas
      currency: USD/JPY (other currencies not represented)
      condition: export volume from Japan as it is; overseas subsidiaries profitable; little hedging beyond the short term
      condition_observable: the results bridge's transactional and translational FX lines, period by period, against the change in the average rate
      observable: {name: consolidated operating income, definition: reported operating income (IFRS), units: ¥tn/yr, frequency: quarterly results, proof_limits: "the total mixes every mechanism; the bridge's FX lines are period changes, not sensitivities"}
      timing: {onset: as rates apply to shipments and quarterly averages, build: a quarter or two as hedges roll off, persistence: while the rate holds, recognition: operating income of the quarter}
      evidence: {existence: documented, direction: documented, magnitude: inferred, timing: inferred, sources: [ty.bridge, ty.sm, ty.dk, ty.fsum]}
      breaker: localization of production shrinks the export base; North America losses reverse the translation part; hedging delays it
      next_state: Toyota operating profit
      unresolved:
      - {input: "split of the yen sensitivity by channel", status: found_connected, searched: [ty.wb, ty.bridge, ty.sm, ty.r1, ty.r2, ty.xc, ty.peer, ty.robo, ty.rates, "corpus: split of the yen sensitivity by channel", "corpus: transactional", "corpus: translational", "corpus: fx rates"], found_in: [ty.bridge, ty.dk, ty.fsum, ty.sm], note: "the results bridge splits FX into transactional and translational lines, and the client's transmission model infers a transactional effect per yen from the company's walks; bound as citations on m29 and the transaction and translation branches. Pack round: the company's own walks give the dollar transactional line with the rates used, which now sizes the transaction branch; m29 keeps the remainder (R13 netting)"}
      - {input: "sensitivity to currencies other than the dollar", status: found_connected, searched: [ty.wb, ty.bridge, ty.sm, ty.r1, ty.r2, ty.xc, ty.peer, ty.robo, ty.rates, "corpus: sensitivity to currencies other than the dollar", "corpus: eur/jpy", "corpus: other currencies", "corpus: per yen"], found_in: [ty.sm], note: "a euro transactional effect is inferred in the client's transmission model; other currencies are pooled and not split. Bound as a citation on m29, which represents the dollar only"}
  - {id: m30, source: dollar_yen.usd_jpy, target: komatsu.operating_profit, label: a weaker yen lifts, effect: {mu: 0.4385, sigma: 0.0485},
