        basis; EV/EBITDA valuation), metric: ebitda, prior: synthetic}
  - entity: softbank_corp
    id: softbank_corp.depreciation
    name: SoftBank Corp depreciation and amortization
    attribute_kind: revenue_flow
    unit: ¥bn/yr
    family: gaussian
    prior: {family: gaussian, mu: -750.0, sigma: 25.0}
    scale: 25.0
    features: {view: reporting_segments, basis: 'group depreciation and amortization incl. right-of-use assets (a charge, negative)',
      metric: depreciation_amortization, prior: synthetic}
  - entity: softbank_corp
    id: softbank_corp.pretax_income
    name: SoftBank Corp profit before tax
    attribute_kind: revenue_flow
    unit: ¥bn/yr
    family: lognormal
    mean: 1000.0
    scale: 0.07
    features: {view: reporting_segments, basis: IFRS profit before income taxes, metric: pretax_income, prior: synthetic}
  - entity: softbank_corp
