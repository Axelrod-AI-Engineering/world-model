interactions:
  # ===================== causal links: uncalibrated (mechanism and sign; size unknown) unless an effect is given =====================
  # --- consumer mobile: tariffs, ARPU, churn and subscribers (subscribers x ARPU = mobile service revenue) ---
  - id: sbk-c-tariff-arpu
    source: softbank_corp.mobile_tariff_index
    target: softbank_corp.mobile_arpu
    label: raises ARPU on existing plans
    calibration: uncalibrated
    transition:
      mechanism: A higher tariff on existing SoftBank and Y!mobile plans raises revenue per subscriber as the new price reaches
        the base; together with migration to larger-data plans it turned ARPU up after years of decline
      sign: +
      actor: SoftBank Corp (pricing)
      business_unit: Consumer mobile (and corporate lines)
      geography: Japan
      currency: JPY
      condition: the increase applies to the existing base, not only new contracts, and churn stays contained
      condition_observable: mobile ARPU, quarterly; the yoy change in ARPU after the increase month
      observable: {name: mobile ARPU, definition: mobile service revenue per main subscriber per month, units: ¥/month, frequency: quarterly
          results, proof_limits: a blend of brands and plans; the price effect is not split from plan-mix migration in the sources
          read}
      timing: {onset: the month the new tariff takes effect (July 2026), build: one quarter to the full run rate, persistence: while
          the tariff holds and is not discounted back, recognition: service revenue each month}
      evidence:
        existence: documented
        direction: documented
        magnitude: unknown
        timing: broker
        sources: [sbk.r1, sbk.r3, sbk.co]
      breaker: discounts or loyalty offers that hand the increase back; down-trading to the cheaper brands; regulatory pressure
        on charges
      next_state: mobile ARPU
      unresolved:
      - input: size of the existing-plan price increase (percent and plans covered)
        status: not_disclosed_in_reviewed_sources
        searched: [sbk.r1, sbk.r2, sbk.r3, sbk.r4, sbk.macro, 'corpus: scripts/construction/inputs.py (25 files)', 'corpus: size
            of the existing-plan price increase (percent and plans covered)', 'corpus: price hike', 'corpus: price increase',
          'corpus: raised prices', 'corpus: existing plans']
        note: 'keyword candidates read: the broker''s revenue effect (cited) and ARPU guidance are found; the percentage and plans
          covered are not'
  - id: sbk-c-tariff-churn
    source: softbank_corp.mobile_tariff_index
    target: softbank_corp.mobile_churn_rate
    label: pushes some subscribers to leave
    calibration: uncalibrated
    transition:
      mechanism: A price increase on existing plans prompts some subscribers to switch carrier or brand; the precedent of a rival's
        increase suggests cancellations stay limited when the increase is justified by inflation and added services
      sign: +
      actor: subscribers (switching decision)
      business_unit: Consumer mobile
      geography: Japan
      currency: JPY
      condition: rivals do not cut prices at the same time; switching costs and bundles hold
      condition_observable: monthly smartphone churn against the same month a year earlier
      observable: {name: mobile churn rate, definition: cancellations over average subscriptions, units: pct/month, frequency: quarterly
          results (monthly in commentary), proof_limits: a single churn figure mixes price-driven and short-term-user cancellations}
      timing: {onset: within 1-2 months of the increase, build: 1-2 quarters, persistence: fades as the base re-prices, recognition: subscriber
          count each quarter}
      evidence:
        existence: broker
        direction: broker
        magnitude: unknown
        timing: broker
        sources: [sbk.r3, sbk.r1]
      breaker: rivals following with their own increases (removes the reason to switch); bundled broadband and payment benefits
      next_state: churn rate
      unresolved:
      - input: churn response to the existing-plan price increase
        status: not_disclosed_in_reviewed_sources
        searched: [sbk.r1, sbk.r2, sbk.r3, sbk.r4, sbk.macro, 'corpus: scripts/construction/inputs.py (25 files)', 'corpus: churn
            response to the existing-plan price increase', 'corpus: churn rate', 'corpus: cancellations']
        note: 'keyword candidates read: qualitative (a rival''s increase did not raise churn much; SoftBank''s June churn improved);
          cited for the direction, no size'
  - id: sbk-c-tariff-entcomms
    source: softbank_corp.mobile_tariff_index
    target: softbank_corp.enterprise_communications_revenue
    label: lifts corporate line revenue
    calibration: uncalibrated
    transition:
      mechanism: 'Mobile ARPU and subscription KPIs cut across Consumer and Enterprise: corporate lines on the repriced plans
        carry the increase into Enterprise communications revenue'
      sign: +
      actor: SoftBank Corp (pricing)
      business_unit: Enterprise communications
      geography: Japan
      currency: JPY
      condition: corporate contracts on the repriced tariffs (not negotiated enterprise pricing)
      condition_observable: Enterprise communications revenue against corporate line count
      observable: {name: Enterprise communications revenue, definition: 'corporate mobile, fixed-line and handset revenue', units: ¥bn/yr,
        frequency: quarterly results, proof_limits: the share of corporate lines on the repriced tariffs is not disclosed}
      timing: {onset: the increase month, build: 1-2 quarters, persistence: while the tariff holds, recognition: service revenue}
      evidence:
        existence: broker
        direction: inferred
        magnitude: unknown
        timing: unknown
        sources: [sbk.r1]
      breaker: negotiated enterprise contracts that are not repriced
      next_state: Enterprise communications revenue
      unresolved:
      - input: share of corporate lines on repriced tariffs
        status: not_disclosed_in_reviewed_sources
        searched: [sbk.r1, sbk.r2, sbk.r3, sbk.r4, sbk.macro, 'corpus: scripts/construction/inputs.py (25 files)', 'corpus: share
            of corporate lines on repriced tariffs', 'corpus: corporate mobile', 'corpus: enterprise mobile']
        note: 'keyword candidates read: corporate subscriptions are rising, no share on repriced tariffs'
  - id: sbk-c-tariff-netcapex
    source: softbank_corp.mobile_tariff_index
    target: softbank_corp.network_capex
    label: funds network investment
    calibration: uncalibrated
    transition:
      mechanism: 'Management ties the increase to funding network quality: the extra cash flow from higher tariffs is reinvested
        in the network from the next fiscal year, which raises depreciation later'
      sign: +
      actor: SoftBank Corp (capital allocation)
      business_unit: network
      geography: Japan
      currency: JPY
      condition: the reinvestment plan holds; cash flow from the increase materializes
      condition_observable: network capex plans in results guidance
      observable: {name: telecom network investment, definition: mobile and fixed network capex, units: ¥bn/yr, frequency: annual
          guidance, proof_limits: the network share of capex is not disclosed}
      timing: {onset: the next fiscal year, build: 1-2 years, persistence: a multi-year programme, recognition: capex as spent;
          depreciation over asset lives}
      evidence:
        existence: broker
        direction: broker
        magnitude: unknown
        timing: broker
        sources: [sbk.r3, sbk.co]
      breaker: capital allocation shifted to the AI build or to dividends
      next_state: network investment
      unresolved:
      - input: network share of capital expenditure
        status: not_disclosed_in_reviewed_sources
        searched: [sbk.r1, sbk.r2, sbk.r3, sbk.r4, sbk.macro, 'corpus: scripts/construction/inputs.py (25 files)', 'corpus: network
            share of capital expenditure', 'corpus: network investment', 'corpus: network quality']
        note: 'keyword candidates read: qualitative statements of more network-quality investment, no amount'
  - id: sbk-c-arpu-mobile
    source: softbank_corp.mobile_arpu
    target: softbank_corp.consumer_mobile_revenue
    label: times subscribers is mobile service revenue
    note: 'converted: a term of the identity sbk.id.mobile_revenue'
    transition:
      mechanism: 'Mobile service revenue is ARPU times average subscribers: a higher ARPU on the same base raises consumer mobile
        revenue'
      sign: +
      actor: none (arithmetic)
      business_unit: Consumer mobile
      geography: Japan
      currency: JPY
      condition: the consumer share of the main-subscriber base is stable
      condition_observable: mobile service revenue against ARPU x average subscribers
      observable: {name: Consumer mobile service revenue, definition: consumer mobile communication service revenue, units: ¥bn/yr,
        frequency: quarterly results, proof_limits: 'ARPU and subscribers cover consumer and enterprise lines; consumer revenue
          is most, not all, of the product'}
      timing: {onset: same period, build: none, persistence: identity, recognition: service revenue each month}
      evidence:
        existence: documented
        direction: documented
        magnitude: inferred
        timing: documented
        sources: [sbk.r3, sbk.r1]
      breaker: 'none: an identity; a shift of lines between consumer and enterprise changes the share'
      next_state: Consumer mobile service revenue
    edge_type: identity
    identity: sbk.id.mobile_revenue
  - id: sbk-c-subs-mobile
    source: softbank_corp.main_subscribers
    target: softbank_corp.consumer_mobile_revenue
    label: times ARPU is mobile service revenue
    note: 'converted: a term of the identity sbk.id.mobile_revenue'
    transition:
      mechanism: 'Mobile service revenue is ARPU times average subscribers: more subscribers at the same ARPU raise consumer mobile
        revenue'
      sign: +
      actor: none (arithmetic)
      business_unit: Consumer mobile
      geography: Japan
      currency: JPY
      condition: ARPU of added or lost lines near the average (short-term users have lower ARPU)
      condition_observable: net additions and their mix by brand
      observable: {name: Consumer mobile service revenue, definition: consumer mobile communication service revenue, units: ¥bn/yr,
        frequency: quarterly results, proof_limits: lost short-term users carry lower ARPU than the average}
      timing: {onset: same period, build: none, persistence: identity, recognition: service revenue each month}
      evidence:
        existence: documented
        direction: documented
        magnitude: inferred
        timing: documented
        sources: [sbk.r3, sbk.r1]
      breaker: 'none: an identity'
      next_state: Consumer mobile service revenue
    edge_type: identity
    identity: sbk.id.mobile_revenue
  - id: sbk-c-churn-cancellations
    source: softbank_corp.mobile_churn_rate
    target: softbank_corp.mobile_cancellations
    label: times subscribers is cancellations
    note: 'converted: churn x subscribers = cancellations (sbk.id.cancellations), which flow out of the subscriber stock (sbk.sf.subscribers)'
    transition:
      mechanism: 'Subscribers are a stock: each month''s churn removes a share of the base; with gross additions unchanged a higher
        churn rate lowers subscribers'
      sign: '-'
      actor: subscribers
      business_unit: Consumer and Enterprise mobile
      geography: Japan
      currency: JPY
      condition: gross additions do not rise to offset
      condition_observable: quarterly net additions
      observable: {name: main subscribers, definition: main mobile subscriptions at period end, units: mn, frequency: quarterly
          results, proof_limits: gross additions are not disclosed in the sources read}
      timing: {onset: within the month, build: accumulates while churn stays high, persistence: until churn normalizes, recognition: period-end
