# SoftBank Corp (the Japanese telecom operator, 9434; not SoftBank Group): business construction (Oct 18). Values added
# to the softbank_corp entity, four new market and regulator entities, links with their transitions, named paths, and
# compositions (model/construction.py). Structure and generic telecom mechanisms only: priors are synthetic, round,
# order-of-magnitude levels marked as such; dated client levels, citations and source bindings stay local
# (data/sally_data/construction/softbank_corp/). Source ids in evidence.sources: sbk.r1 (broker company note: segment
# P&L, KPIs, balance sheet, cash flow, guidance as cited), sbk.r2 (broker AI-strategy event note), sbk.r3 (broker sector
# note: KPIs, competition, capex, payments), sbk.r4 (broker note on a rival's roaming change), sbk.co (company guidance
# and policy as cited in the broker notes; not read directly), sbk.macro (rates and yen research), sbk.pub (public
# business, accounting and regulatory knowledge). No company workbook was supplied.
#
# Bases (features.basis): IFRS, fiscal year ending March, JPY. Segment revenue includes internal sales. Costs, charges
# and deductions are held as negative values, so every part adds to its total with a positive weight; a cost link's
# sign "-" means "a larger charge". Accounting weights are scale_part / scale_total in native sd (log sd times level
# for a lognormal value). A link that is an identity the method cannot yet hold (a product, a ratio, a stock-flow, a
# sum across two views) is uncalibrated with a full transition and says so in its note (identity:, stock-flow:,
# matrix:, state:), so it converts mechanically once those forms exist.

subentities:
  # --- group P&L: revenue and operating income by reporting segment, and the bridge to net income (IFRS) ---
  - entity: softbank_corp
    id: softbank_corp.revenue
    name: SoftBank Corp revenue
    attribute_kind: revenue_flow
    unit: ¥bn/yr
    family: lognormal
    mean: 7000.0
    scale: 0.03
    aliases: [SoftBank Corp sales, operating revenue]
    features: {view: reporting_segments, basis: IFRS consolidated revenue (operating revenue), metric: revenue, prior: synthetic}
  - entity: softbank_corp
    id: softbank_corp.consumer_revenue
    name: SoftBank Corp Consumer revenue
    attribute_kind: revenue_flow
    unit: ¥bn/yr
    family: lognormal
    mean: 3000.0
    scale: 0.03
    features: {view: reporting_segments, basis: 'segment: Consumer revenue incl. internal sales (mobile, broadband, electricity,
        handsets)', metric: consumer_revenue, prior: synthetic}
  - entity: softbank_corp
    id: softbank_corp.enterprise_revenue
    name: SoftBank Corp Enterprise revenue
    attribute_kind: revenue_flow
    unit: ¥bn/yr
    family: lognormal
    mean: 1000.0
    scale: 0.05
    features: {view: reporting_segments, basis: 'segment: Enterprise revenue incl. internal sales (communications, solutions,
        cloud & AI)', metric: enterprise_revenue, prior: synthetic}
  - entity: softbank_corp
    id: softbank_corp.distribution_revenue
    name: SoftBank Corp Distribution revenue
    attribute_kind: revenue_flow
    unit: ¥bn/yr
    family: lognormal
    mean: 1000.0
    scale: 0.08
    features: {view: reporting_segments, basis: 'segment: Distribution revenue incl. internal sales (IT hardware, software and
        services distribution)', metric: distribution_revenue, prior: synthetic}
  - entity: softbank_corp
    id: softbank_corp.media_ec_revenue
    name: SoftBank Corp Media & EC revenue
    attribute_kind: revenue_flow
    unit: ¥bn/yr
    family: lognormal
    mean: 1700.0
    scale: 0.04
    aliases: [LY Corp revenue, LINE Yahoo revenue]
    features: {view: reporting_segments, basis: 'segment: Media & EC revenue incl. internal sales (LY Corporation: advertising,
        e-commerce, membership)', metric: media_ec_revenue, prior: synthetic}
  - entity: softbank_corp
    id: softbank_corp.financial_revenue
    name: SoftBank Corp Financial revenue
    attribute_kind: revenue_flow
    unit: ¥bn/yr
    family: lognormal
    mean: 400.0
    scale: 0.08
    aliases: [PayPay revenue]
    features: {view: reporting_segments, basis: 'segment: Financial revenue incl. internal sales (PayPay payments, card, bank;
        SB Payment Service)', metric: financial_revenue, prior: synthetic}
  - entity: softbank_corp
    id: softbank_corp.revenue_other_and_eliminations
    name: SoftBank Corp other segments and revenue eliminations
    attribute_kind: revenue_flow
    unit: ¥bn/yr
    family: gaussian
    prior: {family: gaussian, mu: -100.0, sigma: 30.0}
    scale: 30.0
    features: {view: reporting_segments, basis: 'elimination (net): the Other segment less intersegment eliminations, reported
        together in the sources read (negative)', prior: synthetic}
  - entity: softbank_corp
    id: softbank_corp.consumer_op
    name: SoftBank Corp Consumer segment income
    attribute_kind: revenue_flow
    unit: ¥bn/yr
    family: lognormal
    mean: 560.0
    scale: 0.05
    features: {view: reporting_segments, basis: 'segment: Consumer segment income (IFRS operating income basis)', metric: consumer_segment_income,
