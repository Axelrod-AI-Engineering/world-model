    entity_id: softbank_corp
    trigger: JGB 10-year yields rise
    endpoint: softbank_corp.net_income
    description: 'Parallel responses: debt reprices as it is refinanced (interest expense), the build slows (s49: less depreciation
      now, less capacity later), and the yield stock re-rates. m33 is the reduced form on operating income kept for Sally''s expected
      paths; it is never added to these steps.'
