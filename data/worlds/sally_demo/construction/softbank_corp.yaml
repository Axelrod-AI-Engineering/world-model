    - {interaction_id: sbk-a-entebitda-enterprise-cash-costs}
    - {interaction_id: sbk-a-entop-enterprise-ebitda}
    - {interaction_id: sbk-a-op-enterprise-op}
    - {interaction_id: sbk-c-gmv-finrev}
    - {interaction_id: sbk-c-finrev-paypayop}
    - {interaction_id: sbk-a-fin-paypay-and-other-op}
    - {interaction_id: sbk-a-op-financial-op}
    - {interaction_id: sbk-a-pretax-operating-profit}
    - {interaction_id: sbk-a-ni-pretax-income}
  - id: sbk.path.dividend_policy
    name: SoftBank Corp net income to the dividend
    entity_id: softbank_corp
    trigger: net income moves
    endpoint: softbank_corp.total_dividends
    description: Net income sets the dividend by the stated ladder (calibrated from guidance); dividends close to free cash flow
      add to debt, and leverage caps further increases (a feedback).
    steps:
    - {interaction_id: sbk-c-ni-dps}
    - {interaction_id: sbk-c-dps-dividends}
    - {interaction_id: sbk-c-dividends-debt}
    - {interaction_id: sbk-c-debt-netdebt}
    - {interaction_id: 'sbk.id.leverage:softbank_corp.net_debt'}
    - {interaction_id: sbk-c-leverage-dps}
  - id: sbk.path.capital_allocation
    name: SoftBank Corp AI build to debt, interest and the dividend
    entity_id: softbank_corp
    trigger: the AI build raises investment
    endpoint: softbank_corp.total_dividends
    description: 'Investment lowers free cash flow; with a high payout the gap is borrowed: debt, interest expense and leverage
      rise, and leverage limits the dividend. The yen rate environment sets what the added debt costs (sbk.path.policy_rate, sbk.path.long_end).'
    steps:
    - {interaction_id: sbk-c-aicapex-capex}
    - {interaction_id: sbk-c-capex-fcf}
    - {interaction_id: sbk-c-fcf-debt}
    - {interaction_id: sbk-c-debt-intexp}
    - {interaction_id: sbk-a-pretax-interest-expense}
    - {interaction_id: sbk-a-ni-pretax-income}
    - {interaction_id: sbk-c-ni-dps}
    - {interaction_id: sbk-c-debt-netdebt}
    - {interaction_id: 'sbk.id.leverage:softbank_corp.net_debt'}
    - {interaction_id: sbk-c-leverage-dps}
    - {interaction_id: sbk-c-dps-dividends}

compositions:
  - id: sbk.comp.revenue_by_segment
    entity_id: softbank_corp
    view: reporting_segments
    basis: IFRS revenue by reporting segment (segment revenue incl. internal sales)
    unit: ¥bn/yr
    period: fiscal year ending March
    total: softbank_corp.revenue
    members: [softbank_corp.consumer_revenue, softbank_corp.enterprise_revenue, softbank_corp.distribution_revenue, softbank_corp.media_ec_revenue,
      softbank_corp.financial_revenue]
    eliminations: softbank_corp.revenue_other_and_eliminations
    note: 'Five reporting segments; the Other segment and intersegment eliminations are reported together in the sources read,
      so they are one net elimination. Media & EC is LY Corporation and Financial is PayPay and SB Payment Service: listed or
      partly owned subsidiaries whose profit is shared with minorities (see sbk.comp.net_income).'
  - id: sbk.comp.op_by_segment
    entity_id: softbank_corp
    view: reporting_segments
    basis: IFRS operating income by reporting segment (segment income)
    unit: ¥bn/yr
    period: fiscal year ending March
    total: softbank_corp.operating_profit
    members: [softbank_corp.consumer_op, softbank_corp.enterprise_op, softbank_corp.distribution_op, softbank_corp.media_ec_op,
      softbank_corp.financial_op]
    residual: softbank_corp.op_other_and_adjustments
    note: 'The driven view of operating income: telecom pricing, subscribers and costs enter through Consumer; AI compute and
      IT demand through Enterprise; payments and the bank through Financial. Not the EBITDA bridge (sbk.comp.op_ebitda_bridge):
      never added to it.'
  - id: sbk.comp.op_ebitda_bridge
    entity_id: softbank_corp
    view: reporting_segments
    basis: operating income as EBITDA less depreciation and amortization (group)
    unit: ¥bn/yr
    period: fiscal year ending March
    total: softbank_corp.operating_profit
    members: [softbank_corp.ebitda, softbank_corp.depreciation]
    drives: false
    note: 'Reconciling view (drives: false): the brokers value the core on EV/EBITDA, so EBITDA and D&A are held and reconciled;
      the drivers act through the segments (sbk.comp.op_by_segment), so its parts carry no link into the total.'
  - id: sbk.comp.consumer_revenue
    entity_id: softbank_corp
    view: product
    basis: 'Consumer revenue by line: mobile service, broadband, electricity, handsets and merchandise'
    unit: ¥bn/yr
    period: fiscal year ending March
    total: softbank_corp.consumer_revenue
    members: [softbank_corp.consumer_mobile_revenue, softbank_corp.consumer_broadband_revenue, softbank_corp.consumer_electricity_revenue,
      softbank_corp.consumer_merchandise_revenue]
    note: An exact split as reported (services = mobile + broadband + electricity; plus merchandise). Mobile service revenue is
      subscribers x ARPU; handsets are low margin.
  - id: sbk.comp.consumer_profit
    entity_id: softbank_corp
    view: reporting_segments
    basis: 'Consumer segment income: EBITDA less depreciation and amortization'
    unit: ¥bn/yr
    period: fiscal year ending March
    total: softbank_corp.consumer_op
    members: [softbank_corp.consumer_ebitda, softbank_corp.consumer_depreciation]
    note: An identity. EBITDA is revenue plus cash costs (negative), held as links (sbk-c-consrev-consebitda, sbk-c-conscosts-consebitda)
      because Consumer revenue is already a part of the segment revenue view.
  - id: sbk.comp.enterprise_revenue
    entity_id: softbank_corp
    view: product
    basis: 'Enterprise revenue by line: communications, solutions, cloud and AI'
    unit: ¥bn/yr
    period: fiscal year ending March
    total: softbank_corp.enterprise_revenue
    members: [softbank_corp.enterprise_communications_revenue, softbank_corp.enterprise_solutions_revenue, softbank_corp.enterprise_cloud_ai_revenue]
    note: An exact split as the company now reports it. Cloud and AI holds AI computing capacity rental, AI solutions, cybersecurity
      and cloud; its growth carries the segment.
  - id: sbk.comp.enterprise_profit
    entity_id: softbank_corp
    view: reporting_segments
    basis: 'Enterprise segment income: EBITDA less depreciation and amortization'
    unit: ¥bn/yr
    period: fiscal year ending March
    total: softbank_corp.enterprise_op
    members: [softbank_corp.enterprise_ebitda, softbank_corp.enterprise_depreciation]
    note: 'An identity. The AI build reaches income twice: capacity and utilization raise revenue (EBITDA), the assets raise D&A
      first.'
  - id: sbk.comp.media_ec_profit
    entity_id: softbank_corp
    view: reporting_segments
    basis: 'Media & EC segment income: recurring income plus one-off items'
    unit: ¥bn/yr
    period: fiscal year ending March
    total: softbank_corp.media_ec_op
    members: [softbank_corp.media_ec_recurring_op, softbank_corp.media_ec_one_offs]
    note: An identity. One-off items (business-combination remeasurement gains, a system-incident loss) are kept apart so a year-on-year
      comparison does not read them as trend.
  - id: sbk.comp.financial_profit
    entity_id: softbank_corp
    view: reporting_segments
    basis: 'Financial segment income: SB Payment Service and PayPay with the other financial businesses'
    unit: ¥bn/yr
    period: fiscal year ending March
    total: softbank_corp.financial_op
    members: [softbank_corp.sbps_op]
    residual: softbank_corp.paypay_and_other_op
    note: SB Payment Service is wholly owned and valued with the core businesses; PayPay (incl. card and bank) is the residual
      and is shared with minorities.
  - id: sbk.comp.pretax
    entity_id: softbank_corp
    view: reporting_segments
    basis: 'profit before tax: operating income less interest plus other non-operating items'
    unit: ¥bn/yr
    period: fiscal year ending March
    total: softbank_corp.pretax_income
    members: [softbank_corp.operating_profit, softbank_corp.interest_expense]
    residual: softbank_corp.other_nonoperating
    note: Interest expense is negative. The funding cost of the AI build and of the yen rate environment lands here, below operating
      income.
  - id: sbk.comp.net_income
    entity_id: softbank_corp
    view: reporting_segments
    basis: 'net income attributable to owners: profit before tax less tax less non-controlling interests'
    unit: ¥bn/yr
    period: fiscal year ending March
    total: softbank_corp.net_income
    members: [softbank_corp.pretax_income, softbank_corp.income_tax, softbank_corp.noncontrolling_interests]
    note: An identity (tax and minorities are negative). Minorities take a large share of Media & EC and Financial profit, so
      operating income overstates what the parent's owners get from those segments.
  - id: sbk.comp.consumer_ebitda
    entity_id: softbank_corp
    view: reporting_segments
    basis: 'Consumer EBITDA: Consumer revenue less cash operating costs'
    unit: ¥bn/yr
    period: fiscal year ending March
    total: softbank_corp.consumer_ebitda
    members: [softbank_corp.consumer_revenue, softbank_corp.consumer_cash_costs]
    note: 'A nested bridge: Consumer revenue is also a part of revenue by segment (a different total). Cash costs are negative.'
  - id: sbk.comp.enterprise_ebitda
    entity_id: softbank_corp
    view: reporting_segments
    basis: 'Enterprise EBITDA: Enterprise revenue less cash operating costs'
    unit: ¥bn/yr
    period: fiscal year ending March
    total: softbank_corp.enterprise_ebitda
    members: [softbank_corp.enterprise_revenue, softbank_corp.enterprise_cash_costs]
    note: 'A nested bridge: Enterprise revenue is also a part of revenue by segment (a different total).'
  - id: sbk.comp.minorities
    entity_id: softbank_corp
    view: capital
    basis: 'non-controlling interests by subsidiary: LY Corporation, PayPay, other (negative values)'
    unit: ¥bn/yr
    period: fiscal year ending March
    total: softbank_corp.noncontrolling_interests
    members: [softbank_corp.nci_lycorp, softbank_corp.nci_paypay]
    residual: softbank_corp.nci_remaining
    note: 'The by-subsidiary split is not disclosed in the sources read: at the baselines it is blocked, not flagged.'

identities:
  - id: sbk.id.mobile_revenue
    entity_id: softbank_corp
    form: product
    target: softbank_corp.consumer_mobile_revenue
    factors: [softbank_corp.mobile_arpu, softbank_corp.main_subscribers, softbank_corp.consumer_line_share]
    coefficient: 0.012
    unit_check: ¥bn/yr = ¥/month x mn x fraction x 12 months / 1000
    basis: consumer mobile service revenue; ARPU and subscribers cover consumer and corporate lines
    note: average subscribers come from sbk.sf.subscribers (period_average)
  - id: sbk.id.cancellations
    entity_id: softbank_corp
    form: product
    target: softbank_corp.mobile_cancellations
    factors: [softbank_corp.mobile_churn_rate, softbank_corp.main_subscribers]
    coefficient: 0.03
    unit_check: mn/quarter = %/month x mn x 0.01 x 3 months
  - id: sbk.id.distribution_margin
    entity_id: softbank_corp
    form: product
    target: softbank_corp.distribution_op
    factors: [softbank_corp.distribution_revenue, softbank_corp.distribution_margin]
    coefficient: 0.01
    unit_check: ¥bn/yr = ¥bn/yr x % x 0.01
  - id: sbk.id.paypay_gmv
    entity_id: softbank_corp
    form: product
    target: softbank_corp.paypay_gmv
    factors: [softbank_corp.paypay_mtu, softbank_corp.paypay_gmv_per_user]
    unit_check: ¥tn/yr = mn users x ¥tn per mn users per year (payments per user x average ticket)
  - id: sbk.id.tax
    entity_id: softbank_corp
    form: product
    target: softbank_corp.income_tax
    factors: [softbank_corp.pretax_income, softbank_corp.effective_tax_rate]
    coefficient: -0.01
    unit_check: ¥bn/yr = ¥bn/yr x % x -0.01 (a charge, negative)
  - id: sbk.id.nci_lycorp
    entity_id: softbank_corp
    form: product
    target: softbank_corp.nci_lycorp
    factors: [softbank_corp.media_ec_op, softbank_corp.lycorp_minority_share]
    coefficient: -1.0
    unit_check: ¥bn/yr = ¥bn/yr x fraction x -1 (a deduction, negative)
  - id: sbk.id.nci_paypay
    entity_id: softbank_corp
    form: product
    target: softbank_corp.nci_paypay
    factors: [softbank_corp.financial_op, softbank_corp.paypay_minority_share]
    coefficient: -1.0
    unit_check: ¥bn/yr = ¥bn/yr x fraction x -1 (a deduction, negative)
  - id: sbk.id.interest
    entity_id: softbank_corp
    form: product
    target: softbank_corp.interest_expense
    factors: [softbank_corp.avg_borrowing_cost, softbank_corp.interest_bearing_debt]
    coefficient: -0.01
    unit_check: ¥bn/yr = % x ¥bn x 0.01, negative (a charge)
  - id: sbk.id.net_debt
    entity_id: softbank_corp
    form: difference
    target: softbank_corp.net_debt
    of: softbank_corp.interest_bearing_debt
    minus: [softbank_corp.cash]
    unit_check: ¥bn = ¥bn - ¥bn
  - id: sbk.id.leverage
    entity_id: softbank_corp
    form: ratio
    target: softbank_corp.net_leverage
    numerator: [softbank_corp.net_debt]
    denominator: [softbank_corp.ebitda]
    unit_check: x = ¥bn / ¥bn/yr
  - id: sbk.id.dividends
    entity_id: softbank_corp
    form: product
    target: softbank_corp.total_dividends
    factors: [softbank_corp.dividend_per_share, softbank_corp.shares_outstanding]
    unit_check: ¥bn/yr = ¥/share x bn shares
  - id: sbk.id.fcf
    entity_id: softbank_corp
    form: difference
    target: softbank_corp.free_cash_flow
    of: softbank_corp.operating_cash_flow
    minus: [softbank_corp.capex]
    unit_check: ¥bn/yr = ¥bn/yr - ¥bn/yr

stock_flows:
  - id: sbk.sf.subscribers
    entity_id: softbank_corp
    stock: softbank_corp.main_subscribers
    period_days: 91
    inflows: [softbank_corp.gross_additions]
    outflows: [softbank_corp.mobile_cancellations]
    measure: period_average
    basis: main subscribers; revenue uses the period average
  - id: sbk.sf.debt
    entity_id: softbank_corp
    stock: softbank_corp.interest_bearing_debt
    period_days: 365
    inflows: [softbank_corp.total_dividends]
    outflows: [softbank_corp.free_cash_flow]
    basis: 'interest-bearing debt: dividends add to it, free cash flow pays it down (acquisitions and disposals left out)'
