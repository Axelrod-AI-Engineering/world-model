paths:
  - id: sbk.path.price_hike
    name: SoftBank Corp existing-plan price increase to net income
    entity_id: softbank_corp
    trigger: SoftBank raises tariffs on existing mobile plans (from July 2026)
    endpoint: softbank_corp.net_income
    description: 'Parallel responses of one pricing decision: ARPU rises on the base, some subscribers leave, corporate lines
      reprice, and the extra cash is reinvested in the network (depreciation later; quality lowers churn). Revenue = subscribers
      x ARPU; EBITDA less D&A to segment income, then to the group.'
    steps:
    - {interaction_id: sbk-c-tariff-arpu, branch: arpu}
    - {interaction_id: sbk-c-tariff-churn, branch: churn}
    - {interaction_id: sbk-c-tariff-entcomms, branch: enterprise}
    - {interaction_id: sbk-c-tariff-netcapex, branch: reinvest}
    - {interaction_id: sbk-c-arpu-mobile}
    - {interaction_id: sbk-c-churn-cancellations}
    - {interaction_id: sbk-c-cancellations-subs}
    - {interaction_id: sbk-c-subs-mobile}
    - {interaction_id: sbk-c-netcapex-quality}
    - {interaction_id: sbk-c-quality-churn}
    - {interaction_id: sbk-a-cons-consumer-mobile-revenue}
    - {interaction_id: sbk-a-consebitda-consumer-revenue}
    - {interaction_id: sbk-a-consop-consumer-ebitda}
    - {interaction_id: sbk-c-netcapex-consdep}
    - {interaction_id: sbk-a-consop-consumer-depreciation}
    - {interaction_id: sbk-a-ent-enterprise-communications-revenue}
    - {interaction_id: sbk-a-entebitda-enterprise-revenue}
    - {interaction_id: sbk-a-entop-enterprise-ebitda}
    - {interaction_id: sbk-a-op-consumer-op}
    - {interaction_id: sbk-a-op-enterprise-op}
    - {interaction_id: sbk-a-pretax-operating-profit}
    - {interaction_id: sbk-a-ni-pretax-income}
  - id: sbk.path.price_competition
    name: SoftBank Corp mobile price competition to net income
    entity_id: softbank_corp
    trigger: rivals cut prices or a low-price challenger gains share
    endpoint: softbank_corp.net_income
    description: 'Parallel responses of one competitive move: subscribers leave, the industry promotes harder (sales costs up,
      more handsets sold at low margin), and SoftBank answers with its cheaper brands (ARPU down).'
    steps:
    - {interaction_id: sbk-c-competition-churn, branch: churn}
    - {interaction_id: sbk-c-competition-promo, branch: promotion}
    - {interaction_id: sbk-c-competition-arpu, branch: arpu}
    - {interaction_id: sbk-c-churn-cancellations}
    - {interaction_id: sbk-c-cancellations-subs}
    - {interaction_id: sbk-c-subs-mobile}
    - {interaction_id: sbk-c-arpu-mobile}
    - {interaction_id: sbk-c-promo-costs}
    - {interaction_id: sbk-c-promo-merch}
    - {interaction_id: sbk-a-cons-consumer-merchandise-revenue}
    - {interaction_id: sbk-a-cons-consumer-mobile-revenue}
    - {interaction_id: sbk-a-consebitda-consumer-revenue}
    - {interaction_id: sbk-a-consebitda-consumer-cash-costs}
    - {interaction_id: sbk-a-consop-consumer-ebitda}
    - {interaction_id: sbk-a-op-consumer-op}
    - {interaction_id: sbk-a-pretax-operating-profit}
    - {interaction_id: sbk-a-ni-pretax-income}
  - id: sbk.path.regulation
    name: SoftBank Corp telecom regulation to net income
    entity_id: softbank_corp
    trigger: the regulator tightens pricing rules or presses for lower charges
    endpoint: softbank_corp.net_income
    description: 'Parallel effects of one regulatory stance: pressure on tariffs (ARPU down), the cap on handset discounts (promotion
      costs and handset sales down: an offset), and easier switching (churn up).'
    steps:
    - {interaction_id: sbk-c-reg-tariff, branch: tariffs}
    - {interaction_id: sbk-c-reg-promo, branch: discounts}
    - {interaction_id: sbk-c-reg-churn, branch: switching}
    - {interaction_id: sbk-c-tariff-arpu}
    - {interaction_id: sbk-c-arpu-mobile}
    - {interaction_id: sbk-c-promo-costs}
    - {interaction_id: sbk-c-promo-merch}
    - {interaction_id: sbk-c-churn-cancellations}
    - {interaction_id: sbk-c-cancellations-subs}
    - {interaction_id: sbk-c-subs-mobile}
    - {interaction_id: sbk-a-cons-consumer-merchandise-revenue}
    - {interaction_id: sbk-a-cons-consumer-mobile-revenue}
    - {interaction_id: sbk-a-consebitda-consumer-revenue}
    - {interaction_id: sbk-a-consebitda-consumer-cash-costs}
    - {interaction_id: sbk-a-consop-consumer-ebitda}
    - {interaction_id: sbk-a-op-consumer-op}
    - {interaction_id: sbk-a-pretax-operating-profit}
    - {interaction_id: sbk-a-ni-pretax-income}
  - id: sbk.path.ai_compute
    name: SoftBank Corp AI compute demand to net income
    entity_id: softbank_corp
    trigger: enterprise and public-sector demand for AI computing capacity rises
    endpoint: softbank_corp.net_income
    description: Demand fills existing capacity (utilization) and prompts more capacity (investment); capacity arrives at commissioning,
      revenue is capacity x utilization x price, depreciation arrives first; the build is funded by debt (capex -> free cash flow
      -> debt -> interest). s48 is the reduced form of the depreciation drag and is never added to these steps.
    steps:
    - {interaction_id: sbk-c-aidemand-util, branch: utilization}
    - {interaction_id: sbk-c-aidemand-aicapex, branch: build}
    - {interaction_id: sbk-c-aicapex-capacity}
    - {interaction_id: sbk-c-capacity-cloudai}
    - {interaction_id: sbk-c-util-cloudai}
    - {interaction_id: sbk-a-ent-enterprise-cloud-ai-revenue}
    - {interaction_id: sbk-a-entebitda-enterprise-revenue}
    - {interaction_id: sbk-a-entop-enterprise-ebitda}
    - {interaction_id: sbk-c-aicapex-entdep}
    - {interaction_id: sbk-a-entop-enterprise-depreciation}
    - {interaction_id: sbk-a-op-enterprise-op}
    - {interaction_id: sbk-c-aicapex-capex}
    - {interaction_id: sbk-c-capex-fcf}
    - {interaction_id: sbk-c-fcf-debt}
    - {interaction_id: sbk-c-debt-intexp}
    - {interaction_id: sbk-a-pretax-interest-expense}
    - {interaction_id: sbk-a-pretax-operating-profit}
    - {interaction_id: sbk-a-ni-pretax-income}
  - id: sbk.path.enterprise_it
    name: SoftBank Corp corporate IT demand to net income
    entity_id: softbank_corp
    trigger: corporate IT and modernization spending rises
    endpoint: softbank_corp.net_income
    description: 'Parallel responses: solutions revenue in Enterprise and IT product volumes in Distribution (thin margin).'
    steps:
    - {interaction_id: sbk-c-itspend-solutions, branch: solutions}
    - {interaction_id: sbk-c-itspend-distribution, branch: distribution}
    - {interaction_id: sbk-a-ent-enterprise-solutions-revenue}
    - {interaction_id: sbk-a-entebitda-enterprise-revenue}
    - {interaction_id: sbk-a-entop-enterprise-ebitda}
    - {interaction_id: sbk-a-op-enterprise-op}
    - {interaction_id: sbk-c-distrev-distop}
    - {interaction_id: sbk-a-op-distribution-op}
    - {interaction_id: sbk-a-pretax-operating-profit}
    - {interaction_id: sbk-a-ni-pretax-income}
  - id: sbk.path.policy_rate
    name: SoftBank Corp BoJ policy rate to net income
    entity_id: softbank_corp
    trigger: the BoJ raises the policy rate
    endpoint: softbank_corp.net_income
    description: 'A counter-path inside the group: short-term and floating debt reprice (interest expense up, below operating
      income) while PayPay Bank''s margin widens (Financial income up, part of it to minorities).'
    steps:
    - {interaction_id: sbk-c-boj-borrowcost, branch: funding}
    - {interaction_id: sbk-c-boj-nim, branch: paypay_bank}
