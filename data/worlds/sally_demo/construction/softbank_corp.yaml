    attribute_kind: revenue_flow
    unit: ¥bn/yr
    family: lognormal
    mean: 200.0
    scale: 0.08
    features: {view: reporting_segments, basis: 'segment: Enterprise segment income', metric: enterprise_segment_income, prior: synthetic}
  - entity: softbank_corp
    id: softbank_corp.distribution_op
