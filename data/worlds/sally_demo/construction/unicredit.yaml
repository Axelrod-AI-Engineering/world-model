identities:
- id: ucg.id.hedge_income
  form: product
  target: unicredit.hedge_income
  factors:
  - unicredit.hedge_notional
  - unicredit.hedge_yield
  coefficient: 0.01
  unit_check: €bn/yr = €bn x % x 0.01
  entity_id: unicredit
- id: ucg.id.deposit_interest
  form: product
  target: unicredit.deposit_interest_expense
  factors:
  - unicredit.commercial_deposits
  - unicredit.deposit_cost
  coefficient: 0.01
  unit_check: €bn/yr = €bn x % x 0.01
  entity_id: unicredit
- id: ucg.id.loan_interest
  form: product
  target: unicredit.loan_interest_income
  factors:
  - unicredit.customer_loans
  - unicredit.loan_yield
  coefficient: 0.01
  unit_check: €bn/yr = €bn x % x 0.01
  entity_id: unicredit
- id: ucg.id.cbk_income
  form: product
  target: unicredit.cbk_equity_income
  factors:
  - unicredit.cbk_stake
  - unicredit.cbk_net_profit
  coefficient: 0.01
  unit_check: €bn/yr = % x €bn/yr x 0.01
  note: equity accounting below control; at control the stake is consolidated (a change of basis this identity does not hold)
  entity_id: unicredit
- id: ucg.id.llp
  form: product
  target: unicredit.loan_loss_provisions
  factors:
  - unicredit.customer_loans
  - unicredit.cost_of_risk
  coefficient: -0.0001
  unit_check: €bn/yr = - €bn x bp x 0.0001 (a charge, negative)
  note: overlay releases enter the line beside it (uncalibrated); the divisional view reconciles
  entity_id: unicredit
- id: ucg.id.cet1_ratio
  form: ratio
  target: unicredit.cet1_ratio
  numerator:
  - unicredit.cet1_capital
  denominator:
  - unicredit.rwa
  coefficient: 100.0
  unit_check: '% = €bn / €bn x 100'
  entity_id: unicredit
- id: ucg.id.cash_dividends
  form: product
  target: unicredit.cash_dividends
  factors:
  - unicredit.net_profit
  - unicredit.cash_payout_ratio
  coefficient: 0.01
  unit_check: €bn/yr = €bn/yr x % x 0.01
  entity_id: unicredit
- id: ucg.id.ordinary_buybacks
  form: product
  target: unicredit.buybacks
  factors:
  - unicredit.net_profit
  - unicredit.buyback_payout_ratio
  coefficient: 0.01
  unit_check: €bn/yr = €bn/yr x % x 0.01
  note: the ordinary buyback; extra buybacks from capital above target enter beside it (uncalibrated, a threshold)
  entity_id: unicredit
stock_flows:
- id: ucg.sf.core_cet1
  entity_id: unicredit
  stock: unicredit.core_cet1_capital
  period_days: 365
  inflows:
  - unicredit.net_profit
  outflows:
  - unicredit.total_distributions
  basis: annual flows (€bn/yr) into the capital stock (€bn); distributions accrued as profit is earned
matrices:
- id: ucg.mx.revenue
  entity_id: unicredit
  rows: ucg.comp.revenue_by_line
  columns: ucg.comp.revenue_by_division
  drives: rows
  cells:
    unicredit.net_interest_income:
      unicredit.italy_revenue: unicredit.italy_nii
      unicredit.germany_revenue: unicredit.germany_nii
      unicredit.austria_revenue: unicredit.austria_nii
      unicredit.cee_revenue: unicredit.cee_nii
      unicredit.russia_revenue: unicredit.russia_nii
      unicredit.gcc_revenue: unicredit.gcc_nii
    unicredit.fees_insurance:
      unicredit.italy_revenue: unicredit.italy_fees
      unicredit.germany_revenue: unicredit.germany_fees
      unicredit.austria_revenue: unicredit.austria_fees
      unicredit.cee_revenue: unicredit.cee_fees
      unicredit.russia_revenue: unicredit.russia_fees
      unicredit.gcc_revenue: unicredit.gcc_fees
  note: Lines drive revenue; divisions reconcile. NII and fees are the cells held (their divisional values); trading, dividends
    and other income by division are not represented, so a division's revenue is not complete from its cells.
paths:
- id: ucg.path.rates_nii
  name: UniCredit ECB deposit rate to net interest income
  trigger: the ECB raises its deposit rate
  endpoint: unicredit.net_profit
  description: 'Parallel responses of one rate move: Euribor and the floating-rate loan yield reprice within a reset (loan
    interest = loans x yield), deposit costs follow by the pass-through with a lag (interest paid = deposits x cost), balances
    migrate out of sight accounts, and the Commerzbank stake earns more. m28 is the summary link on group NII (sized with
    s76 from the disclosed scenarios) and is never added to these steps; the allocation of interest to the divisions stays
    uncalibrated so it is not counted twice.'
  steps:
  - interaction_id: ucg-m-ecb-euribor
    branch: euribor
  - interaction_id: ucg-c-ecb-depcost
    branch: pass_through
  - interaction_id: ucg-c-ecb-sightshare
    branch: migration
  - interaction_id: ucg-c-ecb-cbkincome
    branch: stake
  - interaction_id: ucg-c-euribor-loanyield
  - interaction_id: ucg-c-sightshare-depcost
  - interaction_id: ucg-c-loanyield-interest
  - interaction_id: ucg-c-depcost-interest
  - interaction_id: ucg-c-loanint-italynii
  - interaction_id: ucg-c-loanint-germanynii
  - interaction_id: ucg-c-loanint-austrianii
  - interaction_id: ucg-c-depint-italynii
  - interaction_id: ucg-c-depint-germanynii
  - interaction_id: ucg-c-depint-austrianii
  - interaction_id: ucg-a-nii-italy-nii
  - interaction_id: ucg-a-nii-germany-nii
  - interaction_id: ucg-a-nii-austria-nii
  - interaction_id: ucg-c-cbknp-income
  - interaction_id: ucg-c-cbkincome-divline
  - interaction_id: ucg-a-rev-dividends-equity-income
  - interaction_id: ucg-a-rev-net-interest-income
  - interaction_id: ucg-a-pbt-revenue
  - interaction_id: ucg-a-np-profit-before-tax
  entity_id: unicredit
- id: ucg.path.long_end
  name: UniCredit long-end yields to the structural hedge and capital
  trigger: long-end euro yields rise (a steeper curve)
  endpoint: unicredit.cet1_ratio
  description: 'One move, two parallel responses: the structural hedge reinvests its maturing part at the new yield (hedge
    income = notional x yield, exact), and FVOCI bonds mark down into CET1 at once. s76 and s33 are the summary links on NII
    and the CET1 ratio; never added to these steps.'
  steps:
  - interaction_id: ucg-c-bund-hedgeyield
    branch: hedge
  - interaction_id: ucg-c-bund-fvoci
    branch: marks
  - interaction_id: ucg-c-hedgeyield-nii
  - interaction_id: ucg-c-hedgeincome-nii
  - interaction_id: ucg-a-rev-net-interest-income
  - interaction_id: ucg-a-pbt-revenue
  - interaction_id: ucg-a-np-profit-before-tax
  - interaction_id: ucg-c-np-cet1cap
  - interaction_id: ucg-a-cet1-core-cet1-capital
  - interaction_id: ucg-a-cet1-fvoci-reserve
  - interaction_id: ucg-c-cet1cap-ratio
  entity_id: unicredit
- id: ucg.path.sovereign_spread
  name: UniCredit Italian sovereign spread to capital and distributions
  trigger: the BTP-Bund spread widens
  endpoint: unicredit.total_distributions
  description: A wider spread marks the Italian sovereign book down through the FVOCI reserve into CET1 (exact from the reserve
    on), which leaves less capital above target for extra buybacks; it also raises the corporate centre's wholesale funding
    cost as debt rolls.
  steps:
  - interaction_id: ucg-c-btp-fvoci
    branch: marks
  - interaction_id: ucg-c-btp-gccnii
    branch: funding
  - interaction_id: ucg-a-cet1-fvoci-reserve
  - interaction_id: ucg-c-cet1cap-ratio
  - interaction_id: ucg-c-ratio-buybacks
  - interaction_id: ucg-a-dist-buybacks
  - interaction_id: ucg-a-nii-gcc-nii
  - interaction_id: ucg-a-rev-net-interest-income
  - interaction_id: ucg-a-pbt-revenue
  - interaction_id: ucg-a-np-profit-before-tax
  entity_id: unicredit
- id: ucg.path.credit_cycle
  name: UniCredit growth and unemployment to cost of risk
  trigger: euro-area growth slows and unemployment rises
  endpoint: unicredit.net_profit
  description: Unemployment raises defaults and stage migration (the cost of risk; provisions = loans x cost of risk, exact),
    while overlays held for this are released first and offset part of the rise (a counter-path).
  steps:
  - interaction_id: ucg-m-gdp-unemp
  - interaction_id: ucg-c-unemp-cor
    branch: defaults
  - interaction_id: ucg-c-unemp-overlays
    branch: overlays
  - interaction_id: ucg-c-cor-llp
  - interaction_id: ucg-c-overlays-llp
  - interaction_id: ucg-a-pbt-loan-loss-provisions
  - interaction_id: ucg-a-np-profit-before-tax
  entity_id: unicredit
- id: ucg.path.loan_growth
  name: UniCredit growth to loan volumes, NII and RWA
  trigger: euro-area growth picks up
  endpoint: unicredit.cet1_ratio
  description: 'Loan demand follows nominal growth: more loans earn more interest (exact) and are booked in Italy and Germany,
    but add risk-weighted assets, which lowers the CET1 ratio (exact) until earnings rebuild capital.'
  steps:
  - interaction_id: ucg-c-gdp-loans
  - interaction_id: ucg-c-loans-interest
  - interaction_id: ucg-c-loans-rwa
  - interaction_id: ucg-c-loanint-italynii
  - interaction_id: ucg-c-loanint-germanynii
  - interaction_id: ucg-a-nii-italy-nii
  - interaction_id: ucg-a-nii-germany-nii
  - interaction_id: ucg-a-rev-net-interest-income
  - interaction_id: ucg-a-pbt-revenue
  - interaction_id: ucg-a-np-profit-before-tax
  - interaction_id: ucg-c-np-cet1cap
  - interaction_id: ucg-a-cet1-core-cet1-capital
  - interaction_id: ucg-c-cet1cap-ratio
  - interaction_id: ucg-c-rwa-ratio
  entity_id: unicredit
- id: ucg.path.fees_markets
  name: UniCredit market levels to fees
  trigger: European equity markets rise
  endpoint: unicredit.net_profit
  description: Market levels lift investment fees on assets under management and custody in each division.
  steps:
  - interaction_id: ucg-c-equity-italyfees
  - interaction_id: ucg-c-equity-germanyfees
  - interaction_id: ucg-c-equity-austriafees
  - interaction_id: ucg-c-equity-ceefees
  - interaction_id: ucg-a-fees-italy-fees
  - interaction_id: ucg-a-fees-germany-fees
  - interaction_id: ucg-a-fees-austria-fees
  - interaction_id: ucg-a-fees-cee-fees
  - interaction_id: ucg-a-rev-fees-insurance
  - interaction_id: ucg-a-pbt-revenue
  - interaction_id: ucg-a-np-profit-before-tax
  entity_id: unicredit
- id: ucg.path.cost_inflation
  name: UniCredit inflation to operating costs
  trigger: euro-area inflation rises
  endpoint: unicredit.net_profit
  description: Wage settlements and administrative contracts index to inflation with a lag.
  steps:
  - interaction_id: ucg-c-cpi-italycosts
  - interaction_id: ucg-c-cpi-germanycosts
  - interaction_id: ucg-c-cpi-austriacosts
  - interaction_id: ucg-a-costs-italy-costs
  - interaction_id: ucg-a-costs-germany-costs
  - interaction_id: ucg-a-costs-austria-costs
  - interaction_id: ucg-a-pbt-operating-costs
  - interaction_id: ucg-a-np-profit-before-tax
  entity_id: unicredit
- id: ucg.path.capital_distribution
  name: UniCredit earnings to capital and distributions
  trigger: net profit rises
  endpoint: unicredit.total_distributions
  description: 'Earnings build the capital stock (a stock-flow) and set the ordinary distribution (payout x net profit, split
    into a cash dividend and buybacks: exact products), which is accrued against capital; the ratio above target funds extra
    buybacks (a threshold, uncalibrated).'
  steps:
  - interaction_id: ucg-c-np-cet1cap
    branch: capital
  - interaction_id: ucg-c-np-dividends
    branch: dividends
  - interaction_id: ucg-c-np-buybacks
    branch: buybacks
  - interaction_id: ucg-a-cet1-core-cet1-capital
  - interaction_id: ucg-c-cet1cap-ratio
  - interaction_id: ucg-c-ratio-buybacks
  - interaction_id: ucg-a-dist-cash-dividends
  - interaction_id: ucg-a-dist-buybacks
  - interaction_id: ucg-c-dist-cet1cap
  entity_id: unicredit
- id: ucg.path.capital_requirements
  name: UniCredit CET1 target to buybacks
  trigger: the management target or requirement rises
  endpoint: unicredit.cet1_ratio
  description: 'A higher target leaves less capital to distribute: extra buybacks shrink and the capital stock keeps more.'
  steps:
  - interaction_id: ucg-c-target-buybacks
  - interaction_id: ucg-a-dist-buybacks
  - interaction_id: ucg-c-dist-cet1cap
  - interaction_id: ucg-a-cet1-core-cet1-capital
  - interaction_id: ucg-c-cet1cap-ratio
  entity_id: unicredit
- id: ucg.path.commerzbank
  name: UniCredit Commerzbank stake to earnings, capital and distributions
  trigger: UniCredit raises its Commerzbank stake or gains control
  endpoint: unicredit.total_distributions
  description: Below control, a larger stake books more of Commerzbank's profit (stake x profit, exact) in the equity-investments
    line; at control, full consolidation moves Commerzbank into every line (a change of basis) and its RWA onto the balance
    sheet, which lowers the CET1 ratio and the capital left for buybacks.
  steps:
  - interaction_id: ucg-c-cbkstake-income
    branch: earnings
  - interaction_id: ucg-c-cbkstake-rwa
    branch: consolidation
  - interaction_id: ucg-c-cbkincome-divline
  - interaction_id: ucg-a-rev-dividends-equity-income
  - interaction_id: ucg-a-pbt-revenue
  - interaction_id: ucg-a-np-profit-before-tax
  - interaction_id: ucg-c-np-buybacks
  - interaction_id: ucg-c-rwa-ratio
  - interaction_id: ucg-c-ratio-buybacks
  - interaction_id: ucg-a-dist-buybacks
  entity_id: unicredit
- id: ucg.path.russia
  name: UniCredit rouble and Russia wind-down to profit and capital
  trigger: the rouble weakens (EUR/RUB rises) while Russia is wound down
  endpoint: unicredit.cet1_ratio
  description: A weaker rouble shrinks Russian NII and profit in euros and the translated equity in CET1; the extreme-loss
    scenario (zero value) is a separate capital tail, reduced by the partial sale.
  steps:
  - interaction_id: ucg-c-rub-russianii
    branch: income
  - interaction_id: ucg-c-rub-cet1cap
    branch: capital
  - interaction_id: ucg-a-nii-russia-nii
  - interaction_id: ucg-a-rev-net-interest-income
  - interaction_id: ucg-a-pbt-revenue
  - interaction_id: ucg-a-np-profit-before-tax
  - interaction_id: ucg-c-np-cet1cap
  - interaction_id: ucg-a-cet1-core-cet1-capital
  - interaction_id: ucg-c-cet1cap-ratio
  entity_id: unicredit
compositions:
- id: ucg.comp.revenue_by_line
  entity_id: unicredit
  view: product
  basis: 'revenue by line: NII, fees and net insurance result, trading, dividends and equity investments (reclassified P&L,
    IFRS)'
  unit: €bn/yr
  period: fiscal year ending December
  total: unicredit.revenue
  members:
  - unicredit.net_interest_income
  - unicredit.fees_insurance
  - unicredit.trading_income
  - unicredit.dividends_equity_income
  residual: unicredit.other_revenue
  note: 'The driven view: rates enter through NII, market levels through fees, the stakes through equity investments. Not
    the division view (ucg.comp.revenue_by_division): never added to it. The residual holds other income and rounding.'
- id: ucg.comp.revenue_by_division
  entity_id: unicredit
  view: reporting_segments
  basis: revenue by division (reclassified, IFRS; CEE and Russia at constant FX)
  unit: €bn/yr
  period: fiscal year ending December
  total: unicredit.revenue
  members:
  - unicredit.italy_revenue
  - unicredit.germany_revenue
  - unicredit.austria_revenue
  - unicredit.cee_revenue
  - unicredit.russia_revenue
  residual: unicredit.gcc_revenue
  note: 'The passive (column) view of matrix ucg.mx.revenue: reconciled, not driven; divisional NII and fees reach it as cells.'
- id: ucg.comp.nii_by_division
  entity_id: unicredit
  view: reporting_segments
  basis: net interest income by division
  unit: €bn/yr
  period: fiscal year ending December
  total: unicredit.net_interest_income
  members:
  - unicredit.italy_nii
  - unicredit.germany_nii
  - unicredit.austria_nii
  - unicredit.cee_nii
  - unicredit.russia_nii
  residual: unicredit.gcc_nii
  note: Rates act on the euro divisions (Italy, Germany, Austria) through loan yields and deposit costs; CEE prices off local
    policy rates (not in the world); the corporate centre's residual holds funding and the part of the hedge not allocated.
- id: ucg.comp.fees_by_division
  entity_id: unicredit
  view: reporting_segments
  basis: fees and net insurance result by division
  unit: €bn/yr
  period: fiscal year ending December
  total: unicredit.fees_insurance
  members:
  - unicredit.italy_fees
  - unicredit.germany_fees
  - unicredit.austria_fees
  - unicredit.cee_fees
  - unicredit.russia_fees
  residual: unicredit.gcc_fees
  note: Investment fees follow market levels; the corporate centre's residual is the group less the divisions.
- id: ucg.comp.costs_by_division
  entity_id: unicredit
  view: reporting_segments
  basis: operating costs by division (negative values)
  unit: €bn/yr
  period: fiscal year ending December
  total: unicredit.operating_costs
  members:
  - unicredit.italy_costs
  - unicredit.germany_costs
  - unicredit.austria_costs
  - unicredit.cee_costs
  - unicredit.russia_costs
  residual: unicredit.gcc_costs
  note: Costs are negative values, so every part adds with a positive weight.
- id: ucg.comp.llp_by_division
  entity_id: unicredit
  view: credit
  basis: loan loss provisions by division (negative values)
  unit: €bn/yr
  period: fiscal year ending December
  total: unicredit.loan_loss_provisions
  members:
  - unicredit.italy_llp
  - unicredit.germany_llp
  - unicredit.austria_llp
  - unicredit.cee_llp
  - unicredit.russia_llp
  residual: unicredit.gcc_llp
  note: 'Reconciling: group provisions are loans times the cost of risk (ucg.id.llp); the divisional split is reported, not
    driven.'
  drives: false
- id: ucg.comp.pretax
  entity_id: unicredit
  view: reporting_segments
  basis: 'profit before tax: revenue less operating costs less loan loss provisions, plus other items'
  unit: €bn/yr
  period: fiscal year ending December
  total: unicredit.profit_before_tax
  members:
  - unicredit.revenue
  - unicredit.operating_costs
  - unicredit.loan_loss_provisions
  residual: unicredit.other_pretax_items
  note: 'An identity: costs and provisions are negative values; the residual holds systemic charges, integration costs, gains
    on investments and disposals.'
- id: ucg.comp.net_profit
  entity_id: unicredit
  view: reporting_segments
  basis: 'stated net profit: profit before tax less income tax, less minorities, discontinued operations and other items'
  unit: €bn/yr
  period: fiscal year ending December
  total: unicredit.net_profit
  members:
  - unicredit.profit_before_tax
  - unicredit.income_tax
  residual: unicredit.other_below_pretax
  note: An identity; the residual holds minorities, the Russia disposal in discontinued operations, AT1 coupons and adjustments
    to stated profit.
- id: ucg.comp.net_profit_by_division
  entity_id: unicredit
  view: reporting_segments
  basis: stated net profit by division
  unit: €bn/yr
  period: fiscal year ending December
  total: unicredit.net_profit
  members:
  - unicredit.italy_net_profit
  - unicredit.germany_net_profit
  - unicredit.austria_net_profit
  - unicredit.cee_net_profit
  - unicredit.russia_net_profit
  residual: unicredit.gcc_net_profit
  note: 'Reconciling: net profit is driven through the P&L bridge (ucg.comp.net_profit); the divisional split is reported,
    not driven.'
  drives: false
- id: ucg.comp.distributions
  entity_id: unicredit
  view: capital
  basis: 'distributions for the year: cash dividends plus share buybacks'
  unit: €bn/yr
  period: fiscal year ending December
  total: unicredit.total_distributions
  members:
  - unicredit.cash_dividends
  - unicredit.buybacks
  note: 'An exact split: the ordinary payout is a cash dividend and buybacks (each a stated share of net profit); extra buybacks
    distribute capital above target.'
- id: ucg.comp.payout
  entity_id: unicredit
  view: capital
  basis: 'ordinary payout ratio: cash dividends plus buybacks, each over net profit'
  unit: pct
  total: unicredit.payout_ratio
  members:
  - unicredit.cash_payout_ratio
  - unicredit.buyback_payout_ratio
  note: 'An exact split: the payout policy states a cash share and a buyback share; the split differs between years.'
- id: ucg.comp.cet1_capital
  entity_id: unicredit
  view: capital
  basis: 'CET1 capital: the capital stock before the FVOCI reserve plus the reserve'
  unit: €bn
  total: unicredit.cet1_capital
  members:
  - unicredit.core_cet1_capital
  - unicredit.fvoci_reserve
  note: 'An exact split: the reserve''s marks enter capital at once; the stock moves with earnings and distributions (ucg.sf.core_cet1).'
