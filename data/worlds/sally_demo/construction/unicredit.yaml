interactions:
- id: ucg-m-ecb-euribor
  source: ecb.policy_rate
  target: euro_money_markets.euribor_3m
  label: anchors Euribor
  calibration: uncalibrated
  transition:
    mechanism: Three-month Euribor prices the expected ECB deposit rate over the next three months plus a small term and credit
      premium, so it follows the policy rate and moves ahead of a decision that is priced
    sign: +
    actor: money markets
    business_unit: euro area
    geography: euro area
    currency: EUR
    condition: the corridor and excess liquidity keep Euribor close to the deposit rate
    condition_observable: Euribor 3M against the deposit facility rate, daily
    timing:
      onset: ahead of and at the decision
      build: none
      persistence: while the rate holds
      recognition: loan repricing at the next reset
    evidence:
      existence: documented
      direction: documented
      magnitude: unknown
      timing: inferred
      sources:
      - ucg.wb
      - ucg.pub
    breaker: liquidity shocks widen the Euribor-OIS spread
    next_state: Euribor 3M
    unresolved:
    - input: Euribor 3M history
      status: not_disclosed_in_reviewed_sources
      searched:
      - ucg.wb
      - ucg.r1
      - ucg.r2
      - ucg.r3
      - ucg.r4
      - ucg.r5
      - ucg.r6
      - ucg.r7
      - ucg.peer
      - ucg.macro
      - 'corpus: scripts/construction/inputs.py (10 files)'
      - 'corpus: euribor 3m history'
      note: the workbook lists Euribor 3M as not obtained; the company's plan range and a quarterly average are cited
- id: ucg-m-oil-eurogdp
  source: oil.brent
  target: euro_economy.gdp_growth
  label: weighs on euro growth
  calibration: uncalibrated
  transition:
    mechanism: The euro area imports its oil and gas, so a higher oil price is a terms-of-trade loss that cuts real incomes
      and growth
    sign: '-'
    actor: euro-area households and firms
    business_unit: euro area
    geography: euro area
    condition: the price rise persists; no offsetting fiscal support
    condition_observable: euro area real GDP growth, quarterly
    timing:
      onset: 1-2 quarters
      build: 2-4 quarters
      persistence: while the price holds
      recognition: national accounts
    evidence:
      existence: inferred
      direction: inferred
      magnitude: unknown
      timing: unknown
      sources:
      - ucg.pub
      - ucg.macro
    breaker: fiscal energy support; a demand-driven price rise
    next_state: euro area real GDP growth
- id: ucg-m-gdp-unemp
  source: euro_economy.gdp_growth
  target: euro_economy.unemployment_rate
  label: slower growth raises unemployment
  calibration: uncalibrated
  transition:
    mechanism: Weaker output growth lowers hiring and raises unemployment with a lag (Okun's relation)
    sign: '-'
    actor: euro-area employers
    business_unit: euro area
    geography: euro area
    condition: growth below potential for several quarters
    condition_observable: euro area unemployment rate, monthly
    timing:
      onset: 2-3 quarters
      build: several quarters
      persistence: until growth recovers
      recognition: labour statistics
    evidence:
      existence: inferred
      direction: inferred
      magnitude: unknown
      timing: inferred
      sources:
      - ucg.pub
    breaker: labour hoarding and short-time work schemes
    next_state: euro area unemployment
- id: ucg-m-gdp-btpspread
  source: euro_economy.gdp_growth
  target: btps.bund_spread_10y
  label: weaker growth widens the Italian spread
  calibration: uncalibrated
  transition:
    mechanism: Slower growth worsens Italy's debt dynamics and risk appetite, so investors demand a wider spread over Bunds
    sign: '-'
    actor: sovereign bond investors
    business_unit: Italy
    geography: Italy
    currency: EUR
    condition: debt ratio high; no offsetting ECB purchases
    condition_observable: BTP-Bund 10Y spread, daily
    timing:
      onset: days to weeks
      build: as data confirm
      persistence: while the outlook holds
      recognition: FVOCI marks at once
    evidence:
      existence: inferred
      direction: inferred
      magnitude: unknown
      timing: unknown
      sources:
      - ucg.pub
      - ucg.r2
    breaker: ECB transmission-protection backstop; fiscal consolidation
    next_state: BTP-Bund spread
- id: ucg-c-ecb-depcost
  source: ecb.policy_rate
  target: unicredit.deposit_cost
  label: passes a share of a rate move to deposit rates
  effect:
    mu: 0.9375
    sigma: 0.0781
  kernel:
    delay_days: 30
    lag_days: 180
    duration_days: null
  note: 'state: the pass-through is asymmetric and rises with the rate level, but no size is disclosed by side, so the link
    holds one linear size (calibrate.py --side when one is)'
  transition:
    mechanism: 'The bank reprices commercial deposits by a fraction of an ECB move (the pass-through, or deposit beta): term
      and indexed deposits follow, sight deposits barely move; the fraction builds over quarters'
    sign: +
    actor: UniCredit (deposit pricing in each division)
    business_unit: commercial deposits (Italy, Germany, Austria)
    geography: euro area
    currency: EUR
    condition: 'state: the pass-through rises with the rate level and with competition for deposits; it is lower on the way
      down while sight balances stay unremunerated'
    condition_observable: cumulative pass-through and the cost of commercial deposits, quarterly
    observable:
      name: deposit pass-through
      definition: change in the cost of commercial deposits over the change in the ECB deposit rate since the cycle began
      units: pct
      frequency: quarterly results
      proof_limits: a group average; Italy and Germany differ and CEE prices off local rates
    timing:
      onset: within the quarter
      build: 2-4 quarters to the cumulative pass-through
      persistence: while the rate holds
      recognition: interest expense each quarter
    evidence:
      existence: documented
      direction: documented
      magnitude: documented
      timing: inferred
      sources:
      - ucg.co
      - ucg.wb
      - ucg.r2
    breaker: excess liquidity and low loan demand hold the pass-through down; a deposit-share contest raises it; it is capped
      by the policy rate
    next_state: commercial deposit cost
    unresolved:
    - input: pass-through by division and by deposit type
      status: not_disclosed_in_reviewed_sources
      searched:
      - ucg.wb
      - ucg.r1
      - ucg.r2
      - ucg.r3
      - ucg.r4
      - ucg.r5
      - ucg.r6
      - ucg.r7
      - ucg.peer
      - ucg.macro
      - 'corpus: scripts/construction/inputs.py (10 files)'
      - 'corpus: pass-through by division and by deposit type'
      - 'corpus: pass-through'
      - 'corpus: deposit beta'
      note: the group pass-through and its NII sensitivity are found and bound on ucg-c-ecb-depcost; no split by division
        or deposit type
- id: ucg-c-ecb-sightshare
  source: ecb.policy_rate
  target: unicredit.sight_deposit_share
  label: moves balances from sight into term deposits
  calibration: uncalibrated
  transition:
    mechanism: Higher rates raise the cost of idle balances, so clients move money from sight accounts into term deposits
      and investment products (mix migration)
    sign: '-'
    actor: depositors (households and corporates)
    business_unit: commercial deposits
    condition: rates high enough for the opportunity cost to be noticed; transactional balances are sticky
    condition_observable: sight deposits as a share of commercial deposits, quarterly
    timing:
      onset: 1-2 quarters
      build: several quarters
      persistence: reverses slowly when rates fall
      recognition: interest expense as balances migrate
    evidence:
      existence: broker
      direction: inferred
      magnitude: unknown
      timing: unknown
      sources:
      - ucg.r3
      - ucg.r5
      - ucg.pub
    breaker: operating balances clients cannot move; asset-management products absorb the flows (fees instead of deposits)
    next_state: sight deposit share
    unresolved:
    - input: migration elasticity of sight balances to rates
      status: not_disclosed_in_reviewed_sources
      searched:
      - ucg.wb
      - ucg.r1
      - ucg.r2
      - ucg.r3
      - ucg.r4
      - ucg.r5
      - ucg.r6
      - ucg.r7
      - ucg.peer
      - ucg.macro
      - 'corpus: scripts/construction/inputs.py (10 files)'
      - 'corpus: migration elasticity of sight balances to rates'
      note: ''
- id: ucg-c-sightshare-depcost
  source: unicredit.sight_deposit_share
  target: unicredit.deposit_cost
  label: free funding lowers the average deposit cost
  calibration: uncalibrated
  note: 'a weighted average whose weights are values (the sight share): the method holds stated weights only, so the step
    stays uncalibrated'
