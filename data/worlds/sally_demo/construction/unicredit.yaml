- id: ucg-c-bund-hedgeyield
  source: bunds.yield_10y
  target: unicredit.hedge_yield
  label: rolls the deposit hedge at the new yield
  effect:
    mu: 0.3
    sigma: 0.0375
  kernel:
    delay_days: 30
    lag_days: 365
    duration_days: null
  transition:
    mechanism: The bank invests the stable part of its sight deposits in a rolling ladder of receive-fixed swaps and bonds
      (the structural hedge); each year the part that matures (one over the hedge's maturity) is reinvested at the current
      medium-term swap rate, so the hedge yield moves toward market yields slowly
    sign: +
    actor: UniCredit Group treasury (ALM)
    business_unit: structural hedge of core deposits
    geography: euro area
    currency: EUR
    condition: the hedge notional and its maturity are kept; the Bund 10Y stands in for the five-year euro swap rate
    condition_observable: the hedge's average yield against swap rates, quarterly
    observable:
      name: structural hedge yield
      definition: average yield on the replicating portfolio of core deposits
      units: pct
      frequency: quarterly results
      proof_limits: year-one roll only; the Bund 10Y is a proxy for the swap tenor; the roll is assumed even over the maturity
    timing:
      onset: next quarter
      build: one over the maturity of the notional per year; cumulative over the hedge's maturity
      persistence: while the curve holds
      recognition: interest income and expense each quarter
    evidence:
      existence: documented
      direction: documented
      magnitude: model
      timing: documented
      sources:
      - ucg.co
      - ucg.wb
      - ucg.r4
    breaker: management can shorten or lengthen the hedge; a fall in core deposits shrinks the notional
    next_state: structural hedge yield
    unresolved:
    - input: hedge notional, yield and maturity
      status: found_connected
      found_in:
      - ucg.wb
      searched:
      - ucg.wb
      note: company figures recorded in the workbook with their page; bound as citations and the calibration of ucg-c-bund-hedgeyield
    - input: five-year euro swap rate
      status: not_disclosed_in_reviewed_sources
      searched:
