    actor: UniCredit (board)
    business_unit: distributions
    condition: 'state: only the excess over the management target range is distributed; below it, extra buybacks stop and
      organic generation rebuilds the buffer'
    condition_observable: CET1 ratio against the target range; announced extra distributions
    timing:
      onset: annual (with results)
      build: none
      persistence: while the excess lasts
      recognition: deducted from CET1 when announced
    evidence:
      existence: guidance
      direction: guidance
      magnitude: unknown
      timing: guidance
      sources:
