      build: none
      persistence: while the mix holds
      recognition: interest expense each quarter
    evidence:
      existence: documented
      direction: documented
      magnitude: unknown
      timing: documented
      sources:
      - ucg.wb
      - ucg.pub
    breaker: rising remuneration of sight balances
    next_state: commercial deposit cost
