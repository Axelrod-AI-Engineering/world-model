# UniCredit: business construction (Oct 18). Values added to the unicredit entity (and two euro-area values on
# euro_economy), three new market entities (euro_money_markets, btps, eur_rub), links with their transitions, named paths,
# and compositions (model/construction.py). Structure and generic banking mechanisms only: priors are synthetic, round,
# order-of-magnitude levels marked as such; dated client levels, citations and source bindings stay local
# (data/sally_data/construction/unicredit/). Source ids in evidence.sources: ucg.wb (the supplied company model workbook:
# reclassified P&L history by division, broker estimates, disclosed sensitivities as recorded with their page),
# ucg.co (company disclosures as recorded in the workbook and the broker notes, not read directly), ucg.r1 to ucg.r7
# (broker notes), ucg.peer (peer bank dashboard), ucg.macro (rates and economics notes), ucg.pub (public business and
# accounting knowledge: IFRS 9, FVOCI in CET1, equity accounting, translation).
#
# Bases (features.basis): "reclassified P&L" is UniCredit's reclassified income statement (IFRS), standalone (Commerzbank
# equity-accounted, not consolidated); "division" is a reporting division's result (CEE and Russia at constant FX).
# Costs, provisions and tax are held as negative values, so every part adds to its total with a positive weight.
# Accounting weights are scale_part / scale_total in native sd (log sd times level for a lognormal value).
# Generated from the composition specs; uncalibrated links carry the method's pending forms in `note`
# (identity / stock-flow / matrix / state) so they convert mechanically when those forms land.

entities:
- id: euro_money_markets
  name: Euro money markets
  kind: market
  description: Euro interbank rates. Euribor follows the ECB's expected policy path; floating-rate loans in the euro area
    reprice off it.
  category_tags:
  - MF
  features:
    region: EU
    market: rates
  aliases:
  - Euribor
  - euro money markets
  subentities:
  - id: euro_money_markets.euribor_3m
    name: Euribor 3M
    attribute_kind: interest_rate
    unit: pct
    family: gaussian
    prior:
      family: gaussian
      mu: 2.3
      sigma: 0.25
    scale: 0.25
    aliases:
    - Euribor
    - 3M Euribor
    - three-month Euribor
    features:
      view: operating_state
      basis: three-month euro interbank offered rate, daily fixing
      prior: synthetic
- id: btps
  name: Italian government bonds
  short: BTP
  kind: market
  description: Italy's sovereign curve. Its spread over Bunds marks Italian banks' sovereign holdings and prices their funding.
  category_tags:
  - MF
  features:
    region: EU
    market: rates
  aliases:
  - BTPs
  - Italian bonds
  - BTP-Bund spread
  subentities:
  - id: btps.bund_spread_10y
    name: BTP-Bund 10Y spread
    attribute_kind: rate
    unit: bp
    family: gaussian
    prior:
      family: gaussian
      mu: 100.0
      sigma: 20.0
    scale: 20.0
    aliases:
    - BTP-Bund spread
    - Italian spread
    - lo spread
    features:
      view: operating_state
      basis: 10-year Italian government bond yield less the 10-year Bund yield
      prior: synthetic
- id: eur_rub
  name: EUR/RUB
  kind: market
  description: The euro priced in roubles. A weaker rouble (EUR/RUB up) lowers the euro value of Russian profits and equity.
  category_tags:
  - MF
  features:
    market: fx
  aliases:
  - EUR/RUB
  - EURRUB
  - rouble
  subentities:
  - id: eur_rub.rate
    name: EUR/RUB
    attribute_kind: fx_rate
    unit: RUB per €
    family: lognormal
    mean: 95.0
    scale: 0.08
    aliases:
    - euro-rouble
    - EURRUB
    features:
      view: operating_state
      basis: roubles per euro, spot
      prior: synthetic
