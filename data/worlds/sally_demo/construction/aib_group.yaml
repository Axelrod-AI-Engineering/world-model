# AIB Group: business construction (Oct 18). Values added to the aib_group entity, two new macro entities the bank's
# paths need (ireland_economy, bank_of_england), links with their transitions, named paths, and compositions
# (model/construction.py). Structure and generic banking mechanisms only: priors are synthetic, round,
# order-of-magnitude levels marked as such; dated client levels, citations and source bindings stay local
# (data/sally_data/construction/aib_group/). Source ids in evidence.sources: aib.r1 (a broker's European banks
# valuation sheet that carries an AIB row), aib.r2 (a broker note whose coverage list carries AIB), aib.peer (a euro-area
# peer bank's company workbook: deposit pass-through and structural-hedge mechanics), aib.peer2 (peer broker notes on
# deposit betas and replicating portfolios), aib.macro (the shared macro dataset carried in the supplied workbooks),
# aib.pub (public business, accounting and regulatory knowledge: IFRS 9, CRR, Irish mortgage products). The supplied
# material holds no AIB workbook, results or annual report, so no new link carries a size.
#
# Bases (features.basis): IFRS, EUR, fiscal year = calendar year. Costs and charges are held as negative values, so every
# part adds to its total with a positive weight. Accounting weights are scale_part / scale_total in native sd (log sd
# times level for a lognormal value). Identity, stock-flow and state-dependent steps are uncalibrated links whose
# `note` carries a tag (identity: / stock-flow: / state: / matrix:) for mechanical conversion when the method has them.

entities:
  - id: ireland_economy
    name: Ireland economy
    kind: macro_factor
    description: "Irish domestic demand, jobs and housing: what an Irish bank's lending, credit losses and fees follow. Modified domestic demand stands in for GDP, which multinational flows distort."
    category_tags: [MF]
    features: {region: IE}
    aliases: [Ireland, Irish economy]
    subentities:
      - {id: ireland_economy.domestic_demand_growth, name: "Ireland modified domestic demand growth",
         attribute_kind: growth_rate, unit: pct y/y, family: gaussian, prior: {family: gaussian, mu: 2.5, sigma: 1.0}, scale: 1.0,
         aliases: ["Irish domestic demand", "MDD", "Irish economy"],
         features: {view: operating_state, basis: "real modified domestic demand, year on year (strips multinational IP and aircraft-leasing flows out of GDP)", prior: synthetic}}
      - {id: ireland_economy.unemployment_rate, name: "Ireland unemployment rate",
         attribute_kind: rate, unit: pct, family: gaussian, prior: {family: gaussian, mu: 4.6, sigma: 0.3}, scale: 0.3,
         aliases: ["Irish unemployment", "Irish jobless rate"],
         features: {view: operating_state, basis: "ILO unemployment rate, seasonally adjusted, monthly", prior: synthetic}}
      - {id: ireland_economy.house_price_growth, name: "Ireland residential property price growth",
         attribute_kind: growth_rate, unit: pct y/y, family: gaussian, prior: {family: gaussian, mu: 6.0, sigma: 2.0}, scale: 2.0,
         aliases: ["Irish house prices", "Irish property prices", "RPPI"],
         features: {view: operating_state, basis: "national residential property price index, year on year", prior: synthetic}}
      - {id: ireland_economy.mortgage_drawdowns, name: "Ireland mortgage drawdowns",
         attribute_kind: spending_flow, unit: €bn/yr, family: lognormal, mean: 15.0, scale: 0.08,
         aliases: ["Irish mortgage market", "mortgage drawdowns", "BPFI drawdowns"],
         features: {view: operating_state, basis: "value of new residential mortgage drawdowns in the Irish market, all lenders", prior: synthetic}}
  - id: bank_of_england
    name: Bank of England
    kind: agency
    description: "The UK central bank. Bank Rate sets sterling deposit and loan rates, and so the margin of a UK banking subsidiary."
    category_tags: [MF]
    features: {region: UK, function: monetary_policy}
    aliases: [Bank of England MPC]
    subentities:
      - {id: bank_of_england.policy_rate, name: "Bank of England Bank Rate",
         attribute_kind: policy_rate, unit: pct, family: gaussian, prior: {family: gaussian, mu: 3.75, sigma: 0.25}, scale: 0.25,
         aliases: ["Bank Rate", "UK base rate", "UK policy rate"],
         features: {view: operating_state, basis: "Bank Rate set by the Monetary Policy Committee", prior: synthetic}}

subentities:
  # --- the group income statement (IFRS, EUR): the driven line view and the reported segments --------------------------
  - {entity: aib_group, id: aib_group.total_operating_income, name: "AIB total operating income",
     attribute_kind: revenue_flow, unit: €bn/yr, family: lognormal, mean: 4.6, scale: 0.04,
     features: {view: reporting_segments, basis: "IFRS: net interest income plus other income (fees, trading, other), before costs and impairment", metric: total_operating_income, prior: synthetic}}
  - {entity: aib_group, id: aib_group.fee_income, name: "AIB net fee and commission income",
     attribute_kind: revenue_flow, unit: €bn/yr, family: lognormal, mean: 0.75, scale: 0.06,
     features: {view: product, basis: "IFRS: fee and commission income less expense (current accounts, cards and payments, wealth and insurance, corporate lending fees)", metric: net_fee_and_commission_income, prior: synthetic}}
  - {entity: aib_group, id: aib_group.other_income, name: "AIB other operating income",
     attribute_kind: revenue_flow, unit: €bn/yr, family: gaussian, prior: {family: gaussian, mu: 0.15, sigma: 0.08}, scale: 0.08,
     features: {view: product, basis: "residual: net trading income, hedge ineffectiveness, investment and disposal gains, other (stated as what the two lines leave)", prior: synthetic}}
  - {entity: aib_group, id: aib_group.retail_banking_income, name: "AIB Retail Banking operating income",
     attribute_kind: revenue_flow, unit: €bn/yr, family: lognormal, mean: 2.9, scale: 0.04,
     features: {view: reporting_segments, basis: "segment: Retail Banking (personal and SME customers in Ireland: mortgages, current accounts, cards, wealth) total operating income", metric: retail_banking_operating_income, prior: synthetic}}
  - {entity: aib_group, id: aib_group.capital_markets_income, name: "AIB Capital Markets operating income",
     attribute_kind: revenue_flow, unit: €bn/yr, family: lognormal, mean: 1.0, scale: 0.05,
     features: {view: reporting_segments, basis: "segment: Capital Markets (corporate, institutional and property lending, treasury sales, syndicated and international lending) total operating income", metric: capital_markets_operating_income, prior: synthetic}}
  - {entity: aib_group, id: aib_group.aib_uk_income, name: "AIB UK operating income",
     attribute_kind: revenue_flow, unit: €bn/yr, family: lognormal, mean: 0.6, scale: 0.06,
     features: {view: reporting_segments, basis: "segment: AIB UK (business banking in Great Britain, retail and business banking in Northern Ireland), translated from GBP", metric: aib_uk_operating_income, prior: synthetic}}
  - {entity: aib_group, id: aib_group.group_segment_income, name: "AIB Group segment operating income",
     attribute_kind: revenue_flow, unit: €bn/yr, family: gaussian, prior: {family: gaussian, mu: 0.1, sigma: 0.1}, scale: 0.1,
     features: {view: reporting_segments, basis: "segment residual: Group (treasury and central functions, the part of the structural hedge and central bank income not allocated to the business segments)", metric: group_segment_operating_income, prior: synthetic}}
  # --- costs and charges (negative) ------------------------------------------------------------------------------------
  - {entity: aib_group, id: aib_group.operating_expenses, name: "AIB operating expenses",
     attribute_kind: revenue_flow, unit: €bn/yr, family: gaussian, prior: {family: gaussian, mu: -2.25, sigma: 0.08}, scale: 0.08,
     features: {view: reporting_segments, basis: "IFRS: total operating expenses incl. bank levies and regulatory fees, before exceptional items (a charge, negative)", metric: operating_expenses, prior: synthetic}}
  - {entity: aib_group, id: aib_group.staff_costs, name: "AIB staff costs",
     attribute_kind: revenue_flow, unit: €bn/yr, family: gaussian, prior: {family: gaussian, mu: -1.25, sigma: 0.05}, scale: 0.05,
     features: {view: reporting_segments, basis: "personnel expenses: salaries, pensions, social insurance (variable pay is restricted at Irish banks; negative)", prior: synthetic}}
  - {entity: aib_group, id: aib_group.depreciation, name: "AIB depreciation and amortisation",
     attribute_kind: revenue_flow, unit: €bn/yr, family: gaussian, prior: {family: gaussian, mu: -0.25, sigma: 0.02}, scale: 0.02,
     features: {view: reporting_segments, basis: "depreciation of property and equipment and amortisation of intangible (software) assets (negative)", prior: synthetic}}
  - {entity: aib_group, id: aib_group.bank_levies, name: "AIB bank levies and regulatory fees",
     attribute_kind: revenue_flow, unit: €bn/yr, family: gaussian, prior: {family: gaussian, mu: -0.12, sigma: 0.02}, scale: 0.02,
     features: {view: reporting_segments, basis: "Irish bank levy, deposit guarantee and resolution fund contributions, supervisory fees (negative)", prior: synthetic}}
  - {entity: aib_group, id: aib_group.other_admin_expenses, name: "AIB other general and administrative expenses",
     attribute_kind: revenue_flow, unit: €bn/yr, family: gaussian, prior: {family: gaussian, mu: -0.63, sigma: 0.05}, scale: 0.05,
     features: {view: reporting_segments, basis: "residual: technology, property, professional and marketing costs not in the lines above (negative)", prior: synthetic}}
  - {entity: aib_group, id: aib_group.ecl_charge, name: "AIB net credit impairment charge",
     attribute_kind: revenue_flow, unit: €bn/yr, family: gaussian, prior: {family: gaussian, mu: -0.2, sigma: 0.12}, scale: 0.12,
     features: {view: credit, basis: "IFRS 9: net credit impairment (ECL) charge on loans, commitments and securities (a charge negative, a writeback positive)", metric: net_credit_impairment, prior: synthetic}}
  - {entity: aib_group, id: aib_group.mortgage_ecl, name: "AIB residential mortgage impairment",
     attribute_kind: revenue_flow, unit: €bn/yr, family: gaussian, prior: {family: gaussian, mu: -0.04, sigma: 0.05}, scale: 0.05,
     features: {view: credit, basis: "IFRS 9 ECL charge on residential mortgages, Ireland and UK (negative)", prior: synthetic}}
  - {entity: aib_group, id: aib_group.personal_ecl, name: "AIB personal lending impairment",
     attribute_kind: revenue_flow, unit: €bn/yr, family: gaussian, prior: {family: gaussian, mu: -0.03, sigma: 0.02}, scale: 0.02,
     features: {view: credit, basis: "IFRS 9 ECL charge on personal loans, overdrafts and cards (negative)", prior: synthetic}}
  - {entity: aib_group, id: aib_group.property_ecl, name: "AIB property and construction impairment",
     attribute_kind: revenue_flow, unit: €bn/yr, family: gaussian, prior: {family: gaussian, mu: -0.04, sigma: 0.05}, scale: 0.05,
     features: {view: credit, basis: "IFRS 9 ECL charge on property and construction lending (investment property, development; negative)", prior: synthetic}}
  - {entity: aib_group, id: aib_group.business_ecl, name: "AIB non-property business impairment",
     attribute_kind: revenue_flow, unit: €bn/yr, family: gaussian, prior: {family: gaussian, mu: -0.07, sigma: 0.05}, scale: 0.05,
     features: {view: credit, basis: "IFRS 9 ECL charge on non-property business lending (SME and corporate, incl. syndicated and international; negative)", prior: synthetic}}
  - {entity: aib_group, id: aib_group.other_ecl, name: "AIB other impairment",
     attribute_kind: revenue_flow, unit: €bn/yr, family: gaussian, prior: {family: gaussian, mu: -0.02, sigma: 0.02}, scale: 0.02,
     features: {view: credit, basis: "residual: ECL on off-balance-sheet commitments and securities, and post-model adjustments not allocated to a portfolio (negative)", prior: synthetic}}
  - {entity: aib_group, id: aib_group.mortgage_write_offs, name: "AIB mortgage net write-offs",
     attribute_kind: revenue_flow, unit: €bn/yr, family: gaussian, prior: {family: gaussian, mu: -0.03, sigma: 0.02}, scale: 0.02,
     features: {view: credit, basis: "realised mortgage losses: write-offs net of recoveries charged through impairment (negative)", prior: synthetic}}
  - {entity: aib_group, id: aib_group.mortgage_allowance_build, name: "AIB mortgage ECL allowance build",
     attribute_kind: revenue_flow, unit: €bn/yr, family: gaussian, prior: {family: gaussian, mu: -0.01, sigma: 0.04}, scale: 0.04,
     features: {view: credit, basis: "change in the mortgage ECL allowance charged to impairment: stage migration and forward-looking scenario updates (build negative, release positive)", prior: synthetic}}
  - {entity: aib_group, id: aib_group.business_write_offs, name: "AIB business lending net write-offs",
     attribute_kind: revenue_flow, unit: €bn/yr, family: gaussian, prior: {family: gaussian, mu: -0.04, sigma: 0.02}, scale: 0.02,
     features: {view: credit, basis: "realised non-property business losses net of recoveries (negative)", prior: synthetic}}
  - {entity: aib_group, id: aib_group.business_allowance_build, name: "AIB business lending ECL allowance build",
     attribute_kind: revenue_flow, unit: €bn/yr, family: gaussian, prior: {family: gaussian, mu: -0.03, sigma: 0.04}, scale: 0.04,
     features: {view: credit, basis: "change in the non-property business ECL allowance charged to impairment (build negative, release positive)", prior: synthetic}}
  - {entity: aib_group, id: aib_group.exceptional_items, name: "AIB exceptional and other items",
     attribute_kind: revenue_flow, unit: €bn/yr, family: gaussian, prior: {family: gaussian, mu: -0.05, sigma: 0.05}, scale: 0.05,
     features: {view: reporting_segments, basis: "residual: exceptional items (restructuring, legacy and customer redress), share of associates, gains on disposal", prior: synthetic}}
  - {entity: aib_group, id: aib_group.profit_before_tax, name: "AIB profit before tax",
     attribute_kind: revenue_flow, unit: €bn/yr, family: lognormal, mean: 2.1, scale: 0.07,
     features: {view: reporting_segments, basis: "IFRS: statutory profit before tax", metric: profit_before_tax, prior: synthetic}}
  - {entity: aib_group, id: aib_group.income_tax, name: "AIB income tax",
     attribute_kind: revenue_flow, unit: €bn/yr, family: gaussian, prior: {family: gaussian, mu: -0.3, sigma: 0.04}, scale: 0.04,
     features: {view: reporting_segments, basis: "IFRS income tax charge (Irish trading rate plus deferred tax on carried-forward losses; negative)", metric: income_tax, prior: synthetic}}
  - {entity: aib_group, id: aib_group.profit_after_tax, name: "AIB profit after tax",
     attribute_kind: revenue_flow, unit: €bn/yr, family: lognormal, mean: 1.8, scale: 0.07,
     features: {view: reporting_segments, basis: "IFRS: profit for the year attributable to shareholders and AT1 holders (AT1 coupons are a distribution, not a cost)", metric: profit_after_tax, prior: synthetic}}
  - {entity: aib_group, id: aib_group.retail_banking_pbt, name: "AIB Retail Banking profit before tax",
     attribute_kind: revenue_flow, unit: €bn/yr, family: lognormal, mean: 1.55, scale: 0.06,
     features: {view: reporting_segments, basis: "segment: Retail Banking profit before tax", metric: retail_banking_pbt, prior: synthetic}}
  - {entity: aib_group, id: aib_group.capital_markets_pbt, name: "AIB Capital Markets profit before tax",
     attribute_kind: revenue_flow, unit: €bn/yr, family: lognormal, mean: 0.45, scale: 0.1,
     features: {view: reporting_segments, basis: "segment: Capital Markets profit before tax", metric: capital_markets_pbt, prior: synthetic}}
  - {entity: aib_group, id: aib_group.aib_uk_pbt, name: "AIB UK profit before tax",
     attribute_kind: revenue_flow, unit: €bn/yr, family: lognormal, mean: 0.2, scale: 0.12,
     features: {view: reporting_segments, basis: "segment: AIB UK profit before tax, translated from GBP", metric: aib_uk_pbt, prior: synthetic}}
  - {entity: aib_group, id: aib_group.group_segment_pbt, name: "AIB Group segment profit before tax",
     attribute_kind: revenue_flow, unit: €bn/yr, family: gaussian, prior: {family: gaussian, mu: -0.1, sigma: 0.08}, scale: 0.08,
     features: {view: reporting_segments, basis: "segment residual: Group profit before tax (central costs, unallocated treasury, exceptional items)", metric: group_segment_pbt, prior: synthetic}}
  # --- net interest income by balance-sheet line -----------------------------------------------------------------------
  - {entity: aib_group, id: aib_group.interest_income, name: "AIB interest income",
     attribute_kind: revenue_flow, unit: €bn/yr, family: lognormal, mean: 5.3, scale: 0.04,
     features: {view: investment_assets, basis: "IFRS: interest and similar income (effective interest method) incl. net interest on hedging derivatives", prior: synthetic}}
  - {entity: aib_group, id: aib_group.interest_expense, name: "AIB interest expense",
     attribute_kind: revenue_flow, unit: €bn/yr, family: gaussian, prior: {family: gaussian, mu: -1.6, sigma: 0.1}, scale: 0.1,
     features: {view: liabilities, basis: "IFRS: interest and similar expense (negative)", prior: synthetic}}
  - {entity: aib_group, id: aib_group.loan_interest_income, name: "AIB interest income on loans",
     attribute_kind: revenue_flow, unit: €bn/yr, family: lognormal, mean: 3.4, scale: 0.04,
     features: {view: investment_assets, basis: "interest on loans and advances to customers (average gross loans times loan yield)", prior: synthetic}}
  - {entity: aib_group, id: aib_group.cash_interest_income, name: "AIB interest income on central bank placements",
     attribute_kind: revenue_flow, unit: €bn/yr, family: lognormal, mean: 0.75, scale: 0.15,
     features: {view: investment_assets, basis: "interest on cash and balances at central banks (the deposit facility at the Central Bank of Ireland, and the Bank of England for AIB UK)", prior: synthetic}}
  - {entity: aib_group, id: aib_group.securities_interest_income, name: "AIB interest income on investment securities",
     attribute_kind: revenue_flow, unit: €bn/yr, family: lognormal, mean: 0.65, scale: 0.06,
     features: {view: investment_assets, basis: "interest on investment securities at amortised cost and FVOCI (sovereign, supranational and covered bonds)", prior: synthetic}}
  - {entity: aib_group, id: aib_group.structural_hedge_income, name: "AIB net interest on the structural hedge",
     attribute_kind: revenue_flow, unit: €bn/yr, family: gaussian, prior: {family: gaussian, mu: 0.2, sigma: 0.12}, scale: 0.12,
     features: {view: investment_assets, basis: "net interest on receive-fixed swaps hedging stable deposits and equity: the fixed rate received less the floating rate paid, times the notional (negative when the floating rate is above the fixed)", prior: synthetic}}
  - {entity: aib_group, id: aib_group.other_interest_income, name: "AIB other interest income",
     attribute_kind: revenue_flow, unit: €bn/yr, family: gaussian, prior: {family: gaussian, mu: 0.3, sigma: 0.08}, scale: 0.08,
     features: {view: investment_assets, basis: "residual: loans to banks, finance leases and other earning assets", prior: synthetic}}
  - {entity: aib_group, id: aib_group.deposit_interest_expense, name: "AIB interest expense on customer deposits",
     attribute_kind: revenue_flow, unit: €bn/yr, family: gaussian, prior: {family: gaussian, mu: -0.9, sigma: 0.08}, scale: 0.08,
     features: {view: liabilities, basis: "interest on customer accounts (interest-bearing balances times the deposit cost; negative)", prior: synthetic}}
  - {entity: aib_group, id: aib_group.debt_interest_expense, name: "AIB interest expense on debt securities in issue",
     attribute_kind: revenue_flow, unit: €bn/yr, family: gaussian, prior: {family: gaussian, mu: -0.55, sigma: 0.05}, scale: 0.05,
     features: {view: liabilities, basis: "interest on senior MREL, covered bonds and subordinated liabilities after hedging (negative)", prior: synthetic}}
  - {entity: aib_group, id: aib_group.other_interest_expense, name: "AIB other interest expense",
     attribute_kind: revenue_flow, unit: €bn/yr, family: gaussian, prior: {family: gaussian, mu: -0.15, sigma: 0.03}, scale: 0.03,
     features: {view: liabilities, basis: "residual: deposits by banks, repo, lease liabilities (negative)", prior: synthetic}}
  # --- balances, rates and operating states ----------------------------------------------------------------------------
  - {entity: aib_group, id: aib_group.gross_loans, name: "AIB gross loans to customers",
     attribute_kind: balance, unit: €bn, family: lognormal, mean: 72.0, scale: 0.03,
     features: {view: investment_assets, basis: "gross loans and advances to customers at amortised cost, average", metric: gross_loans, prior: synthetic}}
  - {entity: aib_group, id: aib_group.mortgage_book, name: "AIB residential mortgages",
     attribute_kind: balance, unit: €bn, family: lognormal, mean: 38.0, scale: 0.03,
     features: {view: investment_assets, basis: "gross residential mortgages, Ireland and UK (tracker, variable and fixed)", prior: synthetic}}
  - {entity: aib_group, id: aib_group.personal_loans, name: "AIB personal lending",
     attribute_kind: balance, unit: €bn, family: lognormal, mean: 3.5, scale: 0.05,
     features: {view: investment_assets, basis: "gross personal loans, overdrafts and credit cards", prior: synthetic}}
  - {entity: aib_group, id: aib_group.property_loans, name: "AIB property and construction lending",
     attribute_kind: balance, unit: €bn, family: lognormal, mean: 8.5, scale: 0.05,
     features: {view: investment_assets, basis: "gross property and construction loans", prior: synthetic}}
  - {entity: aib_group, id: aib_group.business_loans, name: "AIB non-property business lending",
     attribute_kind: balance, unit: €bn, family: lognormal, mean: 21.0, scale: 0.04,
     features: {view: investment_assets, basis: "gross non-property business loans (SME, corporate, syndicated and international)", prior: synthetic}}
  - {entity: aib_group, id: aib_group.other_loans, name: "AIB other lending",
     attribute_kind: balance, unit: €bn, family: gaussian, prior: {family: gaussian, mu: 1.0, sigma: 0.5}, scale: 0.5,
     features: {view: investment_assets, basis: "residual: other gross loans and the difference between average and the portfolio split", prior: synthetic}}
  - {entity: aib_group, id: aib_group.customer_deposits, name: "AIB customer accounts",
     attribute_kind: balance, unit: €bn, family: lognormal, mean: 112.0, scale: 0.03,
     features: {view: liabilities, basis: "customer accounts (deposits), average", metric: customer_deposits, prior: synthetic}}
  - {entity: aib_group, id: aib_group.current_accounts, name: "AIB current accounts",
     attribute_kind: balance, unit: €bn, family: lognormal, mean: 67.0, scale: 0.04,
     features: {view: liabilities, basis: "current accounts and other non-interest-bearing or near-zero-rate demand balances", prior: synthetic}}
  - {entity: aib_group, id: aib_group.interest_bearing_deposits, name: "AIB interest-bearing deposits",
     attribute_kind: balance, unit: €bn, family: lognormal, mean: 45.0, scale: 0.05,
     features: {view: liabilities, basis: "demand savings, notice and term deposits that pay a market-linked rate", prior: synthetic}}
  - {entity: aib_group, id: aib_group.deposit_cost, name: "AIB cost of interest-bearing deposits",
     attribute_kind: bank_funding_cost, unit: pct, family: gaussian, prior: {family: gaussian, mu: 2.0, sigma: 0.15}, scale: 0.15,
     features: {view: liabilities, basis: "interest expense on customer accounts over average interest-bearing balances", prior: synthetic}}
  - {entity: aib_group, id: aib_group.loan_yield, name: "AIB loan yield",
     attribute_kind: interest_rate, unit: pct, family: gaussian, prior: {family: gaussian, mu: 4.72, sigma: 0.15}, scale: 0.15,
     features: {view: operating_state, basis: "interest income on loans over average gross loans (tracker, variable, fixed and floating corporate together)", prior: synthetic}}
  - {entity: aib_group, id: aib_group.cash_at_central_banks, name: "AIB cash at central banks",
     attribute_kind: balance, unit: €bn, family: lognormal, mean: 33.3, scale: 0.1,
     features: {view: investment_assets, basis: "average cash and balances at central banks (deposit facility), the liquidity not lent or invested", prior: synthetic}}
  - {entity: aib_group, id: aib_group.securities_portfolio, name: "AIB investment securities",
     attribute_kind: balance, unit: €bn, family: lognormal, mean: 25.0, scale: 0.05,
     features: {view: investment_assets, basis: "average investment securities (amortised cost and FVOCI); no maturity ladder represented", prior: synthetic}}
  - {entity: aib_group, id: aib_group.securities_yield, name: "AIB investment securities yield",
     attribute_kind: bond_yield, unit: pct, family: gaussian, prior: {family: gaussian, mu: 2.6, sigma: 0.12}, scale: 0.12,
     features: {view: investment_assets, basis: "interest income on securities over average securities (book yield)", prior: synthetic}}
  - {entity: aib_group, id: aib_group.structural_hedge_notional, name: "AIB structural hedge notional",
     attribute_kind: balance, unit: €bn, family: lognormal, mean: 40.0, scale: 0.08,
     features: {view: investment_assets, basis: "notional of the structural hedge: receive-fixed swaps and fixed-rate assets set against stable current accounts and equity", prior: synthetic}}
  - {entity: aib_group, id: aib_group.hedge_yield, name: "AIB structural hedge fixed yield",
     attribute_kind: bond_yield, unit: pct, family: gaussian, prior: {family: gaussian, mu: 2.75, sigma: 0.15}, scale: 0.15,
     features: {view: investment_assets, basis: "average fixed rate received on the structural hedge book (rolls toward medium-term swap rates as tranches mature)", prior: synthetic}}
  - {entity: aib_group, id: aib_group.new_mortgage_lending, name: "AIB new mortgage lending",
     attribute_kind: capital_flow, unit: €bn/yr, family: gaussian, prior: {family: gaussian, mu: 5.0, sigma: 0.6}, scale: 0.6,
     features: {view: operating_state, basis: "new residential mortgage drawdowns written by the group in Ireland", prior: synthetic}}
  - {entity: aib_group, id: aib_group.mortgage_market_share, name: "AIB share of Irish mortgage drawdowns",
     attribute_kind: structural_level, unit: pct, family: gaussian, prior: {family: gaussian, mu: 33.3, sigma: 2.0}, scale: 2.0,
     features: {view: operating_state, basis: "the group's brands' share of Irish mortgage drawdowns by value", prior: synthetic}}
  - {entity: aib_group, id: aib_group.npe_ratio, name: "AIB non-performing exposure ratio",
     attribute_kind: rate, unit: pct, family: gaussian, prior: {family: gaussian, mu: 2.5, sigma: 0.3}, scale: 0.3,
     features: {view: credit, basis: "credit-impaired (stage 3) loans over gross loans", prior: synthetic}}
  # --- capital, distributions and the State's shareholding -------------------------------------------------------------
  - {entity: aib_group, id: aib_group.fvoci_reserve, name: "AIB FVOCI reserve",
     attribute_kind: structural_level, unit: €bn, family: gaussian, prior: {family: gaussian, mu: -0.2, sigma: 0.2}, scale: 0.2,
     features: {view: capital, basis: "after-tax unrealised gains and losses on FVOCI securities in OCI (in CET1; the cash-flow hedge reserve is filtered out of CET1)", prior: synthetic}}
  - {entity: aib_group, id: aib_group.cet1_capital, name: "AIB CET1 capital",
     attribute_kind: structural_level, unit: €bn, family: gaussian, prior: {family: gaussian, mu: 11.16, sigma: 0.4}, scale: 0.4,
     features: {view: capital, basis: "common equity tier 1 capital (CRR, fully loaded): equity less intangibles, deferred tax assets on losses, foreseeable distributions and other deductions", prior: synthetic}}
  - {entity: aib_group, id: aib_group.rwa, name: "AIB risk-weighted assets",
     attribute_kind: balance, unit: €bn, family: lognormal, mean: 72.0, scale: 0.03,
     features: {view: capital, basis: "risk-weighted assets (CRR: credit, market and operational risk)", prior: synthetic}}
  - {entity: aib_group, id: aib_group.cet1_ratio, name: "AIB CET1 ratio",
     attribute_kind: structural_level, unit: pct, family: gaussian, prior: {family: gaussian, mu: 15.5, sigma: 0.4}, scale: 0.4,
     aliases: ["AIB CET1", "AIB capital ratio"],
     features: {view: capital, basis: "CET1 capital over risk-weighted assets, fully loaded (CRR)", metric: cet1_ratio, prior: synthetic}}
  - {entity: aib_group, id: aib_group.cet1_requirement, name: "AIB CET1 requirement",
     attribute_kind: structural_level, unit: pct, family: gaussian, prior: {family: gaussian, mu: 11.0, sigma: 0.3}, scale: 0.3,
     features: {view: capital, basis: "maximum distributable amount threshold: Pillar 1 plus Pillar 2 requirement, capital conservation, O-SII and countercyclical buffers", prior: synthetic}}
  - {entity: aib_group, id: aib_group.ordinary_dividends, name: "AIB ordinary dividends",
     attribute_kind: capital_flow, unit: €bn/yr, family: gaussian, prior: {family: gaussian, mu: 0.9, sigma: 0.15}, scale: 0.15,
     features: {view: capital, basis: "ordinary dividends declared for the year (interim and final)", prior: synthetic}}
  - {entity: aib_group, id: aib_group.buybacks, name: "AIB share buybacks",
     attribute_kind: capital_flow, unit: €bn/yr, family: gaussian, prior: {family: gaussian, mu: 0.8, sigma: 0.3}, scale: 0.3,
     features: {view: capital, basis: "share buybacks incl. directed buybacks from the Minister for Finance", prior: synthetic}}
  - {entity: aib_group, id: aib_group.state_shareholding, name: "Irish State shareholding in AIB",
     attribute_kind: structural_level, unit: pct, family: gaussian, prior: {family: gaussian, mu: 2.0, sigma: 2.0}, scale: 2.0,
     features: {view: capital, basis: "the Minister for Finance's share of AIB's ordinary shares (synthetic level: the current stake is not in the reviewed sources; zero once the sell-down is complete)", prior: synthetic}}
  - {entity: aib_group, id: aib_group.state_share_sales, name: "Irish State sales of AIB shares",
     attribute_kind: capital_flow, unit: €bn/yr, family: gaussian, prior: {family: gaussian, mu: 0.3, sigma: 0.4}, scale: 0.4,
     features: {view: capital, basis: "value of the State's disposals: placings, the pre-arranged trading plan and directed buybacks", prior: synthetic}}
  - {entity: aib_group, id: aib_group.short_rate, name: "AIB euro short rate earned and paid",
     attribute_kind: interest_rate, unit: pct, family: gaussian, prior: {family: gaussian, mu: 2.25, sigma: 0.25}, scale: 0.25,
     features: {view: operating_state, basis: "the rate central bank placements earn (the deposit facility rate) and the structural hedge pays on its floating leg (euro short-term rate and Euribor fixings follow it)", proxy_for: "euro short-term rate (€STR) and 3M Euribor: the world has neither series, so the deposit facility rate stands in", prior: synthetic}}
  - {entity: aib_group, id: aib_group.hedge_spread, name: "AIB structural hedge net spread",
     attribute_kind: margin, unit: pct, family: gaussian, prior: {family: gaussian, mu: 0.5, sigma: 0.3}, scale: 0.3,
     features: {view: investment_assets, basis: "the hedge's fixed yield received less the floating rate paid (negative when the floating rate is above the fixed)", prior: synthetic}}
  - {entity: aib_group, id: aib_group.payout_ratio, name: "AIB ordinary dividend payout ratio",
     attribute_kind: structural_level, unit: pct, family: gaussian, prior: {family: gaussian, mu: 50.0, sigma: 5.0}, scale: 5.0,
     features: {view: capital, basis: "ordinary dividends over profit after tax (the board's policy, set at results)", prior: synthetic}}
  - {entity: aib_group, id: aib_group.rwa_density, name: "AIB RWA density on loans",
     attribute_kind: structural_level, unit: pct, family: gaussian, prior: {family: gaussian, mu: 100.0, sigma: 3.0}, scale: 3.0,
     features: {view: capital, basis: "risk-weighted assets (all risk types) per euro of gross loans: loan risk weights plus the RWA of securities, operational and market risk", prior: synthetic}}
  - {entity: aib_group, id: aib_group.mortgage_redemptions, name: "AIB mortgage redemptions",
     attribute_kind: capital_flow, unit: €bn/yr, family: gaussian, prior: {family: gaussian, mu: 4.0, sigma: 0.5}, scale: 0.5,
     features: {view: operating_state, basis: "mortgage repayments, amortisation, switching to other lenders and loan sales, per year", prior: synthetic}}

interactions:
  # ===================== causal links: mechanism and sign; size unknown (uncalibrated) ===========================
  - id: aib-c-ecb-loanyield
    source: ecb.policy_rate
    target: aib_group.loan_yield
    label: "reprices tracker, variable and floating loans"
    calibration: uncalibrated
    note: "state: the response falls as fixed-rate lending grows (not a threshold, asymmetry or sign flip: the floating share moves); uncalibrated by design: not sized: s32 carries the ECB's net effect on NII as a reduced form, and every step below this entry is now an exact identity into NII, so sizing the entry would count the move twice; size the ECB entries and retire s32 together once AIB's own sensitivity is supplied"
    transition:
      mechanism: "Tracker mortgages reset with the ECB rate at once, floating-rate business and corporate loans with Euribor at their next fixing, and standard variable rates at the bank's discretion; fixed-rate mortgages (most new Irish lending) reprice only at the end of their fixed period, so the yield moves by the floating share of the book first and the rest over years"
      sign: "+"
      actor: "AIB (lending pricing); borrowers on trackers and floating loans"
      business_unit: "Retail Banking mortgages; Capital Markets and AIB UK lending"
      geography: "Ireland"
      currency: "EUR"
      condition: "the tracker and floating share of the book; Euribor following the deposit rate (the deposit rate stands in for Euribor here)"
      condition_observable: "loan yield against the ECB rate and 3M Euribor, half-yearly"
      timing: {onset: "within the month for trackers and floating loans", build: "fixed-rate expiries over 1-5 years", persistence: "while the rate holds", recognition: "interest income each quarter"}
      evidence: {existence: public_not_supplied, direction: inferred, magnitude: unknown, timing: inferred, sources: [aib.pub, aib.peer]}
      breaker: "competition on mortgage pricing (variable rates need not follow); a shift of new lending to fixed rates lowers the floating share; receive-fixed swaps on loans"
      next_state: "loan yield"
      unresolved:
        - {input: "tracker, variable and fixed shares of the mortgage book and the fixed-rate maturity profile", status: disclosed_not_supplied, searched: ["corpus: scripts/construction/inputs.py (115 files)", aib.r1, aib.r2, aib.peer, aib.peer2, aib.macro, "corpus: tracker|variable rate|fixed.rate mortgage", "corpus: Irish mortgage"], note: "the company discloses it publicly (annual report, mortgage portfolio disclosures); not in the supplied material"}
  - id: aib-c-ecb-depcost
    source: ecb.policy_rate
    target: aib_group.deposit_cost
    label: "passes a share of a rate move to deposit rates"
    calibration: uncalibrated
    note: "state: the beta differs between hikes and cuts and rises with the rate level (not converted: an asymmetric link must carry sizes); uncalibrated by design: not sized: s32 carries the ECB's net effect on NII as a reduced form, and every step below this entry is now an exact identity into NII, so sizing the entry would count the move twice; size the ECB entries and retire s32 together once AIB's own sensitivity is supplied"
    transition:
      mechanism: "The bank reprices interest-bearing savings, notice and term deposits by a fraction of an ECB move (the deposit beta); current accounts pay close to nothing, and in a concentrated deposit market with few competitors the fraction is low and slow, which is why the bank's NII responds strongly to the ECB"
      sign: "+"
      actor: "AIB (deposit pricing); competitors, State savings products and money funds"
      business_unit: "Retail Banking and Capital Markets deposits"
      geography: "Ireland"
      currency: "EUR"
      condition: "a concentrated deposit market and excess liquidity keep pass-through low; corporate and treasury deposits reprice closer to the market"
      condition_observable: "rate paid on interest-bearing deposits against the ECB deposit rate, half-yearly"
      timing: {onset: "within the quarter for corporate deposits", build: "2-4 quarters for retail term rates", persistence: "while the rate holds", recognition: "interest expense each quarter"}
      evidence: {existence: public_not_supplied, direction: inferred, magnitude: unknown, timing: inferred, sources: [aib.pub, aib.peer, aib.peer2]}
      breaker: "a deposit-price contest (a new entrant, State savings rates) raises the beta; caps at the policy rate; on the way down, rates near zero floor the fall"
      next_state: "cost of interest-bearing deposits"
      unresolved:
        - {input: "deposit beta (pass-through of ECB moves to AIB deposit rates), by product", status: found_proxy, searched: [aib.r1, aib.r2, aib.peer, aib.peer2, aib.macro], found_in: [aib.peer, aib.peer2], note: "a euro peer's sight-deposit beta and pass-through sensitivity; AIB's own is disclosed in its results, not supplied"}
  - id: aib-c-ecb-migration
    source: ecb.policy_rate
    target: aib_group.current_accounts
    label: "moves balances out of current accounts"
    calibration: uncalibrated
    note: "uncalibrated by design: not sized: s32 carries the ECB's net effect on NII as a reduced form, and every step below this entry is now an exact identity into NII, so sizing the entry would count the move twice; size the ECB entries and retire s32 together once AIB's own sensitivity is supplied"
    transition:
      mechanism: "Higher rates make idle balances costly, so customers move money from current accounts into savings and term deposits or out to State savings and funds; lower rates slow or reverse the migration"
      sign: "-"
      actor: "depositors (households, SMEs, corporates)"
      business_unit: "Retail Banking deposits"
      geography: "Ireland"
      currency: "EUR"
      condition: "rates high enough for the opportunity cost to be noticed; transaction balances are sticky"
      condition_observable: "current accounts as a share of customer accounts, half-yearly"
      timing: {onset: "1-2 quarters", build: "several quarters", persistence: "while the gap lasts", recognition: "average balances and interest each quarter"}
      evidence: {existence: inferred, direction: inferred, magnitude: unknown, timing: inferred, sources: [aib.pub, aib.peer2]}
      breaker: "operating balances customers cannot move; deposit inflows from a growing economy"
      next_state: "current accounts"
      unresolved:
        - {input: "current-account share of deposits and its migration elasticity", status: disclosed_not_supplied, searched: ["corpus: scripts/construction/inputs.py (115 files)", aib.r1, aib.r2, aib.peer, aib.peer2, aib.macro, "corpus: current account|sight deposit|non.interest.bearing", "corpus: migration"], note: "the company discloses it publicly (annual report, customer accounts note); not in the supplied material"}
  - id: aib-c-ecb-debtcost
    source: ecb.policy_rate
    target: aib_group.debt_interest_expense
    label: "reprices swapped wholesale debt"
    calibration: uncalibrated
    note: "uncalibrated by design: not sized: s32 carries the ECB's net effect on NII as a reduced form, and every step below this entry is now an exact identity into NII, so sizing the entry would count the move twice; size the ECB entries and retire s32 together once AIB's own sensitivity is supplied"
    transition:
      mechanism: "Senior MREL and covered bonds are mostly swapped to floating, so their cost moves with money-market rates (expense more negative when rates rise)"
      sign: "-"
      actor: "AIB Treasury (funding)"
      business_unit: "Group treasury"
      geography: "Ireland"
      currency: "EUR"
      condition: "the swapped share of debt; issuance volume set by the MREL requirement"
      condition_observable: "interest expense on debt securities in issue"
      timing: {onset: "at the next fixing", build: "as debt rolls", persistence: "while the rate holds", recognition: "interest expense each quarter"}
      evidence: {existence: inferred, direction: inferred, magnitude: unknown, timing: inferred, sources: [aib.pub]}
      breaker: "unswapped fixed coupons; new issuance at wider or tighter spreads"
      next_state: "interest expense on debt securities"
      unresolved:
        - {input: "share of wholesale debt swapped to floating", status: disclosed_not_supplied, searched: ["corpus: scripts/construction/inputs.py (115 files)", aib.r1, aib.r2, aib.peer, aib.peer2, aib.macro, "corpus: MREL|senior debt|covered bond", "corpus: AIB"], note: "the company discloses it publicly (annual report, hedging note); not in the supplied material"}
  - id: aib-c-ecb-property
    source: ecb.policy_rate
    target: aib_group.property_ecl
    label: "higher rates stress property borrowers"
    calibration: uncalibrated
    transition:
      mechanism: "Counter-path to the NII gain: higher rates raise property borrowers' debt service and cut property values, which raises stage migration and impairment on property and construction lending (a larger, negative charge); lower rates ease it"
      sign: "-"
      actor: "property borrowers; AIB credit risk"
      business_unit: "Capital Markets property lending"
      geography: "Ireland"
      currency: "EUR"
      condition: "floating-rate or refinancing property borrowers; valuations sensitive to yields"
      condition_observable: "property and construction loans in stage 2 and 3; impairment charge"
      timing: {onset: "2-4 quarters", build: "over the refinancing cycle", persistence: "while rates stay high", recognition: "impairment charge at each reporting date"}
      evidence: {existence: inferred, direction: inferred, magnitude: unknown, timing: inferred, sources: [aib.pub]}
      breaker: "interest-rate hedges held by borrowers; low leverage after the post-2010 deleveraging"
      next_state: "property and construction impairment"
      unresolved:
