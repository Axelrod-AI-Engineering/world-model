      evidence: {existence: inferred, direction: inferred, magnitude: unknown, timing: inferred, sources: [aib.pub]}
      breaker: "housing supply shortages keep demand above supply; first-time-buyer schemes"
      next_state: "Irish mortgage drawdowns"
      unresolved:
