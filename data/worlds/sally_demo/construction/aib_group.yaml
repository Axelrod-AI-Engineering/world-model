      evidence: {existence: inferred, direction: inferred, magnitude: unknown, timing: inferred, sources: [aib.pub]}
      breaker: "low household leverage and strong employment; payment-break forbearance"
      next_state: "non-performing exposure ratio"
      unresolved:
