      mechanism: "The deposit facility rate is what the bank's central bank placements earn and, through €STR and Euribor fixings, what the structural hedge pays on its floating leg; it moves with the ECB on the effective date"
      sign: "+"
      actor: "ECB (deposit facility); money markets"
      business_unit: "Group treasury"
      geography: "Ireland"
      currency: "EUR"
      condition: "no reserve tiering; €STR and Euribor track the deposit rate"
      condition_observable: "the deposit facility rate and €STR fixings"
      timing: {onset: "same day", build: "none", persistence: "while the rate holds", recognition: "interest each period"}
      evidence: {existence: public_not_supplied, direction: inferred, magnitude: unknown, timing: inferred, sources: [aib.pub, aib.peer]}
      breaker: "a tiering or remuneration change by the ECB; a Euribor basis to the deposit rate"
      next_state: "the euro short rate the bank earns and pays"
  - id: aib-c-shortrate-cashincome
    source: aib_group.short_rate
    target: aib_group.cash_interest_income
    label: "central bank cash earns the short rate"
    edge_type: identity
    identity: aib.id.cash_income
    transition:
      mechanism: "Cash placed at the deposit facility earns the short rate: interest income on central bank placements is the balance times the rate; a deposit-rich, loan-light balance sheet holds a large share of its assets there, so this is the most direct channel from the ECB to NII"
      actor: "AIB Treasury"
      business_unit: "Group treasury (allocated to the segments by funds transfer pricing)"
      geography: "Ireland"
      currency: "EUR"
      condition: "liquidity held at the central bank rather than lent or invested"
      condition_observable: "cash and balances at central banks and their yield, half-yearly"
      timing: {onset: "same day", build: "none", persistence: "while the rate holds", recognition: "interest income each quarter"}
      evidence: {existence: public_not_supplied, direction: inferred, magnitude: inferred, timing: inferred, sources: [aib.pub, aib.peer]}
      breaker: "the bank moves liquidity into securities or the hedge"
      next_state: "interest income on central bank placements"
      unresolved:
        - {input: "average cash at central banks and the share held at the Central Bank of Ireland", status: disclosed_not_supplied, searched: ["corpus: scripts/construction/inputs.py (115 files)", aib.r1, aib.r2, aib.peer, aib.peer2, aib.macro, "corpus: central bank (placements|balances|deposits)|deposit facility", "corpus: AIB"], note: "the company discloses it publicly (annual report, balance sheet); not in the supplied material"}
  - id: aib-c-shortrate-spread
    source: aib_group.short_rate
    target: aib_group.hedge_spread
    label: "the hedge pays floating, so a cut widens its spread"
    edge_type: identity
    identity: aib.id.hedge_spread
    transition:
      mechanism: "Counter-path: the structural hedge receives fixed and pays floating, so a lower short rate widens the hedge's net spread and raises its net interest, offsetting part of the fall in cash and floating-loan income; a higher rate does the opposite"
      actor: "AIB Treasury (asset and liability management)"
      business_unit: "Group treasury"
      geography: "Ireland"
      currency: "EUR"
      condition: "a receive-fixed hedge in place against stable deposits and equity"
      condition_observable: "net hedge interest"
      timing: {onset: "at the next floating fixing", build: "none", persistence: "while the rate holds", recognition: "interest income each quarter"}
      evidence: {existence: public_not_supplied, direction: inferred, magnitude: inferred, timing: inferred, sources: [aib.pub, aib.peer, aib.peer2]}
      breaker: "the bank changes the hedge notional or tenor; hedge accounting puts the swaps' mark in OCI, not income"
      next_state: "structural hedge net spread"
      unresolved:
