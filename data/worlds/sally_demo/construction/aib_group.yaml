paths:
  - id: aib.path.rates_nii
    name: "AIB ECB deposit rate to net interest income"
    entity_id: aib_group
    trigger: "the ECB raises or cuts the deposit rate"
    endpoint: aib_group.profit_after_tax
    description: "Parallel responses of one rate move: central bank cash and floating loans reprice at once, deposit costs follow by the beta with a lag, balances migrate out of current accounts (shrinking the hedgeable base), the structural hedge's floating leg offsets part of the move, swapped debt reprices, and property and variable-rate borrowers feel the cost (the credit counter-path). s32 is the reduced form on NII and is never added to these steps."
    steps:
      - {interaction_id: aib-c-ecb-shortrate, branch: short_rate}
      - {interaction_id: aib-c-ecb-loanyield, branch: loans}
      - {interaction_id: aib-c-ecb-depcost, branch: beta}
      - {interaction_id: aib-c-ecb-migration, branch: migration}
      - {interaction_id: aib-c-ecb-debtcost, branch: wholesale}
      - {interaction_id: aib-c-ecb-property, branch: credit}
      - {interaction_id: aib-c-shortrate-cashincome}
      - {interaction_id: aib-c-shortrate-spread}
      - {interaction_id: aib.id.hedge_income:aib_group.hedge_spread}
      - {interaction_id: aib-c-loanyield-income}
      - {interaction_id: aib-c-depcost-expense}
      - {interaction_id: aib-c-ca-ibdep}
      - {interaction_id: aib-c-ibdep-expense}
      - {interaction_id: aib-c-ca-hedgenotional}
      - {interaction_id: aib-c-hedgenotional-income}
      - {interaction_id: aib-a-ii-cash-interest-income}
      - {interaction_id: aib-a-ii-loan-interest-income}
      - {interaction_id: aib-a-ii-structural-hedge-income}
      - {interaction_id: aib-a-ie-deposit-interest-expense}
      - {interaction_id: aib-a-ie-debt-interest-expense}
      - {interaction_id: aib-a-nii-interest-income}
      - {interaction_id: aib-a-nii-interest-expense}
      - {interaction_id: aib-a-ecl-property-ecl}
      - {interaction_id: aib-a-pbt-ecl-charge}
      - {interaction_id: aib-a-inc-net-interest-income}
      - {interaction_id: aib-a-pbt-total-operating-income}
      - {interaction_id: aib-a-pat-profit-before-tax}
  - id: aib.path.structural_hedge
    name: "AIB euro long end to the structural hedge, securities and capital"
    entity_id: aib_group
    trigger: "medium- and long-term euro rates rise (a steeper curve)"
    endpoint: aib_group.cet1_ratio
    description: "One move, four parallel responses: maturing hedge tranches roll at the higher swap rate (slowly, over the hedge's life), maturing securities reinvest higher, FVOCI bonds mark down into CET1, and dearer fixed mortgages slow new lending. The hedge is what makes a bank with a large current-account base less sensitive to the ECB and more to the medium-term curve."
    steps:
      - {interaction_id: aib-c-bund-hedgeyield, branch: hedge_roll}
      - {interaction_id: aib-c-bund-secyield, branch: securities}
      - {interaction_id: aib-c-bund-fvoci, branch: marks}
      - {interaction_id: aib-c-bund-newlending, branch: mortgage_pricing}
      - {interaction_id: aib-c-hedgeyield-spread}
      - {interaction_id: aib.id.hedge_income:aib_group.hedge_spread}
      - {interaction_id: aib-c-secyield-income}
      - {interaction_id: aib-c-newlending-book}
      - {interaction_id: aib-a-ii-structural-hedge-income}
      - {interaction_id: aib-a-ii-securities-interest-income}
      - {interaction_id: aib-a-loans-mortgage-book}
      - {interaction_id: aib-c-loans-income}
      - {interaction_id: aib-a-ii-loan-interest-income}
      - {interaction_id: aib-a-nii-interest-income}
      - {interaction_id: aib-a-inc-net-interest-income}
      - {interaction_id: aib-a-pbt-total-operating-income}
      - {interaction_id: aib-a-pat-profit-before-tax}
      - {interaction_id: aib-c-fvoci-cet1}
      - {interaction_id: aib-c-pat-cet1}
      - {interaction_id: aib-c-cet1cap-ratio}
  - id: aib.path.mortgage_lending
    name: "AIB Irish housing to the mortgage book and NII"
    entity_id: aib_group
    trigger: "Irish house prices and housing demand rise"
    endpoint: aib_group.profit_after_tax
    description: "Rising prices lift the market's drawdowns, the bank writes its share as new lending, the book grows by new lending less redemptions, and loan interest follows the balance at the loan yield; the larger book adds RWA. Most new lending is fixed-rate, so the yield on the growth is set by swap rates at origination."
    steps:
      - {interaction_id: aib-c-hpi-drawdowns}
      - {interaction_id: aib-c-drawdowns-newlending}
      - {interaction_id: aib-c-newlending-book}
      - {interaction_id: aib-a-loans-mortgage-book}
      - {interaction_id: aib-c-loans-income, branch: income}
      - {interaction_id: aib-c-loans-rwa, branch: capital}
      - {interaction_id: aib-a-ii-loan-interest-income}
      - {interaction_id: aib-a-nii-interest-income}
      - {interaction_id: aib-a-inc-net-interest-income}
      - {interaction_id: aib-a-pbt-total-operating-income}
      - {interaction_id: aib-a-pat-profit-before-tax}
  - id: aib.path.credit_cycle
    name: "AIB Irish economy to impairment (two clocks)"
    entity_id: aib_group
    trigger: "Irish domestic demand weakens"
    endpoint: aib_group.profit_after_tax
    description: "Weaker demand raises unemployment; IFRS 9 builds allowances when the outlook changes (the first clock: business allowances at once, mortgage allowances on the unemployment path), while arrears and stage-3 defaults turn into realised write-offs quarters later (the second clock). Property credit weakens with demand. Each portfolio's charge adds to the impairment line and on to profit."
    steps:
      - {interaction_id: aib-c-dd-unemp, branch: labour}
      - {interaction_id: aib-c-dd-busallow, branch: outlook}
      - {interaction_id: aib-c-dd-property, branch: property}
      - {interaction_id: aib-c-unemp-mortallow, branch: mortgage_outlook}
      - {interaction_id: aib-c-unemp-npe, branch: defaults}
      - {interaction_id: aib-c-npe-mortwo, branch: mortgage_losses}
      - {interaction_id: aib-c-npe-buswo, branch: business_losses}
      - {interaction_id: aib-a-mecl-mortgage-allowance-build}
      - {interaction_id: aib-a-mecl-mortgage-write-offs}
      - {interaction_id: aib-a-becl-business-allowance-build}
      - {interaction_id: aib-a-becl-business-write-offs}
      - {interaction_id: aib-a-ecl-mortgage-ecl}
      - {interaction_id: aib-a-ecl-business-ecl}
      - {interaction_id: aib-a-ecl-property-ecl}
      - {interaction_id: aib-a-pbt-ecl-charge}
      - {interaction_id: aib-a-pat-profit-before-tax}
  - id: aib.path.house_prices_credit
    name: "AIB house prices to mortgage impairment and lending"
    entity_id: aib_group
    trigger: "Irish house prices rise"
    endpoint: aib_group.profit_after_tax
    description: "A shared driver with two parallel responses: collateral values lower loss given default (allowances release), and drawdowns rise (lending grows). A price fall reverses both."
    steps:
      - {interaction_id: aib-c-hpi-mortallow, branch: collateral}
      - {interaction_id: aib-c-hpi-drawdowns, branch: volume}
      - {interaction_id: aib-a-mecl-mortgage-allowance-build}
      - {interaction_id: aib-a-ecl-mortgage-ecl}
      - {interaction_id: aib-a-pbt-ecl-charge}
      - {interaction_id: aib-c-drawdowns-newlending}
      - {interaction_id: aib-c-newlending-book}
      - {interaction_id: aib-a-loans-mortgage-book}
      - {interaction_id: aib-c-loans-income}
      - {interaction_id: aib-a-ii-loan-interest-income}
      - {interaction_id: aib-a-nii-interest-income}
      - {interaction_id: aib-a-inc-net-interest-income}
      - {interaction_id: aib-a-pbt-total-operating-income}
      - {interaction_id: aib-a-pat-profit-before-tax}
  - id: aib.path.fees
    name: "AIB activity to fee income"
    entity_id: aib_group
    trigger: "Irish domestic activity strengthens"
    endpoint: aib_group.profit_after_tax
    description: "Card spend, payments and lending activity raise fees, and stronger demand lifts business borrowing (balance growth into loan interest). Fees are a small share of income and politically constrained."
    steps:
      - {interaction_id: aib-c-dd-fees, branch: fees}
      - {interaction_id: aib-c-dd-business, branch: lending}
      - {interaction_id: aib-a-inc-fee-income}
      - {interaction_id: aib-a-loans-business-loans}
      - {interaction_id: aib-c-loans-income}
      - {interaction_id: aib-a-ii-loan-interest-income}
      - {interaction_id: aib-a-nii-interest-income}
      - {interaction_id: aib-a-inc-net-interest-income}
      - {interaction_id: aib-a-pbt-total-operating-income}
      - {interaction_id: aib-a-pat-profit-before-tax}
  - id: aib.path.wealth_fees
    name: "AIB equity markets to wealth fees"
    entity_id: aib_group
    trigger: "European equity markets rise"
    endpoint: aib_group.profit_after_tax
    description: "Wealth, broking and asset-management fees follow asset values."
    steps:
      - {interaction_id: aib-c-equity-fees}
      - {interaction_id: aib-a-inc-fee-income}
      - {interaction_id: aib-a-pbt-total-operating-income}
      - {interaction_id: aib-a-pat-profit-before-tax}
  - id: aib.path.cost_inflation
    name: "AIB inflation to operating expenses"
    entity_id: aib_group
    trigger: "euro-area inflation rises"
    endpoint: aib_group.profit_after_tax
    description: "Inflation feeds the next wage agreement and vendor and property contracts; variable pay is restricted, so costs do not flex down with income."
    steps:
      - {interaction_id: aib-c-cpi-staff, branch: wages}
      - {interaction_id: aib-c-cpi-admin, branch: vendors}
      - {interaction_id: aib-a-opex-staff-costs}
      - {interaction_id: aib-a-opex-other-admin-expenses}
      - {interaction_id: aib-a-pbt-operating-expenses}
      - {interaction_id: aib-a-pat-profit-before-tax}
  - id: aib.path.uk_rates
    name: "AIB Bank Rate to AIB UK"
    entity_id: aib_group
    trigger: "the Bank of England raises Bank Rate"
    endpoint: aib_group.profit_after_tax
    description: "AIB UK's deposit-funded book widens its margin when Bank Rate rises; the segment's income is translated from sterling. This is the only driver of the segment view, and it is uncalibrated, so it never adds to the line view's NII change."
    steps:
      - {interaction_id: aib-c-boe-ukincome}
      - {interaction_id: aib-a-seg-aib-uk-income}
      - {interaction_id: aib-a-pbt-total-operating-income}
      - {interaction_id: aib-a-pat-profit-before-tax}
  - id: aib.path.capital_distributions
    name: "AIB profit to capital and distributions"
    entity_id: aib_group
    trigger: "profit after tax rises"
    endpoint: aib_group.cet1_ratio
    description: "Profit builds CET1; the dividend is a payout share of profit; capital above the management target is returned through buybacks; both distributions consume CET1. Capital is a stock fed by flows (stock-flow tags on the links)."
    steps:
      - {interaction_id: aib-c-pat-cet1, branch: capital}
      - {interaction_id: aib-c-pat-dividends, branch: dividend}
      - {interaction_id: aib-c-cet1cap-ratio}
      - {interaction_id: aib-c-ratio-buybacks}
      - {interaction_id: aib-c-buyback-cet1}
      - {interaction_id: aib-c-dividends-cet1}
  - id: aib.path.capital_requirements
    name: "AIB capital requirement to buybacks"
    entity_id: aib_group
    trigger: "the CET1 requirement rises (Pillar 2, a buffer)"
    endpoint: aib_group.cet1_ratio
    description: "A higher requirement raises the floor under the management target and leaves less capital to return."
    steps:
      - {interaction_id: aib-c-req-buybacks}
      - {interaction_id: aib-c-buyback-cet1}
      - {interaction_id: aib-c-cet1cap-ratio}
  - id: aib.path.balance_sheet_growth
    name: "AIB loan growth to income and capital"
    entity_id: aib_group
    trigger: "the loan book grows"
    endpoint: aib_group.cet1_ratio
    description: "Loan growth earns interest at the loan yield, needs a day-one IFRS 9 allowance, and consumes RWA; earnings rebuild capital, RWA dilutes the ratio."
    steps:
      - {interaction_id: aib-c-loans-income, branch: income}
      - {interaction_id: aib-c-loans-rwa, branch: capital}
      - {interaction_id: aib-c-loans-allowance, branch: allowance}
      - {interaction_id: aib-a-ii-loan-interest-income}
      - {interaction_id: aib-a-nii-interest-income}
      - {interaction_id: aib-a-inc-net-interest-income}
      - {interaction_id: aib-a-pbt-total-operating-income}
      - {interaction_id: aib-a-becl-business-allowance-build}
      - {interaction_id: aib-a-ecl-business-ecl}
      - {interaction_id: aib-a-pbt-ecl-charge}
      - {interaction_id: aib-a-pat-profit-before-tax}
      - {interaction_id: aib-c-pat-cet1}
      - {interaction_id: aib-c-rwa-ratio}
      - {interaction_id: aib-c-cet1cap-ratio}
  - id: aib.path.state_selldown
    name: "AIB State sell-down to distributions and the share price"
    entity_id: aib_group
    trigger: "the Minister for Finance sells AIB shares"
    endpoint: aib_group.cet1_ratio
    active_when: "while the State holds AIB shares (aib_group.state_shareholding above zero); dormant once the sell-down is complete"
    description: "One sale, three parallel responses: the State's stake falls, a directed buyback (if used) consumes the bank's excess capital, and a placing weighs on the price briefly; a smaller stake removes the overhang. Once the stake is zero the path is dormant."
    steps:
      - {interaction_id: aib-c-statesales-stake, branch: stake}
      - {interaction_id: aib-c-statesales-buyback, branch: directed_buyback}
      - {interaction_id: aib-c-statesales-price, branch: placing}
      - {interaction_id: aib-c-stake-price}
      - {interaction_id: aib-c-buyback-cet1}
      - {interaction_id: aib-c-cet1cap-ratio}

compositions:
  - id: aib.comp.income_by_line
    entity_id: aib_group
    view: product
    basis: "total operating income by line: net interest income, net fees and commissions, other income (IFRS, EUR)"
    unit: €bn/yr
    period: fiscal year ending December
    total: aib_group.total_operating_income
    members: [aib_group.net_interest_income, aib_group.fee_income]
    residual: aib_group.other_income
    note: "The driven view: rates enter through NII, activity and markets through fees. Other income is the residual (trading, hedge ineffectiveness, disposal gains). Not the segment view (aib.comp.income_by_segment): never added to it."
  - id: aib.comp.income_by_segment
    entity_id: aib_group
    view: reporting_segments
    basis: "total operating income by reporting segment (IFRS, EUR)"
    unit: €bn/yr
    period: fiscal year ending December
    total: aib_group.total_operating_income
    members: [aib_group.retail_banking_income, aib_group.capital_markets_income, aib_group.aib_uk_income]
    residual: aib_group.group_segment_income
    drives: false
    note: "Reported view, reconciled but driven only through AIB UK (aib-c-boe-ukincome, uncalibrated): the euro rate, fee and cost drivers act on lines that cut across segments. Segment NII includes funds-transfer-pricing credits for deposits; Group is the residual and holds what is not allocated. No intersegment eliminations line is represented: internal charges net to zero inside the segments."
  - id: aib.comp.expenses
    entity_id: aib_group
    view: reporting_segments
    basis: "operating expenses by type (negative values)"
    unit: €bn/yr
    period: fiscal year ending December
    total: aib_group.operating_expenses
    members: [aib_group.staff_costs, aib_group.depreciation, aib_group.bank_levies]
    residual: aib_group.other_admin_expenses
    note: "Staff costs follow wage agreements; variable pay is restricted, so costs do not flex with income (little operating-leverage offset)."
  - id: aib.comp.ecl_by_portfolio
    entity_id: aib_group
    view: credit
    basis: "net credit impairment charge by portfolio (negative values)"
    unit: €bn/yr
    period: fiscal year ending December
    total: aib_group.ecl_charge
    members: [aib_group.mortgage_ecl, aib_group.personal_ecl, aib_group.property_ecl, aib_group.business_ecl]
    residual: aib_group.other_ecl
    note: "Mortgages are the largest book but a small charge in a rising housing market; property and business lending are smaller and lumpier."
  - id: aib.comp.mortgage_ecl
    entity_id: aib_group
    view: credit
    basis: "mortgage impairment: net write-offs plus allowance change (IFRS 9 roll-forward)"
    unit: €bn/yr
    period: fiscal year ending December
    total: aib_group.mortgage_ecl
    members: [aib_group.mortgage_write_offs, aib_group.mortgage_allowance_build]
    note: "An identity of the allowance roll-forward (other movements are negligible at this level). Write-offs follow realised losses, late; the allowance change follows the forward-looking scenarios and stage migration, early."
  - id: aib.comp.business_ecl
    entity_id: aib_group
    view: credit
    basis: "non-property business impairment: net write-offs plus allowance change (IFRS 9 roll-forward)"
    unit: €bn/yr
    period: fiscal year ending December
    total: aib_group.business_ecl
    members: [aib_group.business_write_offs, aib_group.business_allowance_build]
    note: "An identity of the allowance roll-forward."
  - id: aib.comp.pbt
    entity_id: aib_group
    view: reporting_segments
    basis: "profit before tax: total operating income less operating expenses less net credit impairment, plus exceptional and other items"
    unit: €bn/yr
    period: fiscal year ending December
    total: aib_group.profit_before_tax
    members: [aib_group.total_operating_income, aib_group.operating_expenses, aib_group.ecl_charge]
    residual: aib_group.exceptional_items
    note: "An identity: expenses and impairment are negative values. The residual holds exceptional items and associates, so underlying profit (before exceptional items) is the three members."
  - id: aib.comp.pbt_by_segment
    entity_id: aib_group
    view: reporting_segments
    basis: "profit before tax by reporting segment"
    unit: €bn/yr
    period: fiscal year ending December
    total: aib_group.profit_before_tax
    members: [aib_group.retail_banking_pbt, aib_group.capital_markets_pbt, aib_group.aib_uk_pbt]
    residual: aib_group.group_segment_pbt
    drives: false
    note: "Reported view, reconciled but undriven; never added to aib.comp.pbt. Group (residual) holds central costs and exceptional items."
  - id: aib.comp.profit_after_tax
    entity_id: aib_group
    view: reporting_segments
    basis: "profit after tax: profit before tax less income tax"
    unit: €bn/yr
    period: fiscal year ending December
    total: aib_group.profit_after_tax
    members: [aib_group.profit_before_tax, aib_group.income_tax]
    note: "An identity. The tax charge is below the trading rate times profit while deferred tax assets on past losses are used; AT1 coupons are a distribution below this line."
  - id: aib.comp.nii
    entity_id: aib_group
    view: investment_assets
    basis: "net interest income: interest income less interest expense (IFRS)"
    unit: €bn/yr
    period: fiscal year ending December
    total: aib_group.net_interest_income
    members: [aib_group.interest_income, aib_group.interest_expense]
    note: "An identity."
  - id: aib.comp.interest_income
    entity_id: aib_group
    view: investment_assets
    basis: "interest income by earning asset, incl. net interest on the structural hedge"
    unit: €bn/yr
    period: fiscal year ending December
    total: aib_group.interest_income
    members: [aib_group.loan_interest_income, aib_group.cash_interest_income, aib_group.securities_interest_income, aib_group.structural_hedge_income]
    residual: aib_group.other_interest_income
    note: "Balances and yields are operating states; income is balance times yield, which no fixed weight represents. The hedge line is net (fixed received less floating paid), so a lower policy rate raises it while it lowers cash and floating-loan income."
  - id: aib.comp.interest_expense
    entity_id: aib_group
    view: liabilities
    basis: "interest expense by funding source (negative values)"
    unit: €bn/yr
    period: fiscal year ending December
    total: aib_group.interest_expense
    members: [aib_group.deposit_interest_expense, aib_group.debt_interest_expense]
    residual: aib_group.other_interest_expense
    note: "Deposits reprice by the deposit beta with a lag; MREL and covered bonds are mostly swapped to floating, so they reprice with money-market rates."
  - id: aib.comp.loans_by_portfolio
    entity_id: aib_group
    view: investment_assets
    basis: "gross loans to customers by portfolio"
    unit: €bn
    total: aib_group.gross_loans
    members: [aib_group.mortgage_book, aib_group.personal_loans, aib_group.property_loans, aib_group.business_loans]
    residual: aib_group.other_loans
    note: "The asset portfolios that carry the yield and credit mechanisms; balances, not flows."
  - id: aib.comp.deposits
    entity_id: aib_group
    view: liabilities
    basis: "customer accounts: current accounts plus interest-bearing deposits"
    unit: €bn
    total: aib_group.customer_deposits
    members: [aib_group.current_accounts, aib_group.interest_bearing_deposits]
    note: "A two-way split of the deposit base by whether it pays a market-linked rate (an exact split by construction). The current-account share is what makes the bank rate-sensitive and what the structural hedge is sized against."
  - id: aib.comp.capital_roll_forward
    entity_id: aib_group
    view: capital
    basis: "CET1 capital roll-forward: profit in, distributions out, FVOCI marks (not an additive partition: flows into a stock)"
    unit: €bn
    total: aib_group.cet1_capital
    members: [aib_group.profit_after_tax, aib_group.ordinary_dividends, aib_group.buybacks, aib_group.fvoci_reserve]
    additive: false
    note: "Capital accumulates: next period's CET1 is this period's plus profit less dividends, buybacks and AT1 coupons, plus the change in the FVOCI reserve and in deductions. The method has no stock-flow link, so these are signed causal links (aib-c-pat-cet1, aib-c-dividends-cet1, aib-c-buyback-cet1, aib-c-fvoci-cet1)."

identities:
  - {id: aib.id.cash_income, entity_id: aib_group, form: product, target: aib_group.cash_interest_income, factors: [aib_group.cash_at_central_banks, aib_group.short_rate], coefficient: 0.01, unit_check: "€bn/yr = €bn x % x 0.01", basis: "interest on central bank placements = balance x the rate earned"}
  - {id: aib.id.hedge_spread, entity_id: aib_group, form: difference, target: aib_group.hedge_spread, minus: [aib_group.short_rate], of: aib_group.hedge_yield, unit_check: "pct = pct - pct", basis: "the hedge's net rate: fixed received less floating paid"}
  - {id: aib.id.hedge_income, entity_id: aib_group, form: product, target: aib_group.structural_hedge_income, factors: [aib_group.structural_hedge_notional, aib_group.hedge_spread], coefficient: 0.01, unit_check: "€bn/yr = €bn x % x 0.01", basis: "net hedge interest = notional x (fixed yield - floating rate); linearized at a positive spread"}
  - {id: aib.id.loan_income, entity_id: aib_group, form: product, target: aib_group.loan_interest_income, factors: [aib_group.gross_loans, aib_group.loan_yield], coefficient: 0.01, unit_check: "€bn/yr = €bn x % x 0.01"}
  - {id: aib.id.deposit_expense, entity_id: aib_group, form: product, target: aib_group.deposit_interest_expense, factors: [aib_group.interest_bearing_deposits, aib_group.deposit_cost], coefficient: -0.01, unit_check: "€bn/yr (negative) = -0.01 x €bn x %", basis: "a charge held negative: the coefficient carries the sign"}
  - {id: aib.id.securities_income, entity_id: aib_group, form: product, target: aib_group.securities_interest_income, factors: [aib_group.securities_portfolio, aib_group.securities_yield], coefficient: 0.01, unit_check: "€bn/yr = €bn x % x 0.01"}
  - {id: aib.id.new_lending, entity_id: aib_group, form: product, target: aib_group.new_mortgage_lending, factors: [ireland_economy.mortgage_drawdowns, aib_group.mortgage_market_share], coefficient: 0.01, unit_check: "€bn/yr = €bn/yr x % x 0.01"}
  - {id: aib.id.rwa, entity_id: aib_group, form: product, target: aib_group.rwa, factors: [aib_group.gross_loans, aib_group.rwa_density], coefficient: 0.01, unit_check: "€bn = €bn x % x 0.01", basis: "RWA = gross loans x RWA per euro of loans (all risk types, so non-loan RWA sits in the density)"}
  - {id: aib.id.cet1_ratio, entity_id: aib_group, form: ratio, target: aib_group.cet1_ratio, numerator: [aib_group.cet1_capital], denominator: [aib_group.rwa], coefficient: 100.0, unit_check: "pct = 100 x €bn / €bn"}
  - {id: aib.id.dividends, entity_id: aib_group, form: product, target: aib_group.ordinary_dividends, factors: [aib_group.profit_after_tax, aib_group.payout_ratio], coefficient: 0.01, unit_check: "€bn/yr = €bn/yr x % x 0.01"}

stock_flows:
  - {id: aib.sf.mortgage_book, entity_id: aib_group, stock: aib_group.mortgage_book, period_days: 365, inflows: [aib_group.new_mortgage_lending], outflows: [aib_group.mortgage_redemptions], basis: "mortgage book roll-forward: new lending in, redemptions and amortisation out (flows per year)"}
  - {id: aib.sf.cet1, entity_id: aib_group, stock: aib_group.cet1_capital, period_days: 365, inflows: [aib_group.profit_after_tax], outflows: [aib_group.ordinary_dividends, aib_group.buybacks], basis: "CET1 roll-forward: profit in, dividends and buybacks out (flows per year); FVOCI marks and deductions are outside it (the reserve is a level inside CET1, not a flow)"}
