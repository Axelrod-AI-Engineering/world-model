      sign: "-"
      actor: "home buyers; mortgage lenders"
      business_unit: "Irish mortgage market"
      geography: "Ireland"
      currency: "EUR"
      condition: "mortgage rates follow the ECB and swap rates; housing supply as it is"
      condition_observable: "monthly mortgage drawdowns"
