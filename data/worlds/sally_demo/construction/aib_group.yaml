      evidence: {existence: inferred, direction: inferred, magnitude: unknown, timing: inferred, sources: [aib.pub]}
      breaker: "Irish fiscal surpluses and multinational employment growth can offset it"
      next_state: "Irish domestic demand"
  - id: aib-c-loanyield-income
