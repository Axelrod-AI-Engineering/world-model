  - id: jpm-c-ratio-buybacks
    source: jpmorgan.cet1_ratio
    target: jpmorgan.buybacks
    label: excess capital funds buybacks
    calibration: uncalibrated
    state:
      threshold: {value: jpmorgan.cet1_ratio, above: 12.5}
    note: "state: buybacks respond only while the CET1 ratio is above the requirement plus a management buffer (synthetic level)"
    transition:
      mechanism: "Capital above the requirement plus the management buffer is returned through buybacks, after organic growth; the board sets the pace under its authorization"
      sign: "+"
      actor: board and management (capital allocation)
