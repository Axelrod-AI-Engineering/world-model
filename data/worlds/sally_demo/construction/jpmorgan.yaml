  - id: jpm-c-ni-dividends
    source: jpmorgan.net_income
    target: jpmorgan.common_dividends
    label: dividends follow earnings
    calibration: uncalibrated
    transition:
      mechanism: "The board sets a progressive dividend at a payout of earnings; higher sustained earnings support a higher dividend"
