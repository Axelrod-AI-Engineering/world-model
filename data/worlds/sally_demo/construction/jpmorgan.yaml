  - id: jpm-c-cet1cap-ratio
    source: jpmorgan.cet1_capital
    target: jpmorgan.cet1_ratio
    label: raises the CET1 ratio
    edge_type: identity
    identity: jpm.id.cet1_ratio
    transition:
      mechanism: "The CET1 ratio is CET1 capital over risk-weighted assets; more capital at the same RWA raises it (a ratio identity, linear only near current levels)"
      sign: "+"
