paths:
  - id: jpm.path.rates_nii
    name: JPMorgan policy rate to net interest income
    entity_id: jpmorgan
    trigger: "the Fed raises the policy rate"
    endpoint: jpmorgan.net_income
    description: "Parallel responses of one rate move: deposit costs follow by the beta (asymmetric, lagged) through interest-bearing balances (product and difference identities), cash at the Fed reprices one for one, balances migrate out of free funding, and Markets NII falls inside Markets revenue (excluded from NII ex Markets). m25 carries what the identities do not represent (floating loans, securities hedges, mix), sized jointly with the long end from the disclosed scenarios net of the represented channels."
    steps:
      - {interaction_id: jpm-c-fed-depcost, branch: beta}
      - {interaction_id: jpm-c-fed-nibshare, branch: migration}
      - {interaction_id: jpm-c-fed-deposits, branch: balances}
      - {interaction_id: jpm-c-fed-loanyield, branch: loans}
      - {interaction_id: jpm-c-fed-cashyield, branch: cash}
      - {interaction_id: jpm-c-fed-mktfunding, branch: markets}
      - {interaction_id: jpm-c-fed-mktnii, branch: markets_nii}
      - {interaction_id: m25, branch: unrepresented}
      - {interaction_id: jpm-c-depcost-expense}
      - {interaction_id: jpm.id.nib_deposits:jpmorgan.nib_deposit_share}
      - {interaction_id: jpm.id.nib_deposits:jpmorgan.avg_deposits}
      - {interaction_id: jpm.id.ib_deposits:jpmorgan.avg_deposits}
      - {interaction_id: jpm.id.ib_deposits:jpmorgan.nib_deposits}
      - {interaction_id: jpm.id.deposit_expense:jpmorgan.ib_deposits}
      - {interaction_id: jpm-c-deposits-cash}
      - {interaction_id: jpm-c-cash-income}
      - {interaction_id: jpm.id.cash_income:jpmorgan.cash_yield}
      - {interaction_id: jpm-c-loanyield-income}
      - {interaction_id: jpm-a-ie-deposit-interest-expense}
      - {interaction_id: jpm-a-ie-markets-funding-expense}
      - {interaction_id: jpm-a-ii-loan-interest-income}
      - {interaction_id: jpm-a-ii-cash-interest-income}
      - {interaction_id: jpm-a-nii-interest-income}
      - {interaction_id: jpm-a-nii-interest-expense}
      - {interaction_id: jpm.id.nii_ex_markets:jpmorgan.net_interest_income}
      - {interaction_id: jpm-a-rev-nii-ex-markets}
      - {interaction_id: jpm.id.nii_ex_markets:jpmorgan.markets_nii}
      - {interaction_id: jpm-a-pretax-net-revenue}
      - {interaction_id: jpm-a-ni-pretax-income}
  - id: jpm.path.securities_reinvestment
    name: JPMorgan securities reinvestment
    entity_id: jpmorgan
    trigger: "securities mature or pay down while new-purchase yields differ from the book yield"
    endpoint: jpmorgan.net_income
    description: "Existing securities -> cash released -> the Treasury's reinvestment decision -> book yield -> interest income -> NII -> net revenue -> earnings -> capital. Annual maturities and paydowns are disclosed; the ladder is not, so no new yield is applied to the whole book."
    steps:
      - {interaction_id: jpm-c-sec-cashflow}
      - {interaction_id: jpm-c-cashflow-purchases}
      - {interaction_id: jpm-c-purchases-secyield}
      - {interaction_id: jpm-c-secyield-income}
      - {interaction_id: jpm-a-ii-securities-interest-income}
      - {interaction_id: jpm-a-nii-interest-income}
      - {interaction_id: jpm.id.nii_ex_markets:jpmorgan.net_interest_income}
      - {interaction_id: jpm-a-rev-nii-ex-markets}
      - {interaction_id: jpm-a-pretax-net-revenue}
      - {interaction_id: jpm-a-ni-pretax-income}
      - {interaction_id: jpm-c-ni-cet1, branch: capital}
  - id: jpm.path.long_end
    name: JPMorgan long-end yields to NII, fees and capital
    entity_id: jpmorgan
    trigger: "long-end Treasury yields rise (a steeper curve)"
    endpoint: jpmorgan.cet1_ratio
    description: "One move, four parallel responses: new purchases earn more, mortgage prepayments slow (less cash to reinvest), AFS securities mark down into AOCI and CET1, and mortgage origination falls. jpm-c-ust10-nii (calibrated from the disclosed steeper-curve scenario) and s18 are the reduced forms on NII and the CET1 ratio; never added to these steps."
    steps:
      - {interaction_id: jpm-c-ust10-npy, branch: yield}
      - {interaction_id: jpm-c-ust10-prepay, branch: prepayments}
      - {interaction_id: jpm-c-ust10-aoci, branch: marks}
      - {interaction_id: jpm-c-ust10-mortgage, branch: mortgage}
      - {interaction_id: jpm-c-npy-secyield}
      - {interaction_id: jpm-c-cashflow-purchases}
      - {interaction_id: jpm-c-purchases-secyield}
      - {interaction_id: jpm-c-secyield-income}
      - {interaction_id: jpm-a-ii-securities-interest-income}
      - {interaction_id: jpm-a-nii-interest-income}
      - {interaction_id: jpm.id.nii_ex_markets:jpmorgan.net_interest_income}
      - {interaction_id: jpm-a-rev-nii-ex-markets}
      - {interaction_id: jpm-a-rev-mortgage-fees}
      - {interaction_id: jpm-a-pretax-net-revenue}
      - {interaction_id: jpm-a-ni-pretax-income}
      - {interaction_id: jpm-c-aoci-cet1}
      - {interaction_id: jpm-c-ni-cet1}
      - {interaction_id: jpm-c-cet1cap-ratio}
  - id: jpm.path.markets
    name: JPMorgan volatility to Markets revenue
    entity_id: jpmorgan
    trigger: "market volatility rises"
    endpoint: jpmorgan.net_income
    description: "Volatility lifts FICC and equities flow, but the same shock lowers equity levels (AUM fees), widens credit spreads (markdowns) and raises market-risk RWA; incentive pay takes a share of the revenue. s14 is the reduced form on Markets revenue and is never added to these steps."
    steps:
      - {interaction_id: jpm-c-vol-ficc, branch: ficc}
      - {interaction_id: jpm-c-vol-equities, branch: equities}
      - {interaction_id: jpm-c-vol-equityindex, branch: levels}
      - {interaction_id: jpm-c-vol-spread, branch: credit}
      - {interaction_id: jpm-c-vol-rwa, branch: rwa}
      - {interaction_id: jpm-a-mkts-fixed-income-markets}
      - {interaction_id: jpm-a-mkts-equity-markets}
      - {interaction_id: jpm-c-equity-eqmkts}
      - {interaction_id: jpm-c-equity-aum}
      - {interaction_id: jpm-c-aum-fees}
      - {interaction_id: jpm-c-spread-markdown}
      - {interaction_id: jpm-a-rev-markets-revenue}
      - {interaction_id: jpm-a-rev-asset-mgmt-fees}
      - {interaction_id: jpm-a-rev-other-revenue}
      - {interaction_id: jpm-c-markets-comp}
      - {interaction_id: jpm-a-exp-compensation-expense}
      - {interaction_id: jpm-a-pretax-net-revenue}
      - {interaction_id: jpm-a-pretax-noninterest-expense}
      - {interaction_id: jpm-a-ni-pretax-income}
      - {interaction_id: jpm-c-rwa-ratio}
  - id: jpm.path.deals_ib
    name: JPMorgan deal activity to investment banking fees
    entity_id: jpmorgan
    trigger: "deal and issuance activity rises"
    endpoint: jpmorgan.net_income
    description: "Fees are the market fee wallet times the bank's share of it; bankers' incentive pay takes a share. s12 is the mechanism itself (calibrated); no pipeline value is disclosed to stand between activity and fees."
    steps:
      - {interaction_id: s12}
      - {interaction_id: jpm-a-rev-ib-fees}
      - {interaction_id: jpm-c-ib-comp}
      - {interaction_id: jpm-a-exp-compensation-expense}
      - {interaction_id: jpm-a-pretax-net-revenue}
      - {interaction_id: jpm-a-pretax-noninterest-expense}
      - {interaction_id: jpm-a-ni-pretax-income}
  - id: jpm.path.card_credit
    name: JPMorgan consumer credit cycle (card)
    entity_id: jpmorgan
    trigger: "US growth slows and unemployment rises"
    endpoint: jpmorgan.net_income
    description: "Two clocks: CECL builds reserves in the quarter the unemployment outlook worsens; charge-offs follow delinquencies about two quarters later. Spending (card income) falls at the same time."
    steps:
      - {interaction_id: jpm-c-gdp-unemp}
      - {interaction_id: jpm-c-gdp-spend, branch: spend_growth}
      - {interaction_id: jpm-c-unemp-delinq, branch: losses}
      - {interaction_id: jpm-c-unemp-cardreserve, branch: reserve}
      - {interaction_id: jpm-c-unemp-spend, branch: spend}
      - {interaction_id: jpm-c-delinq-nco}
      - {interaction_id: jpm-c-ncorate-nco}
      - {interaction_id: jpm-a-cardprov-card-net-charge-offs}
      - {interaction_id: jpm-a-cardprov-card-reserve-build}
      - {interaction_id: jpm-c-spend-cardincome}
      - {interaction_id: jpm-a-rev-card-income}
      - {interaction_id: jpm-a-prov-card-provision}
      - {interaction_id: jpm-a-pretax-provision-for-credit-losses}
      - {interaction_id: jpm-a-pretax-net-revenue}
      - {interaction_id: jpm-a-ni-pretax-income}
  - id: jpm.path.card_growth
    name: JPMorgan card growth and its reserve cost
    entity_id: jpmorgan
    trigger: "consumer card spending grows"
    endpoint: jpmorgan.pretax_income
    description: "Growth pays twice and costs twice: net interchange and balance NII rise, but new balances need a day-one CECL reserve and charge off more dollars as they season."
    steps:
      - {interaction_id: jpm-c-spend-cardincome, branch: fees}
      - {interaction_id: jpm-c-spend-cardloans, branch: balances}
      - {interaction_id: jpm-a-loans-card-loans, branch: nii}
      - {interaction_id: jpm-c-cardloans-reserve, branch: reserve}
      - {interaction_id: jpm-c-cardloans-nco, branch: losses}
      - {interaction_id: jpm-c-loans-income}
      - {interaction_id: jpm-a-rev-card-income}
      - {interaction_id: jpm-a-ii-loan-interest-income}
      - {interaction_id: jpm-a-nii-interest-income}
      - {interaction_id: jpm.id.nii_ex_markets:jpmorgan.net_interest_income}
      - {interaction_id: jpm-a-rev-nii-ex-markets}
      - {interaction_id: jpm-a-cardprov-card-reserve-build}
      - {interaction_id: jpm-a-cardprov-card-net-charge-offs}
      - {interaction_id: jpm-a-prov-card-provision}
      - {interaction_id: jpm-a-pretax-net-revenue}
      - {interaction_id: jpm-a-pretax-provision-for-credit-losses}
  - id: jpm.path.wholesale_credit
    name: JPMorgan wholesale credit cycle
    entity_id: jpmorgan
    trigger: "corporate credit spreads widen"
    endpoint: jpmorgan.net_income
    description: "Spreads widen: reserves build first, charge-offs follow, held-for-sale loans mark down, and issuance and sponsor deals dry up (IB fees)."
    steps:
      - {interaction_id: jpm-c-spread-wnco, branch: losses}
      - {interaction_id: jpm-c-spread-wreserve, branch: reserve}
      - {interaction_id: jpm-c-spread-markdown, branch: markdowns}
      - {interaction_id: jpm-c-spread-deals, branch: deals}
      - {interaction_id: jpm-c-wncorate-nco}
      - {interaction_id: jpm-a-wprov-wholesale-net-charge-offs}
      - {interaction_id: jpm-a-wprov-wholesale-reserve-build}
      - {interaction_id: jpm-a-prov-wholesale-provision}
      - {interaction_id: s12}
      - {interaction_id: jpm-a-rev-ib-fees}
      - {interaction_id: jpm-a-rev-other-revenue}
      - {interaction_id: jpm-a-pretax-provision-for-credit-losses}
      - {interaction_id: jpm-a-pretax-net-revenue}
      - {interaction_id: jpm-a-ni-pretax-income}
  - id: jpm.path.asset_management
    name: JPMorgan market levels to asset management fees
    entity_id: jpmorgan
    trigger: "US equity markets rise"
    endpoint: jpmorgan.net_income
    description: "Market levels revalue AUM (fees on average AUM) and lift prime balances in Equity Markets; advisor pay takes a share."
    steps:
      - {interaction_id: jpm-c-equity-aum, branch: aum}
      - {interaction_id: jpm-c-equity-eqmkts, branch: prime}
      - {interaction_id: jpm-c-aum-fees}
      - {interaction_id: jpm-a-rev-asset-mgmt-fees}
      - {interaction_id: jpm-c-amfees-comp}
      - {interaction_id: jpm-a-mkts-equity-markets}
      - {interaction_id: jpm-a-rev-markets-revenue}
      - {interaction_id: jpm-a-exp-compensation-expense}
      - {interaction_id: jpm-a-pretax-net-revenue}
      - {interaction_id: jpm-a-pretax-noninterest-expense}
      - {interaction_id: jpm-a-ni-pretax-income}
  - id: jpm.path.capital_payout
    name: JPMorgan capital and payout
    entity_id: jpmorgan
    trigger: "earnings are retained"
    endpoint: jpmorgan.buybacks
    description: "Earnings add to CET1; dividends follow earnings; capital above the requirement and buffer funds buybacks, which use capital in turn (a feedback loop)."
    steps:
      - {interaction_id: jpm-c-ni-cet1, branch: capital}
      - {interaction_id: jpm-c-ni-dividends, branch: dividend}
      - {interaction_id: jpm-c-cet1cap-ratio}
      - {interaction_id: jpm-c-ratio-buybacks}
      - {interaction_id: jpm-c-buyback-cet1}
      - {interaction_id: jpm-c-dividends-cet1}
  - id: jpm.path.capital_requirements
    name: JPMorgan capital requirements
    entity_id: jpmorgan
    trigger: "the CET1 requirement rises (stress capital buffer, G-SIB surcharge, a capital rule)"
    endpoint: jpmorgan.buybacks
    description: "A higher floor shrinks the excess; buybacks slow and capital is retained."
    steps:
      - {interaction_id: jpm-c-req-buybacks}
      - {interaction_id: jpm-c-buyback-cet1}
      - {interaction_id: jpm-c-cet1cap-ratio}
  - id: jpm.path.balance_sheet_growth
    name: JPMorgan loan growth, NII and capital
    entity_id: jpmorgan
    trigger: "wholesale loans grow"
    endpoint: jpmorgan.cet1_ratio
    description: "Counter-paths: wholesale loan growth adds NII (loans times yield) but needs a day-one reserve, charges off more dollars, and consumes RWA, so it competes with buybacks for capital."
    steps:
      - {interaction_id: jpm-a-loans-wholesale-loans, branch: balances}
      - {interaction_id: jpm-c-loans-wreserve, branch: reserve}
      - {interaction_id: "jpm.id.wholesale_nco:jpmorgan.wholesale_loans", branch: losses}
      - {interaction_id: jpm-c-loans-income, branch: nii}
      - {interaction_id: jpm-c-loans-rwa, branch: rwa}
      - {interaction_id: jpm-a-ii-loan-interest-income}
      - {interaction_id: jpm-a-nii-interest-income}
      - {interaction_id: jpm.id.nii_ex_markets:jpmorgan.net_interest_income}
      - {interaction_id: jpm-a-rev-nii-ex-markets}
      - {interaction_id: jpm-a-wprov-wholesale-reserve-build}
      - {interaction_id: jpm-a-wprov-wholesale-net-charge-offs}
      - {interaction_id: jpm-a-prov-wholesale-provision}
      - {interaction_id: jpm-a-pretax-net-revenue}
      - {interaction_id: jpm-a-pretax-provision-for-credit-losses}
      - {interaction_id: jpm-a-ni-pretax-income}
      - {interaction_id: jpm-c-ni-cet1}
      - {interaction_id: jpm-c-rwa-ratio}
      - {interaction_id: jpm-c-cet1cap-ratio}
  - id: jpm.path.expense_inflation
    name: JPMorgan expense inflation and operating leverage
    entity_id: jpmorgan
    trigger: "wage and price inflation"
    endpoint: jpmorgan.net_income
    description: "Operating leverage is revenue growth less expense growth: fixed pay and vendor costs rise with inflation, revenue-linked pay with revenue (Markets, IB and AWM paths)."
    steps:
      - {interaction_id: jpm-c-cpi-comp, branch: wages}
      - {interaction_id: jpm-c-cpi-other, branch: vendors}
      - {interaction_id: jpm-a-exp-compensation-expense}
      - {interaction_id: jpm-a-exp-other-expense}
      - {interaction_id: jpm-a-pretax-noninterest-expense}
      - {interaction_id: jpm-a-ni-pretax-income}

compositions:
  - id: jpm.comp.revenue_by_line
    entity_id: jpmorgan
    view: product
    basis: "managed net revenue by line: NII ex Markets, CIB Markets revenue (incl. Markets NII) and the fee lines"
    unit: $bn/yr
    period: fiscal year ending December
    total: jpmorgan.net_revenue
    members: [jpmorgan.nii_ex_markets, jpmorgan.markets_revenue, jpmorgan.ib_fees, jpmorgan.asset_mgmt_fees, jpmorgan.card_income, jpmorgan.lending_deposit_fees, jpmorgan.mortgage_fees]
    residual: jpmorgan.other_revenue
    note: "The driving view of net revenue: rates enter through NII ex Markets (firmwide NII less Markets NII, a difference identity), volatility through Markets, deals through IB fees; Markets NII is counted once, inside Markets revenue. The segment view is the matrix's reconciling columns (jpm.mx.revenue)."
  - id: jpm.comp.revenue_by_segment
    entity_id: jpmorgan
    view: reporting_segments
    basis: "managed net revenue by reporting segment"
    unit: $bn/yr
    period: fiscal year ending December
    total: jpmorgan.net_revenue
    members: [jpmorgan.ccb_revenue, jpmorgan.cib_revenue, jpmorgan.awm_revenue]
    residual: jpmorgan.corporate_revenue
    drives: false
    note: "Reconciling (the columns of jpm.mx.revenue): reported and checked against the total, never driving it. No intersegment eliminations line is reported; Corporate is the residual."
  - id: jpm.comp.ccb_lines
    entity_id: jpmorgan
    view: reporting_segments
    basis: "CCB net revenue by line of business, managed"
    unit: $bn/yr
    period: fiscal year ending December
    total: jpmorgan.ccb_revenue
    members: [jpmorgan.ccb_banking_wealth, jpmorgan.ccb_home_lending, jpmorgan.ccb_card_auto]
    note: "An exact split as reported: no residual."
  - id: jpm.comp.cib_businesses
    entity_id: jpmorgan
    view: reporting_segments
    basis: "CIB net revenue by business, managed"
    unit: $bn/yr
    period: fiscal year ending December
    total: jpmorgan.cib_revenue
    members: [jpmorgan.cib_banking_payments, jpmorgan.cib_securities_services]
    residual: jpmorgan.cib_markets_adjustments
    note: "Markets revenue is held in the line view; the residual here is Markets plus credit adjustments, bridged by jpm-c-bridge-markets-cib (no size)."
  - id: jpm.comp.markets
    entity_id: jpmorgan
    view: product
    basis: "CIB Markets revenue by product, managed (incl. Markets NII)"
    unit: $bn/yr
    period: fiscal year ending December
    total: jpmorgan.markets_revenue
    members: [jpmorgan.fixed_income_markets, jpmorgan.equity_markets]
    note: "An exact split as reported: no residual."
  - id: jpm.comp.awm_businesses
    entity_id: jpmorgan
    view: reporting_segments
    basis: "AWM net revenue by business, managed"
    unit: $bn/yr
    period: fiscal year ending December
    total: jpmorgan.awm_revenue
    members: [jpmorgan.awm_asset_management, jpmorgan.awm_private_bank]
    note: "An exact split as reported: no residual."
  - id: jpm.comp.pretax
    entity_id: jpmorgan
    view: reporting_segments
    basis: "managed pretax income: net revenue less noninterest expense less provision for credit losses"
    unit: $bn/yr
    period: fiscal year ending December
    total: jpmorgan.pretax_income
    members: [jpmorgan.net_revenue, jpmorgan.noninterest_expense, jpmorgan.provision_for_credit_losses]
    note: "An identity: expense and provision are negative values."
  - id: jpm.comp.net_income
    entity_id: jpmorgan
    view: reporting_segments
    basis: "net income: managed pretax income less managed income tax"
    unit: $bn/yr
    period: fiscal year ending December
    total: jpmorgan.net_income
    members: [jpmorgan.pretax_income, jpmorgan.income_tax]
    note: "The driving view of net income. An identity; the FTE adjustment cancels between managed revenue and managed tax."
  - id: jpm.comp.net_income_by_segment
    entity_id: jpmorgan
    view: reporting_segments
    basis: "net income by reporting segment"
    unit: $bn/yr
    period: fiscal year ending December
    total: jpmorgan.net_income
    members: [jpmorgan.ccb_net_income, jpmorgan.cib_net_income, jpmorgan.awm_net_income]
    residual: jpmorgan.corporate_net_income
    drives: false
    note: "Reconciling: reported and checked against the total, never driving it (jpm.comp.net_income drives)."
  - id: jpm.comp.expense
    entity_id: jpmorgan
    view: reporting_segments
    basis: "noninterest expense by type (negative values)"
    unit: $bn/yr
    period: fiscal year ending December
    total: jpmorgan.noninterest_expense
    members: [jpmorgan.compensation_expense, jpmorgan.technology_expense, jpmorgan.marketing_expense]
    residual: jpmorgan.other_expense
    note: "Operating leverage is revenue growth less expense growth: revenue-linked compensation is the variable part."
  - id: jpm.comp.credit_costs
    entity_id: jpmorgan
    view: credit
    basis: "provision for credit losses by portfolio (negative values)"
    unit: $bn/yr
    period: fiscal year ending December
    total: jpmorgan.provision_for_credit_losses
    members: [jpmorgan.card_provision, jpmorgan.consumer_ex_card_provision, jpmorgan.wholesale_provision]
    residual: jpmorgan.commitments_other_provision
    note: "Card is most of the provision; wholesale is small but lumpy."
  - id: jpm.comp.card_provision
    entity_id: jpmorgan
    view: credit
    basis: "card provision: net charge-offs plus reserve build (allowance roll-forward)"
    unit: $bn/yr
    period: fiscal year ending December
    total: jpmorgan.card_provision
    members: [jpmorgan.card_net_charge_offs, jpmorgan.card_reserve_build]
    note: "Charge-offs are loans times the loss rate (jpm.id.card_nco); the reserve build follows the CECL outlook and growth."
  - id: jpm.comp.wholesale_provision
    entity_id: jpmorgan
    view: credit
    basis: "wholesale loan provision: net charge-offs plus reserve build"
    unit: $bn/yr
    period: fiscal year ending December
    total: jpmorgan.wholesale_provision
    members: [jpmorgan.wholesale_net_charge_offs, jpmorgan.wholesale_reserve_build]
    note: "An identity of the allowance roll-forward."
  - id: jpm.comp.nii_balance_sheet
    entity_id: jpmorgan
    view: investment_assets
    basis: "firmwide NII, managed: interest income less interest expense"
    unit: $bn/yr
    period: fiscal year ending December
    total: jpmorgan.net_interest_income
    members: [jpmorgan.interest_income, jpmorgan.interest_expense]
    note: "An identity. Each line below is a balance times a rate (product identities)."
  - id: jpm.comp.interest_income
    entity_id: jpmorgan
    view: investment_assets
    basis: "interest income by earning asset, managed (FTE)"
    unit: $bn/yr
    period: fiscal year ending December
    total: jpmorgan.interest_income
    members: [jpmorgan.loan_interest_income, jpmorgan.securities_interest_income, jpmorgan.cash_interest_income, jpmorgan.markets_interest_income]
    residual: jpmorgan.other_interest_income
    note: "Loans, securities and cash are balance times yield (jpm.id.loan_income, jpm.id.securities_income, jpm.id.cash_income)."
  - id: jpm.comp.interest_expense
    entity_id: jpmorgan
    view: liabilities
    basis: "interest expense by funding source (negative values)"
    unit: $bn/yr
    period: fiscal year ending December
    total: jpmorgan.interest_expense
    members: [jpmorgan.deposit_interest_expense, jpmorgan.markets_funding_expense, jpmorgan.long_term_debt_expense]
    residual: jpmorgan.other_funding_expense
    note: "Deposits are interest-bearing balances times the deposit cost (jpm.id.deposit_expense); Markets funding has no balance in the model."
  - id: jpm.comp.loans
    entity_id: jpmorgan
    view: operating_state
    basis: "average loans by portfolio"
    unit: $bn
    period: fiscal year ending December
    total: jpmorgan.avg_loans
    members: [jpmorgan.card_loans, jpmorgan.wholesale_loans]
    residual: jpmorgan.consumer_ex_card_loans
    note: "Card balances earn the card yield inside the loan yield; their own yield is not split out."

identities:
  - {entity_id: jpmorgan, id: jpm.id.nib_deposits, form: product, target: jpmorgan.nib_deposits, factors: [jpmorgan.avg_deposits, jpmorgan.nib_deposit_share], coefficient: 0.01, unit_check: "$bn = $bn x % x 0.01"}
  - {entity_id: jpmorgan, id: jpm.id.ib_deposits, form: difference, target: jpmorgan.ib_deposits, of: jpmorgan.avg_deposits, minus: [jpmorgan.nib_deposits]}
  - {entity_id: jpmorgan, id: jpm.id.deposit_expense, form: product, target: jpmorgan.deposit_interest_expense, factors: [jpmorgan.ib_deposits, jpmorgan.ib_deposit_cost], coefficient: -0.01, unit_check: "$bn/yr (negative) = -($bn x %/yr x 0.01)"}
  - {entity_id: jpmorgan, id: jpm.id.cash_income, form: product, target: jpmorgan.cash_interest_income, factors: [jpmorgan.cash_balances, jpmorgan.cash_yield], coefficient: 0.01, unit_check: "$bn/yr = $bn x %/yr x 0.01"}
  - {entity_id: jpmorgan, id: jpm.id.loan_income, form: product, target: jpmorgan.loan_interest_income, factors: [jpmorgan.avg_loans, jpmorgan.loan_yield], coefficient: 0.01, unit_check: "$bn/yr = $bn x %/yr x 0.01"}
  - {entity_id: jpmorgan, id: jpm.id.securities_income, form: product, target: jpmorgan.securities_interest_income, factors: [jpmorgan.securities_portfolio, jpmorgan.securities_yield], coefficient: 0.01, unit_check: "$bn/yr = $bn x %/yr x 0.01"}
  - {entity_id: jpmorgan, id: jpm.id.card_nco, form: product, target: jpmorgan.card_net_charge_offs, factors: [jpmorgan.card_loans, jpmorgan.card_nco_rate], coefficient: -0.01, unit_check: "$bn/yr (negative) = -($bn x %/yr x 0.01)"}
  - {entity_id: jpmorgan, id: jpm.id.wholesale_nco, form: product, target: jpmorgan.wholesale_net_charge_offs, factors: [jpmorgan.wholesale_loans, jpmorgan.wholesale_nco_rate], coefficient: -0.01, unit_check: "$bn/yr (negative) = -($bn x %/yr x 0.01)"}
  - {entity_id: jpmorgan, id: jpm.id.am_fees, form: product, target: jpmorgan.asset_mgmt_fees, factors: [jpmorgan.aum, jpmorgan.am_fee_rate], coefficient: 0.01, unit_check: "$bn/yr = $bn x %/yr x 0.01"}
  - {entity_id: jpmorgan, id: jpm.id.card_income, form: product, target: jpmorgan.card_income, factors: [jpmorgan.card_sales_volume, jpmorgan.card_income_rate], coefficient: 0.01, unit_check: "$bn/yr = $bn/yr x % x 0.01"}
  - {entity_id: jpmorgan, id: jpm.id.cet1_ratio, form: ratio, target: jpmorgan.cet1_ratio, numerator: [jpmorgan.cet1_capital], denominator: [jpmorgan.rwa], coefficient: 100.0, unit_check: "% = $bn / $bn x 100"}
  - {entity_id: jpmorgan, id: jpm.id.nii_ex_markets, form: difference, target: jpmorgan.nii_ex_markets, of: jpmorgan.net_interest_income, minus: [jpmorgan.markets_nii]}

stock_flows:
  - {id: jpm.sf.cet1, entity_id: jpmorgan, stock: jpmorgan.cet1_capital, period_days: 365, inflows: [jpmorgan.net_income],
     outflows: [jpmorgan.common_dividends, jpmorgan.buybacks],
     basis: "CET1 capital roll-forward: retained net income in, common dividends and buybacks out (annual flows); AOCI marks and other items enter through jpm-c-aoci-cet1 as a signed link"}

matrices:
  - id: jpm.mx.revenue
    entity_id: jpmorgan
    rows: jpm.comp.revenue_by_line
    columns: jpm.comp.revenue_by_segment
    note: "Managed net revenue as lines x segments. The lines drive (rates, volatility and deals act on lines that cut across segments); the segments reconcile. Cells are not built: the segment split of each line is disclosed only for NII and noninterest revenue in total, not for the line view's lines."
