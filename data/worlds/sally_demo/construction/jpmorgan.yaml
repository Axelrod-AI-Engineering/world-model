    target: jpmorgan.cet1_capital
    label: retained earnings add to CET1
    edge_type: stock_flow
    identity: jpm.sf.cet1
    transition:
      mechanism: "Net income adds to retained earnings and so to CET1 capital (a flow into a stock: next period's capital is this period's plus earnings less distributions)"
      sign: "+"
      actor: group
      business_unit: group capital
      condition: "accumulation over the period; preferred dividends come out first"
      condition_observable: "CET1 capital roll-forward"
      timing: {onset: quarter end, build: cumulative, persistence: permanent, recognition: quarterly capital reporting}
      evidence: {existence: documented, direction: documented, magnitude: model, timing: documented, sources: [jpm.wb, jpm.pub]}
      breaker: "distributions above earnings"
      next_state: CET1 capital
  - id: jpm-c-buyback-cet1
