# JPMorgan Chase: business construction (Oct 18). Values added to the jpmorgan entity (and three credit-cycle and
# market values on us_economy and us_capital_markets), links with their transitions, named paths, and compositions
# (model/construction.py). Structure and generic banking mechanisms only: priors are synthetic, round,
# order-of-magnitude levels marked as such; dated client levels, citations and source bindings stay local
# (data/sally_data/construction/jpmorgan/). Source ids in evidence.sources: jpm.wb (sell-side company model workbook:
# history, the analyst's forecast and a guidance tab), jpm.co (company disclosures as cited in the broker notes, not
# read directly), jpm.r1 to jpm.r11 (broker notes), jpm.x1 (expert call on card losses and payments), jpm.macro (rates
# strategy and Fed notes), jpm.peer (peer bank dashboard), jpm.pub (public business and accounting knowledge).
#
# Bases (features.basis): "managed" is the company's managed basis (fully taxable-equivalent; the reporting segments
# add to it); "line" is the income-statement line, firmwide; "segment" is a reporting segment's managed result.
# Costs and charges are held as negative values, so every part adds to its total with a positive weight.
# Accounting weights are scale_part / scale_total in native sd (log sd times level for a lognormal value).

subentities:
  # --- the credit cycle and market levels the bank's paths need (no such value existed in sally_demo) ---------------
  - {entity: us_economy, id: us_economy.unemployment_rate, name: US unemployment rate,
     attribute_kind: rate, unit: pct, family: gaussian, prior: {family: gaussian, mu: 4.2, sigma: 0.3}, scale: 0.3,
     aliases: [unemployment, jobless rate, u-rate],
     features: {view: operating_state, basis: "civilian unemployment rate, monthly", prior: synthetic}}
  - {entity: us_capital_markets, id: us_capital_markets.credit_spread, name: US high-yield credit spread,
     attribute_kind: rate, unit: bp, family: gaussian, prior: {family: gaussian, mu: 320.0, sigma: 60.0}, scale: 60.0,
     aliases: [credit spreads, high-yield spread, HY spread],
     features: {view: operating_state, basis: "option-adjusted spread of US high-yield corporate bonds over Treasuries", prior: synthetic}}
  - {entity: us_capital_markets, id: us_capital_markets.equity_index, name: US equity market level,
     attribute_kind: asset_price, unit: index, family: lognormal, mean: 6500.0, scale: 0.08,
     aliases: [S&P 500, US stocks, US equities],
     features: {view: operating_state, basis: "broad US equity index level", prior: synthetic}}

  # --- managed revenue by line (the driven view) and the group P&L ----------------------------------------------------
  - {entity: jpmorgan, id: jpmorgan.net_revenue, name: JPMorgan net revenue (managed),
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 188.0, scale: 0.04,
     features: {view: reporting_segments, basis: "managed: total net revenue, fully taxable-equivalent; the reporting segments add to it", metric: managed_net_revenue, prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.markets_nii, name: JPMorgan Markets net interest income,
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 8.0, scale: 0.2,
     features: {view: product, basis: "managed: CIB Markets net interest income (inside firmwide NII and inside Markets revenue)", metric: markets_nii, prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.nii_ex_markets, name: JPMorgan NII ex Markets,
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 94.0, scale: 0.055,
     features: {view: product, basis: "managed: firmwide NII less CIB Markets NII (the company's guided measure; a difference identity)", metric: nii_ex_markets, prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.asset_mgmt_fees, name: JPMorgan asset management fees,
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 30.0, scale: 0.06,
     features: {view: product, basis: "line: asset management, administration and commissions (average AUM times the implied fee rate)", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.card_income, name: JPMorgan card income,
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 5.0, scale: 0.15,
     features: {view: product, basis: "line: card income, net of rewards costs and partner payments", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.lending_deposit_fees, name: JPMorgan lending and deposit fees,
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 10.0, scale: 0.06,
     features: {view: product, basis: "line: lending- and deposit-related fees", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.mortgage_fees, name: JPMorgan mortgage fees,
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 1.5, scale: 0.15,
     features: {view: product, basis: "line: mortgage fees and related income (production and net servicing)", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.other_revenue, name: JPMorgan other revenue,
     attribute_kind: revenue_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: 6.0, sigma: 2.0}, scale: 2.0,
     features: {view: product, basis: "residual: other income, securities gains and FTE on noninterest revenue, less Markets revenue booked in the fee lines (commissions)", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.noninterest_expense, name: JPMorgan noninterest expense,
     attribute_kind: revenue_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: -96.0, sigma: 3.0}, scale: 3.0,
     features: {view: reporting_segments, basis: "line: total noninterest expense (a charge, negative)", metric: noninterest_expense, prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.provision_for_credit_losses, name: JPMorgan provision for credit losses,
     attribute_kind: revenue_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: -12.0, sigma: 2.0}, scale: 2.0,
     features: {view: credit, basis: "line: provision for credit losses: loans, lending-related commitments and securities (a charge, negative)", metric: provision_for_credit_losses, prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.pretax_income, name: JPMorgan pretax income (managed),
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 80.0, scale: 0.08,
     features: {view: reporting_segments, basis: "managed: income before income tax expense", metric: managed_pretax_income, prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.income_tax, name: JPMorgan income tax (managed),
     attribute_kind: revenue_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: -20.0, sigma: 1.6}, scale: 1.6,
     features: {view: reporting_segments, basis: "managed: income tax expense including the FTE adjustment (negative)", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.net_income, name: JPMorgan net income,
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 60.0, scale: 0.07,
     features: {view: reporting_segments, basis: "US GAAP net income (managed and reported agree at net income)", metric: net_income, prior: synthetic}}

  # --- reporting segments (managed) ------------------------------------------------------------------------------------
  - {entity: jpmorgan, id: jpmorgan.ccb_revenue, name: JPMorgan Consumer & Community Banking revenue,
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 78.0, scale: 0.04,
     features: {view: reporting_segments, basis: "segment: CCB total net revenue, managed", metric: ccb_net_revenue, prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.cib_revenue, name: JPMorgan Commercial & Investment Bank revenue,
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 80.0, scale: 0.06,
     features: {view: reporting_segments, basis: "segment: CIB total net revenue, managed", metric: cib_net_revenue, prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.awm_revenue, name: JPMorgan Asset & Wealth Management revenue,
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 25.0, scale: 0.06,
     features: {view: reporting_segments, basis: "segment: AWM total net revenue, managed", metric: awm_net_revenue, prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.corporate_revenue, name: JPMorgan Corporate revenue,
     attribute_kind: revenue_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: 5.0, sigma: 3.0}, scale: 3.0,
     features: {view: reporting_segments, basis: "segment residual: Corporate (Treasury and CIO, other corporate items; no separate intersegment eliminations line is reported)", metric: corporate_net_revenue, prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.ccb_banking_wealth, name: JPMorgan CCB Banking & Wealth Management revenue,
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 44.0, scale: 0.04,
     features: {view: reporting_segments, basis: "segment line of business: consumer and business banking, branch wealth (mostly deposit margin)", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.ccb_home_lending, name: JPMorgan CCB Home Lending revenue,
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 5.0, scale: 0.1,
     features: {view: reporting_segments, basis: "segment line of business: mortgage production, servicing and portfolio NII", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.ccb_card_auto, name: JPMorgan CCB Card Services & Auto revenue,
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 29.0, scale: 0.05,
     features: {view: reporting_segments, basis: "segment line of business: card (NII on revolving balances plus net card income), merchant services, auto loans and leases", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.cib_banking_payments, name: JPMorgan CIB Banking & Payments revenue,
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 37.0, scale: 0.05,
     features: {view: reporting_segments, basis: "segment business: investment banking, payments, lending, commercial banking", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.cib_securities_services, name: JPMorgan CIB Securities Services revenue,
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 5.5, scale: 0.06,
     features: {view: reporting_segments, basis: "segment business: custody and fund services (assets under custody)", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.cib_markets_adjustments, name: JPMorgan CIB Markets and credit adjustments,
     attribute_kind: revenue_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: 37.5, sigma: 3.0}, scale: 3.0,
     features: {view: reporting_segments, basis: "segment residual: Fixed Income and Equity Markets plus credit adjustments and other; Markets revenue itself is held in the line view (jpmorgan.markets_revenue)", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.fixed_income_markets, name: JPMorgan Fixed Income Markets revenue,
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 21.0, scale: 0.07,
     features: {view: product, basis: "segment product: FICC (rates, credit, FX, commodities, securitized products), managed incl. Markets NII", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.equity_markets, name: JPMorgan Equity Markets revenue,
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 11.0, scale: 0.1,
     features: {view: product, basis: "segment product: cash equities, derivatives, prime brokerage, managed incl. Markets NII", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.awm_asset_management, name: JPMorgan AWM Asset Management revenue,
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 12.0, scale: 0.07,
     features: {view: reporting_segments, basis: "segment business: institutional and retail asset management", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.awm_private_bank, name: JPMorgan AWM Global Private Bank revenue,
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 13.0, scale: 0.06,
     features: {view: reporting_segments, basis: "segment business: private banking (fees, deposit and lending NII)", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.ccb_net_income, name: JPMorgan CCB net income,
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 19.0, scale: 0.07,
     features: {view: reporting_segments, basis: "segment: CCB net income", metric: ccb_net_income, prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.cib_net_income, name: JPMorgan CIB net income,
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 28.0, scale: 0.08,
     features: {view: reporting_segments, basis: "segment: CIB net income", metric: cib_net_income, prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.awm_net_income, name: JPMorgan AWM net income,
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 7.0, scale: 0.08,
     features: {view: reporting_segments, basis: "segment: AWM net income", metric: awm_net_income, prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.corporate_net_income, name: JPMorgan Corporate net income,
     attribute_kind: revenue_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: 6.0, sigma: 2.0}, scale: 2.0,
     features: {view: reporting_segments, basis: "segment residual: Corporate net income", metric: corporate_net_income, prior: synthetic}}

  # --- expenses (charges, negative) -------------------------------------------------------------------------------------
  - {entity: jpmorgan, id: jpmorgan.compensation_expense, name: JPMorgan compensation expense,
     attribute_kind: revenue_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: -58.0, sigma: 2.0}, scale: 2.0,
     features: {view: reporting_segments, basis: "line: compensation expense, incl. revenue-linked incentive accruals (negative)", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.technology_expense, name: JPMorgan technology expense,
     attribute_kind: revenue_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: -12.0, sigma: 0.8}, scale: 0.8,
     features: {view: reporting_segments, basis: "line: technology, communications and equipment (negative)", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.marketing_expense, name: JPMorgan marketing expense,
     attribute_kind: revenue_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: -7.0, sigma: 0.6}, scale: 0.6,
     features: {view: reporting_segments, basis: "line: marketing, mostly card acquisition (negative)", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.other_expense, name: JPMorgan other noninterest expense,
     attribute_kind: revenue_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: -19.0, sigma: 1.5}, scale: 1.5,
     features: {view: reporting_segments, basis: "residual: occupancy, professional and outside services, legal, FDIC and other (negative)", prior: synthetic}}

  # --- credit costs by portfolio (charges, negative) and their operating states ------------------------------------------
  - {entity: jpmorgan, id: jpmorgan.card_provision, name: JPMorgan card provision,
     attribute_kind: revenue_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: -9.0, sigma: 1.2}, scale: 1.2,
     features: {view: credit, basis: "provision for loan losses, credit card portfolio (negative)", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.consumer_ex_card_provision, name: JPMorgan consumer ex-card provision,
     attribute_kind: revenue_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: -0.8, sigma: 0.3}, scale: 0.3,
     features: {view: credit, basis: "provision for loan losses, consumer excluding card: residential real estate, auto and other (negative)", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.wholesale_provision, name: JPMorgan wholesale loan provision,
     attribute_kind: revenue_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: -2.0, sigma: 1.0}, scale: 1.0,
     features: {view: credit, basis: "provision for loan losses, wholesale portfolio (negative)", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.commitments_other_provision, name: JPMorgan lending-commitment and securities provision,
     attribute_kind: revenue_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: -0.2, sigma: 0.5}, scale: 0.5,
     features: {view: credit, basis: "residual: provision for lending-related commitments (mostly wholesale) and investment securities (negative)", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.card_net_charge_offs, name: JPMorgan card net charge-offs,
     attribute_kind: revenue_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: -8.0, sigma: 0.8}, scale: 0.8,
     features: {view: credit, basis: "credit card net charge-offs, retained loans (negative)", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.card_reserve_build, name: JPMorgan card reserve build,
     attribute_kind: revenue_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: -1.0, sigma: 0.8}, scale: 0.8,
     features: {view: credit, basis: "change in the card allowance for loan losses charged to provision (build negative, release positive; CECL lifetime expected loss)", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.wholesale_net_charge_offs, name: JPMorgan wholesale net charge-offs,
     attribute_kind: revenue_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: -1.0, sigma: 0.5}, scale: 0.5,
     features: {view: credit, basis: "wholesale net charge-offs, retained loans (negative)", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.wholesale_reserve_build, name: JPMorgan wholesale reserve build,
     attribute_kind: revenue_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: -1.0, sigma: 0.8}, scale: 0.8,
     features: {view: credit, basis: "change in the wholesale allowance for loan losses charged to provision (build negative)", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.card_nco_rate, name: JPMorgan card net charge-off rate,
     attribute_kind: rate, unit: pct, family: gaussian, prior: {family: gaussian, mu: 3.2, sigma: 0.3}, scale: 0.3,
     features: {view: operating_state, basis: "annualized card net charge-offs over average retained card loans", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.card_delinquency_rate, name: JPMorgan card 30+ day delinquency rate,
     attribute_kind: rate, unit: pct, family: gaussian, prior: {family: gaussian, mu: 2.0, sigma: 0.2}, scale: 0.2,
     features: {view: operating_state, basis: "card loans 30 or more days past due over card loans (leads charge-offs by about two quarters)", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.card_loans, name: JPMorgan card loans,
     attribute_kind: balance, unit: $bn, family: lognormal, mean: 250.0, scale: 0.04,
     features: {view: operating_state, basis: "average retained credit card loans", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.card_sales_volume, name: JPMorgan debit and credit card sales volume,
     attribute_kind: spending_flow, unit: $bn/yr, family: lognormal, mean: 2000.0, scale: 0.04,
     features: {view: operating_state, basis: "debit and credit card purchase volume", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.wholesale_nco_rate, name: JPMorgan wholesale net charge-off rate,
     attribute_kind: rate, unit: pct, family: gaussian, prior: {family: gaussian, mu: 0.125, sigma: 0.05}, scale: 0.05,
     features: {view: operating_state, basis: "annualized wholesale net charge-offs over average retained wholesale loans", prior: synthetic}}

  # --- net interest income by balance-sheet line (firmwide, managed) and the rate and balance states ---------------------
  - {entity: jpmorgan, id: jpmorgan.interest_income, name: JPMorgan interest income,
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 200.0, scale: 0.04,
     features: {view: investment_assets, basis: "managed: total interest income on earning assets (FTE)", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.interest_expense, name: JPMorgan interest expense,
     attribute_kind: revenue_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: -98.0, sigma: 5.0}, scale: 5.0,
     features: {view: liabilities, basis: "total interest expense on interest-bearing liabilities (negative)", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.loan_interest_income, name: JPMorgan interest income on loans,
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 97.5, scale: 0.04,
     features: {view: investment_assets, basis: "interest income on loans (average loans times loan yield)", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.securities_interest_income, name: JPMorgan interest income on investment securities,
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 31.0, scale: 0.06,
     features: {view: investment_assets, basis: "interest income on AFS and HTM investment securities", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.cash_interest_income, name: JPMorgan interest income on cash and deposits with banks,
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 12.0, scale: 0.15,
     features: {view: investment_assets, basis: "interest on deposits with banks, mostly reserves at the Fed earning IORB", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.markets_interest_income, name: JPMorgan interest income on Markets assets,
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 53.0, scale: 0.08,
     features: {view: investment_assets, basis: "interest on resale agreements, securities borrowed and trading debt instruments", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.other_interest_income, name: JPMorgan other interest income,
     attribute_kind: revenue_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: 6.5, sigma: 1.5}, scale: 1.5,
     features: {view: investment_assets, basis: "residual: other earning assets", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.deposit_interest_expense, name: JPMorgan interest expense on deposits,
     attribute_kind: revenue_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: -44.0, sigma: 3.0}, scale: 3.0,
     features: {view: liabilities, basis: "interest on interest-bearing deposits (average balance times deposit cost; negative)", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.markets_funding_expense, name: JPMorgan interest expense on Markets funding,
     attribute_kind: revenue_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: -33.0, sigma: 3.0}, scale: 3.0,
     features: {view: liabilities, basis: "interest on repurchase agreements, securities loaned and trading liabilities (negative)", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.long_term_debt_expense, name: JPMorgan interest expense on long-term debt,
     attribute_kind: revenue_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: -19.0, sigma: 1.5}, scale: 1.5,
     features: {view: liabilities, basis: "interest on long-term debt after hedges (negative)", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.other_funding_expense, name: JPMorgan other interest expense,
     attribute_kind: revenue_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: -2.0, sigma: 0.5}, scale: 0.5,
     features: {view: liabilities, basis: "residual: commercial paper and beneficial interests of consolidated VIEs (negative)", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.ib_deposit_cost, name: JPMorgan interest-bearing deposit cost,
     attribute_kind: bank_funding_cost, unit: pct, family: gaussian, prior: {family: gaussian, mu: 2.2, sigma: 0.15}, scale: 0.15,
     features: {view: liabilities, basis: "rate paid on average interest-bearing deposits (consumer and wholesale together)", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.nib_deposit_share, name: JPMorgan noninterest-bearing deposit share,
     attribute_kind: structural_level, unit: pct, family: gaussian, prior: {family: gaussian, mu: 20.0, sigma: 1.5}, scale: 1.5,
     features: {view: liabilities, basis: "noninterest-bearing over total deposits, on average balances", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.avg_deposits, name: JPMorgan average deposits,
     attribute_kind: balance, unit: $bn, family: lognormal, mean: 2500.0, scale: 0.03,
     features: {view: liabilities, basis: "average total deposits", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.avg_loans, name: JPMorgan average loans,
     attribute_kind: balance, unit: $bn, family: lognormal, mean: 1500.0, scale: 0.03,
     features: {view: operating_state, basis: "average total loans (consumer and wholesale, incl. held-for-sale and fair value)", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.loan_yield, name: JPMorgan loan yield,
     attribute_kind: interest_rate, unit: pct, family: gaussian, prior: {family: gaussian, mu: 6.5, sigma: 0.2}, scale: 0.2,
     features: {view: operating_state, basis: "interest income on loans over average loans", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.cash_balances, name: JPMorgan cash and deposits with banks,
     attribute_kind: balance, unit: $bn, family: lognormal, mean: 320.0, scale: 0.15,
     features: {view: investment_assets, basis: "average deposits with banks (mostly reserves at the Fed)", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.securities_portfolio, name: JPMorgan investment securities,
     attribute_kind: balance, unit: $bn, family: lognormal, mean: 850.0, scale: 0.04,
     features: {view: investment_assets, basis: "average AFS and HTM investment securities; no maturity ladder or AFS/HTM split by tenor represented", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.securities_cash_flow, name: JPMorgan securities maturities and paydowns,
     attribute_kind: capital_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: 90.0, sigma: 25.0}, scale: 25.0,
     features: {view: investment_assets, basis: "proceeds from paydowns and maturities of HTM and AFS securities (cash flow statement)", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.securities_purchases, name: JPMorgan securities purchases,
     attribute_kind: capital_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: 300.0, sigma: 80.0}, scale: 80.0,
     features: {view: investment_assets, basis: "purchases of HTM and AFS securities (incl. repositioning against AFS sales)", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.new_purchase_yield, name: JPMorgan securities new-purchase yield,
     attribute_kind: bond_yield, unit: pct, family: gaussian, prior: {family: gaussian, mu: 4.5, sigma: 0.25}, scale: 0.25,
     features: {view: investment_assets, basis: "yield on securities bought in the period (tenor and product mix of the purchases, not one market yield)", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.securities_yield, name: JPMorgan investment securities yield,
     attribute_kind: bond_yield, unit: pct, family: gaussian, prior: {family: gaussian, mu: 3.65, sigma: 0.15}, scale: 0.15,
     features: {view: investment_assets, basis: "interest income on securities over average securities (book yield)", prior: synthetic}}

  # --- capital and payout -----------------------------------------------------------------------------------------------
  - {entity: jpmorgan, id: jpmorgan.aoci, name: JPMorgan AOCI on AFS securities,
     attribute_kind: structural_level, unit: $bn, family: gaussian, prior: {family: gaussian, mu: -6.0, sigma: 4.0}, scale: 4.0,
     features: {view: capital, basis: "after-tax unrealized gains and losses on AFS securities and cash-flow hedges in AOCI (in CET1 for this bank)", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.cet1_capital, name: JPMorgan CET1 capital,
     attribute_kind: structural_level, unit: $bn, family: gaussian, prior: {family: gaussian, mu: 310.0, sigma: 10.0}, scale: 10.0,
     features: {view: capital, basis: "common equity tier 1 capital: common equity less goodwill and intangibles net of DTL, incl. AOCI", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.rwa, name: JPMorgan risk-weighted assets,
     attribute_kind: balance, unit: $bn, family: lognormal, mean: 2000.0, scale: 0.03,
     features: {view: capital, basis: "standardized risk-weighted assets (credit, market and other risk)", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.cet1_requirement, name: JPMorgan CET1 requirement,
     attribute_kind: structural_level, unit: pct, family: gaussian, prior: {family: gaussian, mu: 12.0, sigma: 0.5}, scale: 0.5,
     features: {view: capital, basis: "regulatory minimum plus stress capital buffer plus G-SIB surcharge (standardized)", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.buybacks, name: JPMorgan share buybacks,
     attribute_kind: capital_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: 25.0, sigma: 8.0}, scale: 8.0,
     features: {view: capital, basis: "common share repurchases (gross)", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.common_dividends, name: JPMorgan common dividends,
     attribute_kind: capital_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: 17.0, sigma: 1.0}, scale: 1.0,
     features: {view: capital, basis: "common dividends declared", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.aum, name: JPMorgan assets under management,
     attribute_kind: balance, unit: $bn, family: lognormal, mean: 5000.0, scale: 0.06,
     features: {view: operating_state, basis: "AWM assets under management (liquidity, fixed income, equity, multi-asset, alternatives)", prior: synthetic}}

  # --- Oct 18 conversion: the balances and rates the product identities need ------------------------------------------
  - {entity: jpmorgan, id: jpmorgan.nib_deposits, name: JPMorgan noninterest-bearing deposits,
     attribute_kind: balance, unit: $bn, family: lognormal, mean: 500.0, scale: 0.08,
     features: {view: liabilities, basis: "average noninterest-bearing deposits (average deposits times the noninterest-bearing share)", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.ib_deposits, name: JPMorgan interest-bearing deposits,
     attribute_kind: balance, unit: $bn, family: lognormal, mean: 2000.0, scale: 0.035,
     features: {view: liabilities, basis: "average interest-bearing deposits (average deposits less noninterest-bearing)", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.cash_yield, name: JPMorgan yield on cash and deposits with banks,
     attribute_kind: interest_rate, unit: pct, family: gaussian, prior: {family: gaussian, mu: 3.75, sigma: 0.25}, scale: 0.25,
     features: {view: investment_assets, basis: "interest on deposits with banks over their average balance (mostly the rate on reserves)", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.wholesale_loans, name: JPMorgan wholesale loans,
     attribute_kind: balance, unit: $bn, family: lognormal, mean: 800.0, scale: 0.04,
     features: {view: operating_state, basis: "average retained wholesale loans", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.consumer_ex_card_loans, name: JPMorgan consumer ex-card and held-for-sale loans,
     attribute_kind: balance, unit: $bn, family: gaussian, prior: {family: gaussian, mu: 450.0, sigma: 20.0}, scale: 20.0,
     features: {view: operating_state, basis: "residual of average loans: consumer ex-card retained loans plus loans held for sale and at fair value", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.am_fee_rate, name: JPMorgan asset management fee rate,
     attribute_kind: rate, unit: pct, family: gaussian, prior: {family: gaussian, mu: 0.6, sigma: 0.03}, scale: 0.03,
     features: {view: operating_state, basis: "asset management, administration and commissions fees over average AUM (implied; mix and fee compression)", prior: synthetic}}
  - {entity: jpmorgan, id: jpmorgan.card_income_rate, name: JPMorgan net card income rate,
     attribute_kind: rate, unit: pct, family: gaussian, prior: {family: gaussian, mu: 0.25, sigma: 0.04}, scale: 0.04,
     features: {view: operating_state, basis: "card income (interchange net of rewards and partner payments) over card sales volume", prior: synthetic}}

interactions:
  # ===================== uncalibrated causal links (mechanism and sign; size unknown) unless noted =====================
  # --- rates to net interest income: deposit pricing, mix and balances ------------------------------------------------
  - id: jpm-c-fed-depcost
    source: federal_reserve.policy_rate
    target: jpmorgan.ib_deposit_cost
    label: passes a share of a rate move to deposit rates
    state: {asymmetry: {falls: {mu: 0.78, sigma: 0.0625}, rises: {mu: 0.8667, sigma: 0.0833}}}
    kernel: {delay_days: 30, lag_days: 180, duration_days: null}
    transition:
      mechanism: "The bank reprices interest-bearing deposits by a fraction of a policy-rate move (the deposit beta); the fraction builds over several quarters and is higher for wholesale and wealth balances than for consumer checking"
      sign: "+"
      actor: JPMorgan (deposit pricing, CCB, CIB and AWM)
      business_unit: firmwide deposits
      geography: US
      currency: USD
      condition: "deposit competition and the bank's funding need set the pass-through; excess deposits keep it low, loan growth ahead of deposits raises it"
      condition_observable: "interest-bearing deposit cost against the fed funds rate, quarterly; cumulative beta since the cycle began"
      observable: {name: interest-bearing deposit cost, definition: "interest expense on interest-bearing deposits over their average balance", units: pct, frequency: quarterly results, proof_limits: "a firmwide average; consumer and wholesale betas are not disclosed separately in the sources read"}
      timing: {onset: within the quarter of the move, build: "2-4 quarters to the cumulative beta", persistence: while the policy rate holds, recognition: interest expense each quarter}
      evidence: {existence: documented, direction: documented, magnitude: broker, timing: broker, sources: [jpm.wb, jpm.r6, jpm.r2, jpm.r4]}
      breaker: "excess liquidity and low loan demand hold betas down; a deposit-share contest or quantitative tightening pushes them up; caps at the policy rate"
      next_state: interest-bearing deposit cost
      unresolved:
        - {input: "deposit beta by segment (consumer versus wholesale and wealth)", status: not_disclosed_in_reviewed_sources, searched: [jpm.wb, jpm.r2, jpm.r4, jpm.r6, "corpus: consumer deposit (cost|beta|rate)", "corpus: wholesale deposit (cost|beta)"], note: "only firmwide betas are given, by cycle"}
  - id: jpm-c-fed-nibshare
    source: federal_reserve.policy_rate
    target: jpmorgan.nib_deposit_share
    label: moves balances out of noninterest-bearing accounts
    calibration: uncalibrated
    transition:
      mechanism: "Higher rates raise the cost of leaving cash idle, so clients move balances from noninterest-bearing into interest-bearing and investment products (deposit mix migration)"
      sign: "-"
      actor: depositors (consumers, corporates, wealth clients)
      business_unit: firmwide deposits
      geography: US
      condition: "rates high enough that the opportunity cost of idle balances is noticed; operating balances are sticky"
      condition_observable: "noninterest-bearing deposits as a share of total deposits, quarterly"
      timing: {onset: 1-2 quarters, build: several quarters, persistence: reverses slowly when rates fall, recognition: interest expense as balances migrate}
      evidence: {existence: documented, direction: inferred, magnitude: unknown, timing: unknown, sources: [jpm.wb, jpm.r6, jpm.pub]}
      breaker: "operating (transaction) balances that clients cannot move; deposit share gains"
      next_state: noninterest-bearing deposit share
      unresolved:
        - {input: "migration elasticity of noninterest-bearing balances to rates", status: not_disclosed_in_reviewed_sources, searched: [jpm.wb, jpm.r6, jpm.r7, "corpus: noninterest.bearing", "corpus: migration"]}
  - id: jpm-c-fed-deposits
    source: federal_reserve.policy_rate
    target: jpmorgan.avg_deposits
    label: pulls deposits toward money funds and bills
    calibration: uncalibrated
    transition:
      mechanism: "Higher policy rates, with balance-sheet runoff, pull system deposits toward money-market funds and Treasury bills; the bank's balances grow more slowly unless it gains share"
      sign: "-"
      actor: depositors and the Fed (balance-sheet policy)
      business_unit: firmwide deposits
      geography: US
      condition: "money-fund yields above deposit rates; reserves shrinking"
      condition_observable: "average deposits; industry deposit growth (H.8)"
      timing: {onset: 1-2 quarters, build: several quarters, persistence: while the gap lasts, recognition: average balances}
      evidence: {existence: inferred, direction: inferred, magnitude: unknown, timing: unknown, sources: [jpm.pub, jpm.r2, jpm.r3]}
      breaker: "deposit share gains (the research expects them); flight to quality into large banks in stress"
      next_state: average deposits
      unresolved:
        - {input: "deposit balance sensitivity to the policy rate", status: not_disclosed_in_reviewed_sources, searched: ["corpus: scripts/construction/inputs.py (17 files)", jpm.wb, jpm.r2, jpm.r3, "corpus: money market fund", "corpus: deposit outflow"], note: "keyword candidates read: qualitative or about peer banks, not this input"}
  - id: jpm-c-fed-loanyield
    source: federal_reserve.policy_rate
    target: jpmorgan.loan_yield
    label: reprices floating-rate loans
    calibration: uncalibrated
    transition:
      mechanism: "Floating-rate loans (card on prime, wholesale and commercial on SOFR) reprice within weeks of a policy move; fixed-rate mortgages and auto loans reprice only as they are originated"
      sign: "+"
      actor: JPMorgan (lending)
      business_unit: CCB card, CIB lending and commercial banking
      geography: US
      condition: "the floating share of the book and any receive-fixed swaps that convert it"
      condition_observable: "loan yield against SOFR and prime, quarterly"
      timing: {onset: within the month, build: one reset cycle, persistence: while the rate holds, recognition: interest income each quarter}
      evidence: {existence: documented, direction: documented, magnitude: unknown, timing: inferred, sources: [jpm.wb, jpm.pub]}
      breaker: "receive-fixed swaps on the loan book; loan-spread compression from competition"
      next_state: loan yield
      unresolved:
        - {input: "share of floating-rate loans and swap hedges", status: not_disclosed_in_reviewed_sources, searched: [jpm.wb, jpm.r1, jpm.r3, jpm.r9, "corpus: floating.rate loans", "corpus: tied to SOFR", "corpus: prime.based"]}
  - id: jpm-c-fed-cashyield
    source: federal_reserve.policy_rate
    target: jpmorgan.cash_yield
    label: reprices reserves at the Fed
    effect: {mu: 1, sigma: 0.1}
    kernel: {delay_days: 1, lag_days: 1, duration_days: null}
    transition:
      mechanism: "Reserves at the Fed earn the interest rate on reserve balances, which moves one for one with the policy rate the same day"
      sign: "+"
      actor: Federal Reserve (IORB) and Treasury (liquidity)
      business_unit: Treasury and CIO (Corporate)
      geography: US
      condition: "cash balances held at the Fed rather than invested"
      condition_observable: "yield on deposits with banks, quarterly"
      timing: {onset: same day, build: none, persistence: while the rate holds, recognition: interest income each quarter}
      evidence: {existence: documented, direction: documented, magnitude: documented, timing: documented, sources: [jpm.wb, jpm.pub]}
      breaker: "cash balance falls as deposits leave or are invested in securities"
      next_state: yield on cash and deposits with banks
      unresolved:
        - {input: "cash balance by currency and the share at the Fed", status: not_disclosed_in_reviewed_sources, searched: [jpm.wb, jpm.r3, "corpus: scripts/construction/inputs.py (17 files)"], note: "the total of deposits with banks is in the workbook (bound in baselines); its split by currency and the share held at the Fed are not"}
  - id: jpm-c-fed-mktfunding
    source: federal_reserve.policy_rate
    target: jpmorgan.markets_funding_expense
    label: reprices Markets funding
    calibration: uncalibrated
    note: "identity: not converted; Markets funding expense = funding balance x money-market rate, but the Markets funding balance and its rate are not separated in the model"
    transition:
      mechanism: "Repo, securities loaned and trading liabilities reprice at money-market rates, so a higher policy rate raises the interest paid to fund trading inventory (expense more negative)"
      sign: "-"
      actor: CIB Markets (financing desks)
      business_unit: CIB Markets
      geography: US and global
      condition: "inventory funded short; asset yields on the trading book reprice less than the funding"
      condition_observable: "Markets NII and Markets interest-bearing balances"
      timing: {onset: within weeks, build: none, persistence: while the rate holds, recognition: interest expense each quarter}
      evidence: {existence: documented, direction: inferred, magnitude: unknown, timing: inferred, sources: [jpm.wb, jpm.r9, jpm.pub]}
      breaker: "the desk prices funding into client trades; the offset shows in principal transactions (Markets revenue is managed as a whole)"
      next_state: Markets funding expense
      unresolved:
        - {input: "Markets NII rate sensitivity", status: not_disclosed_in_reviewed_sources, searched: ["corpus: scripts/construction/inputs.py (17 files)", jpm.wb, jpm.r1, jpm.r3, jpm.r9, "corpus: Markets NII"], note: "Markets NII levels found (history and broker forecast); its rate sensitivity is not; keyword candidates read: qualitative or about peer banks, not this input"}
  - id: jpm-c-fed-mktnii
    source: federal_reserve.policy_rate
    target: jpmorgan.markets_nii
    label: lowers Markets NII, offset inside Markets revenue
    calibration: uncalibrated
    transition:
      mechanism: "Counter-path: when funding reprices faster than the trading book, Markets NII falls, but the desks earn it back in principal transactions, so Markets revenue is roughly unchanged; NII ex Markets (firmwide NII less Markets NII, a difference identity) is unaffected by it, and net revenue counts Markets NII once, inside Markets revenue"
      sign: "-"
      actor: CIB Markets
      business_unit: CIB Markets
      condition: "Markets revenue is managed as a whole (NII and noninterest revenue together)"
      condition_observable: "NII ex Markets against firmwide NII; Markets NII in the supplement"
      timing: {onset: within weeks, build: none, persistence: while the rate holds, recognition: quarterly results}
      evidence: {existence: documented, direction: inferred, magnitude: unknown, timing: inferred, sources: [jpm.wb, jpm.r3, jpm.r9, jpm.pub]}
      breaker: "a funding shock that the desks cannot pass on"
      next_state: Markets NII
      unresolved:
        - {input: "Markets NII rate sensitivity", status: not_disclosed_in_reviewed_sources, searched: ["corpus: scripts/construction/inputs.py (17 files)", jpm.wb, jpm.r1, jpm.r3, jpm.r9, "corpus: Markets NII"], note: "keyword candidates read: qualitative or about peer banks, not this input"}
  - id: jpm-c-depcost-expense
    source: jpmorgan.ib_deposit_cost
    target: jpmorgan.deposit_interest_expense
    label: raises interest paid on deposits
    edge_type: identity
    identity: jpm.id.deposit_expense
    transition:
      mechanism: "Interest expense on deposits is the interest-bearing balance times the deposit cost; a higher cost makes the (negative) expense larger"
      sign: "-"
      actor: JPMorgan (deposit pricing)
      business_unit: firmwide deposits
      condition: "the change in expense is balance times rate change (bilinear): a fixed weight holds only near the current balance"
      condition_observable: "interest expense on interest-bearing deposits"
      timing: {onset: same quarter, build: none, persistence: while the cost holds, recognition: interest expense each quarter}
      evidence: {existence: documented, direction: documented, magnitude: model, timing: documented, sources: [jpm.wb]}
      breaker: "a falling interest-bearing balance"
      next_state: interest expense on deposits
      unresolved:
        - {input: "average interest-bearing deposits and their cost", status: found_connected, found_in: [jpm.wb], searched: [jpm.wb], note: "bound in baselines (JPMC-B rows) and citations"}
  - id: jpm-c-deposits-cash
    source: jpmorgan.avg_deposits
    target: jpmorgan.cash_balances
    label: funds cash held at the Fed
    calibration: uncalibrated
    note: "identity: not converted; cash is what deposits leave after loans, securities and other uses (a balance-sheet allocation decided by Treasury), not a product or difference of represented values"
    transition:
      mechanism: "Deposits not lent out are held as cash at the Fed or invested in securities; a larger deposit base raises the cash balance"
      sign: "+"
      actor: Treasury and CIO
      business_unit: Corporate
      condition: "loan growth below deposit growth; liquidity rules (LCR) favour high-quality liquid assets"
      condition_observable: "deposits with banks and the loan-to-deposit ratio"
      timing: {onset: same quarter, build: none, persistence: while balances hold, recognition: average balances}
      evidence: {existence: documented, direction: inferred, magnitude: unknown, timing: inferred, sources: [jpm.wb, jpm.pub]}
      breaker: "Treasury invests the cash in securities instead (jpm-c-cash-purchases)"
      next_state: cash and deposits with banks
  - id: jpm-c-cash-income
    source: jpmorgan.cash_balances
    target: jpmorgan.cash_interest_income
    label: earns IORB on reserves
    edge_type: identity
    identity: jpm.id.cash_income
    transition:
      mechanism: "Interest income on cash is the balance times the rate on reserves"
      sign: "+"
      actor: Treasury and CIO
      business_unit: Corporate
      condition: "bilinear: balance times rate"
      condition_observable: "deposits with banks: balance, yield and income"
      timing: {onset: same quarter, build: none, persistence: while balances hold, recognition: interest income each quarter}
      evidence: {existence: documented, direction: documented, magnitude: model, timing: documented, sources: [jpm.wb]}
      breaker: "IORB cut below market rates"
      next_state: interest income on cash
  - id: jpm-c-loanyield-income
    source: jpmorgan.loan_yield
    target: jpmorgan.loan_interest_income
    label: raises loan interest income
    edge_type: identity
    identity: jpm.id.loan_income
    transition:
      mechanism: "Interest income on loans is the average loan balance times the loan yield"
      sign: "+"
      actor: JPMorgan (lending)
      business_unit: CCB and CIB lending
      condition: "bilinear: balance times yield"
      condition_observable: "loan yield and loan interest income"
      timing: {onset: same quarter, build: none, persistence: while the yield holds, recognition: interest income each quarter}
      evidence: {existence: documented, direction: documented, magnitude: model, timing: documented, sources: [jpm.wb]}
      breaker: "loan balances shrink"
      next_state: interest income on loans
  - id: jpm-c-loans-income
    source: jpmorgan.avg_loans
    target: jpmorgan.loan_interest_income
    label: more loans earn more interest
    edge_type: identity
    identity: jpm.id.loan_income
    transition:
      mechanism: "A larger average loan book earns more interest at the prevailing yield"
      sign: "+"
      actor: JPMorgan (lending)
      business_unit: CCB and CIB lending
      condition: "bilinear: balance times yield; growth funded by deposits rather than by wholesale debt"
      condition_observable: "average loans and loan interest income"
      timing: {onset: same quarter, build: as loans are drawn, persistence: while held, recognition: interest income each quarter}
      evidence: {existence: documented, direction: documented, magnitude: model, timing: documented, sources: [jpm.wb, jpm.r2, jpm.r3]}
      breaker: "growth in low-spread loans (securities-based, markets lending) adds less"
      next_state: interest income on loans

  # --- the long end: fixed-rate repricing of securities, prepayments and the AOCI mark -------------------------------------
  - id: jpm-c-ust10-nii
    source: us_treasuries.yield_10y
    target: jpmorgan.net_interest_income
    label: a steeper curve lifts NII as fixed-rate assets reprice
    note: "sized by least squares over the disclosed scenarios parallel_up_100_2q26, parallel_down_100_2q26, steeper_long_up_100_2q26, parallel_up_100_1q26, parallel_down_100_1q26, steeper_long_up_100_1q26 (jpm.co), jointly with m25"
    effect: {mu: 0.0545, sigma: 0.0072}
    kernel: {delay_days: 30, lag_days: 270, duration_days: null}
    transition:
      mechanism: "Reduced form of the securities and fixed-rate loan repricing paths (jpm.path.securities_reinvestment, jpm.path.long_end): higher long-end yields raise net interest income over twelve months as maturing fixed-rate assets reinvest at higher yields; never added to those paths' steps"
      sign: "+"
      actor: Treasury and CIO; lending businesses
      business_unit: firmwide (Corporate securities; mortgages and auto)
      geography: US
      currency: USD
      condition: "short rates unchanged (the disclosed steeper-curve scenario); a static balance sheet"
      condition_observable: "the company's earnings-at-risk scenario for long-term rates up 100bp with short rates unchanged (12-month pretax earnings)"
      observable: {name: 12-month pretax earnings sensitivity, definition: "change in 12-month pretax earnings for long-term rates +100bp, short rates unchanged", units: $bn per 100bp, frequency: quarterly 10-Q, proof_limits: "excludes Markets-based activities; static balance sheet; pretax earnings not NII alone; one scenario, not a curve"}
      timing: {onset: next quarter, build: about a year as assets roll, persistence: while the curve holds, recognition: interest income each quarter}
      evidence: {existence: documented, direction: documented, magnitude: documented, timing: inferred, sources: [jpm.co, jpm.r3]}
      breaker: "slower prepayments extend the book and delay repricing; receive-fixed swaps already reprice with short rates"
      next_state: net interest income
      unresolved:
        - {input: "steeper-curve earnings-at-risk scenario", status: found_connected, found_in: [jpm.r3], searched: [jpm.r3, jpm.r5, jpm.r8, jpm.r9, "corpus: earnings.at.risk|asset.sensitiv|100 ?bps"], note: "company disclosure as cited by the broker; bound as a citation"}
  - id: jpm-c-sec-cashflow
    source: jpmorgan.securities_portfolio
    target: jpmorgan.securities_cash_flow
    label: releases cash as securities mature and pay down
    calibration: uncalibrated
    note: "identity: not converted; runoff = book x runoff rate, but the runoff rate (maturity ladder, prepayments) is not disclosed, so a product would invent a factor"
    transition:
      mechanism: "Maturities, calls and principal paydowns on held securities are the cash the Treasury can reinvest"
      sign: "+"
      actor: Treasury and CIO
      business_unit: Corporate
      condition: "securities actually mature or prepay in the period"
      condition_observable: "proceeds from paydowns and maturities of HTM and AFS securities (cash flow statement)"
      observable: {name: securities maturities and paydowns, definition: "HTM and AFS proceeds from paydowns and maturities", units: $bn/yr, frequency: quarterly cash flow statement, proof_limits: "annual flows only: no maturity ladder, so next year's runoff is not known in advance"}
      timing: {onset: actual cash dates, build: unknown, persistence: unknown, recognition: not recognized in income until reinvested and earned}
      evidence: {existence: documented, direction: documented, magnitude: unknown, timing: unknown, sources: [jpm.wb]}
      breaker: "slower prepayments when mortgage rates rise (jpm-c-ust10-prepay)"
      next_state: securities maturities and paydowns
      unresolved:
        - {input: "securities maturities and paydowns (annual flows)", status: found_connected, found_in: [jpm.wb], searched: [jpm.wb], note: "cash flow statement rows; bound in baselines"}
        - {input: "maturity ladder and repricing schedule of the securities book", status: not_disclosed_in_reviewed_sources, searched: [jpm.wb, jpm.r2, jpm.r5, jpm.r6, jpm.r9, "corpus: reprices in one year|matur(es|ity) (between|ladder|profile)|repricing schedule"], note: "a broker quotes a peer's repricing schedule, not this bank's"}
  - id: jpm-c-ust10-prepay
    source: us_treasuries.yield_10y
    target: jpmorgan.securities_cash_flow
    label: slows mortgage prepayments
    calibration: uncalibrated
    transition:
      mechanism: "Higher long rates raise mortgage rates, so refinancing slows and MBS paydowns fall: less cash to reinvest just when reinvestment yields are higher (extension)"
      sign: "-"
      actor: mortgage borrowers
      business_unit: Corporate (agency MBS in the securities book)
      geography: US
      condition: "the book holds prepayable MBS"
      condition_observable: "MBS paydowns; prepayment speeds"
      timing: {onset: 1-2 months, build: 1-2 quarters, persistence: while rates hold, recognition: cash flow}
