# China Construction Bank: business construction (Oct 18). Values added to the china_construction_bank entity (and
# a 5-year LPR on pboc and a fiscal mortgage subsidy on china_economy), links with their transitions, named paths, and
# compositions (model/construction.py). Structure and generic banking mechanisms only: priors are synthetic, round,
# order-of-magnitude levels marked as such; dated client levels, citations and source bindings stay local
# (data/sally_data/construction/china_construction_bank/). Source ids in evidence.sources: ccb.v1 (algorithmic
# summary report with FY2023-25 summary financials), ccb.r1, ccb.r2, ccb.r3, ccb.r4, ccb.r5 (broker, vendor and
# credit notes on the China banks), ccb.pub (public business, accounting and regulatory knowledge). No company model
# workbook was supplied.
#
# Basis: IFRS (the A-share CAS figures agree at group net profit), group, RMB bn. Costs and charges are held as
# negative values, so every part adds to its total with a positive weight. Accounting weights are scale_part /
# scale_total in native sd (log sd times level for a lognormal value). Exact steps that are not sums are declared
# under identities: (products, ratios, a weighted average) and stock_flows: (CET1, mortgages, the loan loss reserve), so
# their weights are derived; state-dependent steps carry a state: block. The segment views reconcile (drives: false).
# Steps that fit no form stay uncalibrated, and their note says why.

subentities:
- entity: pboc
  id: pboc.loan_prime_rate_5y
  name: 5-year loan prime rate
  attribute_kind: policy_rate
  unit: pct
  family: gaussian
