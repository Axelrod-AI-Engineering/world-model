  scale: 0.1
  aliases: [5Y LPR, 5-year LPR, mortgage benchmark rate]
  features: {view: operating_state, basis: '5-year-and-over loan prime rate, quoted monthly by the panel banks; the benchmark for residential mortgages', prior: synthetic}
