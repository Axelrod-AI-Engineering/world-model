interactions:
- id: ccb-c-lpr-corpyield
  source: pboc.loan_prime_rate
  target: china_construction_bank.corporate_loan_yield
  label: reprices corporate loans
  calibration: uncalibrated
  transition:
    mechanism: 'Corporate loans are priced at a spread to the 1-year LPR: new loans price off the current LPR at once, existing floating loans move on their repricing date; competition for scarce loan demand
      deepens discounts below the LPR'
    sign: +
    actor: CCB (corporate lending and pricing)
    business_unit: Corporate Finance
    geography: China
    currency: RMB
    condition: loans priced off the LPR rather than fixed; repricing dates spread over the year
    condition_observable: average corporate loan yield against the 1-year LPR, half-yearly; new-loan pricing in PBoC data
    timing: {onset: new loans at once; existing loans at their repricing date, build: up to 12 months as the book reprices, persistence: while the LPR holds, recognition: interest income each period}
    evidence:
      existence: documented
      direction: documented
      magnitude: unknown
      timing: broker
      sources: [ccb.r4, ccb.r2, ccb.pub]
    breaker: loan demand weak enough that discounts widen regardless of the LPR; policy-directed lending at thin spreads
    next_state: corporate loan yield
    unresolved:
    - input: share of corporate loans priced off the LPR and their repricing dates
      status: not_disclosed_in_reviewed_sources
      searched: [ccb.v1, ccb.r1, ccb.r2, ccb.r3, ccb.r4, ccb.r5, 'corpus: scripts/construction/inputs.py (11 files: the six China Construction Bank PDFs and five spreadsheets)', 'corpus: share of corporate
          loans priced off the lpr and their repricing dates']
    - input: NII sensitivity to an LPR cut (repricing gap by tenor)
      status: disclosed_not_supplied
      searched: [ccb.v1, ccb.r1, ccb.r2, ccb.r3, ccb.r4, ccb.r5, 'corpus: scripts/construction/inputs.py (11 files: the six China Construction Bank PDFs and five spreadsheets)', 'corpus: nii sensitivity
          to an lpr cut (repricing gap by tenor)']
      note: 'the interest-rate risk note gives an NII sensitivity to a parallel shift and a repricing gap: the bank''s annual report (IFRS notes), not in the supplied material'
- id: ccb-c-lpr-lpr5y
