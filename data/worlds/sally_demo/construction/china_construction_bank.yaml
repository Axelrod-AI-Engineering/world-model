    timing: {onset: new mortgages at once; the book at its next repricing date, build: one reset cycle (up to 12 months), persistence: while the LPR holds, recognition: interest income each period, calendar: 'existing
        mortgages reprice on their annual repricing date (usually 1 January); recorded, not scheduled by the kernel'}
    evidence:
      existence: documented
      direction: documented
      magnitude: unknown
      timing: documented
      sources: [ccb.r2, ccb.r4, ccb.pub]
    breaker: a pricing floor on new mortgages; administrative cuts to existing mortgage rates outside the LPR; prepayment of high-rate loans
