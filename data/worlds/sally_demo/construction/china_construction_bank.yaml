      policy target)
    sign: +
    actor: LPR panel banks under PBoC guidance
    business_unit: benchmark rates
    geography: China
    currency: RMB
    condition: an LPR fixing that moves both tenors
    condition_observable: monthly LPR fixings (1-year and 5-year)
    timing: {onset: same fixing day, build: none, persistence: until the next fixing, recognition: benchmark only}
    evidence:
      existence: documented
      direction: documented
      magnitude: unknown
      timing: documented
      sources: [ccb.r4, ccb.pub]
    breaker: a targeted move in one tenor only (housing support through the 5-year tenor)
    next_state: 5-year LPR
    unresolved:
