    timing: {onset: same reporting period, build: none, persistence: identity, recognition: interim and annual results}
    evidence:
      existence: documented
      direction: documented
      magnitude: model
      timing: documented
      sources: [ccb.pub]
    next_state: interest-earning assets
- id: ccb-a-iea-other-earning-assets
  source: china_construction_bank.other_earning_assets
  target: china_construction_bank.earning_assets
  label: adds to interest-earning assets
  edge_type: accounting
  effect: {mu: 0.408, sigma: 0.001}
  kernel: {delay_days: 0, lag_days: 1, duration_days: null}
  transition:
    mechanism: 'CCB other earning assets is the residual of CCB interest-earning assets: what the named parts leave out, stated in its basis (interest-earning assets by type); weight is its scale over the
      total''s'
    business_unit: earning assets
    condition: IFRS, group, same period, RMB bn; never added to another view of the same total
    timing: {onset: same reporting period, build: none, persistence: identity, recognition: interim and annual results}
    evidence:
      existence: documented
      direction: documented
      magnitude: model
      timing: documented
      sources: [ccb.pub]
    next_state: interest-earning assets

paths:
- id: ccb.path.lpr_nii
  name: CCB loan prime rate to net interest income
  entity_id: china_construction_bank
  trigger: the PBoC guides the loan prime rate down
  endpoint: china_construction_bank.operating_profit
  description: 'Parallel responses of one LPR move: corporate loans reprice off the 1-year LPR, mortgages off the 5-year LPR at their reset date, deposits only through posted-rate cuts and maturities, the
    bond curve follows, and credit demand responds. Assets reprice faster than deposits, so a cut squeezes NII before deposit cuts catch up. s27 and s29 are the reduced forms (LPR to NIM, NIM to net profit)
    and are never added to these steps.'
  steps:
  - {interaction_id: ccb-c-lpr-corpyield, branch: corporate}
  - {interaction_id: ccb-c-lpr-lpr5y, branch: mortgage}
  - {interaction_id: ccb-c-lpr-listrate, branch: deposits}
  - {interaction_id: s56, branch: bonds}
  - {interaction_id: s03, branch: volume}
  - {interaction_id: ccb-c-lpr5y-mortyield}
  - {interaction_id: ccb-c-listrate-depcost}
  - {interaction_id: ccb-c-cgb-npy}
  - {interaction_id: ccb-c-npy-invyield}
  - {interaction_id: ccb-c-credit-corploans}
  - {interaction_id: ccb-c-corpyield-loanii}
  - {interaction_id: ccb-c-mortyield-loanii}
  - {interaction_id: ccb-c-depcost-depexp}
  - {interaction_id: ccb-c-invyield-invii}
  - {interaction_id: ccb-c-corploans-loanii}
  - {interaction_id: ccb-a-lii-corporate-loan-income}
  - {interaction_id: ccb-a-lii-mortgage-income}
  - {interaction_id: ccb-a-ii-loan-interest-income}
  - {interaction_id: ccb-a-ii-investment-interest-income}
  - {interaction_id: ccb-a-ie-deposit-interest-expense}
  - {interaction_id: ccb-a-nii-interest-income}
  - {interaction_id: ccb-a-nii-interest-expense}
  - {interaction_id: ccb-c-nii-nim}
  - {interaction_id: ccb-a-oi-net-interest-income}
  - {interaction_id: ccb-a-pbt-operating-income}
  - {interaction_id: ccb-a-np-profit-before-tax}
- id: ccb.path.deposit_repricing
  name: CCB deposit repricing and migration
  entity_id: china_construction_bank
  trigger: the large state banks cut posted deposit rates
  endpoint: china_construction_bank.operating_profit
  description: 'One posted-rate cut, five responses: the cost falls only as time deposits mature, savings migrate to wealth products (slower deposit growth, but distribution fees), households prepay mortgages
    from savings, and savers term out (a higher time share partly offsets the cut).'
  steps:
  - {interaction_id: ccb-c-listrate-depcost, branch: cost}
  - {interaction_id: ccb-c-listrate-deposits, branch: migration}
  - {interaction_id: ccb-c-listrate-agency, branch: wealth}
  - {interaction_id: ccb-c-listrate-prepay, branch: prepayment}
  - {interaction_id: ccb-c-listrate-timeshare, branch: mix}
  - {interaction_id: ccb-c-timeshare-depcost}
  - {interaction_id: ccb-c-depcost-depexp}
  - {interaction_id: ccb-c-deposits-depexp}
  - {interaction_id: ccb-c-prepay-mortgages}
  - {interaction_id: ccb-c-mortgages-loanii}
  - {interaction_id: ccb-a-lii-mortgage-income}
  - {interaction_id: ccb-a-ie-deposit-interest-expense}
  - {interaction_id: ccb-a-nii-interest-expense}
  - {interaction_id: ccb-a-ii-loan-interest-income}
  - {interaction_id: ccb-a-nii-interest-income}
  - {interaction_id: ccb-a-fee-agency-fees}
  - {interaction_id: ccb-a-oi-net-fee-income}
  - {interaction_id: ccb-a-oi-net-interest-income}
  - {interaction_id: ccb-a-pbt-operating-income}
  - {interaction_id: ccb-a-np-profit-before-tax}
- id: ccb.path.cgb_yields
  name: CCB government bond yields to NII, gains and capital
  entity_id: china_construction_bank
  trigger: Chinese government bond yields fall
  endpoint: china_construction_bank.cet1_ratio
  description: 'One move, three responses: new purchases earn less (the book yield drifts down as bonds roll), FVOCI bonds mark up into OCI and CET1 (not profit), and trading and disposal gains offset part
    of the margin loss for a while. s58 is the reduced form (CGB 10Y to NIM) and is never added to these steps.'
  steps:
  - {interaction_id: ccb-c-cgb-npy, branch: yield}
  - {interaction_id: ccb-c-cgb-fvoci, branch: marks}
  - {interaction_id: ccb-c-cgb-trading, branch: trading}
  - {interaction_id: ccb-c-npy-invyield}
  - {interaction_id: ccb-c-invyield-invii}
  - {interaction_id: ccb-a-ii-investment-interest-income}
  - {interaction_id: ccb-a-nii-interest-income}
  - {interaction_id: ccb-a-oi-net-interest-income}
  - {interaction_id: ccb-a-oi-other-operating-income}
  - {interaction_id: ccb-a-pbt-operating-income}
  - {interaction_id: ccb-a-np-profit-before-tax}
  - {interaction_id: ccb-c-fvoci-cet1}
  - {interaction_id: ccb-c-np-cet1}
  - {interaction_id: ccb-c-cet1cap-ratio}
- id: ccb.path.securities_reinvestment
  name: CCB bond reinvestment below the book yield
  entity_id: china_construction_bank
  trigger: bonds bought at higher yields mature while new-purchase yields sit below the book yield
  endpoint: china_construction_bank.operating_profit
  description: Maturities -> reinvestment at lower yields -> book yield -> interest income -> NII -> operating income -> profit -> capital. The maturity ladder is not in the supplied material, so no new
    yield is applied to the whole book.
  steps:
  - {interaction_id: ccb-c-maturities-invyield}
  - {interaction_id: ccb-c-invyield-invii}
  - {interaction_id: ccb-a-ii-investment-interest-income}
  - {interaction_id: ccb-a-nii-interest-income}
  - {interaction_id: ccb-a-oi-net-interest-income}
  - {interaction_id: ccb-a-pbt-operating-income}
  - {interaction_id: ccb-a-np-profit-before-tax}
  - {interaction_id: ccb-c-np-cet1, branch: capital}
- id: ccb.path.property_credit
  name: CCB property market to asset quality and credit cost
  entity_id: china_construction_bank
  trigger: property sales fall
  endpoint: china_construction_bank.operating_profit
  description: 'A weaker property market reaches the bank four ways at once: mortgage NPLs (slow, low loan-to-value), developer NPLs (faster), fewer new mortgages, and a worse IFRS 9 outlook (an allowance
    build before any default). NPLs feed write-offs and stage-3 reserves; a thick coverage buffer lets the bank smooth the charge. s28 and s30 are the reduced forms and are never added to these steps.'
  steps:
  - {interaction_id: ccb-c-prop-mortnpl, branch: mortgage_quality}
  - {interaction_id: ccb-c-prop-devnpl, branch: developer_quality}
  - {interaction_id: ccb-c-prop-mortgages, branch: volume}
  - {interaction_id: ccb-c-prop-allowance, branch: outlook}
  - {interaction_id: ccb-c-mortnpl-npl}
  - {interaction_id: ccb-c-devnpl-npl}
  - {interaction_id: ccb-c-npl-writeoffs}
  - {interaction_id: ccb-c-npl-allowance}
  - {interaction_id: ccb-c-npl-npls}
  - {interaction_id: ccb-c-npl-coverage}
  - {interaction_id: ccb-c-coverage-allowance}
  - {interaction_id: ccb-c-allowance-reserve}
  - {interaction_id: ccb-c-reserve-coverage}
  - {interaction_id: ccb-c-mortgages-loanii}
  - {interaction_id: ccb-a-lii-mortgage-income}
  - {interaction_id: ccb-a-limp-net-write-offs}
  - {interaction_id: ccb-a-limp-allowance-build}
  - {interaction_id: ccb-a-cimp-loan-impairment}
  - {interaction_id: ccb-a-pbt-credit-impairment}
  - {interaction_id: ccb-a-ii-loan-interest-income}
  - {interaction_id: ccb-a-nii-interest-income}
  - {interaction_id: ccb-a-oi-net-interest-income}
  - {interaction_id: ccb-a-pbt-operating-income}
  - {interaction_id: ccb-a-np-profit-before-tax}
- id: ccb.path.mortgage_subsidy
  name: CCB fiscal mortgage subsidy to asset quality
  entity_id: china_construction_bank
  trigger: the government funds an interest subsidy on eligible first-home mortgages
  endpoint: china_construction_bank.operating_profit
  description: 'Policy support paid by the budget, not by bank pricing: borrowers'' effective cost falls (better mortgage quality) and first-home demand firms (more originations), while the bank''s loan
    yield is unchanged, so there is no NIM step. It may also lessen the need for further LPR cuts (a policy substitution not held as a link).'
  steps:
  - {interaction_id: ccb-c-subsidy-mortnpl, branch: repayment}
  - {interaction_id: ccb-c-subsidy-propsales, branch: demand}
  - {interaction_id: ccb-c-prop-mortgages}
  - {interaction_id: ccb-c-mortnpl-npl}
  - {interaction_id: ccb-c-npl-allowance}
  - {interaction_id: ccb-c-npl-writeoffs}
  - {interaction_id: ccb-c-mortgages-loanii}
  - {interaction_id: ccb-a-lii-mortgage-income}
  - {interaction_id: ccb-a-limp-allowance-build}
  - {interaction_id: ccb-a-limp-net-write-offs}
  - {interaction_id: ccb-a-cimp-loan-impairment}
  - {interaction_id: ccb-a-pbt-credit-impairment}
  - {interaction_id: ccb-a-ii-loan-interest-income}
  - {interaction_id: ccb-a-nii-interest-income}
  - {interaction_id: ccb-a-oi-net-interest-income}
  - {interaction_id: ccb-a-pbt-operating-income}
  - {interaction_id: ccb-a-np-profit-before-tax}
- id: ccb.path.credit_growth
  name: CCB credit growth to NII and capital
  entity_id: china_construction_bank
  trigger: system credit growth picks up
  endpoint: china_construction_bank.operating_profit
  description: Corporate (policy-supported) and household loans respond separately; policy-directed growth comes at thinner spreads, and every loan consumes risk-weighted assets. s31 is the reduced form
    and is never added to these steps.
  steps:
  - {interaction_id: ccb-c-credit-corploans, branch: corporate}
  - {interaction_id: ccb-c-credit-otherpers, branch: retail}
  - {interaction_id: ccb-c-corploans-corpyield}
  - {interaction_id: ccb-c-corploans-loanii}
  - {interaction_id: ccb-c-otherpers-loanii}
  - {interaction_id: ccb-c-corpyield-loanii}
  - {interaction_id: ccb-a-lii-corporate-loan-income}
  - {interaction_id: ccb-a-lii-other-loan-income}
  - {interaction_id: ccb-a-loans-corporate-loans}
  - {interaction_id: ccb-a-loans-other-personal-loans}
  - {interaction_id: ccb-c-loans-rwa}
  - {interaction_id: ccb-c-rwa-ratio}
  - {interaction_id: ccb-a-ii-loan-interest-income}
  - {interaction_id: ccb-a-nii-interest-income}
  - {interaction_id: ccb-a-oi-net-interest-income}
  - {interaction_id: ccb-a-pbt-operating-income}
  - {interaction_id: ccb-a-np-profit-before-tax}
- id: ccb.path.wealth_fees
  name: CCB capital markets to wealth distribution fees
  entity_id: china_construction_bank
  trigger: Chinese equity markets rise
  endpoint: china_construction_bank.operating_profit
  description: Fund and wealth product sales follow the market; regulatory fee-rate caps limit what the bank earns per sale.
  steps:
  - {interaction_id: ccb-c-equity-agency}
  - {interaction_id: ccb-a-fee-agency-fees}
  - {interaction_id: ccb-a-oi-net-fee-income}
  - {interaction_id: ccb-a-pbt-operating-income}
  - {interaction_id: ccb-a-np-profit-before-tax}
- id: ccb.path.capital_payout
  name: CCB profit to capital and dividends
  entity_id: china_construction_bank
  trigger: net profit changes
  endpoint: china_construction_bank.cet1_ratio
  description: Profit is retained in CET1 or paid out at the payout ratio; dividends leave capital; the ratio is capital over RWA.
  steps:
  - {interaction_id: ccb-c-np-cet1, branch: retain}
  - {interaction_id: ccb-c-np-dividends, branch: distribute}
  - {interaction_id: ccb-c-dividends-cet1}
  - {interaction_id: ccb-c-cet1cap-ratio}
- id: ccb.path.state_capital
  name: CCB state capital injection
  entity_id: china_construction_bank
  trigger: the state injects core tier 1 capital
  endpoint: china_construction_bank.cet1_ratio
  description: 'Government support as shareholder: capital in at once, raising the ratio (and the room for lending and dividends).'
  steps:
  - {interaction_id: ccb-c-injection-cet1}
  - {interaction_id: ccb-c-cet1cap-ratio}
- id: ccb.path.capital_requirements
  name: CCB capital requirements and payout
  entity_id: china_construction_bank
  trigger: capital requirements rise (systemic surcharge bucket, TLAC)
  endpoint: china_construction_bank.cet1_ratio
  description: A tighter requirement holds the payout back (when the surplus is thin), keeping more profit in capital.
  steps:
  - {interaction_id: ccb-c-req-payout}
  - {interaction_id: ccb-c-payout-dividends}
  - {interaction_id: ccb-c-dividends-cet1}
  - {interaction_id: ccb-c-cet1cap-ratio}

compositions:
- id: ccb.comp.operating_income_by_line
  entity_id: china_construction_bank
  view: product
  basis: 'operating income by line: net interest income, net fee and commission income and other operating income'
  unit: CNY bn/yr
  period: fiscal year ending December
  total: china_construction_bank.operating_income
  members: [china_construction_bank.net_interest_income, china_construction_bank.net_fee_income]
  residual: china_construction_bank.other_operating_income
  note: 'The driven view: rates and balances enter through NII, capital markets and activity through fees, bond yields through other operating income (gains). Not the segment view (ccb.comp.operating_income_by_segment):
    never added to it.'
- id: ccb.comp.operating_income_by_segment
  entity_id: china_construction_bank
  view: reporting_segments
  basis: operating income by reporting segment
  unit: CNY bn/yr
  period: fiscal year ending December
  total: china_construction_bank.operating_income
  members: [china_construction_bank.corporate_finance_income, china_construction_bank.personal_finance_income, china_construction_bank.treasury_income]
  residual: china_construction_bank.other_segment_income
  drives: false
  note: 'Reconciling view (drives: false): reported and reconciled, never linked into the total. The drivers act on lines (NII, fees) that cut across segments; the line view drives. Others is the residual
    and holds the inter-segment items.'
- id: ccb.comp.nii
  entity_id: china_construction_bank
  view: investment_assets
  basis: 'net interest income: interest income less interest expense'
  unit: CNY bn/yr
  period: fiscal year ending December
  total: china_construction_bank.net_interest_income
  members: [china_construction_bank.interest_income, china_construction_bank.interest_expense]
  note: 'An identity: interest expense is held negative.'
- id: ccb.comp.interest_income
  entity_id: china_construction_bank
  view: investment_assets
  basis: interest income by earning asset
  unit: CNY bn/yr
  period: fiscal year ending December
  total: china_construction_bank.interest_income
  members: [china_construction_bank.loan_interest_income, china_construction_bank.investment_interest_income]
  residual: china_construction_bank.other_interest_income
  note: Loans reprice off the LPR; the bond book reprices only as it rolls; the residual is central bank and interbank income.
- id: ccb.comp.loan_interest
  entity_id: china_construction_bank
  view: investment_assets
  basis: interest income on loans by portfolio
  unit: CNY bn/yr
  period: fiscal year ending December
  total: china_construction_bank.loan_interest_income
  members: [china_construction_bank.corporate_loan_income, china_construction_bank.mortgage_income]
  residual: china_construction_bank.other_loan_income
  note: Each named part is a product identity (balance x yield); the residual holds the portfolios without a yield value.
- id: ccb.comp.interest_expense
  entity_id: china_construction_bank
  view: liabilities
  basis: interest expense by funding source (negative values)
  unit: CNY bn/yr
  period: fiscal year ending December
  total: china_construction_bank.interest_expense
  members: [china_construction_bank.deposit_interest_expense]
  residual: china_construction_bank.other_interest_expense
  note: Deposits reprice through posted-rate cuts and time-deposit maturities; the residual reprices at money-market rates.
- id: ccb.comp.fees
  entity_id: china_construction_bank
  view: product
  basis: net fee and commission income by product
  unit: CNY bn/yr
  period: fiscal year ending December
  total: china_construction_bank.net_fee_income
  members: [china_construction_bank.agency_fees, china_construction_bank.card_fees, china_construction_bank.settlement_fees]
  residual: china_construction_bank.other_fees
  note: Agency (wealth distribution) fees follow capital markets and deposit migration and sit under regulatory fee-rate caps; the residual holds fee expense.
- id: ccb.comp.pretax
  entity_id: china_construction_bank
  view: reporting_segments
  basis: 'profit before tax: operating income less operating expenses less credit impairment'
  unit: CNY bn/yr
  period: fiscal year ending December
  total: china_construction_bank.profit_before_tax
  members: [china_construction_bank.operating_income, china_construction_bank.operating_expenses, china_construction_bank.credit_impairment]
  residual: china_construction_bank.other_pretax_items
  note: Costs and charges are negative values. The residual holds insurance service expenses, other operating expenses and share of associates.
- id: ccb.comp.pbt_by_segment
  entity_id: china_construction_bank
  view: reporting_segments
  basis: profit before tax by reporting segment
  unit: CNY bn/yr
  period: fiscal year ending December
  total: china_construction_bank.profit_before_tax
  members: [china_construction_bank.corporate_finance_pbt, china_construction_bank.personal_finance_pbt, china_construction_bank.treasury_pbt]
  residual: china_construction_bank.other_segment_pbt
  drives: false
  note: 'Reconciling view (drives: false): reported and reconciled, never linked into the total; the P&L bridge (ccb.comp.pretax) drives. Others is the residual.'
- id: ccb.comp.net_profit
  entity_id: china_construction_bank
  view: reporting_segments
  basis: 'net profit: profit before tax less income tax'
  unit: CNY bn/yr
  period: fiscal year ending December
  total: china_construction_bank.operating_profit
  members: [china_construction_bank.profit_before_tax, china_construction_bank.income_tax]
  note: An identity. Net profit is the group figure incl. minority interests (the existing value china_construction_bank.operating_profit).
- id: ccb.comp.credit_impairment
  entity_id: china_construction_bank
  view: credit
  basis: credit impairment losses by asset (negative values)
  unit: CNY bn/yr
  period: fiscal year ending December
  total: china_construction_bank.credit_impairment
  members: [china_construction_bank.loan_impairment]
  residual: china_construction_bank.other_impairment
  note: Loans are most of the charge.
- id: ccb.comp.loan_impairment
  entity_id: china_construction_bank
  view: credit
  basis: 'loan impairment: net write-offs plus allowance build (allowance roll-forward)'
  unit: CNY bn/yr
  period: fiscal year ending December
  total: china_construction_bank.loan_impairment
  members: [china_construction_bank.net_write_offs, china_construction_bank.allowance_build]
  note: The allowance roll-forward (charge = write-offs net of recoveries + change in allowance; other movements negligible). Write-offs follow realized losses; the build follows staging and the forward-looking
    outlook.
- id: ccb.comp.loans_by_type
  entity_id: china_construction_bank
  view: product
  basis: gross loans and advances by type
  unit: CNY bn
  period: average balance for the fiscal year
  total: china_construction_bank.loans
  members: [china_construction_bank.corporate_loans, china_construction_bank.mortgages, china_construction_bank.other_personal_loans]
  residual: china_construction_bank.other_loans
  note: Mortgages are a large share of loans at this bank (high among peers). The residual holds discounted bills, overseas and other loans.
- id: ccb.comp.earning_assets
  entity_id: china_construction_bank
  view: investment_assets
  basis: interest-earning assets by type
  unit: CNY bn
  period: average balance for the fiscal year
  total: china_construction_bank.earning_assets
  members: [china_construction_bank.loans, china_construction_bank.financial_investments]
  residual: china_construction_bank.other_earning_assets
  note: The NIM denominator. The residual is central bank reserves and interbank assets.
- id: ccb.comp.capital_sources_uses
  entity_id: china_construction_bank
  view: capital
  basis: 'CET1 capital roll-forward: profit in, dividends out, FVOCI marks, state injections (not an additive partition: flows into a stock)'
  unit: CNY bn
  period: ''
  total: china_construction_bank.cet1_capital
  members: [china_construction_bank.operating_profit, china_construction_bank.dividends, china_construction_bank.fvoci_reserve, china_construction_bank.capital_injection]
  additive: false
  note: 'Capital accumulates: next period''s CET1 is this period''s plus net profit less dividends plus the change in the FVOCI reserve plus any injection, less deductions. Profit, dividends and injections
    accumulate through the stock-flow ccb.sf.cet1_capital; the FVOCI reserve is a stock whose change enters CET1, held as a signed link (ccb-c-fvoci-cet1).'

identities:
- id: ccb.id.corporate_loan_income
  entity_id: china_construction_bank
  form: product
  target: china_construction_bank.corporate_loan_income
  factors: [china_construction_bank.corporate_loans, china_construction_bank.corporate_loan_yield]
  coefficient: 0.01
  unit_check: CNY bn/yr = CNY bn x % x 0.01
- id: ccb.id.mortgage_income
  entity_id: china_construction_bank
  form: product
  target: china_construction_bank.mortgage_income
  factors: [china_construction_bank.mortgages, china_construction_bank.mortgage_yield]
  coefficient: 0.01
  unit_check: CNY bn/yr = CNY bn x % x 0.01
- id: ccb.id.deposit_interest
  entity_id: china_construction_bank
  form: product
  target: china_construction_bank.deposit_interest_expense
  factors: [china_construction_bank.deposits, china_construction_bank.deposit_cost]
  coefficient: -0.01
  unit_check: CNY bn/yr (negative) = CNY bn x % x -0.01
- id: ccb.id.investment_interest
  entity_id: china_construction_bank
  form: product
  target: china_construction_bank.investment_interest_income
  factors: [china_construction_bank.financial_investments, china_construction_bank.investment_yield]
  coefficient: 0.01
  unit_check: CNY bn/yr = CNY bn x % x 0.01
- id: ccb.id.nim
  entity_id: china_construction_bank
  form: ratio
  target: china_construction_bank.net_interest_margin
  numerator: [china_construction_bank.net_interest_income]
  denominator: [china_construction_bank.earning_assets]
  coefficient: 100.0
  unit_check: '% = CNY bn/yr / CNY bn x 100'
  note: 's29 (NIM to net profit) is a reduced form beside this identity: once NII moves through a quantified route, the two count it twice'
- id: ccb.id.cet1_ratio
  entity_id: china_construction_bank
  form: ratio
  target: china_construction_bank.cet1_ratio
  numerator: [china_construction_bank.cet1_capital]
  denominator: [china_construction_bank.rwa]
  coefficient: 100.0
  unit_check: '% = CNY bn / CNY bn x 100'
- id: ccb.id.dividends
  entity_id: china_construction_bank
  form: product
  target: china_construction_bank.dividends
  factors: [china_construction_bank.payout_ratio, china_construction_bank.operating_profit]
  coefficient: 0.01
  unit_check: CNY bn/yr = % x CNY bn/yr x 0.01
  note: the payout applies to profit attributable to shareholders; group net profit (incl. minorities) stands in for it
- id: ccb.id.npl_ratio
  entity_id: china_construction_bank
  form: weighted_average
  target: china_construction_bank.npl_ratio
  weights: {china_construction_bank.mortgage_npl_ratio: 0.2, china_construction_bank.developer_npl_ratio: 0.04, china_construction_bank.other_npl_ratio: 0.76}
  unit_check: '% = sum of loan shares x %'
  note: weights are the construction loan mix (synthetic); a mix that moves would make the weights values, which the form does not take
- id: ccb.id.nonperforming_loans
  entity_id: china_construction_bank
  form: product
  target: china_construction_bank.nonperforming_loans
  factors: [china_construction_bank.npl_ratio, china_construction_bank.loans]
  coefficient: 0.01
  unit_check: CNY bn = % x CNY bn x 0.01
- id: ccb.id.provision_coverage
  entity_id: china_construction_bank
  form: ratio
  target: china_construction_bank.provision_coverage
  numerator: [china_construction_bank.loan_loss_reserve]
  denominator: [china_construction_bank.nonperforming_loans]
  coefficient: 100.0
  unit_check: '% = CNY bn / CNY bn x 100'

stock_flows:
- id: ccb.sf.cet1_capital
  entity_id: china_construction_bank
  stock: china_construction_bank.cet1_capital
  period_days: 365
  inflows: [china_construction_bank.operating_profit, china_construction_bank.capital_injection]
  outflows: [china_construction_bank.dividends]
  basis: CET1 roll-forward, annual flows; the FVOCI reserve's change and regulatory deductions are not flows here (ccb-c-fvoci-cet1 stays a signed link)
- id: ccb.sf.mortgages
  entity_id: china_construction_bank
  stock: china_construction_bank.mortgages
  period_days: 365
  outflows: [china_construction_bank.mortgage_prepayments]
  measure: period_average
  basis: average mortgage balance; originations and scheduled amortization are not held as flows (ccb-c-prop-mortgages stays causal)
- id: ccb.sf.loan_loss_reserve
  entity_id: china_construction_bank
  stock: china_construction_bank.loan_loss_reserve
  period_days: 365
  outflows: [china_construction_bank.allowance_build]
  basis: the allowance build is held negative (a build), so as an outflow it raises the reserve; write-offs net of recoveries sit inside the charge
