  - id: ms.path.deals_ib
    name: "Morgan Stanley deal activity to investment banking fees"
    entity_id: morgan_stanley
    trigger: "deal and issuance activity picks up"
    endpoint: morgan_stanley.net_income
    description: "Announced M&A completes two to four quarters later and pays advisory fees at completion; equity and debt issuance pay underwriting fees in the quarter priced; incentive pay takes a share. s13 is the reduced form on investment banking revenue and is never added to these steps."
    steps:
      - {interaction_id: ms-c-deals-completedma, branch: advisory}
      - {interaction_id: ms-c-deals-ecm, branch: ecm}
      - {interaction_id: ms-c-deals-dcm, branch: dcm}
      - {interaction_id: ms-c-completedma-advisory}
      - {interaction_id: ms-a-ib-advisory-fees}
      - {interaction_id: ms-a-ib-ecm-fees}
      - {interaction_id: ms-a-ib-dcm-fees}
      - {interaction_id: ms-a-isg-ib-fees}
      - {interaction_id: ms-a-seg-isg-revenue}
