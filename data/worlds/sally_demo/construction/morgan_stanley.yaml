  - id: ms.path.credit_spreads
    name: "Morgan Stanley credit spreads to provisions, marks and issuance"
    entity_id: morgan_stanley
    trigger: "credit spreads widen"
    endpoint: morgan_stanley.net_income
    description: "One widening, parallel responses: CECL reserves rise at once, credit inventory and fair-value loans mark down, debt issuance and leveraged finance slow, and deal activity falls."
    steps:
      - {interaction_id: ms-c-spread-provision, branch: reserves}
      - {interaction_id: ms-c-spread-ficc, branch: inventory}
      - {interaction_id: ms-c-spread-isgother, branch: loan_marks}
      - {interaction_id: ms-c-spread-dcm, branch: issuance}
      - {interaction_id: jpm-c-spread-deals, branch: deals}
      - {interaction_id: ms-c-deals-completedma}
      - {interaction_id: ms-c-completedma-advisory}
      - {interaction_id: ms-a-trd-ficc-revenue}
      - {interaction_id: ms-a-isg-trading-revenue}
      - {interaction_id: ms-a-ib-dcm-fees}
