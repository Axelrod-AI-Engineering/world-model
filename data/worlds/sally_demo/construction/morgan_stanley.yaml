  - id: ms.path.investment_management
    name: "Morgan Stanley IM flows to management fees"
    entity_id: morgan_stanley
    trigger: "clients add net flows to Investment Management"
    endpoint: morgan_stanley.net_income
    description: "Flows accumulate into AUM (ms.sf.im_aum) and fees are AUM times the fee rate (ms.id.im_fees), so a flow reaches fees exactly (mix toward liquidity lowers the rate). Market impact on AUM and fund marks runs through ms.path.market_levels."
    steps:
      - {interaction_id: ms-c-imflows-aum}
      - {interaction_id: ms-c-aum-imfees}
      - {interaction_id: ms-a-im-im-mgmt-fees}
