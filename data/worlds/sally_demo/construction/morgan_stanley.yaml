  - id: ms.path.volatility
    name: "Morgan Stanley volatility to trading and wealth activity"
    entity_id: morgan_stanley
    trigger: "market volatility rises"
    endpoint: morgan_stanley.net_income
    description: "Volatility lifts equity execution, macro FICC and retail trading, but the same shock usually lowers equity prices (fee-based assets and prime balances fall), widens spreads (inventory marks), shuts the IPO window and raises clearing costs; incentive pay takes a share of revenue. s15 (sales and trading) and s17 (WM revenue) are the reduced forms and are never added to these steps."
    steps:
      - {interaction_id: ms-c-vol-execution, branch: execution}
      - {interaction_id: ms-c-vol-ficc, branch: ficc}
      - {interaction_id: ms-c-vol-darts, branch: retail}
      - {interaction_id: ms-c-vol-ecm, branch: ipo_window}
      - {interaction_id: jpm-c-vol-equityindex, branch: risk_off}
      - {interaction_id: jpm-c-vol-spread, branch: credit}
      - {interaction_id: ms-c-vol-clearing, branch: costs}
      - {interaction_id: ms-c-darts-transactional}
      - {interaction_id: ms-c-equity-feeassets}
      - {interaction_id: ms-c-feeassets-amfees}
      - {interaction_id: ms-c-equity-prime}
      - {interaction_id: ms-c-prime-financing}
