identities:
  - {id: ms.id.wm_loan_interest, entity_id: morgan_stanley, form: product, target: morgan_stanley.wm_loan_interest_income, factors: [morgan_stanley.wm_loans, morgan_stanley.wm_loan_rate], coefficient: 0.01, unit_check: "$bn/yr = $bn x pct x 0.01"}
  - {id: ms.id.wm_deposit_interest, entity_id: morgan_stanley, form: product, target: morgan_stanley.wm_deposit_interest, factors: [morgan_stanley.wm_deposits, morgan_stanley.wm_deposit_cost], coefficient: 0.01, unit_check: "$bn/yr = $bn x pct x 0.01"}
  - {id: ms.id.wm_nii, entity_id: morgan_stanley, form: difference, target: morgan_stanley.wm_nii, minus: [morgan_stanley.wm_deposit_interest], of: morgan_stanley.wm_interest_income}
  - {id: ms.id.wm_am_fees, entity_id: morgan_stanley, form: product, target: morgan_stanley.wm_asset_mgmt_fees, factors: [morgan_stanley.wm_fee_based_assets, morgan_stanley.wm_fee_rate], coefficient: 0.0001, unit_check: "$bn/yr = $bn x bp x 0.0001"}
  - {id: ms.id.im_fees, entity_id: morgan_stanley, form: product, target: morgan_stanley.im_mgmt_fees, factors: [morgan_stanley.im_aum, morgan_stanley.im_fee_rate], coefficient: 0.0001, unit_check: "$bn/yr = $bn x bp x 0.0001"}
  - {id: ms.id.advisory, entity_id: morgan_stanley, form: product, target: morgan_stanley.advisory_fees, factors: [morgan_stanley.completed_ma_volume, morgan_stanley.advisory_fee_rate], coefficient: 0.0001, unit_check: "$bn/yr = $bn/yr x bp x 0.0001"}
  - {id: ms.id.financing, entity_id: morgan_stanley, form: product, target: morgan_stanley.equity_financing, factors: [morgan_stanley.prime_balances, morgan_stanley.financing_revenue_rate], coefficient: 0.01, unit_check: "$bn/yr = $bn x pct x 0.01"}
  - {id: ms.id.compensation, entity_id: morgan_stanley, form: product, target: morgan_stanley.compensation_expense, factors: [morgan_stanley.comp_ratio, morgan_stanley.net_revenue], coefficient: -0.01, unit_check: "$bn/yr (negative) = -0.01 x pct x $bn/yr"}
  - {id: ms.id.tax, entity_id: morgan_stanley, form: product, target: morgan_stanley.income_tax, factors: [morgan_stanley.effective_tax_rate, morgan_stanley.pretax_income], coefficient: -0.01, unit_check: "$bn/yr (negative) = -0.01 x pct x $bn/yr"}
  - {id: ms.id.cet1_ratio, entity_id: morgan_stanley, form: ratio, target: morgan_stanley.cet1_ratio, numerator: [morgan_stanley.cet1_capital], denominator: [morgan_stanley.rwa], coefficient: 100, unit_check: "pct = 100 x $bn / $bn"}
  - {id: ms.id.slr, entity_id: morgan_stanley, form: ratio, target: morgan_stanley.slr, numerator: [morgan_stanley.tier1_capital], denominator: [morgan_stanley.leverage_exposure], coefficient: 100, unit_check: "pct = 100 x $bn / $bn"}

stock_flows:
  - {id: ms.sf.client_assets, entity_id: morgan_stanley, stock: morgan_stanley.wm_client_assets, period_days: 365, inflows: [morgan_stanley.wm_net_new_assets], outflows: [], basis: "period-end client assets; market impact enters by ms-c-equity-clientassets (sign only)"}
  - {id: ms.sf.fee_based_assets, entity_id: morgan_stanley, stock: morgan_stanley.wm_fee_based_assets, period_days: 365, inflows: [morgan_stanley.wm_fee_based_flows], outflows: [], basis: "period-end fee-based assets; market impact enters by ms-c-equity-feeassets and ms-c-ust10-feeassets (sign only)"}
  - {id: ms.sf.im_aum, entity_id: morgan_stanley, stock: morgan_stanley.im_aum, period_days: 365, inflows: [morgan_stanley.im_net_flows], outflows: [], basis: "period-end AUM; market impact enters by ms-c-equity-aum (sign only); distributions are in net flows"}
  - {id: ms.sf.cet1, entity_id: morgan_stanley, stock: morgan_stanley.cet1_capital, period_days: 365, inflows: [morgan_stanley.net_income], outflows: [morgan_stanley.common_dividends, morgan_stanley.buybacks], basis: "CET1 roll-forward; preferred dividends and AOCI changes are left out (AOCI enters by ms-c-aoci-cet1, sign only)"}

paths:
  - id: ms.path.rates_wm_nii
    name: "Morgan Stanley policy rate to WM net interest income"
    entity_id: morgan_stanley
    trigger: "the Fed raises the policy rate"
    endpoint: morgan_stanley.net_income
    description: "Parallel responses of one rate move inside Wealth Management: savings and sweep rates follow by the beta, clients move cash out of sweep (cash sorting) partly into the firm's savings products, and floating securities-based loans reprice at once. WM NII is loan interest plus securities interest less deposit interest, each balance times rate an identity (ms.id.wm_loan_interest, ms.id.wm_deposit_interest, ms.id.wm_nii), so those steps are exact; the rate responses themselves (beta, sorting, repricing) are sign-only. s75 is the reduced form on WM revenue (calibrated from the disclosed WM NII sensitivity) and is never added to these steps."
    steps:
      - {interaction_id: ms-c-fed-depcost, branch: beta}
      - {interaction_id: ms-c-fed-sweep, branch: sorting}
      - {interaction_id: ms-c-fed-savings, branch: savings}
      - {interaction_id: ms-c-fed-loanyield, branch: loans}
      - {interaction_id: ms-c-sweep-depcost}
      - {interaction_id: ms-a-dep-wm-sweep-deposits}
      - {interaction_id: ms-a-dep-wm-other-deposits}
      - {interaction_id: ms-c-deposits-depinterest}
      - {interaction_id: ms-c-depinterest-wmnii}
      - {interaction_id: ms-c-depcost-depinterest}
      - {interaction_id: ms-c-loanrate-loaninterest}
      - {interaction_id: ms-a-wmii-wm-loan-interest-income}
      - {interaction_id: ms-c-wmii-wmnii}
      - {interaction_id: ms-a-wm-wm-nii}
      - {interaction_id: ms-a-seg-wealth-revenue}
      - {interaction_id: ms-c-revenue-comp}
      - {interaction_id: ms-a-exp-compensation-expense}
      - {interaction_id: ms-a-pretax-net-revenue}
      - {interaction_id: ms-a-pretax-noninterest-expense}
      - {interaction_id: ms-a-ni-pretax-income, branch: earnings}
      - {interaction_id: ms-c-pretax-tax, branch: tax}
      - {interaction_id: ms-a-ni-income-tax}
  - id: ms.path.market_levels
    name: "Morgan Stanley market levels to asset-based fees"
    entity_id: morgan_stanley
    trigger: "US equity markets rise"
    endpoint: morgan_stanley.net_income
    description: "One market move, parallel responses: fee-based assets reprice (fees a month later), client assets and lending capacity rise, IM AUM and fund marks rise, prime balances grow, retail activity and deferred-plan hedges lift transactional revenue while the same plans raise pay (an offset), and the IPO window opens. ms-c-equity-amfees (calibrated from management's asset mix) is the reduced form on WM asset management fees and is never added to these steps."
    steps:
      - {interaction_id: ms-c-equity-feeassets, branch: wm_fees}
      - {interaction_id: ms-c-equity-clientassets, branch: client_assets}
      - {interaction_id: ms-c-equity-aum, branch: im_aum}
      - {interaction_id: ms-c-equity-perf, branch: carry}
      - {interaction_id: ms-c-equity-prime, branch: prime}
      - {interaction_id: ms-c-equity-transactional, branch: activity}
      - {interaction_id: ms-c-equity-dcpcomp, branch: deferred_pay}
      - {interaction_id: ms-c-equity-ecm, branch: ipo_window}
      - {interaction_id: ms-c-feeassets-amfees}
