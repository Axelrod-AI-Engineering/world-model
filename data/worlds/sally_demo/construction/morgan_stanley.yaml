# Morgan Stanley: business construction (Oct 18). Values added to the morgan_stanley entity, links with their
# transitions, named paths, and compositions (model/construction.py). Structure and generic mechanisms of an investment
# bank and wealth manager only: priors are synthetic, round, order-of-magnitude levels marked as such; dated client
# levels, citations and source bindings stay local (data/sally_data/construction/morgan_stanley/). Source ids in
# evidence.sources: ms.wb (the client's company model workbook: history, transmission map, disclosed WM NII sensitivity,
# broker means), ms.vm (vendor company model workbook in the sell-side folder), ms.co (company filings as cited in ms.wb,
# not read directly), ms.r1 to ms.r5 (broker notes), ms.x1 (expert call on wealth platforms; no names recorded),
# ms.pub (public business and accounting knowledge).
#
# Bases (features.basis): US GAAP as reported; segment revenues include intersegment amounts (eliminated once in the
# segment view); the reported income-statement lines are a second, undriven view of net revenues. Costs and charges are
# held as negative values, so every part adds to its total with a positive weight. Accounting weights are
# scale_part / scale_total in native sd (log sd times level for a lognormal value). Shared market values come from the
# JPMorgan build (us_capital_markets.equity_index, us_capital_markets.credit_spread, us_economy.unemployment_rate).
# Links that are identities, accumulations, cross-classifications or state-dependent carry a tag in `note`
# (identity: / stock-flow: / matrix: / state:) so they convert mechanically when those forms exist.

subentities:
  # --- net revenues by reporting segment (the driven view) and the group P&L -------------------------------------------
  - {entity: morgan_stanley, id: morgan_stanley.net_revenue, name: "Morgan Stanley net revenues",
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 70.8, scale: 0.05,
     features: {view: reporting_segments, basis: "US GAAP net revenues, firm: the three segments less intersegment eliminations", metric: net_revenues, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.isg_revenue, name: "Morgan Stanley Institutional Securities net revenues",
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 35.0, scale: 0.08,
     features: {view: reporting_segments, basis: "segment: Institutional Securities net revenues (incl. intersegment amounts)", metric: isg_net_revenues, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.im_revenue, name: "Morgan Stanley Investment Management net revenues",
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 6.5, scale: 0.07,
     features: {view: reporting_segments, basis: "segment: Investment Management net revenues (incl. intersegment amounts)", metric: im_net_revenues, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.intersegment_eliminations, name: "Morgan Stanley intersegment eliminations (revenue)",
     attribute_kind: revenue_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: -0.7, sigma: 0.1}, scale: 0.1,
     features: {view: reporting_segments, basis: "eliminations of intersegment revenue (negative): segment revenues include amounts one segment books from another", metric: intersegment_eliminations, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.isg_other_revenue, name: "Morgan Stanley ISG other revenue",
     attribute_kind: revenue_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: 0.5, sigma: 0.4}, scale: 0.4,
     features: {view: reporting_segments, basis: "segment residual: ISG other (investments, the Japanese securities joint venture's income, lending fees and marks on corporate loans and hedges, NII not in trading)", metric: isg_other_revenue, prior: synthetic}}
  # --- Institutional Securities products -------------------------------------------------------------------------------
  - {entity: morgan_stanley, id: morgan_stanley.equity_revenue, name: "Morgan Stanley Equity sales and trading revenue",
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 19.0, scale: 0.09,
     features: {view: product, basis: "segment product: Equity net revenues (financing and execution services), incl. their net interest", metric: equity_net_revenues, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.ficc_revenue, name: "Morgan Stanley Fixed Income sales and trading revenue",
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 9.0, scale: 0.1,
     features: {view: product, basis: "segment product: Fixed Income net revenues (rates, FX, credit, commodities), incl. their net interest", metric: fixed_income_net_revenues, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.equity_financing, name: "Morgan Stanley Equity financing revenue",
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 9.5, scale: 0.08,
     features: {view: product, basis: "segment product: prime brokerage and equity financing (trading, fees and net interest, the latter a funding cost)", metric: equity_financing_revenues, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.equity_execution, name: "Morgan Stanley Equity execution services revenue",
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 9.5, scale: 0.1,
     features: {view: product, basis: "segment product: cash equities and derivatives execution (trading, commissions and fees)", metric: equity_execution_revenues, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.advisory_fees, name: "Morgan Stanley advisory revenue",
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 2.5, scale: 0.15,
     features: {view: product, basis: "segment product: M&A advisory fees, recognized at completion", metric: advisory_revenues, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.ecm_fees, name: "Morgan Stanley equity underwriting revenue",
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 1.8, scale: 0.2,
     features: {view: product, basis: "segment product: equity underwriting (IPOs, follow-ons, convertibles)", metric: equity_underwriting_revenues, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.dcm_fees, name: "Morgan Stanley fixed income underwriting revenue",
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 2.2, scale: 0.12,
     features: {view: product, basis: "segment product: fixed income underwriting (investment-grade, high-yield, leveraged loans)", metric: fixed_income_underwriting_revenues, prior: synthetic}}
  # --- Wealth and Investment Management lines --------------------------------------------------------------------------
  - {entity: morgan_stanley, id: morgan_stanley.wm_asset_mgmt_fees, name: "Morgan Stanley WM asset management fees",
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 18.0, scale: 0.05,
     features: {view: reporting_segments, basis: "segment line: WM asset management revenues: fee-based assets times the fee rate, billed off prior month-end values", metric: wm_asset_management_revenues, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.wm_transactional, name: "Morgan Stanley WM transactional revenue",
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 4.5, scale: 0.1,
     features: {view: reporting_segments, basis: "segment line: WM transactional revenues (commissions, self-directed trading, investment banking distribution; deferred-compensation hedge marks)", metric: wm_transactional_revenues, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.wm_nii, name: "Morgan Stanley WM net interest income",
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 7.0, scale: 0.06,
     features: {view: reporting_segments, basis: "segment line: WM net interest income: bank deposits (incl. brokerage sweeps) funding securities-based and mortgage lending and investment securities", metric: wm_net_interest_income, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.wm_other_revenue, name: "Morgan Stanley WM other revenue",
     attribute_kind: revenue_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: 0.5, sigma: 0.15}, scale: 0.15,
     features: {view: reporting_segments, basis: "segment residual: WM other revenues", metric: wm_other_revenues, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.im_mgmt_fees, name: "Morgan Stanley IM asset management fees",
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 6.0, scale: 0.05,
     features: {view: reporting_segments, basis: "segment line: IM asset management and related fees: average AUM times the fee rate", metric: im_asset_management_fees, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.im_performance_fees, name: "Morgan Stanley IM performance-based income",
     attribute_kind: revenue_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: 0.5, sigma: 0.3}, scale: 0.3,
     features: {view: reporting_segments, basis: "segment line: IM performance-based income (carried interest accrued on fund marks, reversed when marks fall) and other", metric: im_performance_based_income, prior: synthetic}}
  # --- the reported income-statement lines (a second view of net revenues, reconciled but undriven) --------------------
  - {entity: morgan_stanley, id: morgan_stanley.firm_nii, name: "Morgan Stanley net interest income (firm)",
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 10.0, scale: 0.08,
     features: {view: product, basis: "line: firm net interest income (all segments; ISG's includes the funding cost of financing and inventory)", metric: net_interest_income, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.trading_line, name: "Morgan Stanley trading revenues (line)",
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 18.5, scale: 0.08,
     features: {view: product, basis: "line: trading revenues, firm (principal transactions; not the ISG sales and trading total, which also holds fees and net interest)", metric: trading_revenues_line, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.ib_line, name: "Morgan Stanley investment banking revenues (line)",
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 8.2, scale: 0.1,
     features: {view: product, basis: "line: investment banking revenues, firm (ISG fees plus WM distribution of underwritings)", metric: investment_banking_revenues_line, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.commissions_line, name: "Morgan Stanley commissions and fees (line)",
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 6.0, scale: 0.08,
     features: {view: product, basis: "line: commissions and fees, firm", metric: commissions_and_fees_line, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.am_fees_line, name: "Morgan Stanley asset management, distribution and administration fees (line)",
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 25.3, scale: 0.05,
     features: {view: product, basis: "line: asset management, distribution and administration fees, firm (WM, IM and ISG)", metric: asset_management_fees_line, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.other_revenue_lines, name: "Morgan Stanley investments and other revenues (line)",
     attribute_kind: revenue_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: 2.8, sigma: 0.8}, scale: 0.8,
     features: {view: product, basis: "residual: investments and other revenues (lines)", metric: other_revenues_line, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.interest_income, name: "Morgan Stanley interest income",
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 59.0, scale: 0.06,
     features: {view: investment_assets, basis: "line: total interest income (resale agreements, securities borrowed, customer receivables, trading assets, loans, investment securities)", metric: interest_income, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.interest_expense, name: "Morgan Stanley interest expense",
     attribute_kind: revenue_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: -49.0, sigma: 3.5}, scale: 3.5,
     features: {view: liabilities, basis: "line: total interest expense (deposits, borrowings, repo, securities loaned, customer payables), negative", metric: interest_expense, prior: synthetic}}
  # --- expenses, provision, pretax income and net income (charges negative) --------------------------------------------
  - {entity: morgan_stanley, id: morgan_stanley.noninterest_expense, name: "Morgan Stanley non-interest expenses",
     attribute_kind: revenue_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: -48.4, sigma: 2.0}, scale: 2.0,
     features: {view: reporting_segments, basis: "line: total non-interest expenses (a charge, negative)", metric: non_interest_expenses, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.compensation_expense, name: "Morgan Stanley compensation and benefits",
     attribute_kind: revenue_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: -29.0, sigma: 1.4}, scale: 1.4,
     features: {view: reporting_segments, basis: "line: compensation and benefits, incl. revenue-linked incentive accruals, the advisor payout and deferred cash-based plans (negative)", metric: compensation_and_benefits, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.brokerage_clearing_expense, name: "Morgan Stanley brokerage, clearing and exchange fees",
     attribute_kind: revenue_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: -4.7, sigma: 0.3}, scale: 0.3,
     features: {view: reporting_segments, basis: "line: brokerage, clearing and exchange fees, volume-linked (negative)", metric: brokerage_clearing_exchange_fees, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.technology_expense, name: "Morgan Stanley information processing and communications",
     attribute_kind: revenue_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: -4.4, sigma: 0.2}, scale: 0.2,
     features: {view: reporting_segments, basis: "line: information processing and communications (negative)", metric: information_processing_communications, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.other_noncomp_expense, name: "Morgan Stanley other non-compensation expenses",
     attribute_kind: revenue_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: -10.3, sigma: 0.7}, scale: 0.7,
     features: {view: reporting_segments, basis: "residual: professional services, occupancy, marketing, other expenses (negative)", metric: other_non_compensation_expenses, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.provision_for_credit_losses, name: "Morgan Stanley provision for credit losses",
     attribute_kind: revenue_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: -0.4, sigma: 0.15}, scale: 0.15,
     features: {view: credit, basis: "line: provision for credit losses on loans and lending commitments (ISG corporate and CRE; WM securities-based and mortgage), negative", metric: provision_for_credit_losses, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.pretax_income, name: "Morgan Stanley income before taxes",
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 22.0, scale: 0.1,
     features: {view: reporting_segments, basis: "line: income from continuing operations before income taxes", metric: pretax_income, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.income_tax, name: "Morgan Stanley provision for income taxes",
     attribute_kind: revenue_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: -4.9, sigma: 0.5}, scale: 0.5,
     features: {view: reporting_segments, basis: "line: provision for income taxes (negative)", metric: income_tax, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.noncontrolling_interests, name: "Morgan Stanley net income to noncontrolling interests",
     attribute_kind: revenue_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: -0.2, sigma: 0.05}, scale: 0.05,
     features: {view: reporting_segments, basis: "residual: net income applicable to noncontrolling interests (negative)", metric: noncontrolling_interests, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.net_income, name: "Morgan Stanley net income",
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 16.9, scale: 0.1,
     features: {view: reporting_segments, basis: "line: net income applicable to Morgan Stanley (before preferred dividends)", metric: net_income, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.isg_pretax, name: "Morgan Stanley ISG pretax income",
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 11.2, scale: 0.15,
     features: {view: reporting_segments, basis: "segment: Institutional Securities income before taxes", metric: isg_pretax_income, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.wm_pretax, name: "Morgan Stanley WM pretax income",
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 9.3, scale: 0.06,
     features: {view: reporting_segments, basis: "segment: Wealth Management income before taxes", metric: wm_pretax_income, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.im_pretax, name: "Morgan Stanley IM pretax income",
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 1.55, scale: 0.15,
     features: {view: reporting_segments, basis: "segment: Investment Management income before taxes", metric: im_pretax_income, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.elim_pretax, name: "Morgan Stanley intersegment eliminations (pretax)",
     attribute_kind: revenue_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: -0.05, sigma: 0.02}, scale: 0.02,
     features: {view: reporting_segments, basis: "eliminations of intersegment pretax income (revenue eliminations net of the matching expense eliminations)", metric: intersegment_eliminations_pretax, prior: synthetic}}
  # --- Wealth Management operating states: client assets, flows, fee rate, activity, deposits and lending --------------
  - {entity: morgan_stanley, id: morgan_stanley.wm_client_assets, name: "Morgan Stanley WM total client assets",
     attribute_kind: balance, unit: $bn, family: lognormal, mean: 7400.0, scale: 0.06,
     features: {view: operating_state, basis: "period-end total client assets, advisor-led and self-directed (incl. workplace)", metric: wm_client_assets, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.wm_fee_based_assets, name: "Morgan Stanley WM fee-based client assets",
     attribute_kind: balance, unit: $bn, family: lognormal, mean: 2750.0, scale: 0.06,
     features: {view: operating_state, basis: "fee-based client assets (advisory programmes billed on asset value); roughly equity-weighted per management's mix", metric: wm_fee_based_assets, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.wm_net_new_assets, name: "Morgan Stanley WM net new assets",
     attribute_kind: capital_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: 350.0, sigma: 60.0}, scale: 60.0,
     features: {view: operating_state, basis: "net new assets across advisor-led, self-directed and workplace channels, per year", metric: wm_net_new_assets, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.wm_fee_based_flows, name: "Morgan Stanley WM fee-based asset flows",
     attribute_kind: capital_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: 160.0, sigma: 30.0}, scale: 30.0,
     features: {view: operating_state, basis: "net inflows into fee-based (advisory) accounts, per year", metric: wm_fee_based_flows, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.wm_fee_rate, name: "Morgan Stanley WM fee rate on fee-based assets",
     attribute_kind: rate, unit: bp, family: gaussian, prior: {family: gaussian, mu: 65.5, sigma: 2.0}, scale: 2.0,
     features: {view: operating_state, basis: "annualized WM asset management revenues over period-end fee-based assets (the reported rate is on averages)", metric: wm_fee_rate, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.wm_daily_trades, name: "Morgan Stanley daily average revenue trades",
     attribute_kind: production_flow, unit: "thousand trades/day", family: lognormal, mean: 1100.0, scale: 0.12,
     features: {view: operating_state, basis: "self-directed daily average revenue trades", metric: wm_darts, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.wm_deposits, name: "Morgan Stanley WM deposits",
     attribute_kind: balance, unit: $bn, family: lognormal, mean: 410.0, scale: 0.04,
     features: {view: liabilities, basis: "Wealth Management bank deposits, period end (brokerage sweep plus savings and other)", metric: wm_deposits, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.wm_sweep_deposits, name: "Morgan Stanley WM brokerage sweep deposits",
     attribute_kind: balance, unit: $bn, family: lognormal, mean: 140.0, scale: 0.06,
     features: {view: liabilities, basis: "brokerage sweep deposits: client cash swept from brokerage accounts into the banks at low administered rates", metric: wm_sweep_deposits, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.wm_other_deposits, name: "Morgan Stanley WM savings and other deposits",
     attribute_kind: balance, unit: $bn, family: lognormal, mean: 270.0, scale: 0.05,
     features: {view: liabilities, basis: "savings, certificates of deposit and other WM deposits, priced nearer market rates", metric: wm_other_deposits, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.wm_deposit_cost, name: "Morgan Stanley WM cost of deposits",
     attribute_kind: rate, unit: pct, family: gaussian, prior: {family: gaussian, mu: 2.7, sigma: 0.15}, scale: 0.15,
     features: {view: operating_state, basis: "annualized weighted average cost of WM deposits, period average", metric: wm_cost_of_deposits, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.wm_loans, name: "Morgan Stanley WM loans",
     attribute_kind: balance, unit: $bn, family: lognormal, mean: 180.0, scale: 0.04,
     features: {view: operating_state, basis: "Wealth Management loans: securities-based lending (mostly floating) and residential mortgages", metric: wm_loans, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.wm_loan_rate, name: "Morgan Stanley interest rate earned on loans",
     attribute_kind: rate, unit: pct, family: gaussian, prior: {family: gaussian, mu: 5.4, sigma: 0.25}, scale: 0.25,
     features: {view: operating_state, basis: "yield on loans held for investment (firm; WM loans are most of them)", metric: loan_yield, prior: synthetic}}
  # --- Investment Management and Institutional Securities operating states ---------------------------------------------
  - {entity: morgan_stanley, id: morgan_stanley.im_aum, name: "Morgan Stanley IM assets under management",
     attribute_kind: balance, unit: $bn, family: lognormal, mean: 1900.0, scale: 0.05,
     features: {view: operating_state, basis: "IM assets under management or supervision (equity, fixed income, alternatives and solutions, liquidity)", metric: im_aum, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.im_net_flows, name: "Morgan Stanley IM net flows",
     attribute_kind: capital_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: 100.0, sigma: 40.0}, scale: 40.0,
     features: {view: operating_state, basis: "IM total net flows (long-term plus liquidity), per year", metric: im_net_flows, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.im_fee_rate, name: "Morgan Stanley IM fee rate",
     attribute_kind: rate, unit: bp, family: gaussian, prior: {family: gaussian, mu: 31.6, sigma: 1.5}, scale: 1.5,
     features: {view: operating_state, basis: "annualized IM management fees over period-end AUM (the reported rate is on averages)", metric: im_fee_rate, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.completed_ma_volume, name: "Morgan Stanley completed M&A volume",
     attribute_kind: production_flow, unit: $bn/yr, family: lognormal, mean: 750.0, scale: 0.15,
     features: {view: operating_state, basis: "dollar volume of completed M&A transactions the firm advised on, per year (announcements complete 2-4 quarters later)", metric: completed_ma_volume, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.prime_balances, name: "Morgan Stanley prime brokerage balances",
     attribute_kind: balance, unit: $bn, family: lognormal, mean: 190.0, scale: 0.08,
     features: {view: operating_state, basis: "customer receivables and other, average balance: mostly prime brokerage margin and debit balances (a proxy)", metric: prime_balances, prior: synthetic}}
  # --- capital, leverage and payout ------------------------------------------------------------------------------------
  - {entity: morgan_stanley, id: morgan_stanley.cet1_capital, name: "Morgan Stanley CET1 capital",
     attribute_kind: structural_level, unit: $bn, family: gaussian, prior: {family: gaussian, mu: 82.5, sigma: 3.0}, scale: 3.0,
     features: {view: capital, basis: "common equity tier 1 capital (incl. AOCI on AFS securities)", metric: cet1_capital, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.rwa, name: "Morgan Stanley risk-weighted assets",
     attribute_kind: balance, unit: $bn, family: lognormal, mean: 550.0, scale: 0.04,
     features: {view: capital, basis: "standardized risk-weighted assets (the binding approach)", metric: rwa_standardized, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.cet1_ratio, name: "Morgan Stanley CET1 ratio",
     attribute_kind: structural_level, unit: pct, family: gaussian, prior: {family: gaussian, mu: 15.0, sigma: 0.3}, scale: 0.3,
     features: {view: capital, basis: "CET1 capital over standardized RWA", metric: cet1_ratio, prior: synthetic}}
  - {entity: morgan_stanley, id: morgan_stanley.cet1_requirement, name: "Morgan Stanley CET1 requirement",
     attribute_kind: structural_level, unit: pct, family: gaussian, prior: {family: gaussian, mu: 11.8, sigma: 0.4}, scale: 0.4,
