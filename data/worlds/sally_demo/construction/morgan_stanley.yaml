      - {interaction_id: ms-c-pretax-tax, branch: tax}
      - {interaction_id: ms-a-ni-income-tax}
  - id: ms.path.recession
    name: "Morgan Stanley slower growth to credit costs"
    entity_id: morgan_stanley
    trigger: "US growth slows"
    endpoint: morgan_stanley.net_income
    description: "Slower growth raises unemployment, and CECL reserves on mortgages and corporate loans rise at once (securities-based loans are over-collateralized, so losses stay small). Growth also slows dealmaking through s09, a shared statistical record without a transition that is left untouched; its effect on fees runs through ms.path.deals_ib."
    steps:
      - {interaction_id: jpm-c-gdp-unemp, branch: labour}
      - {interaction_id: ms-c-unemp-provision}
      - {interaction_id: ms-a-pretax-provision-for-credit-losses}
      - {interaction_id: ms-a-ni-pretax-income, branch: earnings}
      - {interaction_id: ms-c-pretax-tax, branch: tax}
      - {interaction_id: ms-a-ni-income-tax}
  - id: ms.path.long_end
    name: "Morgan Stanley long-end yields to capital, fees and issuance"
    entity_id: morgan_stanley
    trigger: "long-end Treasury yields rise"
    endpoint: morgan_stanley.cet1_ratio
    description: "One move, parallel responses: AFS securities mark down into AOCI and CET1, the bond sleeve of fee-based assets falls, real-asset fund marks reverse carried interest, and refinancing is deferred. Dearer financing also defers deals through s74, a shared statistical record without a transition that is left untouched (its fees run through ms.path.deals_ib)."
    steps:
      - {interaction_id: ms-c-ust10-aoci, branch: marks}
      - {interaction_id: ms-c-ust10-feeassets, branch: bond_sleeve}
      - {interaction_id: ms-c-ust10-perf, branch: carry}
      - {interaction_id: ms-c-ust10-dcm, branch: issuance}
      - {interaction_id: ms-c-feeassets-amfees}
      - {interaction_id: ms-a-wm-wm-asset-mgmt-fees}
      - {interaction_id: ms-a-im-im-performance-fees}
      - {interaction_id: ms-a-ib-dcm-fees}
      - {interaction_id: ms-a-isg-ib-fees}
      - {interaction_id: ms-a-seg-wealth-revenue}
      - {interaction_id: ms-a-seg-im-revenue}
      - {interaction_id: ms-a-seg-isg-revenue}
      - {interaction_id: ms-a-pretax-net-revenue}
      - {interaction_id: ms-a-ni-pretax-income}
      - {interaction_id: ms-c-aoci-cet1}
      - {interaction_id: ms-c-ni-cet1}
      - {interaction_id: ms-c-cet1cap-ratio}
  - id: ms.path.balance_sheet
    name: "Morgan Stanley financing balances, leverage and buybacks"
    entity_id: morgan_stanley
    trigger: "client financing (prime brokerage) balances grow"
    endpoint: morgan_stanley.buybacks
    description: "Financing balances earn the financing spread but consume RWA and leverage exposure; when the leverage ratio binds, its headroom, not the CET1 ratio, limits buybacks."
    steps:
      - {interaction_id: ms-c-prime-financing, branch: revenue}
      - {interaction_id: ms-c-prime-rwa, branch: rwa}
      - {interaction_id: ms-c-prime-leverage, branch: leverage}
      - {interaction_id: ms-a-eq-equity-financing}
      - {interaction_id: ms-a-trd-equity-revenue}
      - {interaction_id: ms-a-isg-trading-revenue}
      - {interaction_id: ms-a-seg-isg-revenue}
      - {interaction_id: ms-a-pretax-net-revenue}
      - {interaction_id: ms-a-ni-pretax-income}
      - {interaction_id: ms-c-ni-cet1}
      - {interaction_id: ms-c-rwa-ratio}
      - {interaction_id: ms-c-cet1cap-ratio}
      - {interaction_id: ms-c-leverage-slr}
      - {interaction_id: ms-a-t1-cet1-capital}
      - {interaction_id: ms-c-tier1-slr}
      - {interaction_id: ms-c-ratio-buybacks}
      - {interaction_id: ms-c-slr-buybacks}
  - id: ms.path.capital_payout
    name: "Morgan Stanley capital and payout"
    entity_id: morgan_stanley
    trigger: "earnings accumulate"
    endpoint: morgan_stanley.buybacks
    description: "Net income adds to CET1 and supports the dividend; the excess over the requirement and buffer (or the leverage headroom when it binds) funds buybacks, which use capital in turn."
    steps:
      - {interaction_id: ms-c-ni-cet1, branch: retain}
      - {interaction_id: ms-c-ni-dividends, branch: dividend}
      - {interaction_id: ms-c-dividends-cet1}
      - {interaction_id: ms-c-cet1cap-ratio}
      - {interaction_id: ms-a-t1-cet1-capital}
      - {interaction_id: ms-c-tier1-slr}
      - {interaction_id: ms-c-ratio-buybacks}
      - {interaction_id: ms-c-slr-buybacks}
      - {interaction_id: ms-c-buyback-cet1}
  - id: ms.path.capital_requirements
    name: "Morgan Stanley capital requirements"
    entity_id: morgan_stanley
    trigger: "the stress capital buffer or surcharge rises"
    endpoint: morgan_stanley.cet1_ratio
    description: "A higher requirement (stress capital buffer from the annual stress test, or surcharge) leaves less excess to return; fewer buybacks keep CET1 and the ratio higher."
    steps:
      - {interaction_id: ms-c-req-buybacks}
      - {interaction_id: ms-c-buyback-cet1}
      - {interaction_id: ms-c-cet1cap-ratio}
      - {interaction_id: ms-a-t1-cet1-capital}
      - {interaction_id: ms-c-tier1-slr}
  - id: ms.path.expense_inflation
    name: "Morgan Stanley expense inflation and operating leverage"
    entity_id: morgan_stanley
    trigger: "core inflation rises"
    endpoint: morgan_stanley.net_income
    description: "Wage and vendor inflation raise the fixed costs; revenue-linked pay (incentives, the advisor payout) is the variable part and runs through the revenue paths. Operating leverage is revenue growth less expense growth."
    steps:
      - {interaction_id: ms-c-cpi-comp, branch: wages}
      - {interaction_id: ms-c-cpi-othernoncomp, branch: vendors}
      - {interaction_id: ms-a-exp-compensation-expense}
      - {interaction_id: ms-a-exp-other-noncomp-expense}
      - {interaction_id: ms-a-pretax-noninterest-expense}
      - {interaction_id: ms-a-ni-pretax-income, branch: earnings}
      - {interaction_id: ms-c-pretax-tax, branch: tax}
      - {interaction_id: ms-a-ni-income-tax}

compositions:
  - id: ms.comp.revenue_by_segment
    entity_id: morgan_stanley
    view: reporting_segments
    basis: "net revenues by reporting segment, US GAAP, with intersegment eliminations"
    unit: $bn/yr
    period: fiscal year ending December
    total: morgan_stanley.net_revenue
    members: [morgan_stanley.isg_revenue, morgan_stanley.wealth_revenue, morgan_stanley.im_revenue]
    eliminations: morgan_stanley.intersegment_eliminations
    note: "The driven view: Morgan Stanley's segments follow its drivers (markets and deals in ISG, client assets and rates in WM, AUM in IM). Segment revenues include intersegment amounts, eliminated once. Not the line view (ms.comp.revenue_by_line): never added to it."
  - id: ms.comp.isg
    entity_id: morgan_stanley
    view: reporting_segments
    basis: "Institutional Securities net revenues by business"
    unit: $bn/yr
    period: fiscal year ending December
    total: morgan_stanley.isg_revenue
    members: [morgan_stanley.trading_revenue, morgan_stanley.ib_fees]
    residual: morgan_stanley.isg_other_revenue
    note: "Sales and trading (Equity and Fixed Income) plus investment banking; the residual is ISG other (investments, the Japanese securities joint venture, lending fees and corporate-loan marks)."
  - id: ms.comp.trading
    entity_id: morgan_stanley
    view: product
    basis: "ISG sales and trading net revenues by product"
    unit: $bn/yr
    period: fiscal year ending December
    total: morgan_stanley.trading_revenue
    members: [morgan_stanley.equity_revenue, morgan_stanley.ficc_revenue]
    note: "An exact split as reported: no residual. Each product includes its own fees and net interest."
  - id: ms.comp.equity
    entity_id: morgan_stanley
    view: product
    basis: "Equity net revenues by business: financing and execution services"
    unit: $bn/yr
    period: fiscal year ending December
    total: morgan_stanley.equity_revenue
    members: [morgan_stanley.equity_financing, morgan_stanley.equity_execution]
    note: "An exact split as reported (the sum of the businesses' trading, fees, net interest and other). Financing earns on prime balances; execution on volumes and volatility."
  - id: ms.comp.ib
    entity_id: morgan_stanley
    view: product
    basis: "ISG investment banking revenues by product"
    unit: $bn/yr
    period: fiscal year ending December
    total: morgan_stanley.ib_fees
    members: [morgan_stanley.advisory_fees, morgan_stanley.ecm_fees, morgan_stanley.dcm_fees]
    note: "An exact split as reported: no residual."
  - id: ms.comp.wm
    entity_id: morgan_stanley
    view: reporting_segments
    basis: "Wealth Management net revenues by line"
    unit: $bn/yr
    period: fiscal year ending December
    total: morgan_stanley.wealth_revenue
    members: [morgan_stanley.wm_asset_mgmt_fees, morgan_stanley.wm_transactional, morgan_stanley.wm_nii]
    residual: morgan_stanley.wm_other_revenue
    note: "Asset-based fees (fee-based assets times the fee rate), transactional revenue, and net interest on bank deposits; the residual is WM other."
  - id: ms.comp.im
    entity_id: morgan_stanley
    view: reporting_segments
    basis: "Investment Management net revenues by line"
    unit: $bn/yr
    period: fiscal year ending December
    total: morgan_stanley.im_revenue
    members: [morgan_stanley.im_mgmt_fees, morgan_stanley.im_performance_fees]
    note: "An exact split as reported: management fees on AUM, and performance-based income and other (which can be negative when carried interest reverses)."
  - id: ms.comp.wm_deposits
    entity_id: morgan_stanley
    view: liabilities
    basis: "Wealth Management deposits by type, period end"
    unit: $bn
    period: period end
    total: morgan_stanley.wm_deposits
    members: [morgan_stanley.wm_sweep_deposits, morgan_stanley.wm_other_deposits]
    note: "An exact split: brokerage sweep (low administered rate) and savings and other (priced nearer market). Cash sorting moves balances between them and off the balance sheet."
  - id: ms.comp.revenue_by_line
    entity_id: morgan_stanley
    view: product
    basis: "net revenues by reported income-statement line, firm"
    unit: $bn/yr
    period: fiscal year ending December
    total: morgan_stanley.net_revenue
    members: [morgan_stanley.firm_nii, morgan_stanley.trading_line, morgan_stanley.ib_line, morgan_stanley.commissions_line, morgan_stanley.am_fees_line]
    residual: morgan_stanley.other_revenue_lines
    drives: false
    note: "Reported view, reconciled but undriven: each line cuts across segments (firm NII holds WM NII and ISG's financing cost; the trading line is not ISG sales and trading). Bridged to the segment view by size-free links only; never added to it."
  - id: ms.comp.nii
    entity_id: morgan_stanley
    view: investment_assets
    basis: "firm net interest income: interest income less interest expense"
    unit: $bn/yr
    period: fiscal year ending December
    total: morgan_stanley.firm_nii
    members: [morgan_stanley.interest_income, morgan_stanley.interest_expense]
    note: "An identity. Most gross interest is ISG's matched book (resale/repo, securities borrowed/loaned, customer receivables/payables), so firm NII is a small net of large flows; WM NII is the rate-sensitive part."
  - id: ms.comp.expense
    entity_id: morgan_stanley
    view: reporting_segments
    basis: "non-interest expenses by type (negative values)"
    unit: $bn/yr
    period: fiscal year ending December
    total: morgan_stanley.noninterest_expense
    members: [morgan_stanley.compensation_expense, morgan_stanley.brokerage_clearing_expense, morgan_stanley.technology_expense]
    residual: morgan_stanley.other_noncomp_expense
    note: "Compensation is the variable part (incentive accruals on ISG revenue, the advisor payout on WM revenue, deferred cash-based plans that follow markets); brokerage and clearing follows volumes."
  - id: ms.comp.pretax
    entity_id: morgan_stanley
    view: reporting_segments
    basis: "pretax income: net revenues less non-interest expenses less provision"
    unit: $bn/yr
    period: fiscal year ending December
    total: morgan_stanley.pretax_income
    members: [morgan_stanley.net_revenue, morgan_stanley.noninterest_expense, morgan_stanley.provision_for_credit_losses]
    note: "An identity: expenses and provision are negative values. Operating leverage is revenue growth less expense growth."
  - id: ms.comp.net_income
    entity_id: morgan_stanley
    view: reporting_segments
    basis: "net income applicable to Morgan Stanley: pretax income less income tax less noncontrolling interests"
    unit: $bn/yr
    period: fiscal year ending December
    total: morgan_stanley.net_income
    members: [morgan_stanley.pretax_income, morgan_stanley.income_tax]
    residual: morgan_stanley.noncontrolling_interests
    note: "An identity; preferred dividends come after this line (net income to common)."
  - id: ms.comp.pretax_by_segment
    entity_id: morgan_stanley
    view: reporting_segments
    basis: "pretax income by reporting segment, with intersegment eliminations"
    unit: $bn/yr
    period: fiscal year ending December
    total: morgan_stanley.pretax_income
