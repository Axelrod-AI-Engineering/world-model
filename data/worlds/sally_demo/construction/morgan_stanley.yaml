  - id: ms.path.net_new_assets
    name: "Morgan Stanley net new assets: the workplace and advisory funnel"
    entity_id: morgan_stanley
    trigger: "IPOs and liquidity events release stock-plan assets into workplace accounts"
    endpoint: morgan_stanley.net_income
    description: "Net new assets arrive through workplace stock plans and self-directed accounts, convert over years into fee-based advisory accounts, and bring cash that sweeps into the banks. Client assets and fee-based assets accumulate their flows (ms.sf.client_assets, ms.sf.fee_based_assets) and fees are assets times the fee rate (ms.id.wm_am_fees), so a fee-based flow reaches fees exactly; the funnel's own conversions are sign-only."
    steps:
      - {interaction_id: ms-c-deals-nna}
      - {interaction_id: ms-c-nna-feeflows, branch: advisory}
      - {interaction_id: ms-c-nna-clientassets, branch: assets}
