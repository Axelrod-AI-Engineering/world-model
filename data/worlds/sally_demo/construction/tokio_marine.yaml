  - {entity: tokio_marine, id: tokio_marine.jpc_bonds_yen, name: Tokio Marine Japan P&C yen bonds,
     attribute_kind: balance, unit: ¥bn, family: lognormal, mean: 3000.0, scale: 0.05,
