interactions:
  # ===================== accounting links (a part adds to its total, on that composition's basis) =====================
  # adjusted net income by business (m22, m23 in interactions.yaml are the international and Japan P&C parts)
  - id: tm-a-ani-life
    source: tokio_marine.japan_life_profit
    target: tokio_marine.operating_profit
    label: adds to group adjusted net income
    edge_type: accounting
    effect: {mu: 0.35, sigma: 0.001}
    kernel: {delay_days: 0, lag_days: 1, duration_days: null}
    transition:
      mechanism: "Japan Life adjusted net income is one part of group adjusted net income (company definition)"
      business_unit: Japan Life
      condition: "same basis (ANI, IFRS), same fiscal period and yen"
      timing: {onset: same reporting period, build: none, persistence: identity, recognition: quarterly results}
      evidence: {existence: documented, direction: documented, magnitude: model, timing: documented, sources: [tm.seg, tm.r1]}
      next_state: group adjusted net income
  - id: tm-a-ani-solution
    source: tokio_marine.solution_profit
    target: tokio_marine.operating_profit
    label: adds to group adjusted net income
    edge_type: accounting
    effect: {mu: 0.13, sigma: 0.001}
    kernel: {delay_days: 0, lag_days: 1, duration_days: null}
    transition:
      mechanism: "Solution and other businesses' adjusted net income is one part of group adjusted net income"
      business_unit: solution and other
      condition: "same basis (ANI, IFRS), same fiscal period"
      timing: {onset: same reporting period, build: none, persistence: identity, recognition: quarterly results}
      evidence: {existence: documented, direction: documented, magnitude: model, timing: documented, sources: [tm.seg, tm.r1]}
      next_state: group adjusted net income
  - id: tm-a-ani-adjust
    source: tokio_marine.ani_consolidation_adjustment
    target: tokio_marine.operating_profit
    label: adds to group adjusted net income
    edge_type: accounting
    effect: {mu: 0.21, sigma: 0.001}
    kernel: {delay_days: 0, lag_days: 1, duration_days: null}
    transition:
      mechanism: "Consolidation adjustments and unallocated items reconcile the business parts to the group total (usually negative)"
      business_unit: group
      condition: "same basis (ANI, IFRS)"
      timing: {onset: same reporting period, build: none, persistence: identity, recognition: quarterly results}
      evidence: {existence: documented, direction: documented, magnitude: model, timing: documented, sources: [tm.seg, tm.r1]}
      next_state: group adjusted net income
  # statutory net income = adjusted net income + reconciling adjustments (R2: definitions reconciled, never merged)
  - id: tm-a-ni-ani
    source: tokio_marine.operating_profit
    target: tokio_marine.net_income_ifrs
