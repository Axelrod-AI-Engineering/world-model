  - {entity: tokio_marine, id: tokio_marine.seg_domestic_life, name: Tokio Marine domestic life segment profit,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: lognormal, mean: 40.0, scale: 0.4,
     features: {view: reporting_segments, basis: "JGAAP segment: domestic life insurance", metric: jgaap_segment_profit_domestic_life, prior: synthetic}}
  - {entity: tokio_marine, id: tokio_marine.seg_international, name: Tokio Marine international segment profit,
