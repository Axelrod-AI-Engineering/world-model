      business_unit: solution and other
      condition: "margin stable; costs scale with revenue"
      condition_observable: "solution revenue and adjusted net income"
      timing: {onset: same period, build: none, persistence: while the margin holds, recognition: quarterly results}
      evidence: {existence: documented, direction: inferred, magnitude: unknown, timing: inferred, sources: [tm.seg]}
      breaker: "margin compression; integration costs of acquired service businesses"
      next_state: solution adjusted net income
      unresolved:
        - {input: "solution revenue and margin history", status: "found_connected", searched: ["tm.seg"], found_in: ["tm.seg"], note: "revenue guidance by business includes the solution businesses (bound by a citation); no margin series; a product identity (profit = revenue x margin) waits on a margin value"}
  - id: tm-sf-parent-domestic
    source: tokio_marine.domestic_subsidiary_dividends
    target: tokio_marine.excess_capital
    label: adds parent cash
    edge_type: stock_flow
    identity: tm.sf.parent_capital
    transition:
      mechanism: "Dividends from domestic subsidiaries add to capital available at the parent (stock-flow tm.sf.parent_capital)"
      sign: "+"
      actor: group capital management
      business_unit: group
      condition_observable: "holding-company cash"
      timing: {onset: on receipt, build: none, persistence: until used, recognition: holding-company accounts}
      evidence: {existence: inferred, direction: inferred, magnitude: inferred, timing: unknown, sources: [tm.pub]}
      breaker: "holding-company obligations"
      next_state: deployable excess capital
  - id: tm-c-remit-capital
    source: tokio_marine.overseas_remittances
    target: tokio_marine.domestic_subsidiary_dividends
    label: is paid up through the Japan P&C subsidiary
    calibration: uncalibrated
    note: "plan round: the overseas companies are held by the Japan P&C subsidiary, whose dividend income from overseas entities carries the remittances; they reach the holding company inside that subsidiary's dividend, so they are not a second inflow to parent capital (R13)"
    transition:
      mechanism: "Overseas subsidiaries remit dividends to their Japan P&C parent company, which pays them up to the holding company as part of its own dividend; the holding company's dividends received are the one inflow to parent capital"
      sign: "+"
      actor: group capital management
      business_unit: group
      condition: "the Japan P&C subsidiary pays the remittance on rather than retaining it"
      condition_observable: "Japan P&C dividends from overseas entities; holding-company dividends received from subsidiaries"
      timing: {onset: on receipt, build: up to a year (dividend calendar), persistence: until used, recognition: parent accounts}
      evidence: {existence: documented, direction: documented, magnitude: unknown, timing: inferred, sources: [tm.pk.pres_20260520, tm.pk.yuho_fy2025]}
      breaker: "retention in the Japan P&C subsidiary for its own capital needs"
      next_state: dividends from domestic subsidiaries
  - id: tm-c-ani-returns
    source: tokio_marine.operating_profit
    target: tokio_marine.shareholder_returns
    label: sets payout under the dividend policy
    calibration: uncalibrated
    transition:
      mechanism: "Dividends follow a payout policy on adjusted net income; a higher recurring profit supports a higher payout, by board decision"
      sign: "+"
      actor: board
      business_unit: group
      condition: "solvency within or above target; payout policy unchanged"
      condition_observable: "dividend per share and payout ratio announcements"
      timing: {onset: next fiscal-year decision, build: annual, persistence: progressive dividend policy, recognition: on declaration}
      evidence: {existence: documented, direction: documented, magnitude: unknown, timing: documented, sources: [tm.r1, tm.seg, tm.r5]}
      breaker: "capital stress; payout constraints; per-share figures need split normalization"
      next_state: shareholder returns
  - id: tm-c-ani-esr
    source: tokio_marine.operating_profit
    target: tokio_marine.esr
    label: adds retained capital
    calibration: uncalibrated
    note: "not converted: the solvency ratio is economic capital over required capital, a ratio whose numerator and denominator are not held as values (the shock values are disclosed but not supplied); stays sign-only"
    transition:
      mechanism: "Earnings retained after payout add to economic capital (earnings capacity, distinct from cash and regulatory capital)"
      sign: "+"
      actor: group
      business_unit: group
      condition_observable: "ESR roll-forward"
      timing: {onset: period end, build: none, persistence: cumulative, recognition: solvency reporting}
      evidence: {existence: inferred, direction: inferred, magnitude: unknown, timing: unknown, sources: [tm.pub]}
      breaker: "payout above earnings"
      next_state: economic solvency ratio

paths:
  - id: tm.path.policy_growth
    name: Tokio Marine policy growth
    entity_id: tokio_marine
    trigger: "customers' insurable exposures grow (vehicles, property, commercial activity)"
    endpoint: tokio_marine.operating_profit
    description: "Exposure growth reaches profit only through earned premium at adequate prices; written premium is not earned profit."
    steps:
      - {interaction_id: tm-c-exposure}
      - {interaction_id: tm-c-exposure-premium}
      - {interaction_id: tm-c-premium-earned}
      - {interaction_id: tm-i-uw-revenue}
      - {interaction_id: tm-a-jpc-insurance}
      - {interaction_id: m23}
  - id: tm.path.claims_inflation_repricing
    name: Tokio Marine claims inflation and repricing
    entity_id: tokio_marine
    trigger: "repair parts, construction and service costs rise"
    endpoint: tokio_marine.operating_profit
    description: "Claims costs hit losses and open-claim reserves first; underwriting review reprices with a lag, retention pushes back, and the new rates earn through over a year."
    steps:
      - {interaction_id: tm-c-cpi-severity}
      - {interaction_id: tm-c-severity-loss, branch: losses}
      - {interaction_id: tm-c-severity-reserves, branch: reserves}
      - {interaction_id: tm-c-loss-repricing}
      - {interaction_id: tm-c-rate-retention, branch: retention}
      - {interaction_id: tm-c-rate-premium, branch: premium}
      - {interaction_id: tm-c-rate-loss, branch: margin}
      - {interaction_id: tm-c-retention-premium}
      - {interaction_id: tm-c-loss-profit}
      - {interaction_id: tm-c-premium-earned}
      - {interaction_id: tm-i-uw-claims}
      - {interaction_id: tm-i-uw-revenue}
      - {interaction_id: tm-a-jpc-insurance}
      - {interaction_id: m23}
  - id: tm.path.us_liability_reserves
    name: Tokio Marine US liability reserves and specialty repricing
    entity_id: tokio_marine
    trigger: "US liability claim costs (legal and social inflation) rise"
    endpoint: tokio_marine.operating_profit
    description: "The same severity trend reaches Japan P&C (US cover of Japanese clients) and the international units as reserve charges, and the international books as repricing."
    steps:
      - {interaction_id: tm-c-usliab-tmnf, branch: japan_pc}
      - {interaction_id: tm-c-usliab-intl, branch: international}
      - {interaction_id: tm-c-usliab-reprice, branch: repricing}
      - {interaction_id: tm-c-tmnf-usliab-profit}
      - {interaction_id: tm-c-intl-pyd-profit}
      - {interaction_id: tm-c-intl-rate-profit, branch: margin}
      - {interaction_id: tm-c-intl-rate-npw, branch: volume}
      - {interaction_id: tm-c-intl-npw-profit}
      - {interaction_id: tm-i-uw-claims}
      - {interaction_id: tm-a-jpc-insurance}
      - {interaction_id: tm-a-intl-insurance}
      - {interaction_id: tm-a-intl-translate}
      - {interaction_id: m22}
      - {interaction_id: m23}
  - id: tm.path.catastrophe_reinsurance
    name: Tokio Marine catastrophes and reinsurance
    entity_id: tokio_marine
    trigger: "a heavy domestic catastrophe season"
    endpoint: tokio_marine.operating_profit
    steps:
      - {interaction_id: tm-c-cat-profit, branch: losses}
      - {interaction_id: tm-c-cat-reins, branch: reinsurance}
      - {interaction_id: tm-c-reins-profit, branch: ceded}
      - {interaction_id: tm-c-reins-rates, branch: pass_through}
      - {interaction_id: tm-c-cat-recoveries, branch: recoveries}
      - {interaction_id: tm-c-recoveries-claims}
      - {interaction_id: tm-i-uw-claims}
      - {interaction_id: tm-i-uw-revenue}
      - {interaction_id: tm-a-jpc-insurance}
      - {interaction_id: m23}
  - id: tm.path.reinvestment
    name: Tokio Marine reinvestment
    entity_id: tokio_marine
    trigger: "existing holdings mature or pay while market yields differ from book yields"
    endpoint: tokio_marine.operating_profit
    description: "The reviewer's six steps. (1) Bonds due within a year redeem and free cash; coupons and net underwriting cash add to it. (2) Cash held for claims and liquidity is deducted (tm.comp.jpc_cash_sources). (3) The deployed share is allocated by class, currency and hedge (identities), and each class is a stock rolled forward by purchases and redemptions. (4) Income over the holding period: the book yield moves toward the new-money yield only through what is reinvested (sign flips below the book yield); gross income = assets x yield, net of the hedged slice's cost. (5) The net investment result joins underwriting in Japan P&C adjusted net income (IFRS). (6) Japan P&C reaches group adjusted net income; dividends to the holding company, parent capital and solvency are separate branches. A new market yield is never applied to the whole portfolio; the redemption and allocation entries stay unsized until the pack's ladder and holdings are read."
    steps:
      - {interaction_id: tm-c-portfolio-cash}
      - {interaction_id: tm-a-cash-maturities}
      - {interaction_id: tm-c-cash-invest}
      - {interaction_id: tm-c-invest-income, branch: yield}
      - {interaction_id: tm-i-jpc-new-yen, branch: allocation}
      - {interaction_id: tm-sf-jpc-yen-new}
      - {interaction_id: tm-a-assets-yen}
      - {interaction_id: tm-i-jpc-nii-assets}
      - {interaction_id: tm-i-jpc-nii-yield}
      - {interaction_id: tm-i-jpc-nii-gross}
      - {interaction_id: tm-a-jpc-nii}
      - {interaction_id: tm-a-jpc-financial}
      - {interaction_id: m23}
      - {interaction_id: tm-sf-jpc-yen-maturities, branch: runoff}
      - {interaction_id: tm-c-jpc-dividends, branch: parent}
      - {interaction_id: tm-c-ani-returns, branch: payout}
      - {interaction_id: tm-c-ani-esr, branch: capital}
  - id: tm.path.domestic_yields
    name: Tokio Marine domestic yields to reinvestment income
    entity_id: tokio_marine
    trigger: "super-long JGB yields rise"
    endpoint: tokio_marine.operating_profit
    description: "A JGB move reaches only the new money invested at that tenor, while the liability unwind absorbs part; Japan Life is the long-duration book. m21 is the reduced-form summary of this path and is never added to it."
    steps:
      - {interaction_id: tm-c-jgb30-nmy, branch: assets}
      - {interaction_id: tm-c-jgb30-ife, branch: liabilities}
      - {interaction_id: tm-c-jgb30-life, branch: life}
      - {interaction_id: tm-c-nmy-income}
      - {interaction_id: tm-i-jpc-nii-yield}
      - {interaction_id: tm-i-jpc-nii-gross}
      - {interaction_id: tm-a-jpc-nii}
      - {interaction_id: tm-a-jpc-ife}
      - {interaction_id: tm-a-jpc-financial}
      - {interaction_id: m23}
      - {interaction_id: tm-a-ani-life}
  - id: tm.path.international_reinvestment
    name: Tokio Marine US yields to international investment income
    entity_id: tokio_marine
    trigger: "US Treasury yields rise"
    endpoint: tokio_marine.operating_profit
    description: "US yields reach the share of the North America book that reinvests, net of the liability unwind; m20 is the reduced-form summary and is never added to it."
    steps:
      - {interaction_id: tm-c-ust-nmy, branch: assets}
      - {interaction_id: tm-c-ust-ife, branch: liabilities}
      - {interaction_id: tm-c-intl-nmy-income}
      - {interaction_id: tm-a-intl-nii}
      - {interaction_id: tm-a-intl-ife}
      - {interaction_id: tm-a-intl-financial}
      - {interaction_id: tm-a-intl-translate}
      - {interaction_id: m22}
  - id: tm.path.fx_hedge_cost
    name: Tokio Marine FX hedge cost
    entity_id: tokio_marine
    trigger: "the US-Japan short-rate gap widens"
    endpoint: tokio_marine.operating_profit
    steps:
      - {interaction_id: tm-c-fed-hedge}
      - {interaction_id: tm-c-hedge-nii}
      - {interaction_id: tm-a-hedge-financial}
      - {interaction_id: tm-a-jpc-finother}
      - {interaction_id: tm-a-jpc-financial}
      - {interaction_id: m23}
  - id: tm.path.overseas_translation
    name: Tokio Marine overseas translation
    entity_id: tokio_marine
    trigger: "the yen weakens against the dollar"
    endpoint: tokio_marine.operating_profit
    description: "Translation raises yen overseas profit while foreign-currency claims reserves in Japan P&C cost part of it back; overseas share is not the FX sensitivity."
    steps:
      - {interaction_id: m19, branch: translation}
      - {interaction_id: tm-c-fx-reserves, branch: reserves}
      - {interaction_id: m22}
      - {interaction_id: m23}
  - id: tm.path.asset_marks_liabilities
    name: Tokio Marine asset marks and liability valuation
    entity_id: tokio_marine
    trigger: "super-long JGB yields move"
    endpoint: tokio_marine.esr
    description: "Asset marks and liability valuation are parallel routes to equity and solvency; neither is subtracted from recurring income."
    steps:
      - {interaction_id: tm-c-jgb-bondmark, branch: assets}
      - {interaction_id: tm-c-jgb-liability, branch: liabilities}
      - {interaction_id: tm-c-bondmark-equity, branch: equity}
      - {interaction_id: tm-c-bondmark-esr, branch: solvency}
      - {interaction_id: tm-c-liability-oci-equity, branch: liability_equity}
      - {interaction_id: tm-c-liability-esr}
  - id: tm.path.equity_marks
    name: Tokio Marine equity marks on business-related holdings
    entity_id: tokio_marine
    trigger: "Japanese equities move"
    endpoint: tokio_marine.esr
    steps:
      - {interaction_id: tm-c-topix-xholding}
      - {interaction_id: tm-c-xholding-equity, branch: equity}
      - {interaction_id: tm-c-xholding-esr, branch: solvency}
  - id: tm.path.cross_holding_disposal
    name: Tokio Marine cross-holding disposal
    entity_id: tokio_marine
    trigger: "management sells business-related equities under the reduction programme"
    endpoint: tokio_marine.excess_capital
    description: "Disposal -> earnings, cash and risk -> parent resources and solvency -> allocation. Proceeds and realized gains are capital, not recurring income: the only route into adjusted net income is the forgone dividend (negative); the gain is J-GAAP segment profit of the seller and, on IFRS, moves within equity. Cash reaches the parent as subsidiary dividends, then funds returns or acquisitions."
    steps:
      - {interaction_id: tm-c-sale-dividends, branch: income}
      - {interaction_id: tm-c-sale-book, branch: book}
      - {interaction_id: tm-c-sale-esr, branch: risk}
      - {interaction_id: tm-c-sale-gains, branch: gains}
      - {interaction_id: tm-c-sale-capital, branch: cash}
      - {interaction_id: tm-c-gains-segment}
      - {interaction_id: tm-a-inc-domeq}
      - {interaction_id: tm-c-jtd-nii}
      - {interaction_id: tm-a-jpc-nii}
      - {interaction_id: tm-a-jpc-financial}
      - {interaction_id: m23}
      - {interaction_id: tm-sf-parent-domestic}
      - {interaction_id: tm-c-capital-returns, branch: returns}
      - {interaction_id: tm-c-capital-ma, branch: redeploy}
  - id: tm.path.japan_life_rates
    name: Tokio Marine Japan Life rates
    entity_id: tokio_marine
    trigger: "super-long JGB yields move"
    endpoint: tokio_marine.operating_profit
    description: "Two measures, parallel: embedded value (a value measure, sized from the EV rate sensitivity, asymmetric) and IFRS profit (new-money income on the life book); they are never added."
    steps:
      - {interaction_id: tm-c-jgb-ev, branch: value}
      - {interaction_id: tm-c-jgb30-life, branch: earnings}
      - {interaction_id: tm-a-ani-life}
  - id: tm.path.japan_life_lapse
    name: Tokio Marine Japan Life lapses
    entity_id: tokio_marine
    trigger: "surrender and lapse experience worsens"
    endpoint: tokio_marine.operating_profit
    steps:
      - {interaction_id: tm-c-lapse-ev, branch: value}
      - {interaction_id: tm-c-lapse-life, branch: earnings}
      - {interaction_id: tm-a-ani-life}
  - id: tm.path.per_share
    name: Tokio Marine per-share value
    entity_id: tokio_marine
    trigger: "a buyback programme or a change in the share count (including the stock split)"
    endpoint: tokio_marine.dps
    description: "Capital returned by buyback retires shares; adjusted EPS = adjusted net income / shares (identity); the dividend follows EPS by policy. Per-share series break at the stock split (a corporate action held as a dated local event)."
    steps:
      - {interaction_id: tm-c-capital-returns}
      - {interaction_id: tm-c-returns-shares}
      - {interaction_id: tm-i-eps-shares}
      - {interaction_id: tm-c-eps-dps}
  - id: tm.path.growth_execution
    name: Tokio Marine growth execution
    entity_id: tokio_marine
    trigger: "an acquisition opportunity within risk appetite"
    endpoint: tokio_marine.operating_profit
    steps:
      - {interaction_id: tm-c-capital-ma}
      - {interaction_id: tm-c-ma-earnings, branch: earnings}
      - {interaction_id: tm-c-ma-esr, branch: capital}
      - {interaction_id: tm-c-acquired-intl}
      - {interaction_id: tm-a-intl-translate}
      - {interaction_id: m22}
  - id: tm.path.capital_payout
    name: Tokio Marine capital and payout
    entity_id: tokio_marine
    trigger: "overseas subsidiaries earn and can remit"
    endpoint: tokio_marine.shareholder_returns
    description: "Earnings capacity, parent cash, available capital and board payout policy are distinct; a profit move does not by itself decide a dividend."
    steps:
      - {interaction_id: tm-c-intl-remit}
      - {interaction_id: tm-c-remit-capital}
      - {interaction_id: tm-sf-parent-domestic}
      - {interaction_id: tm-c-capital-returns}

  - id: tm.path.domestic_dividends
    name: Tokio Marine domestic subsidiaries to parent capital
    entity_id: tokio_marine
    trigger: "Japan P&C profit changes (Japan Life reaches the same dividends through tm-c-life-dividends)"
    endpoint: tokio_marine.shareholder_returns
    description: "Each domestic business reaches the holding company's usable capital only through dividends; group adjusted net income is not parent cash. Parent capital accumulates dividends and remittances less returns and acquisitions (tm.sf.parent_capital)."
    steps:
      - {interaction_id: tm-c-jpc-dividends}
      - {interaction_id: tm-sf-parent-domestic}
      - {interaction_id: tm-c-capital-returns}
compositions:
  - id: tm.comp.ani_by_business
    entity_id: tokio_marine
    view: reporting_segments
    basis: "adjusted net income by business, company definition (IFRS from FY3/27; excludes gains on business-related equities)"
    unit: ¥bn/yr
    period: fiscal year ending March
    total: tokio_marine.operating_profit
    members: [tokio_marine.international_profit, tokio_marine.japan_pc_profit, tokio_marine.japan_life_profit, tokio_marine.solution_profit]
    eliminations: tokio_marine.ani_consolidation_adjustment
    note: "Not the J-GAAP segment-profit view (tm.comp.jgaap_segments): different basis, perimeter and tax treatment."
  - id: tm.comp.jpc_assets_by_class
    entity_id: tokio_marine
    view: investment_assets
    basis: "Japan P&C investment assets by class and currency treatment (yen bonds, hedged foreign bonds, unhedged foreign bonds, other)"
    unit: ¥bn
    period: fiscal year end
    total: tokio_marine.jpc_investment_portfolio
    members: [tokio_marine.jpc_bonds_yen, tokio_marine.jpc_bonds_foreign_hedged, tokio_marine.jpc_bonds_foreign_unhedged]
    residual: tokio_marine.jpc_assets_nonbond
    note: "Drives the portfolio: each class is a stock rolled forward by its purchases (and, for yen bonds, its redemptions). Levels are synthetic until the pack's holdings by class and currency are read; a subsidiary-only table is another scope (R14)."
  - id: tm.comp.jpc_yen_bond_ladder
    entity_id: tokio_marine
    view: investment_assets
    basis: "Japan P&C yen bonds by remaining maturity"
    unit: ¥bn
    period: fiscal year end
    total: tokio_marine.jpc_bonds_yen
    members: [tokio_marine.jpc_yen_bonds_due_1y, tokio_marine.jpc_yen_bonds_due_1_5y, tokio_marine.jpc_yen_bonds_due_5_10y]
    residual: tokio_marine.jpc_yen_bonds_due_10y_plus
    drives: false
    note: "Reconciling view: the stock-flow drives the yen bonds; the ladder binds the redemption schedule and feeds redemptions from its first bucket. Buckets do not age into each other. The schedule is disclosed in the securities report (group scope), not supplied yet."
  - id: tm.comp.jpc_cash_sources
    entity_id: tokio_marine
    view: investment_assets
    basis: "Japan P&C cash available to reinvest: redemptions + cash investment income + net underwriting cash - cash held for claims and liquidity"
    unit: ¥bn/yr
    period: fiscal year ending March
    total: tokio_marine.jpc_reinvestable_cash
    members: [tokio_marine.jpc_bond_maturities, tokio_marine.jpc_investment_cash_income, tokio_marine.jpc_operating_cash]
    eliminations: tokio_marine.jpc_cash_reserved_liquidity
    note: "The reviewer's first two reinvestment steps: cash freed, less cash constrained for claims and liquidity."
  - id: tm.comp.international_regions
    entity_id: tokio_marine
    view: regions
    basis: "International adjusted net income by region (IFRS, yen): North America, EMEA, Latin America, Asia-Pacific"
    unit: ¥bn/yr
    period: fiscal year ending March
    total: tokio_marine.international_profit
    members: [tokio_marine.intl_ani_north_america, tokio_marine.intl_ani_emea, tokio_marine.intl_ani_latam, tokio_marine.intl_ani_apac]
    residual: tokio_marine.intl_ani_unallocated
    drives: false
    note: "Reconciling view: the international total is driven by local results translated at USD/JPY (tm.comp.international_local, m19); the regions bind where the company reports them. The business-unit view (tm.comp.international_units) is on another basis."
  - id: tm.comp.group_debt_cash_flows
    entity_id: tokio_marine
    view: investment_assets
    basis: "Group debt securities: undiscounted principal and coupon cash flows by time to receipt (IFRS liquidity-risk maturity analysis, all segments and currencies)"
    unit: ¥bn
    period: fiscal year end
    total: tokio_marine.group_debt_cf_undiscounted
    members: [tokio_marine.group_debt_cf_due_1y, tokio_marine.group_debt_cf_due_1_5y]
    residual: tokio_marine.group_debt_cf_after_5y
    drives: false
    note: "Reconciling view at group scope. It is not the Japan P&C yen-bond ladder (tm.comp.jpc_yen_bond_ladder): it covers every segment and currency and counts coupons, so it never sizes Japan P&C redemptions (R14)."
  - id: tm.comp.net_income_bridge
    entity_id: tokio_marine
    view: reporting_segments
    basis: "IFRS: net income attributable to owners = adjusted net income (company definition) + reconciling adjustments"
    unit: ¥bn/yr
    period: fiscal year ending March
    total: tokio_marine.net_income_ifrs
    members: [tokio_marine.operating_profit]
    residual: tokio_marine.ani_to_ni_adjustments
    note: "Three profit definitions stay separate values: statutory (this total), adjusted (tokio_marine.operating_profit, a legacy id whose metric is adjusted_net_income) and J-GAAP segment profit (tm.comp.jgaap_segments). Adjusted and statutory reconcile here; segment profit does not reconcile to either (J-GAAP, pre-tax, another perimeter) and is never added to them."
  - id: tm.comp.jgaap_segments
    entity_id: tokio_marine
    view: reporting_segments
    basis: "J-GAAP reportable-segment profit (pre-tax, ordinary-profit based), history through FY3/26"
    unit: ¥bn/yr
    period: fiscal year ending March
    total: tokio_marine.segment_profit
    members: [tokio_marine.seg_domestic_nonlife, tokio_marine.seg_domestic_life, tokio_marine.seg_international, tokio_marine.seg_financial_businesses]
    eliminations: tokio_marine.seg_adjustments
    note: "No identity to adjusted net income; never added to tm.comp.ani_by_business."
  - id: tm.comp.japan_pc_ani
    entity_id: tokio_marine
    view: underwriting
    basis: "Japan P&C adjusted net income: insurance-related plus financial-related profit, less tax and other (IFRS)"
    unit: ¥bn/yr
    period: fiscal year ending March
    total: tokio_marine.japan_pc_profit
    members: [tokio_marine.jpc_insurance_profit, tokio_marine.jpc_financial_profit]
    residual: tokio_marine.jpc_tax_and_adjustments
  - id: tm.comp.japan_pc_financial
    entity_id: tokio_marine
    view: investment_assets
    basis: "Japan P&C financial-related profit: net investment income less insurance finance expense plus other (IFRS, pre-tax)"
    unit: ¥bn/yr
    period: fiscal year ending March
    total: tokio_marine.jpc_financial_profit
    members: [tokio_marine.jpc_net_investment_income, tokio_marine.jpc_insurance_finance_expense]
    residual: tokio_marine.jpc_financial_residual
  - id: tm.comp.international_local
    entity_id: tokio_marine
    view: regions
    basis: "international adjusted net income in local currency (USD-equivalent at the plan rate): insurance plus financial-related profit, less tax and other"
    unit: $bn/yr
    period: fiscal year ending March
    total: tokio_marine.intl_profit_local
    members: [tokio_marine.intl_insurance_profit, tokio_marine.intl_financial_profit]
    residual: tokio_marine.intl_tax_and_adjustments
    note: "Translated into the yen value by tm-a-intl-translate at the period-average rate (m19 carries the rate)."
  - id: tm.comp.international_financial
    entity_id: tokio_marine
    view: investment_assets
    basis: "international financial-related profit: net investment income less insurance finance expense plus other (IFRS, local currency, pre-tax)"
    unit: $bn/yr
    period: fiscal year ending March
    total: tokio_marine.intl_financial_profit
    members: [tokio_marine.intl_net_investment_income, tokio_marine.intl_insurance_finance_expense]
    residual: tokio_marine.intl_financial_residual
  - id: tm.comp.international_units
    entity_id: tokio_marine
    view: regions
    basis: "international business-unit profit by unit, pre-IFRS company basis (yen)"
    unit: ¥bn/yr
    period: fiscal year ending March
    total: tokio_marine.intl_bup
    members: [tokio_marine.intl_phly_profit, tokio_marine.intl_dfg_profit, tokio_marine.intl_tmhcc_profit]
    residual: tokio_marine.intl_other_bup
    note: "Overseas is not one exposure: the asset-intensive unit is investment-income heavy, the specialty units underwriting heavy. Bridged to the IFRS value by an uncalibrated definitional link."
  - id: tm.comp.tmnf_lines
    entity_id: tokio_marine
    view: underwriting
    basis: "J-GAAP net premiums written by line, main P&C company"
    unit: ¥bn/yr
    period: fiscal year ending March
    total: tokio_marine.tmnf_npw
    members: [tokio_marine.tmnf_npw_fire, tokio_marine.tmnf_npw_auto, tokio_marine.tmnf_npw_marine_pa_specialty]
    residual: tokio_marine.tmnf_npw_cali
    note: "An activity measure, not profit; compulsory auto liability is a no-profit, no-loss line."
  - id: tm.comp.tmnf_income_by_asset
    entity_id: tokio_marine
    view: investment_assets
    basis: "J-GAAP net interest and dividends by asset class, main P&C company"
    unit: ¥bn/yr
    period: fiscal year ending March
    total: tokio_marine.tmnf_interest_dividends
    members: [tokio_marine.tmnf_div_domestic_equity, tokio_marine.tmnf_div_foreign_equity, tokio_marine.tmnf_inc_domestic_bonds, tokio_marine.tmnf_inc_foreign_securities]
    residual: tokio_marine.tmnf_inc_residual
    note: "Income by asset class only: balances by class, maturity ladder, currency and hedge notional are not in the sources read, so none is represented."
  - id: tm.comp.capital_sources_uses
    entity_id: tokio_marine
    view: capital
    basis: "sources and uses of deployable capital (not an additive partition; flows into a stock)"
    unit: ¥bn
    total: tokio_marine.excess_capital
    members: [tokio_marine.operating_profit, tokio_marine.cross_holding_sales, tokio_marine.overseas_remittances, tokio_marine.shareholder_returns, tokio_marine.acquisition_spend]
    additive: false
    note: "Earnings capacity, parent cash, available regulatory capital and payout policy are related but distinct."

# Oct 18 conversion: exact relationships that are not sums. Weights are derived from the construction levels and scales
# (model/construction.identity_weights, stock_flow_weights), never written.
identities:
  - {id: tm.id.jpc_gross_income, entity_id: tokio_marine, form: product, target: tokio_marine.jpc_gross_investment_income,
     factors: [tokio_marine.jpc_investment_portfolio, tokio_marine.jpc_income_yield], coefficient: 0.01,
     unit_check: "¥bn/yr = ¥bn x %/yr x 0.01", basis: "IFRS, Japan P&C, the company's own investment income and assets under management",
     period: fiscal year,
     note: "the income yield is defined by this identity (gross investment income over assets); reinvestment and new-money yields act on it, never a market yield on the whole book"}
  - {id: tm.id.jpc_uw, entity_id: tokio_marine, form: difference, target: tokio_marine.jpc_insurance_profit,
     of: tokio_marine.jpc_insurance_revenue, minus: [tokio_marine.jpc_claims_incurred, tokio_marine.jpc_uw_expenses],
     unit_check: "¥bn/yr = ¥bn/yr - ¥bn/yr - ¥bn/yr", basis: "IFRS 17, Japan P&C, net of reinsurance held", period: fiscal year,
     note: "insurance service result: revenue less incurred claims and expenses; the reinsurance result is held net in revenue and claims"}
  - {id: tm.id.jpc_nii, entity_id: tokio_marine, form: difference, target: tokio_marine.jpc_net_investment_income,
     of: tokio_marine.jpc_gross_investment_income, minus: [tokio_marine.jpc_investment_expenses],
     unit_check: "¥bn/yr = ¥bn/yr - ¥bn/yr", basis: "IFRS, Japan P&C (the company's breakdown: interest and dividend income less investment expenses)", period: fiscal year,
     note: "the hedge cost is not in this identity: the breakdown has no hedge line inside net investment income, so it is charged to other financial items (tm-a-hedge-financial)"}
  - {id: tm.id.jpc_hedge_cost, entity_id: tokio_marine, form: product, target: tokio_marine.jpc_hedge_cost_amount,
     factors: [tokio_marine.jpc_bonds_foreign_hedged, tokio_marine.fx_hedge_cost], coefficient: 0.01,
     unit_check: "¥bn/yr = ¥bn x %/yr x 0.01", basis: "Japan P&C hedged foreign bonds", period: fiscal year,
     note: "the hedge slice only: unhedged foreign bonds carry currency risk, not hedge cost"}
  - {id: tm.id.adjusted_eps, entity_id: tokio_marine, form: ratio, target: tokio_marine.adjusted_eps,
     numerator: [tokio_marine.operating_profit], denominator: [tokio_marine.shares_outstanding], coefficient: 1000.0,
     unit_check: "¥/share = 1000 x ¥bn / mn shares", basis: "IFRS adjusted net income over shares outstanding, pre-split basis",
     note: "a per-share series breaks at the stock split: divide the earlier values by the split ratio to compare"}
  - {id: tm.id.jpc_new_money, entity_id: tokio_marine, form: product, target: tokio_marine.jpc_new_investments,
     factors: [tokio_marine.jpc_reinvestable_cash, tokio_marine.jpc_deployment_share], coefficient: 0.01,
     unit_check: "¥bn/yr = ¥bn/yr x % x 0.01", basis: "Japan P&C", period: fiscal year,
     note: "the deployment share is not disclosed (synthetic prior)"}
  - {id: tm.id.jpc_new_yen, entity_id: tokio_marine, form: product, target: tokio_marine.jpc_new_yen_bonds,
     factors: [tokio_marine.jpc_new_investments, tokio_marine.jpc_alloc_share_yen_bonds], coefficient: 0.01,
     unit_check: "¥bn/yr = ¥bn/yr x % x 0.01", basis: "Japan P&C", period: fiscal year}
  - {id: tm.id.jpc_new_hedged, entity_id: tokio_marine, form: product, target: tokio_marine.jpc_new_foreign_hedged,
     factors: [tokio_marine.jpc_new_investments, tokio_marine.jpc_alloc_share_foreign_hedged], coefficient: 0.01,
     unit_check: "¥bn/yr = ¥bn/yr x % x 0.01", basis: "Japan P&C", period: fiscal year}
  - {id: tm.id.jpc_new_unhedged, entity_id: tokio_marine, form: product, target: tokio_marine.jpc_new_foreign_unhedged,
     factors: [tokio_marine.jpc_new_investments, tokio_marine.jpc_alloc_share_foreign_unhedged], coefficient: 0.01,
     unit_check: "¥bn/yr = ¥bn/yr x % x 0.01", basis: "Japan P&C", period: fiscal year}
  - {id: tm.id.jpc_new_nonbond, entity_id: tokio_marine, form: product, target: tokio_marine.jpc_new_nonbond,
     factors: [tokio_marine.jpc_new_investments, tokio_marine.jpc_alloc_share_nonbond], coefficient: 0.01,
     unit_check: "¥bn/yr = ¥bn/yr x % x 0.01", basis: "Japan P&C", period: fiscal year}

stock_flows:
  - {id: tm.sf.cross_holdings, entity_id: tokio_marine, stock: tokio_marine.cross_holding_book, period_days: 365,
     outflows: [tokio_marine.cross_holding_sales],
     basis: "market value of business-related equities; sales at market value",
     note: "the market moves the book through tm-c-topix-xholding (uncalibrated); the roll-forward holds for sales only"}
  - {id: tm.sf.jpc_yen_bonds, entity_id: tokio_marine, stock: tokio_marine.jpc_bonds_yen, period_days: 365,
     inflows: [tokio_marine.jpc_new_yen_bonds], outflows: [tokio_marine.jpc_bond_maturities],
     basis: "Japan P&C yen bonds at carrying value", note: "sales before maturity and changes in carrying value are not held as flows"}
  - {id: tm.sf.jpc_foreign_hedged, entity_id: tokio_marine, stock: tokio_marine.jpc_bonds_foreign_hedged, period_days: 365,
     inflows: [tokio_marine.jpc_new_foreign_hedged],
     basis: "Japan P&C hedged foreign bonds", note: "foreign-bond redemptions are not held as a flow (no foreign maturity data in the sources read)"}
  - {id: tm.sf.jpc_foreign_unhedged, entity_id: tokio_marine, stock: tokio_marine.jpc_bonds_foreign_unhedged, period_days: 365,
     inflows: [tokio_marine.jpc_new_foreign_unhedged],
     basis: "Japan P&C unhedged foreign bonds", note: "foreign-bond redemptions and currency translation are not held as flows"}
  - {id: tm.sf.jpc_nonbond, entity_id: tokio_marine, stock: tokio_marine.jpc_assets_nonbond, period_days: 365,
     inflows: [tokio_marine.jpc_new_nonbond],
     basis: "Japan P&C equities, loans and cash", note: "disposals (business-related equities are held separately in tm.sf.cross_holdings) and market moves are not held as flows here"}
  - {id: tm.sf.parent_capital, entity_id: tokio_marine, stock: tokio_marine.excess_capital, period_days: 365,
     inflows: [tokio_marine.domestic_subsidiary_dividends], outflows: [tokio_marine.shareholder_returns, tokio_marine.acquisition_spend],
     basis: "deployable capital at the parent: dividends received from its (domestic) subsidiaries, which carry the overseas remittances; cash out to shareholders and acquisitions",
     note: "debt issuance and changes in required capital are not held as values; they move the stock outside this roll-forward"}
