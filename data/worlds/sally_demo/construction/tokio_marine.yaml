# Tokio Marine: business construction (Oct 17). Values added to the tokio_marine entity, links with their transitions,
# named paths, and compositions (model/construction.py). Structure and generic insurance mechanisms only: priors are
# synthetic, round, order-of-magnitude levels marked as such; dated client levels and source bindings stay local
# (data/sally_data/construction/tokio_marine/). Source ids in evidence.sources: tm.wb (sell-side company model
# workbook), tm.seg (client segment forecast model), tm.co (company disclosures as cited in tm.seg), tm.r1 (broker
# note on profit definitions), tm.r2 (broker note on underwriting, reserves, growth, capital), tm.r3 (broker note on
# the stock split), tm.pub (public business and accounting knowledge).
#
# Bases (features.basis): "ANI" is adjusted net income by business, company definition, IFRS from FY3/27 (excludes
# gains on business-related equities); "JGAAP segment" is reportable-segment profit through FY3/26; "JGAAP TMNF" is the
# main P&C company's non-consolidated detail; "BUP" is the pre-IFRS business-unit profit by international unit.
# Accounting weights are scale_part / scale_total in native sd (log sd for the translation link).

subentities:
  # --- adjusted net income by business (the group view; operating_profit and two parts are existing values) -------
  - {entity: tokio_marine, id: tokio_marine.japan_life_profit, name: Tokio Marine Japan Life adjusted net income,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: lognormal, mean: 85.0, scale: 0.2,
     features: {view: reporting_segments, basis: "ANI: Japan Life business, company definition (IFRS)", metric: japan_life_adjusted_net_income, prior: synthetic}}
  - {entity: tokio_marine, id: tokio_marine.solution_profit, name: Tokio Marine solution and other businesses adjusted net income,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: lognormal, mean: 20.0, scale: 0.3,
     features: {view: reporting_segments, basis: "ANI: solution and other businesses, company definition (IFRS)", metric: solution_adjusted_net_income, prior: synthetic}}
  - {entity: tokio_marine, id: tokio_marine.ani_consolidation_adjustment, name: Tokio Marine adjusted net income consolidation adjustment,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: gaussian, prior: {family: gaussian, mu: -10.0, sigma: 10.0}, scale: 10.0,
     features: {view: reporting_segments, basis: "ANI: consolidation adjustment and unallocated (eliminations), company definition (IFRS)", metric: ani_consolidation_adjustment, prior: synthetic}}
  # --- statutory net income and its bridge from adjusted net income (R2: each definition its own value) -----------
  - {entity: tokio_marine, id: tokio_marine.net_income_ifrs, name: Tokio Marine net income attributable to owners (IFRS),
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: gaussian, prior: {family: gaussian, mu: 900.0, sigma: 100.0}, scale: 100.0,
     features: {view: reporting_segments, basis: "statutory: IFRS net income attributable to owners of the parent (from FY3/27); not adjusted net income and not J-GAAP segment profit", metric: net_income_attributable, prior: synthetic}}
  - {entity: tokio_marine, id: tokio_marine.ani_to_ni_adjustments, name: Tokio Marine adjustments from adjusted to statutory net income,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: gaussian, prior: {family: gaussian, mu: -60.0, sigma: 60.0}, scale: 60.0,
     features: {view: reporting_segments, basis: "the company's reconciling items from adjusted net income to IFRS net income (amortization, one-off items such as reinsurance of a life block); residual: not split in the sources read; the synthetic prior closes the round parts to the round total", metric: ani_to_net_income_adjustments, prior: synthetic}}

  # --- Japan P&C on the ANI basis: insurance-related and financial-related profit --------------------------------
  - {entity: tokio_marine, id: tokio_marine.jpc_insurance_profit, name: Tokio Marine Japan P&C insurance-related profit,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: lognormal, mean: 200.0, scale: 0.06,
     features: {view: underwriting, basis: "ANI component: Japan P&C insurance-related profit, pre-tax (IFRS)", prior: synthetic}}
  - {entity: tokio_marine, id: tokio_marine.jpc_financial_profit, name: Tokio Marine Japan P&C financial-related profit,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: lognormal, mean: 60.0, scale: 0.15,
     features: {view: investment_assets, basis: "ANI component: Japan P&C financial-related profit, pre-tax (IFRS): net investment income less insurance finance expense plus other", prior: synthetic}}
  - {entity: tokio_marine, id: tokio_marine.jpc_tax_and_adjustments, name: Tokio Marine Japan P&C taxes and adjustments,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: gaussian, prior: {family: gaussian, mu: -35.0, sigma: 5.0}, scale: 5.0,
     features: {view: underwriting, basis: "ANI component: Japan P&C income taxes and other items (residual; its synthetic prior closes the round parts to the round total)", prior: synthetic}}
  - {entity: tokio_marine, id: tokio_marine.jpc_net_investment_income, name: Tokio Marine Japan P&C net investment income,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: lognormal, mean: 145.0, scale: 0.05,
     features: {view: investment_assets, basis: "IFRS: Japan P&C net investment income (income gains), pre-tax", prior: synthetic}}
  - {entity: tokio_marine, id: tokio_marine.jpc_insurance_finance_expense, name: Tokio Marine Japan P&C insurance finance expense,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: gaussian, prior: {family: gaussian, mu: -35.0, sigma: 3.0}, scale: 3.0,
     features: {view: liabilities, basis: "IFRS 17: unwind of discount on Japan P&C insurance liabilities (negative)", prior: synthetic}}
  - {entity: tokio_marine, id: tokio_marine.jpc_financial_residual, name: Tokio Marine Japan P&C other financial items,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: gaussian, prior: {family: gaussian, mu: -50.0, sigma: 4.0}, scale: 4.0,
     features: {view: investment_assets, basis: "ANI component: other financial-related items (residual), incl. the currency hedge cost (tm-a-hedge-financial) and FX results", prior: synthetic}}

  # --- international: local-currency profit, its parts, and the business-unit view --------------------------------
  - {entity: tokio_marine, id: tokio_marine.intl_profit_local, name: Tokio Marine international adjusted net income in local currency,
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 4.0, scale: 0.06,
     features: {view: regions, basis: "ANI: international business, USD-equivalent at the company plan rate (before translation)", currency: USD-equivalent, prior: synthetic}}
  - {entity: tokio_marine, id: tokio_marine.intl_insurance_profit, name: Tokio Marine international insurance-related profit,
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 3.5, scale: 0.06,
     features: {view: underwriting, basis: "ANI component: international insurance-related profit, pre-tax, local currency", prior: synthetic}}
  - {entity: tokio_marine, id: tokio_marine.intl_financial_profit, name: Tokio Marine international financial-related profit,
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 2.5, scale: 0.06,
     features: {view: investment_assets, basis: "ANI component: international financial-related profit, pre-tax, local currency", prior: synthetic}}
  - {entity: tokio_marine, id: tokio_marine.intl_tax_and_adjustments, name: Tokio Marine international taxes and adjustments,
     attribute_kind: revenue_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: -2.0, sigma: 0.1}, scale: 0.1,
     features: {view: underwriting, basis: "ANI component: international taxes and other (residual; its synthetic prior closes the round parts to the round total), local currency", prior: synthetic}}
  - {entity: tokio_marine, id: tokio_marine.intl_net_investment_income, name: Tokio Marine international net investment income,
     attribute_kind: revenue_flow, unit: $bn/yr, family: lognormal, mean: 4.5, scale: 0.03,
     features: {view: investment_assets, basis: "IFRS: international net investment income, local currency, pre-tax", prior: synthetic}}
  - {entity: tokio_marine, id: tokio_marine.intl_insurance_finance_expense, name: Tokio Marine international insurance finance expense,
     attribute_kind: revenue_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: -2.2, sigma: 0.08}, scale: 0.08,
     features: {view: liabilities, basis: "IFRS 17: unwind of discount on international insurance liabilities (negative), local currency", prior: synthetic}}
  - {entity: tokio_marine, id: tokio_marine.intl_financial_residual, name: Tokio Marine international other financial items,
     attribute_kind: revenue_flow, unit: $bn/yr, family: gaussian, prior: {family: gaussian, mu: 0.2, sigma: 0.05}, scale: 0.05,
     features: {view: investment_assets, basis: "ANI component: other international financial-related items (residual)", prior: synthetic}}
  - {entity: tokio_marine, id: tokio_marine.intl_bup, name: Tokio Marine international business-unit profit,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: lognormal, mean: 470.0, scale: 0.08,
     features: {view: regions, basis: "BUP: international business-unit profit, pre-IFRS company basis (yen)", prior: synthetic}}
  - {entity: tokio_marine, id: tokio_marine.intl_phly_profit, name: Tokio Marine Philadelphia business-unit profit,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: lognormal, mean: 100.0, scale: 0.1,
     features: {view: regions, basis: "BUP: US specialty commercial P&C unit", prior: synthetic}}
  - {entity: tokio_marine, id: tokio_marine.intl_dfg_profit, name: Tokio Marine Delphi business-unit profit,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: lognormal, mean: 180.0, scale: 0.1,
     features: {view: regions, basis: "BUP: US employee-benefits and asset-intensive unit (investment-income heavy)", prior: synthetic}}
  - {entity: tokio_marine, id: tokio_marine.intl_tmhcc_profit, name: Tokio Marine HCC business-unit profit,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: lognormal, mean: 120.0, scale: 0.1,
     features: {view: regions, basis: "BUP: global specialty underwriting unit (underwriting heavy)", prior: synthetic}}
  - {entity: tokio_marine, id: tokio_marine.intl_other_bup, name: Tokio Marine other international business-unit profit,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: gaussian, prior: {family: gaussian, mu: 70.0, sigma: 15.0}, scale: 15.0,
     features: {view: regions, basis: "BUP residual (its synthetic prior closes the round parts to the round total): other North America, Europe, Latin America, Asia-Oceania, Middle East and Africa, international life, other", prior: synthetic}}

  # --- reportable-segment profit (J-GAAP history; a separate basis, never added to ANI) ---------------------------
