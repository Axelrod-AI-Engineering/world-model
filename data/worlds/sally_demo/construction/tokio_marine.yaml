     features: {view: reporting_segments, basis: "JGAAP segment: international insurance", metric: jgaap_segment_profit_international, prior: synthetic}}
  - {entity: tokio_marine, id: tokio_marine.seg_financial_businesses, name: Tokio Marine financial and other segment profit,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: lognormal, mean: 20.0, scale: 0.3,
     features: {view: reporting_segments, basis: "JGAAP segment: financial and other businesses", metric: jgaap_segment_profit_financial_other, prior: synthetic}}
  - {entity: tokio_marine, id: tokio_marine.seg_adjustments, name: Tokio Marine segment profit adjustments,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: gaussian, prior: {family: gaussian, mu: -10.0, sigma: 5.0}, scale: 5.0,
     features: {view: reporting_segments, basis: "JGAAP segment: adjustments (eliminations; the synthetic prior closes the round parts to the round total)", metric: jgaap_segment_profit_adjustments, prior: synthetic}}

