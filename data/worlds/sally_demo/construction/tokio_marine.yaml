  # --- Japan P&C reinvestment: stocks by class and currency, the yen-bond ladder, cash freed, allocation, income ----
  - {entity: tokio_marine, id: tokio_marine.jpc_investment_portfolio, name: Tokio Marine Japan P&C investment assets,
