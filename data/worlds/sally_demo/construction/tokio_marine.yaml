  - {entity: tokio_marine, id: tokio_marine.jpc_bond_maturities, name: Tokio Marine Japan P&C yen bond redemptions,
     attribute_kind: capital_flow, unit: ¥bn/yr, family: gaussian, prior: {family: gaussian, mu: 300.0, sigma: 60.0}, scale: 60.0,
