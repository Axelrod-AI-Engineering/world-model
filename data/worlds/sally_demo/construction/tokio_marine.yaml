  - {entity: tokio_marine, id: tokio_marine.jpc_insurance_revenue, name: Tokio Marine Japan P&C insurance revenue,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: lognormal, mean: 3000.0, scale: 0.01,
     features: {view: underwriting, basis: "IFRS 17: Japan P&C insurance revenue net of reinsurance held (earned premium on the IFRS basis)", prior: synthetic}}
  - {entity: tokio_marine, id: tokio_marine.jpc_claims_incurred, name: Tokio Marine Japan P&C claims incurred,
