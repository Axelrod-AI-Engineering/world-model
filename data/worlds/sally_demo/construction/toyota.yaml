# --- compositions: one view each; views of one total overlap and are never added ----------------------------
# --- identities (Oct 18): exact relationships that are not sums; their links' weights are derived ------------------
identities:
- {id: ty.id.na_revenue, entity_id: toyota, form: product, target: toyota.north_america_external_revenue,
   factors: [toyota.north_america_units, toyota.na_revenue_per_vehicle], unit_check: '¥tn/yr = m units/yr x ¥m/unit',
   basis: 'external revenue over units sold (the workbook''s calculated revenue per vehicle)'}
- {id: ty.id.japan_revenue, entity_id: toyota, form: product, target: toyota.japan_external_revenue,
   factors: [toyota.japan_units, toyota.japan_revenue_per_vehicle], unit_check: '¥tn/yr = m units/yr x ¥m/unit',
   basis: 'external revenue over units sold'}
- {id: ty.id.europe_revenue, entity_id: toyota, form: product, target: toyota.europe_external_revenue,
   factors: [toyota.europe_units, toyota.europe_revenue_per_vehicle], unit_check: '¥tn/yr = m units/yr x ¥m/unit',
   basis: 'external revenue over units sold'}
- {id: ty.id.asia_revenue, entity_id: toyota, form: product, target: toyota.asia_external_revenue,
   factors: [toyota.asia_units, toyota.asia_revenue_per_vehicle], unit_check: '¥tn/yr = m units/yr x ¥m/unit',
   basis: 'external revenue over units sold'}
- {id: ty.id.fs_revenue, entity_id: toyota, form: product, target: toyota.financial_services_revenue,
   factors: [toyota.fs_finance_receivables, toyota.fs_customer_rate], coefficient: 0.0160714,
   unit_check: '¥tn/yr = ¥tn x % x 0.01 x 1.607',
   note: 'The 0.01 converts the rate in %; the 1.607 holds lease rentals and other financing revenue as a constant multiple
     of contract interest at the construction levels (an approximation: lease income is not split from interest in the
     material). Synthetic levels, not the company''s.'}
- {id: ty.id.cost_of_financing, entity_id: toyota, form: product, target: toyota.fs_cost_of_financing,
   factors: [toyota.fs_borrowings, toyota.fs_funding_cost_rate], coefficient: 0.0166667,
   unit_check: '¥tn/yr = ¥tn x % x 0.01 x 1.667',
   note: 'The 0.01 converts the rate in %; the 1.667 holds lease depreciation and other costs of financing as a constant
     multiple of funding interest at the construction levels (an approximation; residual-value losses are added
     separately by ty_residual_cost). Synthetic levels.'}
- {id: ty.id.japan_exports, entity_id: toyota, form: difference, target: toyota.japan_export_units,
   of: toyota.japan_production, minus: [toyota.japan_units, toyota.japan_other_flows],
   note: 'Exports = Japan production - Japan sales - other flows (inventory build); the reported exports are observed, and the
     other flows are the explicit residual.'}
- {id: ty.id.na_imports, entity_id: toyota, form: difference, target: toyota.na_import_units,
   of: toyota.north_america_units, minus: [toyota.north_america_production],
   note: 'Net supply from outside the region, by definition sales minus production (inventory change inside it).'}
- id: ty.id.industrial_fcf
  entity_id: toyota
  form: difference
  target: toyota.industrial_free_cash_flow
  of: toyota.industrial_operating_cash_flow
  minus:
  - toyota.capex
  note: Industrial free cash flow = non-financial operating cash flow - capex (excluding leased vehicles); the finance book's growth
    is funded by its own debt and kept out.
- id: ty.id.dividends
  entity_id: toyota
  form: product
  target: toyota.dividends_paid
  factors:
  - toyota.dividend_per_share
  - toyota.shares_outstanding
  coefficient: 0.001
  unit_check: ¥tn/yr = ¥/share x bn shares x 0.001
  note: Period-end shares outstanding approximate the shares at the two record dates; the gap is a few tenths of a percent.
- id: ty.id.us_duty
  entity_id: toyota
  form: product
  target: toyota.us_tariff_cost
  factors:
  - toyota.us_customs_base
  - us_vehicle_tariffs.effective_rate
  coefficient: 0.01
  unit_check: ¥tn/yr = ¥tn/yr x % x 0.01
  note: 'Batch 2 (Q7): duty = covered customs value x effective rate, summed over origin by the base''s driving view; paid at entry,
    expensed as the stock sells. Replaces the rate''s guidance-sized reduced form (R13): the base has no observed level, so the identity
    is blocked at the baselines and its weights come from the construction levels.'
- id: ty.id.na_incentive_cost
  entity_id: toyota
  form: product
  target: toyota.na_incentive_cost
  factors:
  - toyota.na_incentive_per_unit
  - toyota.north_america_units
  coefficient: 1.0
  unit_check: $bn/yr = $k/unit x m units/yr
  note: 'Batch 2 (Q9): the direct concession before any volume response; the retained-volume leg is ty_incentive_to_units (unsized).'
- id: ty.id.incentive_breakeven
  entity_id: toyota
  form: ratio
  target: toyota.incentive_breakeven_units
  numerator:
  - toyota.na_incentive_cost
  denominator:
  - toyota.na_contribution_per_unit
  coefficient: 1.0
  unit_check: m units/yr = $bn/yr / ($k/unit)
  note: 'Batch 2 (Q9): for a fixed budget; if spending is per unit, solve profit = contribution x incremental units - incentive x all
    eligible units.'
- id: ty.id.dealer_days
  entity_id: toyota
  form: ratio
  target: toyota.na_dealer_inventory
  numerator:
  - toyota.na_dealer_stock_units
  denominator:
  - toyota.north_america_units
  coefficient: 365.0
  unit_check: days = 365 x m units / (m units/yr)
  note: 'Batch 2 (Q10): a metric definition (calendar days, annual selling rate; not seasonally adjusted), not a threshold for incentive
    changes. The days'' supply level is a synthetic prior, never an observation.'
- id: ty.id.us_fin_income
  entity_id: toyota
  form: product
  target: toyota.us_fin_interest_income
  factors:
  - toyota.us_finance_subsidiary_earning_assets
  - toyota.us_fin_asset_rate
  coefficient: 0.01
  unit_check: $bn/yr = $bn x % x 0.01
- id: ty.id.us_fin_expense
  entity_id: toyota
  form: product
  target: toyota.us_fin_interest_expense
  factors:
  - toyota.us_fin_debt
  - toyota.us_fin_funding_rate
  coefficient: 0.01
  unit_check: $bn/yr = $bn x % x 0.01
- id: ty.id.us_fin_nii
  entity_id: toyota
  form: difference
  target: toyota.us_fin_net_interest_income
  of: toyota.us_fin_interest_income
  minus:
  - toyota.us_fin_interest_expense
- id: ty.id.fs_us_scope
  entity_id: toyota
  form: product
  target: toyota.fs_income_us_scope
  factors:
  - toyota.us_fin_net_interest_income
  - dollar_yen.usd_jpy
  coefficient: 0.001
  unit_check: ¥tn/yr = $bn/yr x ¥/$ x 0.001
  note: Translation at the average rate; US GAAP to IFRS mapping is not represented and sits in the uncovered residual.
- id: ty.id.us_brand_units
  entity_id: toyota
  form: product
  target: toyota.us_brand_units
  factors:
  - us_auto_market.industry_volume
  - toyota.us_brand_share
  coefficient: 0.01
  unit_check: m units/yr = m units/yr x pct x 0.01
  note: 'Batch 2 (T02A): units = market x share on one US industry denominator; a share move is in points, not percent. Kept apart from
    North America consolidated units (no link onward).'
- id: ty.id.eps
  entity_id: toyota
  form: ratio
  target: toyota.eps
  numerator:
  - toyota.net_income
  denominator:
  - toyota.weighted_average_shares
  coefficient: 1000.0
  unit_check: ¥/share = 1000 x ¥tn/yr / bn shares
  note: 'Batch 2 (T09C): one net income definition over one weighted-average share path; never a mean of brokers'' EPS.'
- id: ty.id.us_translation
  entity_id: toyota
  form: product
  target: toyota.us_operations_profit_translated
  factors:
  - toyota.us_operations_profit_usd
  - dollar_yen.usd_jpy
  coefficient: 0.001
  unit_check: ¥tn/yr = $bn/yr x ¥/$ x 0.001
  note: 'Batch 2 (T07B): average P&L rate; period-end rates belong to balance-sheet translation, not here.'
stock_flows:
- id: ty.sf.shares
  entity_id: toyota
  stock: toyota.shares_outstanding
  period_days: 365
  outflows: [toyota.shares_repurchased]
  basis: 'shares outstanding (issued less treasury): repurchases out; retirements of treasury shares change both issued and treasury
    stock and leave it unchanged; reissuance to the employee trust is not given in shares and stays inside the tolerance'
- id: ty.sf.na_dealer_stock
  entity_id: toyota
  stock: toyota.na_dealer_stock_units
  period_days: 365
  inflows:
  - toyota.na_dealer_arrivals
  outflows:
  - toyota.north_america_units
  basis: 'dealer stock: arrivals in, retail out (consolidated sales stand in for retail; approximation)'
- id: ty.sf.industrial_liquidity
  entity_id: toyota
  stock: toyota.industrial_liquidity
  period_days: 365
  inflows:
  - toyota.industrial_free_cash_flow
  - toyota.industrial_other_cash_movements
  outflows:
  - toyota.dividends_paid
  - toyota.buyback_spend
  basis: 'industrial liquid assets: free cash flow and identified other movements in, dividends and buyback cash out; the finance book
    is funded separately'

compositions:
- id: ty.comp.reporting_segments
  entity_id: toyota
  view: reporting_segments
  basis: segment operating income by business (IFRS, before intersegment eliminations)
  unit: ¥tn/yr
  period: fiscal year ending March
  drives: false    # Oct 18: reconciling; the regional view drives operating profit
  total: toyota.operating_profit
  members: [toyota.automotive_operating_income, toyota.financial_services_operating_income]
  residual: toyota.other_business_operating_income
  eliminations: toyota.segment_eliminations
  note: Automotive and financial services earn differently (vehicle margin versus lending spread, credit and residual risk) and use
    capital differently. This is the view a business mechanism lands in; the regional view of the same total is never added to it.
- id: ty.comp.regional_operating_income
  entity_id: toyota
  view: regions
  basis: operating income by geographic segment, location of the reporting company (IFRS, before eliminations)
  unit: ¥tn/yr
  period: fiscal year ending March
  total: toyota.operating_profit
  members: [toyota.japan_operating_income, toyota.north_america_operating_income, toyota.europe_operating_income, toyota.asia_operating_income]
  residual: toyota.other_regions_operating_income
  eliminations: toyota.regional_eliminations
  note: 'By location of the reporting company. Japan''s profit includes its export margin on vehicles sold to overseas subsidiaries
    (intersegment); North America''s includes its finance arm. Overlaps the business view: never add the two.'
- id: ty.comp.regional_external_revenue
  entity_id: toyota
  view: regions
  basis: revenue from external customers by location of the selling company (IFRS; excludes intersegment)
  unit: ¥tn/yr
  period: fiscal year ending March
  total: toyota.net_revenue
  members: [toyota.japan_external_revenue, toyota.north_america_external_revenue, toyota.europe_external_revenue, toyota.asia_external_revenue]
  residual: toyota.other_regions_external_revenue
  note: 'External customers only, so no elimination: rank regions on this, not on total regional revenue, which includes intersegment
    sales (Japan''s intersegment revenue is its own value, internal supply).'
- id: ty.comp.revenue_by_customer_location
  entity_id: toyota
  view: customer_location
  basis: revenue by location of the external customer (IFRS)
  unit: ¥tn/yr
  period: fiscal year ending March
  drives: false    # Oct 18: reconciling; the selling-company view drives net revenue
  total: toyota.net_revenue
  members: [toyota.japan_customer_revenue, toyota.north_america_customer_revenue, toyota.europe_customer_revenue, toyota.asia_customer_revenue]
  residual: toyota.other_customer_revenue
  note: 'Where customers are, not where the selling company is: Japanese companies'' direct exports land in the destination. Overlaps
    the selling-company view of the same total.'
- id: ty.comp.units_by_customer_region
  entity_id: toyota
  view: customer_location
  basis: consolidated vehicle sales by region of sale (Toyota, Lexus, Daihatsu, Hino; excludes units retailed by equity-accounted JVs)
  unit: m units/yr
  period: fiscal year ending March
  total: toyota.consolidated_units
  members: [toyota.japan_units, toyota.north_america_units, toyota.europe_units, toyota.asia_units]
  residual: toyota.other_regions_units
  note: 'Where vehicles sell. US sales alone do not reveal tariff exposure: compare with where they are built.'
- id: ty.comp.units_by_production_region
  entity_id: toyota
  view: production_location
  basis: vehicle production by location of the plant (consolidated companies)
  unit: m units/yr
  period: fiscal year ending March
  total: toyota.production_units
  members: [toyota.japan_production, toyota.north_america_production, toyota.europe_production, toyota.asia_production]
  residual: toyota.other_regions_production
  note: Where vehicles are built. Japan builds far more than it sells (the export base); North America sells more than it builds (the
    import base). Not additive with the customer-location view.
- id: ty.comp.retail_units_bridge
  entity_id: toyota
  view: customer_location
  basis: group retail units versus consolidated vehicle sales
  unit: m units/yr
  period: fiscal year ending March
  total: toyota.group_retail_units
  members: [toyota.consolidated_units]
  residual: toyota.unconsolidated_retail_units
  note: Units retailed by equity-accounted JVs (mostly China) count in retail volume but reach the accounts only as equity-method income,
    not consolidated revenue.
- id: ty.comp.retail_units_by_powertrain
  entity_id: toyota
  view: product
  basis: Toyota and Lexus retail units by powertrain (includes units retailed by equity-accounted JVs)
  unit: m units/yr
  period: fiscal year ending March
  total: toyota.vehicle_sales
  members: [toyota.hybrid_retail_units, toyota.plugin_hybrid_retail_units, toyota.battery_electric_retail_units]
  residual: toyota.ice_and_other_retail_units
  note: Units only. Margins by powertrain are not disclosed and are not invented here; an electrified share is not a measured hybrid
    profit.
- id: ty.comp.financial_services
  entity_id: toyota
  view: financial_services
  basis: financial services segment (IFRS)
  unit: ¥tn/yr
  period: fiscal year ending March
  total: toyota.financial_services_operating_income
  members: [toyota.financial_services_revenue, toyota.fs_cost_of_financing]
  residual: toyota.fs_other_expenses
  note: Lending and leasing income less funding interest, lease depreciation and residual impairment, and other expenses (credit-loss
    provisions assumed here). Revenue includes intersegment subvention, eliminated at group level.
- id: ty.comp.pretax_bridge
  entity_id: toyota
  view: reporting_segments
  basis: consolidated income statement, IFRS
  unit: ¥tn/yr
  period: fiscal year ending March
  total: toyota.pretax_income
  members: [toyota.operating_profit, toyota.equity_method_income]
  residual: toyota.other_nonoperating_income
  note: Equity-method income (JVs and affiliates) and finance and FX items sit below operating income.
- id: ty.comp.net_income_bridge
  entity_id: toyota
  view: reporting_segments
  basis: consolidated income statement, IFRS
  unit: ¥tn/yr
  period: fiscal year ending March
  total: toyota.net_income
  members: [toyota.pretax_income, toyota.income_tax_expense, toyota.noncontrolling_interests]
  note: Tax and minorities are deducted (negative accounting weights).

# --- named paths: connected steps, parallel responses as branches ------------------------------------------
- id: ty.comp.segment_revenue
  entity_id: toyota
  view: reporting_segments
  basis: segment revenue including inter-segment sales, IFRS
  unit: ¥tn/yr
  period: fiscal year ending March
  drives: false
  total: toyota.net_revenue
  members:
  - toyota.automotive_revenue
  - toyota.financial_services_revenue
  residual: toyota.other_business_revenue
  eliminations: toyota.segment_revenue_eliminations
  note: 'Plan round: revenue by business, each segment with its inter-segment sales, and the eliminations that make them external. The
    third view of net revenue beside the selling-company (driving) and customer-location views; never added to them.'
- id: ty.comp.us_customs_base_by_origin
  entity_id: toyota
  view: operating_state
  basis: declared customs value of covered imports at entry, by origin
  unit: ¥tn/yr
  period: fiscal year ending March
  total: toyota.us_customs_base
  members:
  - toyota.us_customs_base_japan
  - toyota.us_customs_base_north_america
  residual: toyota.us_customs_base_third_country
  note: 'Batch 2 (Q7): the base by origin; categories and entry dates are the next split when declared values are available.'
- id: ty.comp.fs_by_scope
  entity_id: toyota
  view: financial_services
  basis: 'financial services operating income by scope: the US module (translated) and the uncovered residual'
  unit: ¥tn/yr
  period: fiscal year ending March
  drives: false
  total: toyota.financial_services_operating_income
  members:
  - toyota.fs_income_us_scope
  residual: toyota.fs_income_uncovered
  note: 'Batch 2 (Q11): a scoped module reconciled into the group with an explicit uncovered residual; reconciling view (the revenue/cost
    view drives).'
paths:
- id: ty.path.tariffs_sourcing
  name: Tariffs and sourcing
  entity_id: toyota
  trigger: a change in the US tariff regime on imported vehicles and parts
  steps:
  - {interaction_id: ty_tariff_cost}
  - {interaction_id: ty_tariff_reprice, branch: reprice}
  - {interaction_id: ty_tariff_resource, branch: resource}
  - {interaction_id: ty_tariff_absorb, branch: absorb}
  - {interaction_id: ty_tariff_transfer, branch: transfer_price}
  - {interaction_id: ty_tariff_incentives, branch: incentives}
  - {interaction_id: ty_incentive_to_rpv}
  - {interaction_id: ty_incentive_to_units}
  - {interaction_id: ty_list_to_rpv, branch: realized_price}
  - {interaction_id: ty_list_to_units, branch: customer_response}
  - {interaction_id: ty_imports_na_production}
  - {interaction_id: ty_tariff_base}
  - {interaction_id: ty_na_prod_to_exports}
  - {interaction_id: ty_exports_customs_base}
  - {interaction_id: ty_na_production_customs}
  - {interaction_id: ty_customs_japan_base}
  - {interaction_id: ty_customs_na_base}
  - {interaction_id: ty_customs_other_base}
  - {interaction_id: ty_customs_base_cost}
  - {interaction_id: ty_na_units_to_inventory}
  - {interaction_id: ty_na_production_to_oi}
  - {interaction_id: ty_na_rev_price}
  - {interaction_id: ty_na_rev_units}
  - {interaction_id: ty_na_rev_to_oi}
  - {interaction_id: ty_exports_to_intersegment}
  - {interaction_id: ty_intersegment_to_japan_oi}
  - {interaction_id: ty_reg_north_america_oi}
  - {interaction_id: ty_reg_japan_oi}
  endpoint: toyota.operating_profit
  description: 'Operational (plan round). (1) Covered imports: the customs base is the declared value of covered vehicles and parts
    entering the US, fed by North America imports and US-bound exports from Japan, neither of which is the base itself (R14); the duty
    falls due at customs entry (ty_customs_base_cost). (2) Who bears it: the US importer of record, booked in North America (ty_tariff_absorb),
    unless transfer-price support moves part to Japan. (3) Management response, parallel branches: absorb, reprice, trim incentives,
    resource, transfer-price support. (4) Customers, dealers and production respond: realized price and lost volume, dealer stock,
    local production and plant absorption. (5) Regional accounts: North America and Japan operating income, reconciled to the group by the
    geographic identities. Localization feeds back into a smaller base. Sized: the rate to the cost (guidance) and absorption (model).'
- id: ty.path.regional_growth
  name: Regional growth (North America)
  entity_id: toyota
  trigger: faster US growth lifting new-vehicle demand
  steps:
  - {interaction_id: ty_us_gdp_industry}
  - {interaction_id: ty_industry_to_na_units}
  - {interaction_id: ty_na_rev_units, branch: revenue}
  - {interaction_id: ty_na_units_to_production, branch: production}
  - {interaction_id: ty_na_units_to_inventory, branch: inventory}
  - {interaction_id: ty_imports_na_units, branch: imports}
  - {interaction_id: ty_inventory_to_units}
  - {interaction_id: ty_na_production_to_oi}
  - {interaction_id: ty_na_rev_to_oi}
  - {interaction_id: ty_reg_north_america_oi}
  endpoint: toyota.operating_profit
  description: Industry demand becomes Toyota orders and realized sales only with product available; sales pull production (utilization
    and absorption), draw down dealer stock (availability feedback) and pull imports (the tariff base). s42 is the broad statistical
    summary of this path and is never added to it.
- id: ty.path.pricing_competition
  name: Pricing competition (North America)
  entity_id: toyota
  trigger: competitors raising incentives
  steps:
  - {interaction_id: ty_industry_incentives_match, branch: match}
  - {interaction_id: ty_industry_incentives_conquest, branch: hold_price}
  - {interaction_id: ty_incentive_to_rpv, branch: price}
  - {interaction_id: ty_incentive_to_units, branch: volume}
  - {interaction_id: ty_incentive_subvention, branch: subvention}
  - {interaction_id: ty_na_units_to_inventory}
  - {interaction_id: ty_dealer_stock_incentives}
  - {interaction_id: ty_na_rev_price}
  - {interaction_id: ty_na_rev_units}
  - {interaction_id: ty_na_rev_to_oi}
  - {interaction_id: ty_reg_north_america_oi}
  endpoint: toyota.operating_profit
  description: 'Competitive conditions (rivals'' incentives) → Toyota and dealer response (match, hold price, subvented financing; dealers
    lift incentives when stock builds) → realized net price and retained or lost volume → North America revenue and operating income.
    Subvented financing moves part of the incentive into financial-services revenue; it is eliminated on consolidation, so it is counted
    once, as an incentive. Management''s walk reports marketing efforts as one line (volume, mix, price and incentives); it is kept whole
    and never split without support (R14).'
- id: ty.path.asia_entrants
  name: Competition from Chinese entrants (Southeast Asia)
  entity_id: toyota
  trigger: Chinese brands gaining share in Southeast Asia
  steps:
  - {interaction_id: ty_chinese_share}
  - {interaction_id: ty_asia_share_units}
  - {interaction_id: ty_asia_units_rev}
  - {interaction_id: ty_asia_rev_oi}
  - {interaction_id: ty_reg_asia_oi}
  endpoint: toyota.operating_profit
  description: Share loss reaches Asia operating income through volume; the incumbent's service network, parts and financing are the
    breaker; aftermarket and value-chain profit is an offset not represented as a value.
- id: ty.path.product_mix
  name: Product mix (powertrain)
  entity_id: toyota
  trigger: fuel prices changing the economics of fuel efficiency
  steps:
  - {interaction_id: ty_fuel_hybrid, branch: hybrid}
  - {interaction_id: ty_fuel_bev, branch: battery_electric}
  - {interaction_id: ty_fuel_ice, branch: engine_only}
  - {interaction_id: ty_pt_hybrid_retail_units}
  - {interaction_id: ty_pt_battery_electric_retail_units}
  - {interaction_id: ty_pt_ice_and_other_retail_units}
  - {interaction_id: ty_hybrid_rev}
  - {interaction_id: ty_bev_rev}
  - {interaction_id: ty_ice_rev}
  - {interaction_id: ty_auto_rev_oi}
  - {interaction_id: ty_seg_automotive_operating_income}
  endpoint: toyota.operating_profit
  description: Customer preference shifts the powertrain mix; much of the hybrid gain substitutes for engine-only units, so retail volume
    moves less than the mix. Units reach automotive revenue only when consolidated companies sell them; margins by powertrain are unknown.
    Stays in the business-segment view.
- id: ty.path.yen
  name: 'Yen: transaction, translation and imported inputs'
  entity_id: toyota
  trigger: a move in USD/JPY
  steps:
  - {interaction_id: m29, branch: disclosed_total}
  - {interaction_id: ty_yen_transaction, branch: transaction}
  - {interaction_id: ty_yen_translation, branch: translation}
  - {interaction_id: ty_yen_imports, branch: imported_inputs}
  - {interaction_id: ty_material_japan_oi}
  - {interaction_id: ty_reg_japan_oi}
  - {interaction_id: ty_reg_north_america_oi}
  endpoint: toyota.operating_profit
  description: 'Reconciles to the disclosed aggregate FX impact (plan round, local record per period): transactional = US dollar +
    euro + other currencies, exactly, in each of eight actual periods; total FX effect = transactional + translational. Pack round (R13): the transaction branch is sized from the company''s US dollar transactional line (documented);
    m29 carries only the remainder of the total FX effect (translation, the euro, other currencies; inferred). Translation and
    imported inputs stay unsized branches inside that remainder, so no effect is counted twice. Below-operating-income FX gains
    are not represented.'
- id: ty.path.financing_funding
  name: 'Financing: funding cost and contract repricing'
  entity_id: toyota
  trigger: a rise in US short and medium-term yields
  steps:
  - {interaction_id: ty_ust_funding}
  - {interaction_id: ty_funding_cost, branch: funding}
  - {interaction_id: ty_funding_reprice, branch: repricing}
  - {interaction_id: ty_customer_rate_rev, branch: yield}
  - {interaction_id: ty_customer_rate_units, branch: affordability}
  - {interaction_id: ty_customer_rate_arrears, branch: arrears}
  - {interaction_id: ty_units_receivables}
  - {interaction_id: ty_receivables_rev, branch: earning_book}
  - {interaction_id: ty_receivables_borrowings, branch: funding_need}
  - {interaction_id: ty_borrowings_cost}
  - {interaction_id: ty_credit_loss_expense}
  - {interaction_id: ty_fs_revenue}
  - {interaction_id: ty_fs_cost_of_financing}
  - {interaction_id: ty_fs_other_expenses}
  - {interaction_id: ty_seg_financial_services_operating_income}
  endpoint: toyota.operating_profit
  description: 'Funding cost reaches interest expense as debt refinances; contract rates reprice as the book turns over, earning more
    but costing affordability and raising arrears. Receivables growth is funded by debt: consolidated debt rising with the finance book
    is not industrial stress.'
- id: ty.path.financing_credit_residual
  name: 'Financing: used-vehicle values, residuals and credit'
  entity_id: toyota
  trigger: a fall or rise in used-vehicle values
  steps:
  - {interaction_id: ty_used_residual, branch: residual}
  - {interaction_id: ty_used_severity, branch: severity}
  - {interaction_id: ty_residual_cost}
  - {interaction_id: ty_credit_loss_expense}
  - {interaction_id: ty_fs_cost_of_financing}
  - {interaction_id: ty_fs_other_expenses}
  - {interaction_id: ty_seg_financial_services_operating_income}
  endpoint: toyota.operating_profit
  description: Used values set lease outcomes at maturity (residual gains or losses within cost of financing) and loss severity on repossessions.
    Borrower income (ty_income_arrears) is a second driver of credit losses.
- id: ty.path.execution_share
  name: Execution and share
  entity_id: toyota
  trigger: a stronger or weaker new-model pipeline (launches, redesigns, quality)
  steps:
  - {interaction_id: ty_pipeline_na_share, branch: north_america}
  - {interaction_id: ty_pipeline_asia_share, branch: asia}
  - {interaction_id: ty_pipeline_capex, branch: investment}
  - {interaction_id: ty_na_share_units}
  - {interaction_id: ty_asia_share_units}
  - {interaction_id: ty_na_rev_units}
  - {interaction_id: ty_asia_units_rev}
  - {interaction_id: ty_na_rev_to_oi}
  - {interaction_id: ty_asia_rev_oi}
  - {interaction_id: ty_reg_north_america_oi}
  - {interaction_id: ty_reg_asia_oi}
  endpoint: toyota.operating_profit
  description: Competitive product retains or gains share and so regional earnings; the investment branch ends at capital expenditure
    (cash before earnings). Its depreciation lands in the business view (ty_capex_auto_oi) and is not added to these regional routes.
- id: ty.path.new_initiatives
  name: 'New initiatives: robotics and automation'
  entity_id: toyota
  trigger: a commitment of resources to in-house robotics and factory automation
  steps:
  - {interaction_id: ty_robotics_rd, branch: development_cost}
  - {interaction_id: ty_robotics_deploy, branch: deployment}
  - {interaction_id: ty_robotics_capex, branch: equipment}
  - {interaction_id: ty_robots_savings, branch: productivity}
  - {interaction_id: ty_robots_external, branch: paid_external_use}
  - {interaction_id: ty_savings_auto_oi}
  - {interaction_id: ty_rd_auto_oi}
  - {interaction_id: ty_capex_auto_oi}
  - {interaction_id: ty_seg_automotive_operating_income}
  - {interaction_id: ty_seg_other_business_operating_income}
  endpoint: toyota.operating_profit
  description: Announcement, commitment, validated deployment and measured economics are separate states. Development and deployment
    costs come first; savings only after validated deployment; external sales are optionality, kept apart from established earnings.
- id: ty.path.china_affiliates
  name: 'Affiliates: China joint ventures'
  entity_id: toyota
  trigger: Chinese demand for the joint ventures' vehicles
  steps:
  - {interaction_id: ty_china_jv_units}
  - {interaction_id: ty_jv_units_equity, branch: equity_income}
  - {interaction_id: ty_retail_unconsolidated, branch: retail_volume}
  - {interaction_id: ty_pretax_equity}
  - {interaction_id: ty_tax_equity_exclusion, branch: no_group_tax}
  - {interaction_id: ty_ni_pretax}
  - {interaction_id: ty_ni_tax}
  endpoint: toyota.net_income
  description: JV unit growth raises retail volume and equity-method income, not consolidated revenue or operating income. s43 is the
    broad statistical summary (China growth to global retail volume) and is never added to it.
- id: ty.path.group_bridge
  name: 'Group bridge: operating income to net income'
  entity_id: toyota
  trigger: a change in consolidated operating income
  steps:
  - {interaction_id: ty_pretax_op}
  - {interaction_id: ty_tax_formula, branch: tax}
  - {interaction_id: ty_nci_share, branch: minorities}
  - {interaction_id: ty_ni_pretax, branch: identity}
  - {interaction_id: ty_ni_tax}
  - {interaction_id: ty_ni_nci}
  endpoint: toyota.net_income
  description: Income before tax, tax at the documented effective rate (calibrated), minorities (uncalibrated) and the net-income identity.
    Equity-method income and finance and FX items join below operating income.
- id: ty.path.supply_availability
  name: Product supply availability (electrified)
  entity_id: toyota
  trigger: electrified supply capacity changing (battery supply, plant allocation)
  steps:
  - interaction_id: ty_supply_hybrid
  - interaction_id: ty_pt_hybrid_retail_units
  - interaction_id: ty_hybrid_rev
  - interaction_id: ty_auto_rev_oi
  - interaction_id: ty_seg_automotive_operating_income
  endpoint: toyota.operating_profit
  description: 'Plan round: customer choice is the product-mix path; this is the supply side. While orders exceed supply, deliveries
    follow capacity. Units reach automotive revenue; margins by powertrain are not disclosed, and a sales share is not a margin (R14).
    Lands in the business view, which reconciles to operating profit (no size reaches the total).'
- id: ty.path.financing_borrower
  name: 'Financing: borrower conditions and credit losses'
  entity_id: toyota
  trigger: US borrowers' income and employment weakening
  steps:
  - interaction_id: ty_income_arrears
  - interaction_id: ty_credit_loss_expense
  - interaction_id: ty_fs_other_expenses
  - interaction_id: ty_seg_financial_services_operating_income
  endpoint: toyota.operating_profit
  description: 'Plan round: borrower conditions → arrears and charge-offs → provisions in the segment''s expenses → financial services
    operating income. The US finance subsidiary''s provision is the observable (another basis, R14); the segment''s provision line is
    not split. Lands in the business view, which reconciles to operating profit.'
- id: ty.path.production_disruption
  name: Production disruption and recovery (certification)
  entity_id: toyota
  trigger: a certification restriction on models built in Japan (dated events)
  steps:
  - interaction_id: ty_cert_production
    branch: production
  - interaction_id: ty_cert_deliveries
    branch: deliveries
  - interaction_id: ty_cert_recovery
    branch: recovery_costs
  - interaction_id: ty_japan_production_to_oi
  - interaction_id: ty_exports_japan_production
  - interaction_id: ty_exports_to_intersegment
  - interaction_id: ty_intersegment_to_japan_oi
  - interaction_id: ty_recovery_costs_oi
  - interaction_id: ty_reg_japan_oi
  - interaction_id: ty_exports_to_inventory
    branch: inventory_buffer
  - interaction_id: ty_arrivals_stock
  endpoint: toyota.operating_profit
  description: 'Plan round: certification restriction → available production (units withheld) → deliveries and plant utilization, and
    recovery costs → Japan operating income → group (geographic identity). Exports fall through the export identity. Batch 2 (T04C):
    fewer exports arrive at dealers and the dealer stock buffers sales by the mass balance (change in stock = arrivals - sales), so a
    lost unit is a delayed sale, a stock draw or a foregone sale, never all three. The dated events
    (halt, orders, staged restarts) and the production loss measured from monthly data are local; an event replays as a level of the
    shortfall over its dates.'
- id: ty.path.cash_capital
  name: Cash and capital allocation
  entity_id: toyota
  trigger: a change in earnings
  steps:
  - interaction_id: ty_ni_ocf
    branch: cash
  - interaction_id: ty_ni_dps
    branch: dividend_policy
  - interaction_id: ty_ocf_fcf
  - interaction_id: ty_fcf_liquidity
  - interaction_id: ty_dps_dividends
  - interaction_id: ty_dividends_liquidity
  - interaction_id: ty_liquidity_buyback
  - interaction_id: ty_buyback_shares
  - interaction_id: ty_shares_dividends
  endpoint: toyota.shares_outstanding
  description: 'Plan round: earnings → industrial operating cash → free cash flow after capex (identity) → liquid assets → capital actions:
    dividends (per share x shares, identity) and buybacks above the liquidity buffer under an open authorization → shares outstanding
    (stock-flow), which feeds back into the dividend bill. The finance book is funded by its own borrowings (ty_receivables_borrowings)
    and kept out of industrial cash. Authorized and completed buybacks are separate values (R8).'
- id: ty.path.us_finance_module
  name: 'US finance module: asset and funding clocks'
  entity_id: toyota
  trigger: a move in US 2-year yields
  steps:
  - interaction_id: ty_ust_us_asset_yield
    branch: asset_clock
  - interaction_id: ty_ust_us_funding_rate
    branch: funding_clock
  - interaction_id: ty_usfin_yield_income
  - interaction_id: ty_usfin_rate_expense
  - interaction_id: ty_usfin_income_nii
