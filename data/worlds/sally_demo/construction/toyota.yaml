- id: ty_customs_base_cost
  source: toyota.us_customs_base
  target: toyota.us_tariff_cost
  label: times the rate is the duty
  edge_type: identity
  identity: ty.id.us_duty
  note: 'Plan round: the product (duty = base x rate) is not built as an identity: the base has no level (not disclosed), and the rate''s
    size is carried by the reduced form ty_tariff_cost, sized from the company''s planned cost (R13: one number per effect). The step
    shows who pays and when the duty falls due.'
  transition:
    mechanism: The duty is the customs value of covered imports times the effective rate; Toyota's US importer of record owes it at
      customs entry and expenses it in cost of sales as the vehicles sell
    sign: +
    actor: Toyota's US importer of record (pays the duty)
    business_unit: North America operations
    geography: US
    currency: USD
    condition: the importer of record is the US subsidiary; the duty is paid at entry, before the vehicle is sold
    condition_observable: duty records by entry; the company's tariff impact line in the operating-income walk
    timing:
      onset: customs entry (duty payable)
      build: one inventory turn (expensed as tariffed stock sells)
      persistence: while the regime holds
      recognition: cost of sales of the quarter of sale
    evidence:
      existence: documented
      direction: documented
      magnitude: unknown
      timing: documented
      sources:
      - ty.dk
      - ty.tt
      - ty.pub
    breaker: a lower rate or exemption by deal; refunds of duties found unlawful (a refund reverses part of the cost)
    next_state: Toyota US tariff cost
    unresolved:
    - input: covered imported volume by origin
      status: not_disclosed_in_reviewed_sources
      searched:
      - ty.wb
      - ty.sm
      - ty.f20
      - ty.f20p
      - ty.dk
      - ty.fsum
      - ty.qa
      - ty.fs10
      - ty.mo
      - ty.us
      - ty.tt
      - ty.cert
      - ty.cap
      - ty.rt
      - ty.ir
      - ty.ja
      - 'corpus: covered'
      - 'corpus: imports by origin'
