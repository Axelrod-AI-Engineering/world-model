    and their production loss are in the local events file (dated events in the local events file (certification halts: announcement,
    orders, shipment halt, staged restarts)).'
  transition:
    mechanism: A certification restriction stops the affected models' production at Japanese plants until the regulator confirms compliance;
      each withheld unit is a unit not built
    sign: '-'
    actor: Toyota group makers in Japan and the regulator
    business_unit: automotive
    geography: Japan
    condition: the affected models are built in Japan; restarts follow model-by-model confirmations
    condition_observable: monthly Japan production of the affected maker; restart notices
    timing:
      onset: the halt date
      build: none (a stop)
      persistence: until each model's restart
      recognition: production of the month
    evidence:
      existence: documented
      direction: documented
      magnitude: documented
      timing: documented
      sources:
      - ty.cert
      - ty.mo
    breaker: staged restarts after confirmations; other plants cannot build the affected models
    next_state: Toyota Japan production volume
    unresolved: []
  effect: {mu: -0.7192, sigma: 0.036}
