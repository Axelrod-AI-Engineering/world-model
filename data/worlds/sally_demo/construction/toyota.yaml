    business_unit: group
    currency: JPY
    condition: the change arises in subsidiaries with minority holders
    condition_observable: net income attributable to non-controlling interests
    timing: {onset: same period, build: none, persistence: persistent, recognition: net income}
    evidence: {existence: documented, direction: documented, magnitude: unknown, timing: documented, sources: [ty.wb]}
    breaker: the change arises in wholly-owned units
    next_state: Toyota income attributable to non-controlling interests
    unresolved:
    - {input: minority share by subsidiary, status: found_not_connected, searched: [ty.wb, ty.bridge, ty.sm, ty.r1, ty.r2, ty.xc, ty.peer, ty.robo, ty.rates, 'corpus: minority share by subsidiary', 'corpus: non-controlling', 'corpus: nci', 'corpus: minority', ty.f20, ty.f20p, ty.dk, ty.fsum, ty.qa, ty.fs10, ty.mo, ty.us, ty.tt, ty.cert, ty.rt, ty.cap, ty.ir, ty.ja, 'corpus: public document pack (144 files parsed, scripts/construction/inputs.py)'], found_in: [ty.f20], note: 'the annual report lists principal subsidiaries with Toyota''s ownership and voting interest; minority profit by subsidiary is not given, so not bound'}

