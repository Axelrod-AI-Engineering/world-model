# Toyota Motor: business construction (Oct 17, construction skill v2 review). Loaded by ConstructionSpec.load
# (engine/initialize.py) into sally_demo: values added to the `toyota` entity, three new market/policy entities, links
# with their transitions, named paths and compositions. Readable view and gap register: docs/construction/toyota.md.
#
# Priors are synthetic, round, order-of-magnitude levels with wide spread (the world's convention, see entities.yaml):
# they are not the company's figures. They add up: every additive composition reconciles exactly at the construction
# levels (lognormal medians), checked by scripts/construction/check.py --reconcile --statistic median (Oct 18). Dated
# levels from the client's workbook stay local, in
# data/sally_data/construction/toyota/baselines.json. Accounting links weigh a part by its scale over its total's
# (native sd for a sum; log scale for a product such as units x revenue per vehicle). Causal links whose size no
# source supports are uncalibrated: mechanism, sign, conditions and breakers, no numbers.

# --- values of the toyota entity ----------------------------------------------------------------------------
