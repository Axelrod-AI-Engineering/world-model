# --- links: accounting identities, then causal steps -----------------------------------------------------------
interactions:
- id: ty_seg_automotive_operating_income
  source: toyota.automotive_operating_income
  target: toyota.operating_profit
  label: adds to group operating income
  note: 'Reconciling view (Oct 18): the business segments reconcile to operating profit, which the regional view drives; this link carries no size (one driving view per total).'
  edge_type: accounting
  calibration: uncalibrated
  kernel: &id001 {delay_days: 0, lag_days: 1, duration_days: null}
  transition:
    mechanism: 'Identity: automotive segment operating income adds to consolidated operating income (business-segment view)'
    sign: +
    business_unit: automotive
    currency: JPY
    condition: same period, perimeter and accounting basis on both sides (segment operating income by business (IFRS, before intersegment
      eliminations))
    condition_observable: the reported reconciliation (parts plus residual and eliminations equal the total)
    timing: {onset: same period, build: none, persistence: while the definition holds, recognition: each reported quarter (cumulative
