- id: ty_exports_customs_base
  source: toyota.japan_export_units
  target: toyota.us_customs_base_japan
  label: enter the US as covered imports
  note: 'R14: Japan exports alone do not establish customs value; the declared value per vehicle and the US share are needed. Batch 2: lands in the Japan-origin part of the base.'
  calibration: uncalibrated
  transition:
    mechanism: Vehicles exported from Japan to the US enter at a declared customs value set by the intercompany transfer price; they
      are part of the covered base
    sign: +
    actor: Toyota parent (exporter) and Toyota's US importer of record
    business_unit: Japan and North America operations
    geography: Japan to US
    currency: USD
    condition: the destination is the US (not Canada, Mexico or other markets) and the vehicles are covered by the regime
    condition_observable: exports from Japan by destination (monthly); customs entries by origin
    timing:
      onset: shipment and customs entry
      build: with the export mix
      persistence: while sourcing holds
      recognition: customs entry; cost of sales when sold
    evidence:
      existence: documented
      direction: inferred
      magnitude: unknown
      timing: inferred
