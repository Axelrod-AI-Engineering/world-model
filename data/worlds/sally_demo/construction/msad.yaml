interactions:
  # ===================== accounting links (a part adds to its total, on that composition's basis) =====================
  # group adjusted profit by business (s39, s40 in interactions.yaml are the international and domestic non-life parts)
  - id: msad-a-gap-life
    source: msad.domestic_life_profit
    target: msad.operating_profit
    label: adds to group adjusted profit
    edge_type: accounting
    effect: {mu: 0.73, sigma: 0.001}
    kernel: {delay_days: 0, lag_days: 1, duration_days: null}
    transition:
      mechanism: "Domestic life adjusted profit is one part of group adjusted profit (company definition)"
      business_unit: domestic life
      condition: "same basis (group adjusted profit by business), period and yen"
      timing: {onset: same reporting period, build: none, persistence: identity, recognition: quarterly results}
      evidence: {existence: public_not_supplied, direction: public_not_supplied, magnitude: inferred, timing: public_not_supplied, sources: [msad.pub]}
      next_state: group adjusted profit
  - id: msad-a-gap-finsvc
    source: msad.financial_services_profit
    target: msad.operating_profit
    label: adds to group adjusted profit
    edge_type: accounting
    effect: {mu: 0.1, sigma: 0.001}
    kernel: {delay_days: 0, lag_days: 1, duration_days: null}
    transition:
      mechanism: "Financial services and risk-related services adjusted profit is one part of group adjusted profit"
      business_unit: financial services
      condition: "same basis (group adjusted profit by business), period and yen"
      timing: {onset: same reporting period, build: none, persistence: identity, recognition: quarterly results}
      evidence: {existence: public_not_supplied, direction: public_not_supplied, magnitude: inferred, timing: public_not_supplied, sources: [msad.pub]}
      next_state: group adjusted profit
  - id: msad-a-gap-other
    source: msad.adjusted_profit_residual
    target: msad.operating_profit
    label: adds to group adjusted profit
    edge_type: accounting
    effect: {mu: 0.48, sigma: 0.001}
    kernel: {delay_days: 0, lag_days: 1, duration_days: null}
    transition:
      mechanism: "Holding-company, equity-method and consolidation adjustments reconcile the business parts to the group total (the residual)"
      business_unit: group
      condition: "same basis (group adjusted profit)"
      timing: {onset: same reporting period, build: none, persistence: identity, recognition: quarterly results}
      evidence: {existence: public_not_supplied, direction: public_not_supplied, magnitude: inferred, timing: public_not_supplied, sources: [msad.pub]}
      next_state: group adjusted profit
  # net income = group adjusted profit - reserve add-back + other (one direction: net income is downstream)
  - id: msad-a-ni-gap
    source: msad.operating_profit
    target: msad.net_income
    label: carries into net income
    edge_type: accounting
    effect: {mu: 0.55, sigma: 0.001}
    kernel: {delay_days: 0, lag_days: 1, duration_days: null}
    transition:
      mechanism: "Net income is group adjusted profit less the items the definition adds back; every operating change reaches net income through adjusted profit, so nothing is counted twice"
      business_unit: group
      condition: "same period and yen; the items added back are J-GAAP reserve provisions and the definition's other adjustments"
      timing: {onset: same reporting period, build: none, persistence: identity, recognition: quarterly results}
      evidence: {existence: public_not_supplied, direction: public_not_supplied, magnitude: inferred, timing: public_not_supplied, sources: [msad.pub]}
      breaker: "a change of the adjusted-profit definition (e.g. excluding sale gains) moves items between the two views"
      next_state: net income
  - id: msad-a-ni-addback
    source: msad.reserve_addback
    target: msad.net_income
    label: is deducted from adjusted profit to give net income
    edge_type: accounting
    effect: {mu: -0.36, sigma: 0.001}
    kernel: {delay_days: 0, lag_days: 1, duration_days: null}
    transition:
      mechanism: "The after-tax net provision for catastrophe and price-fluctuation reserves is a charge in net income that adjusted profit adds back; a reversal year turns it negative and lifts net income above adjusted profit"
      business_unit: domestic non-life
      condition: "J-GAAP reserves exist (they do not under IFRS)"
      timing: {onset: same reporting period, build: none, persistence: identity, recognition: quarterly results}
      evidence: {existence: public_not_supplied, direction: public_not_supplied, magnitude: inferred, timing: public_not_supplied, sources: [msad.pub, msad.peer]}
      next_state: net income
  - id: msad-a-ni-other
    source: msad.net_income_bridge_residual
    target: msad.net_income
    label: adds to net income
    edge_type: accounting
    effect: {mu: 0.36, sigma: 0.001}
    kernel: {delay_days: 0, lag_days: 1, duration_days: null}
    transition:
      mechanism: "Other differences between the definitions (amortization of goodwill and intangibles, extraordinary items) close the bridge (residual)"
      business_unit: group
      timing: {onset: same reporting period, build: none, persistence: identity, recognition: quarterly results}
      evidence: {existence: public_not_supplied, direction: public_not_supplied, magnitude: inferred, timing: public_not_supplied, sources: [msad.pub]}
