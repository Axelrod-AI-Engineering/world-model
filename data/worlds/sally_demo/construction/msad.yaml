# MS&AD Insurance: business construction (Oct 18). Values added to the msad entity (and two shared macro values),
# links with their transitions, named paths, and compositions (model/construction.py). It follows the Tokio Marine
# build (the direct peer) with MS&AD's own reporting: domestic non-life by company (Mitsui Sumitomo, Aioi Nissay Dowa),
# international by business (MS Amlin, Asia, Americas, Europe, other), domestic life by company (MSI Aioi Life, MSI
# Primary Life), group adjusted profit and its bridge to net income, and strategic-equity sale gains as their own part.
#
# Structure and generic insurance mechanisms only. The supplied material holds no MS&AD company model or results: the
# structure is MS&AD's public reporting (evidence "inferred", source msad.pub, because that reporting is not in the
# reviewed material), every operating link is uncalibrated, and every level is a synthetic, round prior that adds up
# within its view (features.prior: synthetic). Source bindings stay local (data/sally_data/construction/msad/). Source
# ids: msad.r1 (broker note with a three-insurer valuation table), msad.r2 (broker stock report with a Japanese P&C
# market profile and sector outlook), msad.macro (the client's yen-rates workbook, company-mapping rows), msad.x1
# (expert call on the US D&O market), msad.peer (the peer's company-model workbook, read for J-GAAP mechanics only),
# msad.pub (public business and accounting knowledge), msad.corpus (the search scope).
#
# Bases (features.basis): "GAP" is group adjusted profit by business, company definition (J-GAAP based; the plan in
# force and any IFRS transition are not established in the reviewed sources); "J-GAAP DNL" is the two domestic P&C
# companies combined (non-consolidated); "constant FX" is international adjusted profit at the plan rates, before
# translation. Accounting weights are scale_part / scale_total in native sd (log sd for the translation link).
# Shared drivers are reused, never redefined: JGB, UST and Bund yields, USD/JPY, the policy rates, Japan CPI, wages and
# GDP, TOPIX, and the market-wide claim states held on the tokio_marine entity (japan_claim_severity,
# us_liability_severity).

subentities:
  # --- shared macro values (new; any insurer can use them) -----------------------------------------------------------
  - {entity: japan_economy, id: japan_economy.nat_cat_insured_losses, name: Japan insured natural catastrophe losses,
     attribute_kind: loss_flow, unit: ¥bn/yr, family: lognormal, mean: 600.0, scale: 0.6,
     features: {view: operating_state, basis: "industry insured losses from Japanese typhoons, floods, hail and earthquakes in the fiscal year (all insurers, gross)", prior: synthetic},
     aliases: [Japan natural catastrophes, Japan typhoon losses, domestic natural catastrophe losses]}
  - {entity: us_economy, id: us_economy.nat_cat_insured_losses, name: US insured natural catastrophe losses,
     attribute_kind: loss_flow, unit: $bn/yr, family: lognormal, mean: 100.0, scale: 0.4,
     features: {view: operating_state, basis: "industry insured losses from US hurricanes, convective storms and wildfires in the year (all insurers and reinsurers)", prior: synthetic},
     aliases: [US catastrophe losses, hurricane losses]}

  # --- group adjusted profit by business (operating_profit, domestic_profit and international_profit exist) ----------
  - {entity: msad, id: msad.domestic_life_profit, name: MS&AD domestic life adjusted profit,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: lognormal, mean: 150.0, scale: 0.15,
     features: {view: reporting_segments, basis: "GAP: domestic life business (MSI Aioi Life, MSI Primary Life), company definition", metric: domestic_life_adjusted_profit, prior: synthetic}}
  - {entity: msad, id: msad.financial_services_profit, name: MS&AD financial services and risk-related services adjusted profit,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: lognormal, mean: 10.0, scale: 0.3,
     features: {view: reporting_segments, basis: "GAP: financial services and risk-related services, company definition", metric: financial_services_adjusted_profit, prior: synthetic}}
  - {entity: msad, id: msad.adjusted_profit_residual, name: MS&AD other and consolidation adjustments to group adjusted profit,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: gaussian, prior: {family: gaussian, mu: 40.0, sigma: 15.0}, scale: 15.0,
     features: {view: reporting_segments, basis: "GAP residual: holding company, equity-method and consolidation adjustments; at the synthetic priors it also absorbs the difference between the parts and the total", metric: adjusted_profit_other, prior: synthetic}}

  # --- net income and the bridge to adjusted profit ------------------------------------------------------------------
  - {entity: msad, id: msad.net_income, name: MS&AD net income,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: lognormal, mean: 560.0, scale: 0.1,
     features: {view: reporting_segments, basis: "consolidated net income attributable to owners of the parent (statutory)", metric: net_income, prior: synthetic}}
  - {entity: msad, id: msad.reserve_addback, name: MS&AD reserve add-back to net income,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: gaussian, prior: {family: gaussian, mu: 60.0, sigma: 20.0}, scale: 20.0,
     features: {view: reporting_segments, basis: "after-tax net provision for catastrophe and price-fluctuation reserves (J-GAAP items), added back in adjusted profit; negative in a reversal year", metric: reserve_addback, prior: synthetic}}
  - {entity: msad, id: msad.net_income_bridge_residual, name: MS&AD other differences between net income and adjusted profit,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: gaussian, prior: {family: gaussian, mu: 0.0, sigma: 20.0}, scale: 20.0,
     features: {view: reporting_segments, basis: "bridge residual: goodwill and intangible amortization, extraordinary items and the definition's other adjustments (items not in the reviewed sources)", prior: synthetic}}

  # --- domestic non-life: by company and by source --------------------------------------------------------------------
  - {entity: msad, id: msad.msi_profit, name: Mitsui Sumitomo Insurance adjusted profit,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: lognormal, mean: 150.0, scale: 0.08,
     features: {view: reporting_segments, basis: "GAP: Mitsui Sumitomo Insurance (non-consolidated), company definition", prior: synthetic},
     aliases: [Mitsui Sumitomo profit, MSI profit]}
  - {entity: msad, id: msad.adi_profit, name: Aioi Nissay Dowa Insurance adjusted profit,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: lognormal, mean: 90.0, scale: 0.1,
     features: {view: reporting_segments, basis: "GAP: Aioi Nissay Dowa Insurance (non-consolidated; Toyota-affiliated, auto heavy), company definition", prior: synthetic},
     aliases: [Aioi Nissay Dowa profit, ADI profit]}
  - {entity: msad, id: msad.dnl_other_companies, name: MS&AD other domestic non-life companies and eliminations,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: gaussian, prior: {family: gaussian, mu: 20.0, sigma: 5.0}, scale: 5.0,
     features: {view: reporting_segments, basis: "GAP residual: direct auto insurer and other domestic non-life subsidiaries, less eliminations", prior: synthetic}}
  - {entity: msad, id: msad.dnl_underwriting_profit, name: MS&AD domestic non-life underwriting profit,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: gaussian, prior: {family: gaussian, mu: 90.0, sigma: 70.0}, scale: 70.0,
     features: {view: underwriting, basis: "J-GAAP DNL: underwriting profit before catastrophe-reserve movements = net premiums earned less net incurred losses less underwriting expenses (identity msad.id.uw_profit), pre-tax", prior: synthetic}}
  - {entity: msad, id: msad.dnl_investment_income, name: MS&AD domestic non-life net interest and dividends,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: lognormal, mean: 160.0, scale: 0.1,
     features: {view: investment_assets, basis: "J-GAAP DNL: net interest and dividends after investment income credited to savings-type policies (recurring)", prior: synthetic}}
  - {entity: msad, id: msad.dnl_xholding_gains, name: MS&AD gains on sales of strategic equity holdings,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: gaussian, prior: {family: gaussian, mu: 100.0, sigma: 30.0}, scale: 30.0,
     features: {view: investment_assets, basis: "J-GAAP DNL: realized gains on sales of strategic (cross-held) equities, pre-tax; non-recurring; counted in adjusted profit under the definition read here (to verify against the plan in force)", prior: synthetic}}
  - {entity: msad, id: msad.dnl_taxes, name: MS&AD domestic non-life taxes and other items,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: gaussian, prior: {family: gaussian, mu: -90.0, sigma: 10.0}, scale: 10.0,
     features: {view: underwriting, basis: "J-GAAP DNL residual: income taxes, other ordinary items and other gains and losses", prior: synthetic}}

  # --- investment income by asset class and the portfolio by class (J-GAAP DNL) ---------------------------------------
  - {entity: msad, id: msad.dnl_div_domestic_equity, name: MS&AD dividends from domestic equities,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: lognormal, mean: 80.0, scale: 0.15,
     features: {view: investment_assets, basis: "J-GAAP DNL: dividends from domestic stocks (mostly strategic holdings)", prior: synthetic}}
  - {entity: msad, id: msad.dnl_inc_domestic_bonds, name: MS&AD income from domestic bonds,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: lognormal, mean: 40.0, scale: 0.1,
     features: {view: investment_assets, basis: "J-GAAP DNL: interest on domestic bonds (JGBs, municipal and corporate bonds)", prior: synthetic}}
  - {entity: msad, id: msad.dnl_inc_foreign_securities, name: MS&AD income from foreign securities,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: lognormal, mean: 60.0, scale: 0.15,
     features: {view: investment_assets, basis: "J-GAAP DNL: interest and dividends on foreign bonds and other foreign securities, incl. dividends from overseas subsidiaries", prior: synthetic}}
  - {entity: msad, id: msad.dnl_deposit_credit, name: MS&AD investment income credited to savings-type policies,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: gaussian, prior: {family: gaussian, mu: -30.0, sigma: 3.0}, scale: 3.0,
     features: {view: liabilities, basis: "J-GAAP DNL: investment income transferred to deposit premiums of maturity-refund policies (negative; the liability side)", prior: synthetic}}
  - {entity: msad, id: msad.dnl_inv_residual, name: MS&AD other interest and dividends,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: gaussian, prior: {family: gaussian, mu: 10.0, sigma: 5.0}, scale: 5.0,
     features: {view: investment_assets, basis: "J-GAAP DNL residual: loans, real estate and other income less investment expenses", prior: synthetic}}
  - {entity: msad, id: msad.dnl_investment_portfolio, name: MS&AD domestic non-life investment assets,
     attribute_kind: balance, unit: ¥bn, family: lognormal, mean: 9000.0, scale: 0.05,
     features: {view: investment_assets, basis: "J-GAAP DNL: investment assets at book or market value per classification; no maturity ladder or hedge notional", prior: synthetic}}
  - {entity: msad, id: msad.dnl_domestic_bonds, name: MS&AD domestic bond portfolio,
     attribute_kind: balance, unit: ¥bn, family: lognormal, mean: 4000.0, scale: 0.03,
     features: {view: investment_assets, basis: "J-GAAP DNL: domestic bonds held at book value (JGBs, municipal, corporate); tenor and classification not in the reviewed sources; marks are in msad.bond_valuation", prior: synthetic}}
  - {entity: msad, id: msad.cross_holding_book, name: MS&AD strategic equity holdings,
     attribute_kind: balance, unit: ¥bn, family: lognormal, mean: 2500.0, scale: 0.15,
     features: {view: investment_assets, basis: "market value of strategic (cross-held) domestic equities; available-for-sale under J-GAAP", prior: synthetic}}
  - {entity: msad, id: msad.dnl_foreign_securities, name: MS&AD foreign securities holdings,
     attribute_kind: balance, unit: ¥bn, family: lognormal, mean: 2000.0, scale: 0.06,
     features: {view: investment_assets, basis: "J-GAAP DNL: foreign bonds and other foreign securities (hedged and unhedged; hedge ratio not disclosed)", prior: synthetic}}
  - {entity: msad, id: msad.dnl_other_assets, name: MS&AD other investment assets,
     attribute_kind: balance, unit: ¥bn, family: gaussian, prior: {family: gaussian, mu: 500.0, sigma: 50.0}, scale: 50.0,
     features: {view: investment_assets, basis: "J-GAAP DNL residual: cash, loans, real estate, other securities", prior: synthetic}}

  # --- reinvestment states ----------------------------------------------------------------------------------------------
  - {entity: msad, id: msad.dnl_reinvestable_cash, name: MS&AD domestic non-life cash available to reinvest,
     attribute_kind: capital_flow, unit: ¥bn/yr, family: gaussian, prior: {family: gaussian, mu: 500.0, sigma: 200.0}, scale: 200.0,
     features: {view: investment_assets, basis: "redemptions and coupons of the domestic bond portfolio plus net premium cash after claims and liquidity needs; level unknown (no ladder)", prior: synthetic}}
  - {entity: msad, id: msad.dnl_new_investments, name: MS&AD domestic non-life new investments,
     attribute_kind: capital_flow, unit: ¥bn/yr, family: gaussian, prior: {family: gaussian, mu: 500.0, sigma: 200.0}, scale: 200.0,
     features: {view: investment_assets, basis: "purchases of domestic bonds (the share of reinvestable cash the mandate puts into domestic bonds); level unknown", prior: synthetic}}
  - {entity: msad, id: msad.dnl_new_money_yield, name: MS&AD domestic non-life new-money yield,
     attribute_kind: bond_yield, unit: pct, family: gaussian, prior: {family: gaussian, mu: 1.8, sigma: 0.4}, scale: 0.4,
     features: {view: investment_assets, basis: "yield achieved on new domestic investments (tenor and credit mix of what is bought, not one market yield)", prior: synthetic}}
  - {entity: msad, id: msad.dnl_bond_redemptions, name: MS&AD domestic bond redemptions,
     attribute_kind: capital_flow, unit: ¥bn/yr, family: gaussian, prior: {family: gaussian, mu: 400.0, sigma: 150.0}, scale: 150.0,
     features: {view: investment_assets, basis: "domestic bonds maturing or redeemed in the year, at book value; level unknown (no ladder)", prior: synthetic}}
  - {entity: msad, id: msad.dnl_bond_book_yield, name: MS&AD domestic bond book yield,
     attribute_kind: bond_yield, unit: pct, family: gaussian, prior: {family: gaussian, mu: 1.0, sigma: 0.1}, scale: 0.1,
     features: {view: investment_assets, basis: "interest on domestic bonds over their book value: the balance-weighted yield of the cohorts held", prior: synthetic}}
  - {entity: msad, id: msad.fx_hedge_cost, name: MS&AD FX hedge cost on foreign bonds,
     attribute_kind: borrowing_cost, unit: pct, family: gaussian, prior: {family: gaussian, mu: 3.0, sigma: 0.4}, scale: 0.4,
     features: {view: investment_assets, basis: "annualized cost MS&AD pays to hedge its foreign bonds into yen (its own tenors and hedge ratio on the short-rate differential); notional not disclosed", prior: synthetic}}

  # --- underwriting units and operating states (J-GAAP DNL: the two P&C companies combined) -----------------------------
  - {entity: msad, id: msad.dnl_npw, name: MS&AD domestic non-life net premiums written,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: lognormal, mean: 3000.0, scale: 0.03,
     features: {view: underwriting, basis: "J-GAAP DNL: net premiums written, all lines, both P&C companies (activity, not earned profit)", prior: synthetic}}
  - {entity: msad, id: msad.dnl_npw_fire, name: MS&AD domestic fire premiums,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: lognormal, mean: 600.0, scale: 0.06,
     features: {view: underwriting, basis: "J-GAAP DNL: fire and allied lines net premiums written", prior: synthetic}}
  - {entity: msad, id: msad.dnl_npw_auto, name: MS&AD domestic voluntary auto premiums,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: lognormal, mean: 1500.0, scale: 0.03,
     features: {view: underwriting, basis: "J-GAAP DNL: voluntary automobile net premiums written (the largest line; dealer and agency channels)", prior: synthetic}}
  - {entity: msad, id: msad.dnl_npw_specialty, name: "MS&AD domestic marine, personal accident and other premiums",
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: lognormal, mean: 600.0, scale: 0.05,
     features: {view: underwriting, basis: "J-GAAP DNL: hull and cargo, personal accident, liability and other net premiums written", prior: synthetic}}
  - {entity: msad, id: msad.dnl_npw_cali, name: MS&AD domestic compulsory auto liability premiums,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: lognormal, mean: 300.0, scale: 0.03,
     features: {view: underwriting, basis: "J-GAAP DNL residual: compulsory automobile liability (a no-profit, no-loss line)", prior: synthetic}}
  - {entity: msad, id: msad.dnl_npe, name: MS&AD domestic non-life net premiums earned,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: lognormal, mean: 2500.0, scale: 0.02,
     features: {view: underwriting, basis: "J-GAAP DNL: net premiums earned, private insurance (written premium earned over the policy term, net of ceded premium)", prior: synthetic}}
  - {entity: msad, id: msad.dnl_incurred_losses, name: MS&AD domestic non-life net incurred losses,
     attribute_kind: loss_flow, unit: ¥bn/yr, family: lognormal, mean: 1600.0, scale: 0.03,
     features: {view: underwriting, basis: "J-GAAP DNL: net incurred losses incl. loss adjustment expenses, private insurance, before catastrophe-reserve movements (current-year claims, prior-year development, natural catastrophes)", prior: synthetic}}
  - {entity: msad, id: msad.dnl_uw_expenses, name: MS&AD domestic non-life underwriting expenses,
     attribute_kind: spending_flow, unit: ¥bn/yr, family: lognormal, mean: 810.0, scale: 0.03,
     features: {view: underwriting, basis: "J-GAAP DNL: commissions and operating expenses for underwriting", prior: synthetic}}
  - {entity: msad, id: msad.dnl_combined_ratio, name: MS&AD domestic non-life combined ratio,
     attribute_kind: margin, unit: pct, family: gaussian, prior: {family: gaussian, mu: 91.0, sigma: 2.2}, scale: 2.2,
     features: {view: underwriting, basis: "J-GAAP DNL: loss ratio plus expense ratio, private insurance (the Japanese convention: a sum of ratios with different denominators)", prior: synthetic}}
  - {entity: msad, id: msad.dnl_loss_ratio, name: MS&AD domestic non-life loss ratio,
     attribute_kind: margin, unit: pct, family: gaussian, prior: {family: gaussian, mu: 64.0, sigma: 2.0}, scale: 2.0,
     features: {view: underwriting, basis: "J-GAAP DNL: net incurred losses incl. loss adjustment expenses over net premiums earned (E/I), private insurance", prior: synthetic}}
  - {entity: msad, id: msad.dnl_expense_ratio, name: MS&AD domestic non-life expense ratio,
     attribute_kind: margin, unit: pct, family: gaussian, prior: {family: gaussian, mu: 27.0, sigma: 1.0}, scale: 1.0,
     features: {view: underwriting, basis: "J-GAAP DNL: commissions and operating expenses for underwriting over net premiums written, all lines (W/P; identity msad.id.expense_ratio)", prior: synthetic}}
  - {entity: msad, id: msad.dnl_insured_exposure, name: MS&AD domestic insured exposure,
     attribute_kind: quantity_flow, unit: index, family: lognormal, mean: 100.0, scale: 0.03,
     features: {view: operating_state, basis: "insured units and sums insured (vehicles, property, commercial activity); index", prior: synthetic}}
  - {entity: msad, id: msad.auto_rate_revision, name: MS&AD domestic auto rate revision,
     attribute_kind: growth_rate, unit: pct y/y, family: gaussian, prior: {family: gaussian, mu: 4.0, sigma: 2.0}, scale: 2.0,
     features: {view: operating_state, basis: "average voluntary auto rate revision at renewal (rate filings, reference loss-cost changes)", prior: synthetic}}
  - {entity: msad, id: msad.fire_rate_revision, name: MS&AD domestic fire rate revision,
     attribute_kind: growth_rate, unit: pct y/y, family: gaussian, prior: {family: gaussian, mu: 5.0, sigma: 3.0}, scale: 3.0,
     features: {view: operating_state, basis: "average fire and allied lines rate revision and reunderwriting at renewal", prior: synthetic}}
  - {entity: msad, id: msad.dnl_retention, name: MS&AD domestic policy retention,
     attribute_kind: structural_level, unit: pct, family: gaussian, prior: {family: gaussian, mu: 85.0, sigma: 3.0}, scale: 3.0,
     features: {view: operating_state, basis: "share of expiring voluntary auto and fire policies renewed", prior: synthetic}}
  - {entity: msad, id: msad.japan_nat_cat_losses, name: MS&AD domestic natural catastrophe losses,
     attribute_kind: loss_flow, unit: ¥bn/yr, family: lognormal, mean: 80.0, scale: 0.5,
     features: {view: underwriting, basis: "net incurred losses from domestic natural catastrophes after reinsurance recoveries, before catastrophe-reserve movements", prior: synthetic}}
  - {entity: msad, id: msad.cat_reserve_provision, name: MS&AD catastrophe loss reserve net provision,
     attribute_kind: loss_flow, unit: ¥bn/yr, family: gaussian, prior: {family: gaussian, mu: 80.0, sigma: 30.0}, scale: 30.0,
     features: {view: liabilities, basis: "J-GAAP DNL: provision (+) or reversal (-) of catastrophe loss reserves, pre-tax; reversal only where a line's loss ratio exceeds its statutory threshold", prior: synthetic}}
  - {entity: msad, id: msad.reinsurance_cost, name: MS&AD reinsurance cost,
     attribute_kind: cost_index, unit: index, family: lognormal, mean: 100.0, scale: 0.08,
     features: {view: liabilities, basis: "price of ceded catastrophe and excess-of-loss cover at renewal; index", prior: synthetic}}

  # --- international: by business, at constant FX by source, and underwriting states ------------------------------------
  - {entity: msad, id: msad.intl_amlin_profit, name: MS Amlin adjusted profit,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: lognormal, mean: 40.0, scale: 0.3,
     features: {view: regions, basis: "GAP: MS Amlin (Lloyd's syndicates, reinsurance and continental European insurance), yen at reporting rates", prior: synthetic}}
  - {entity: msad, id: msad.intl_asia_profit, name: MS&AD Asia adjusted profit,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: lognormal, mean: 70.0, scale: 0.12,
     features: {view: regions, basis: "GAP: Asia non-life (MSIG Asia) and Asian life and non-life stakes (equity method), yen", prior: synthetic}}
  - {entity: msad, id: msad.intl_americas_profit, name: MS&AD Americas adjusted profit,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: lognormal, mean: 20.0, scale: 0.3,
     features: {view: regions, basis: "GAP: US and other Americas operations (commercial and specialty), yen", prior: synthetic}}
  - {entity: msad, id: msad.intl_europe_profit, name: MS&AD Europe (Aioi Nissay Dowa Europe) adjusted profit,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: lognormal, mean: 10.0, scale: 0.3,
     features: {view: regions, basis: "GAP: European auto and telematics insurance of the Toyota-affiliated company, yen", prior: synthetic}}
  - {entity: msad, id: msad.intl_residual, name: MS&AD other international adjusted profit,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: gaussian, prior: {family: gaussian, mu: 20.0, sigma: 8.0}, scale: 8.0,
     features: {view: regions, basis: "GAP residual: other equity-method stakes (e.g. in Australia), international reinsurance and headquarters items", prior: synthetic}}
  - {entity: msad, id: msad.intl_profit_cfx, name: MS&AD international adjusted profit at constant FX,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: lognormal, mean: 160.0, scale: 0.07,
     features: {view: regions, basis: "GAP: international business at the plan rates (before translation at actual rates)", currency: multi-currency at plan rates, prior: synthetic}}
  - {entity: msad, id: msad.intl_underwriting_profit, name: MS&AD international underwriting profit,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: lognormal, mean: 120.0, scale: 0.12,
     features: {view: underwriting, basis: "international underwriting result, pre-tax, constant FX", prior: synthetic}}
  - {entity: msad, id: msad.intl_investment_income, name: MS&AD international investment income,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: lognormal, mean: 100.0, scale: 0.08,
     features: {view: investment_assets, basis: "international net investment income, pre-tax, constant FX", prior: synthetic}}
  - {entity: msad, id: msad.intl_taxes, name: MS&AD international taxes and other items,
     attribute_kind: revenue_flow, unit: ¥bn/yr, family: gaussian, prior: {family: gaussian, mu: -60.0, sigma: 6.0}, scale: 6.0,
     features: {view: underwriting, basis: "international residual: taxes, minority interests, equity-method results and other, constant FX", prior: synthetic}}
  - {entity: msad, id: msad.intl_new_money_yield, name: MS&AD international new-money yield,
     attribute_kind: bond_yield, unit: pct, family: gaussian, prior: {family: gaussian, mu: 4.8, sigma: 0.3}, scale: 0.3,
     features: {view: investment_assets, basis: "yield on new fixed income bought by the overseas units (USD, GBP, EUR and Asian curves plus spread)", prior: synthetic}}
  - {entity: msad, id: msad.intl_cat_losses, name: MS&AD international catastrophe losses,
     attribute_kind: loss_flow, unit: ¥bn/yr, family: lognormal, mean: 60.0, scale: 0.5,
     features: {view: underwriting, basis: "net natural catastrophe losses of the overseas units (property reinsurance and Lloyd's books mostly), constant FX", prior: synthetic}}
  - {entity: msad, id: msad.intl_prior_year_development, name: MS&AD international prior-year reserve development,
     attribute_kind: loss_flow, unit: ¥bn/yr, family: gaussian, prior: {family: gaussian, mu: 0.0, sigma: 20.0}, scale: 20.0,
     features: {view: liabilities, basis: "adverse (+) or favorable (-) prior-year development, overseas casualty and specialty books, constant FX", prior: synthetic}}
  - {entity: msad, id: msad.intl_renewal_pricing, name: MS&AD international renewal pricing,
     attribute_kind: growth_rate, unit: pct y/y, family: gaussian, prior: {family: gaussian, mu: 3.0, sigma: 3.0}, scale: 3.0,
     features: {view: operating_state, basis: "renewal price change on the overseas specialty, property and reinsurance books", prior: synthetic}}
