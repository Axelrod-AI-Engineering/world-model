    source: msad.cross_holding_sales
    target: msad.cross_holding_book
    label: shrinks the strategic book
    edge_type: stock_flow
    identity: msad.sf.cross_holding_book
    transition:
      mechanism: "Sales reduce the strategic equity book under the reduction plan"
      sign: "-"
      actor: domestic non-life
      business_unit: domestic non-life
      condition_observable: "market value of strategic equities"
      timing: {onset: on sale, build: over the plan, persistence: permanent, recognition: period end}
      evidence: {existence: inferred, direction: inferred, magnitude: unknown, timing: inferred, sources: [msad.r1, msad.pub]}
      breaker: "counterparties resist sales"
      next_state: strategic equity holdings
      unresolved:
        - {input: "MS&AD reduction plan and its end date", status: disclosed_not_supplied, searched: ["msad.corpus", "msad.r1", "msad.r2", "msad.macro", "msad.x1", "msad.peer", "corpus: ms&ad reduction plan and its end date"], note: "MS&AD discloses this publicly (the strategic-equity reduction plan in the medium-term plan); not in the supplied material"}
  - id: msad-c-sale-esr
    source: msad.cross_holding_sales
    target: msad.esr
    label: releases risk capital
    calibration: uncalibrated
    transition:
      mechanism: "Selling equities and holding the proceeds in lower-risk assets lowers required capital more than economic capital"
      sign: "+"
      actor: group capital management
      business_unit: group
      condition: "proceeds held in lower-risk assets or returned"
      condition_observable: "ESR after sales"
      timing: {onset: on sale, build: over the plan, persistence: permanent, recognition: solvency reporting}
      evidence: {existence: inferred, direction: inferred, magnitude: unknown, timing: unknown, sources: [msad.pub]}
      breaker: "proceeds redeployed into riskier assets or acquisitions"
      next_state: economic solvency ratio
  - id: msad-c-sale-capital
    source: msad.cross_holding_sales
    target: msad.excess_capital
    label: adds deployable capital
    edge_type: stock_flow
    identity: msad.sf.excess_capital
    transition:
      mechanism: "After-tax proceeds and released risk capital add to capital that can be returned or redeployed; capital, not earnings"
      sign: "+"
      actor: group capital management
      business_unit: group
      condition: "tax on realized gains paid; solvency above target range"
      condition_observable: "capital policy disclosures"
      timing: {onset: on sale, build: over the plan, persistence: until deployed, recognition: capital reporting}
      evidence: {existence: inferred, direction: inferred, magnitude: unknown, timing: unknown, sources: [msad.pub]}
      breaker: "capital stress elsewhere absorbs it"
      next_state: deployable excess capital
  # --- overseas translation counter-effect ---------------------------------------------------------------------------
  - id: msad-c-fx-reserves
    source: dollar_yen.usd_jpy
    target: msad.dnl_incurred_losses
    label: a weaker yen raises foreign-currency claims reserves
    calibration: uncalibrated
    transition:
      mechanism: "The domestic P&C companies hold claims reserves in foreign currency (marine, overseas covers of Japanese clients); a weaker yen raises their yen value at the period-end rate, offsetting part of the translation gain"
      sign: "+"
      actor: domestic non-life (reserving)
      business_unit: domestic non-life
      geography: Japan (foreign-currency liabilities)
      currency: USD and other into JPY
      condition: "foreign-currency outstanding claims reserves exist and are not matched by foreign-currency assets in the same line"
      condition_observable: "foreign-currency reserve provision in the P&C companies' results"
      timing: {onset: period end, build: none, persistence: until the rate reverses, recognition: quarterly results at the period-end rate}
      evidence: {existence: inferred, direction: inferred, magnitude: unknown, timing: inferred, sources: [msad.pub]}
      breaker: "asset-side FX gains in the same company; a reversal of the rate reverses it"
      next_state: net incurred losses
      unresolved:
        - {input: "MS&AD per-yen sensitivity of profit", status: not_disclosed_in_reviewed_sources, searched: ["msad.corpus", "msad.r1", "msad.r2", "msad.macro", "msad.x1", "msad.peer", "corpus: ms&ad per-yen sensitivity of profit"], note: "the client's rates workbook keeps company sensitivities as placeholders until disclosed"}
  # --- capital, payout and growth --------------------------------------------------------------------------------------
  - id: msad-c-intl-remit
    source: msad.international_profit
    target: msad.overseas_remittances
    label: becomes remittable cash
    calibration: uncalibrated
    transition:
      mechanism: "Overseas profit becomes parent cash only when subsidiaries remit dividends, subject to local capital rules (Lloyd's and local regulators)"
      sign: "+"
      actor: overseas boards and regulators
      business_unit: international
      condition: "local capital surplus; no trapped cash"
      condition_observable: "dividends received from overseas subsidiaries"
      timing: {onset: annual dividend cycle, build: one year, persistence: per year, recognition: parent accounts}
      evidence: {existence: inferred, direction: inferred, magnitude: unknown, timing: unknown, sources: [msad.pub]}
      breaker: "trapped cash; local capital stress (e.g. after catastrophe years at Lloyd's)"
      next_state: dividends from overseas subsidiaries
      unresolved:
        - {input: "remittances by subsidiary", status: not_disclosed_in_reviewed_sources, searched: ["msad.corpus", "msad.r1", "msad.r2", "msad.macro", "msad.x1", "msad.peer", "corpus: remittances by subsidiary"], note: "no candidate passage in the supplied corpus"}
  - id: msad-c-remit-capital
    source: msad.overseas_remittances
    target: msad.excess_capital
    label: adds parent capital
    edge_type: stock_flow
    identity: msad.sf.excess_capital
    transition:
      mechanism: "Remitted cash adds to capital available at the parent"
      sign: "+"
      actor: group capital management
      business_unit: group
      condition_observable: "parent liquidity"
      timing: {onset: on receipt, build: none, persistence: until used, recognition: parent accounts}
      evidence: {existence: inferred, direction: inferred, magnitude: unknown, timing: unknown, sources: [msad.pub]}
      breaker: "parent obligations"
      next_state: deployable excess capital
  - id: msad-c-capital-returns
    source: msad.excess_capital
    target: msad.shareholder_returns
    label: funds buybacks
    calibration: uncalibrated
    transition:
      mechanism: "Capital beyond needs can fund buybacks under the board's capital policy; no automatic dividend conclusion follows"
      sign: "+"
      actor: board
      business_unit: group
      condition: "ESR above the target range; parent cash available; no better use"
      condition_observable: "announced buybacks"
      timing: {onset: next results or capital announcement, build: over the year, persistence: per decision, recognition: equity}
      evidence: {existence: inferred, direction: inferred, magnitude: unknown, timing: unknown, sources: [msad.pub, msad.r1]}
      breaker: "acquisitions take priority; capital stress"
      next_state: shareholder returns
      unresolved:
        - {input: "shareholder return policy in force", status: disclosed_not_supplied, searched: ["msad.corpus", "msad.r1", "msad.r2", "msad.macro", "msad.x1", "msad.peer", "corpus: shareholder return policy in force"], note: "MS&AD discloses this publicly (the medium-term plan and results presentations); not in the supplied material"}
  - id: msad-c-capital-ma
    source: msad.excess_capital
    target: msad.acquisition_spend
    label: funds acquisitions and stakes
    calibration: uncalibrated
    transition:
      mechanism: "Excess capital funds acquisitions and strategic stakes when a target fits risk appetite and price discipline"
      sign: "+"
      actor: group management (M&A)
      business_unit: group
      condition: "an opportunity at an acceptable price"
      condition_observable: "announced deals"
      timing: {onset: deal announcement, build: closing (months), persistence: per deal, recognition: at closing}
      evidence: {existence: inferred, direction: inferred, magnitude: unknown, timing: unknown, sources: [msad.pub]}
      breaker: "no fitting target; price too high"
      next_state: acquisition spend
  - id: msad-c-ma-earnings
    source: msad.acquisition_spend
    target: msad.acquired_earnings
    label: adds acquired earnings
    calibration: uncalibrated
    transition:
      mechanism: "An acquisition or stake adds earnings after financing cost, reserve adequacy and integration; the price decides the return"
      sign: "+"
      actor: group management
      business_unit: international
      condition: "price below value; reserves adequate"
      condition_observable: "acquired-business profit versus the deal case"
      timing: {onset: closing, build: 1-3 years, persistence: while owned, recognition: from closing (consolidated or equity method)}
      evidence: {existence: inferred, direction: inferred, magnitude: unknown, timing: unknown, sources: [msad.pub]}
      breaker: "overpaying; reserve deficiencies; integration failure"
      next_state: acquired-business earnings
  - id: msad-c-ma-esr
    source: msad.acquisition_spend
    target: msad.esr
    label: consumes economic capital
    calibration: uncalibrated
    transition:
      mechanism: "Acquisitions consume economic capital (price above net assets plus the acquired risk)"
      sign: "-"
      actor: group capital management
      business_unit: group
      condition_observable: "ESR after the deal"
      timing: {onset: closing, build: none, persistence: until earned back, recognition: solvency reporting}
      evidence: {existence: inferred, direction: inferred, magnitude: unknown, timing: unknown, sources: [msad.pub]}
      breaker: "funded by new equity or partner capital"
      next_state: economic solvency ratio
  - id: msad-c-acquired-intl
    source: msad.acquired_earnings
    target: msad.intl_profit_cfx
    label: joins international profit
    calibration: uncalibrated
    transition:
      mechanism: "Acquired overseas earnings join international profit at constant FX (inorganic growth, kept apart from organic)"
      sign: "+"
      actor: group reporting
      business_unit: international
      condition: "consolidated, or equity-accounted (profit share only)"
      condition_observable: "growth split organic versus inorganic"
      timing: {onset: closing, build: none, persistence: while owned, recognition: from closing}
      evidence: {existence: inferred, direction: inferred, magnitude: unknown, timing: unknown, sources: [msad.pub]}
      breaker: "a stake below significant influence (dividends only)"
      next_state: international profit at constant FX
  - id: msad-c-gap-returns
    source: msad.operating_profit
    target: msad.shareholder_returns
    label: sets the payout
    calibration: uncalibrated
    transition:
      mechanism: "Dividends and buybacks follow a payout policy on group adjusted profit; higher recurring profit supports a higher payout, by board decision"
      sign: "+"
      actor: board
      business_unit: group
      condition: "ESR within or above target; payout policy unchanged"
      condition_observable: "dividend per share, buybacks and total payout ratio announcements"
      timing: {onset: next fiscal-year decision, build: annual, persistence: progressive dividend policy, recognition: on declaration}
      evidence: {existence: inferred, direction: inferred, magnitude: unknown, timing: unknown, sources: [msad.pub, msad.r1]}
      breaker: "capital stress; a payout ratio on a definition that excludes sale gains"
      next_state: shareholder returns
      unresolved:
        - {input: "shareholder return policy in force", status: disclosed_not_supplied, searched: ["msad.corpus", "msad.r1", "msad.r2", "msad.macro", "msad.x1", "msad.peer", "corpus: shareholder return policy in force"], note: "MS&AD discloses this publicly (the medium-term plan and results presentations); not in the supplied material"}
  - id: msad-c-gap-capital
    source: msad.operating_profit
    target: msad.excess_capital
    label: adds retained capital
    edge_type: stock_flow
    identity: msad.sf.excess_capital
    transition:
      mechanism: "Adjusted profit retained after payout adds to capital (earnings capacity, distinct from parent cash and regulatory capital)"
      sign: "+"
      actor: group
      business_unit: group
      condition_observable: "ESR roll-forward"
      timing: {onset: period end, build: none, persistence: cumulative, recognition: capital reporting}
      evidence: {existence: inferred, direction: inferred, magnitude: unknown, timing: unknown, sources: [msad.pub]}
      breaker: "payout above earnings"
      next_state: deployable excess capital

paths:
  - id: msad.path.policy_growth
    name: MS&AD policy growth
    entity_id: msad
    trigger: "customers' insurable exposures grow (vehicles, property, commercial activity)"
    endpoint: msad.operating_profit
    description: "Exposure growth reaches profit only through earned premium at adequate prices; it also spreads fixed costs. The Toyota dealer channel feeds the same exposure (msad-c-toyota-exposure)."
    steps:
      - {interaction_id: msad-c-exposure}
      - {interaction_id: msad-c-exposure-npw}
      - {interaction_id: msad-c-npw-earned, branch: earned}
      - {interaction_id: "msad.id.expense_ratio:msad.dnl_npw", branch: expense_ratio}
      - {interaction_id: msad-a-cr-expense}
      - {interaction_id: "msad.id.uw_profit:msad.dnl_npe"}
      - {interaction_id: msad-a-dnl-uw}
      - {interaction_id: s40}
  - id: msad.path.auto_repricing
    name: MS&AD claims inflation and auto repricing
    entity_id: msad
    trigger: "repair parts, labor and construction costs rise"
    endpoint: msad.operating_profit
    description: "Claims costs raise incurred losses (current and open-claim reserves) and so the loss ratio first; auto rate revisions follow with a lag, retention pushes back, and the new rates earn through as earned premium, the loss ratio's denominator. Underwriting profit is earned premium less losses less expenses (msad.id.uw_profit)."
    steps:
      - {interaction_id: msad-c-severity-loss, branch: losses}
      - {interaction_id: msad-c-severity-reserves, branch: reserves}
      - {interaction_id: "msad.id.loss_ratio:msad.dnl_incurred_losses"}
      - {interaction_id: msad-c-loss-autorate}
      - {interaction_id: msad-c-autorate-retention, branch: retention}
      - {interaction_id: msad-c-autorate-premium, branch: premium}
      - {interaction_id: msad-c-retention-npw}
      - {interaction_id: msad-a-npw-auto}
      - {interaction_id: msad-c-npw-earned}
      - {interaction_id: "msad.id.loss_ratio:msad.dnl_npe"}
      - {interaction_id: msad-a-cr-loss}
      - {interaction_id: "msad.id.uw_profit:msad.dnl_incurred_losses"}
      - {interaction_id: "msad.id.uw_profit:msad.dnl_npe"}
      - {interaction_id: msad-a-dnl-uw}
      - {interaction_id: s40}
  - id: msad.path.catastrophe_reserves
    name: MS&AD catastrophes, catastrophe reserves and reinsurance
    entity_id: msad
    trigger: "a heavy domestic typhoon or flood season"
    endpoint: msad.net_income
    description: "Catastrophe losses hit underwriting profit and group adjusted profit in full; the J-GAAP catastrophe-reserve reversal cushions net income only (adjusted profit adds reserve movements back). Reinsurance hardens at the next renewal and passes into fire rates."
    steps:
      - {interaction_id: msad-c-industrycat-losses, branch: company}
      - {interaction_id: msad-c-industrycat-reins, branch: reinsurance}
      - {interaction_id: msad-c-cat-uw, branch: losses}
      - {interaction_id: msad-c-cat-reserve, branch: reserve}
      - {interaction_id: msad-c-reins-uw, branch: ceded}
      - {interaction_id: msad-c-reins-firerate, branch: pass_through}
      - {interaction_id: msad-c-firerate-npw}
      - {interaction_id: msad-a-npw-fire}
      - {interaction_id: msad-c-npw-earned}
      - {interaction_id: "msad.id.uw_profit:msad.dnl_incurred_losses"}
      - {interaction_id: "msad.id.uw_profit:msad.dnl_npe"}
      - {interaction_id: msad-a-dnl-uw}
      - {interaction_id: s40}
      - {interaction_id: msad-a-ni-gap}
      - {interaction_id: msad-c-reserve-addback}
      - {interaction_id: msad-a-ni-addback}
  - id: msad.path.international_underwriting
    name: MS&AD international catastrophes and the rate cycle
    entity_id: msad
    trigger: "a heavy US hurricane or global catastrophe year"
    endpoint: msad.operating_profit
    description: "The same catastrophe year costs the reinsurance and Lloyd's books now and hardens rates for the next renewals; MS Amlin carries most of it."
    steps:
      - {interaction_id: msad-c-uscat-intlcat, branch: losses}
      - {interaction_id: msad-c-uscat-intlrate, branch: hardening}
      - {interaction_id: msad-c-intlcat-uw}
      - {interaction_id: msad-c-intlrate-npw, branch: volume}
      - {interaction_id: msad-c-intlrate-uw, branch: margin}
      - {interaction_id: msad-c-intlnpw-uw}
      - {interaction_id: msad-a-intl-uw}
      - {interaction_id: msad-a-intl-translate}
      - {interaction_id: s39}
  - id: msad.path.us_casualty_reserves
    name: MS&AD US casualty reserves and specialty repricing
    entity_id: msad
    trigger: "US liability claim costs (legal and social inflation) rise"
    endpoint: msad.operating_profit
    description: "The same severity trend reaches the overseas casualty books as reserve charges and the specialty market as repricing."
    steps:
      - {interaction_id: msad-c-usliab-pyd, branch: reserves}
      - {interaction_id: msad-c-usliab-rate, branch: repricing}
      - {interaction_id: msad-c-pyd-uw}
      - {interaction_id: msad-c-intlrate-uw}
      - {interaction_id: msad-a-intl-uw}
      - {interaction_id: msad-a-intl-translate}
      - {interaction_id: s39}
  - id: msad.path.domestic_yields
    name: MS&AD domestic yields to investment income and life
    entity_id: msad
    trigger: "super-long JGB yields rise"
    endpoint: msad.operating_profit
    description: "A JGB move reaches only new money at that tenor; income credited to savings-type policies absorbs part; the life company is the long-duration book. s38 is the reduced-form summary of this path and is never added to it."
    steps:
      - {interaction_id: msad-c-jgb30-nmy, branch: assets}
      - {interaction_id: msad-c-jgb30-deposit, branch: liabilities}
      - {interaction_id: msad-c-jgb30-life, branch: life}
      - {interaction_id: msad-c-nmy-bondinc}
      - {interaction_id: "msad.id.bond_income:msad.dnl_bond_book_yield"}
      - {interaction_id: msad-a-inv-dombond}
      - {interaction_id: msad-a-inv-deposit}
      - {interaction_id: msad-a-dnl-inv}
      - {interaction_id: s40}
      - {interaction_id: msad-a-life-mail}
      - {interaction_id: msad-a-gap-life}
  - id: msad.path.reinvestment
    name: MS&AD reinvestment of the domestic bond portfolio
    entity_id: msad
    trigger: "domestic bonds mature or pay while market yields differ from book yields"
    endpoint: msad.operating_profit
    description: "The reinvestment transitions: existing bonds -> redemptions -> eligible cash -> chosen investments -> the bond book (a stock, msad.sf.domestic_bonds) -> earned income (book x book yield, msad.id.bond_income) -> net investment result -> segment profit -> group earnings and capacity. Sizes are unknown: no maturity ladder, allocation or turnover is in the reviewed sources, so a new yield is never applied to the whole portfolio."
    steps:
      - {interaction_id: msad-c-portfolio-cash}
      - {interaction_id: msad-c-redeem-cash}
      - {interaction_id: msad-c-cash-invest}
      - {interaction_id: msad-c-invest-income}
      - {interaction_id: "msad.id.bond_income:msad.dnl_domestic_bonds"}
      - {interaction_id: msad-a-inv-dombond}
      - {interaction_id: msad-a-dnl-inv}
      - {interaction_id: s40}
      - {interaction_id: msad-c-gap-returns, branch: payout}
      - {interaction_id: msad-c-gap-capital, branch: capital}
  - id: msad.path.fx_hedge_cost
    name: MS&AD FX hedge cost
    entity_id: msad
    trigger: "the US-Japan short-rate gap widens"
    endpoint: msad.operating_profit
    description: "Hedge cost consumes the yield on hedged foreign bonds; the BoJ side narrows it (msad-c-boj-hedge)."
    steps:
      - {interaction_id: msad-c-fed-hedge}
      - {interaction_id: msad-c-hedge-forinc}
      - {interaction_id: msad-a-inv-forsec}
      - {interaction_id: msad-a-dnl-inv}
      - {interaction_id: s40}
  - id: msad.path.overseas_yields
    name: MS&AD US and European yields to overseas income and annuity sales
    entity_id: msad
    trigger: "US Treasury yields rise"
    endpoint: msad.operating_profit
    description: "US yields reach the reinvesting share of the overseas books, the domestic companies' foreign bonds (before hedge cost), and the bank-channel annuity business. Euro yields reach the same new-money yield through msad-c-bund-nmy (a parallel driver, not a step here). s36 and s37 are reduced-form summaries and are never added to this path."
    steps:
      - {interaction_id: msad-c-ust-nmy, branch: international}
      - {interaction_id: msad-c-ust-forinc, branch: domestic_foreign}
      - {interaction_id: msad-c-ust-primary, branch: primary_life}
      - {interaction_id: msad-c-intl-nmy-income}
      - {interaction_id: msad-a-intl-inv}
      - {interaction_id: msad-a-intl-translate}
      - {interaction_id: s39}
      - {interaction_id: msad-a-inv-forsec}
      - {interaction_id: msad-a-dnl-inv}
      - {interaction_id: s40}
      - {interaction_id: msad-c-primary-sales-profit}
      - {interaction_id: msad-a-life-primary}
      - {interaction_id: msad-a-gap-life}
  - id: msad.path.asset_marks_liabilities
    name: MS&AD asset marks and liability valuation
    entity_id: msad
    trigger: "super-long JGB yields move"
    endpoint: msad.esr
    description: "Asset marks and liability valuation are parallel routes to net assets and the ESR; neither reaches adjusted profit."
    steps:
      - {interaction_id: msad-c-jgb-bondmark, branch: assets}
      - {interaction_id: msad-c-jgb-liability, branch: liabilities}
      - {interaction_id: msad-c-bondmark-equity, branch: equity}
      - {interaction_id: msad-c-bondmark-esr, branch: solvency}
      - {interaction_id: msad-c-liability-esr}
  - id: msad.path.equity_marks
    name: MS&AD equity marks on strategic holdings
    entity_id: msad
    trigger: "Japanese equities move"
    endpoint: msad.esr
    description: "A large strategic book moves net assets, the ESR and the holding value per share that a sum-of-the-parts adds to core earnings value."
    steps:
      - {interaction_id: msad-c-topix-xholding}
      - {interaction_id: msad-c-xholding-equity, branch: equity}
      - {interaction_id: msad-c-xholding-esr, branch: solvency}
      - {interaction_id: msad-c-xholding-pershare, branch: valuation}
      - {interaction_id: msad-c-pershare-price}
  - id: msad.path.cross_holding_disposal
    name: MS&AD strategic-equity reduction
    entity_id: msad
    trigger: "management sells strategic equities under the reduction plan"
    endpoint: msad.excess_capital
    description: "Sales give up recurring dividends (negative), realize one-off gains that count in adjusted profit under the definition read here, shrink the book, release risk capital, and add deployable capital."
    steps:
      - {interaction_id: msad-c-sale-dividends, branch: income}
      - {interaction_id: msad-c-sale-gains, branch: gains}
      - {interaction_id: msad-c-sale-book, branch: book}
      - {interaction_id: msad-c-sale-esr, branch: risk}
      - {interaction_id: msad-c-sale-capital, branch: cash}
      - {interaction_id: msad-a-inv-domeq}
      - {interaction_id: msad-a-dnl-inv}
      - {interaction_id: msad-a-dnl-xgain}
      - {interaction_id: s40}
      - {interaction_id: msad-c-capital-returns, branch: returns}
      - {interaction_id: msad-c-capital-ma, branch: redeploy}
  - id: msad.path.overseas_translation
    name: MS&AD overseas translation
    entity_id: msad
    trigger: "the yen weakens against the dollar"
    endpoint: msad.operating_profit
    description: "Translation raises yen overseas profit while foreign-currency claims reserves at home cost part of it back (size unknown: no MS&AD sensitivity in the reviewed sources)."
    steps:
      - {interaction_id: s35, branch: translation}
      - {interaction_id: msad-c-fx-reserves, branch: reserves}
      - {interaction_id: s39}
      - {interaction_id: "msad.id.uw_profit:msad.dnl_incurred_losses"}
      - {interaction_id: msad-a-dnl-uw}
      - {interaction_id: s40}
  - id: msad.path.capital_payout
    name: MS&AD capital and shareholder return
    entity_id: msad
    trigger: "overseas subsidiaries earn and can remit"
    endpoint: msad.shareholder_returns
    description: "Earnings capacity, parent cash, available capital and board payout policy are distinct; a profit move does not by itself decide a dividend."
    steps:
      - {interaction_id: msad-c-intl-remit}
      - {interaction_id: msad-c-remit-capital}
      - {interaction_id: msad-c-capital-returns}
  - id: msad.path.growth_execution
    name: MS&AD growth execution
    entity_id: msad
    trigger: "an acquisition or stake within risk appetite"
    endpoint: msad.operating_profit
    steps:
      - {interaction_id: msad-c-capital-ma}
      - {interaction_id: msad-c-ma-earnings, branch: earnings}
      - {interaction_id: msad-c-ma-esr, branch: capital}
      - {interaction_id: msad-c-acquired-intl}
      - {interaction_id: msad-a-intl-translate}
      - {interaction_id: s39}

compositions:
  - id: msad.comp.adjusted_profit_by_business
    entity_id: msad
    view: reporting_segments
    basis: "group adjusted profit by business, company definition (J-GAAP based)"
    unit: ¥bn/yr
    period: fiscal year ending March
    total: msad.operating_profit
    members: [msad.domestic_profit, msad.international_profit, msad.domestic_life_profit, msad.financial_services_profit]
    residual: msad.adjusted_profit_residual
    note: "The view every operating path feeds. Its residual absorbs the gap between the synthetic parts and total, and says so."
  - id: msad.comp.net_income_bridge
    entity_id: msad
    view: reporting_segments
    basis: "net income = group adjusted profit - after-tax reserve add-back + other differences"
    unit: ¥bn/yr
    period: fiscal year ending March
    total: msad.net_income
    members: [msad.operating_profit, msad.reserve_addback]
    residual: msad.net_income_bridge_residual
    note: "Net income is downstream of adjusted profit, so an operating change is never counted twice; the reserve add-back subtracts (negative accounting link)."
  - id: msad.comp.domestic_nonlife_by_company
    entity_id: msad
    view: reporting_segments
    basis: "domestic non-life adjusted profit by company, company definition"
    unit: ¥bn/yr
    period: fiscal year ending March
    total: msad.domestic_profit
    members: [msad.msi_profit, msad.adi_profit]
    residual: msad.dnl_other_companies
    note: "Overlaps msad.comp.domestic_nonlife_by_source: the same total, never added together."
  - id: msad.comp.domestic_nonlife_by_source
    entity_id: msad
    view: underwriting
    basis: "domestic non-life adjusted profit by source: underwriting, recurring investment income, strategic-equity sale gains, less taxes and other (J-GAAP, both P&C companies)"
    unit: ¥bn/yr
    period: fiscal year ending March
    total: msad.domestic_profit
    members: [msad.dnl_underwriting_profit, msad.dnl_investment_income, msad.dnl_xholding_gains]
    residual: msad.dnl_taxes
    note: "Sale gains are their own non-recurring part. The view the operating paths drive."
  - id: msad.comp.dnl_investment_income
    entity_id: msad
    view: investment_assets
    basis: "J-GAAP net interest and dividends by asset class, both P&C companies"
    unit: ¥bn/yr
    period: fiscal year ending March
    total: msad.dnl_investment_income
    members: [msad.dnl_div_domestic_equity, msad.dnl_inc_domestic_bonds, msad.dnl_inc_foreign_securities, msad.dnl_deposit_credit]
    residual: msad.dnl_inv_residual
    note: "Income by asset class; the credit to savings-type policies is the liability side (negative)."
  - id: msad.comp.dnl_assets_by_class
    entity_id: msad
    view: investment_assets
    basis: "J-GAAP investment assets by class, both P&C companies (balances)"
    unit: ¥bn
    total: msad.dnl_investment_portfolio
    members: [msad.dnl_domestic_bonds, msad.cross_holding_book, msad.dnl_foreign_securities]
    residual: msad.dnl_other_assets
    note: "Balances by class only: no maturity ladder, tenor, classification or hedge notional is in the reviewed sources, so none is represented."
  - id: msad.comp.dnl_premiums_by_line
    entity_id: msad
    view: underwriting
    basis: "J-GAAP net premiums written by line, both P&C companies"
    unit: ¥bn/yr
    period: fiscal year ending March
    total: msad.dnl_npw
    members: [msad.dnl_npw_fire, msad.dnl_npw_auto, msad.dnl_npw_specialty]
    residual: msad.dnl_npw_cali
    note: "An activity measure, not profit; compulsory auto liability is a no-profit, no-loss line. The by-company split of lines (matrix) is not represented."
  - id: msad.comp.combined_ratio
    entity_id: msad
    view: underwriting
    basis: "combined ratio = loss ratio (E/I) + expense ratio (W/P), private insurance, both P&C companies"
    unit: pct
    period: fiscal year ending March
    total: msad.dnl_combined_ratio
    members: [msad.dnl_loss_ratio, msad.dnl_expense_ratio]
    note: "An identity of ratios with different denominators, not of amounts; no residual."
  - id: msad.comp.international_by_business
    entity_id: msad
    view: regions
    basis: "international adjusted profit by business, yen at reporting rates"
    unit: ¥bn/yr
    period: fiscal year ending March
    total: msad.international_profit
    members: [msad.intl_amlin_profit, msad.intl_asia_profit, msad.intl_americas_profit, msad.intl_europe_profit]
    residual: msad.intl_residual
    note: "Overseas is not one exposure: MS Amlin carries catastrophe and reserve swings, Asia is growth and equity-method stakes."
  - id: msad.comp.international_by_source
    entity_id: msad
    view: regions
    basis: "international adjusted profit at constant FX: underwriting plus investment income, less taxes and other"
    unit: ¥bn/yr
    period: fiscal year ending March
    total: msad.intl_profit_cfx
    members: [msad.intl_underwriting_profit, msad.intl_investment_income]
    residual: msad.intl_taxes
    note: "Translated into the yen value by msad-a-intl-translate (s35 carries the dollar rate)."
  - id: msad.comp.domestic_life
    entity_id: msad
    view: reporting_segments
    basis: "domestic life adjusted profit by company, company definition"
    unit: ¥bn/yr
    period: fiscal year ending March
    total: msad.domestic_life_profit
    members: [msad.life_mail_profit, msad.life_primary_profit]
    residual: msad.life_residual
  - id: msad.comp.capital_sources_uses
    entity_id: msad
    view: capital
    basis: "sources and uses of deployable capital (not an additive partition; flows into a stock)"
    unit: ¥bn
    total: msad.excess_capital
    members: [msad.operating_profit, msad.cross_holding_sales, msad.overseas_remittances, msad.shareholder_returns, msad.acquisition_spend]
    additive: false
    note: "Earnings capacity, parent cash, available capital and payout policy are related but distinct."

# Oct 18 conversion: exact relations that are not sums (weights derived at the construction levels), stocks with their
# flows, and the company x source cross-classification of domestic non-life.
identities:
  - {id: msad.id.loss_ratio, entity_id: msad, form: ratio, target: msad.dnl_loss_ratio,
     numerator: [msad.dnl_incurred_losses], denominator: [msad.dnl_npe], coefficient: 100,
     unit_check: "pct = 100 x ¥bn / ¥bn (earned/incurred basis)"}
  - {id: msad.id.expense_ratio, entity_id: msad, form: ratio, target: msad.dnl_expense_ratio,
     numerator: [msad.dnl_uw_expenses], denominator: [msad.dnl_npw], coefficient: 100,
     unit_check: "pct = 100 x ¥bn / ¥bn (written basis: a different denominator from the loss ratio)"}
  - {id: msad.id.uw_profit, entity_id: msad, form: difference, target: msad.dnl_underwriting_profit,
     of: msad.dnl_npe, minus: [msad.dnl_incurred_losses, msad.dnl_uw_expenses]}
  - {id: msad.id.bond_income, entity_id: msad, form: product, target: msad.dnl_inc_domestic_bonds,
     factors: [msad.dnl_domestic_bonds, msad.dnl_bond_book_yield], coefficient: 0.01,
     unit_check: "¥bn/yr = ¥bn x pct x 0.01"}
  - {id: msad.id.adjusted_eps, entity_id: msad, form: ratio, target: msad.adjusted_eps,
     numerator: [msad.operating_profit], denominator: [msad.shares_outstanding], coefficient: 1000,
     unit_check: "¥ per share = 1000 x ¥bn / m shares"}

stock_flows:
  - {id: msad.sf.domestic_bonds, entity_id: msad, stock: msad.dnl_domestic_bonds, period_days: 365,
     inflows: [msad.dnl_new_investments], outflows: [msad.dnl_bond_redemptions],
     basis: "book value: purchases in, redemptions out; marks are in msad.bond_valuation"}
  - {id: msad.sf.cross_holding_book, entity_id: msad, stock: msad.cross_holding_book, period_days: 365,
     outflows: [msad.cross_holding_sales],
     basis: "market value: sales out at their market value; the index move is msad-c-topix-xholding"}
  - {id: msad.sf.excess_capital, entity_id: msad, stock: msad.excess_capital, period_days: 365,
     inflows: [msad.operating_profit, msad.cross_holding_sales, msad.overseas_remittances],
     outflows: [msad.shareholder_returns, msad.acquisition_spend],
     basis: "deployable capital at the parent; adjusted profit stands in for retained earnings capacity (a builder simplification: payout is the shareholder-returns outflow)"}

matrices:
  - id: msad.mx.domestic_nonlife
    entity_id: msad
    rows: msad.comp.domestic_nonlife_by_source
    columns: msad.comp.domestic_nonlife_by_company
    drives: rows
    note: "Each company has underwriting, investment income and sale gains; the by-source view drives domestic profit (every operating path feeds it), the by-company view reconciles. No cell (company x source) is in the reviewed sources, so none is represented."
