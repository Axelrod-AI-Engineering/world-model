paths:
- id: cit.path.non_usd_rates
  name: Citi non-USD short rates to Services NII
  entity_id: citigroup
  trigger: non-USD policy rates rise (the ECB as the largest leg; the BoJ and PBoC links feed the same basket)
  endpoint: citigroup.net_income
  description: 'Parallel responses of one move in Citi''s non-USD rate basket: the TTS and Securities Services deposit spreads widen, and non-USD
    deposit costs follow at a low beta. cit-c-nonusd-nii (calibrated from the disclosed all-currency sensitivity) is the reduced form on firm
    NII and is never added to these steps.'
  steps:
  - {interaction_id: cit-c-ecb-basket}
  - {interaction_id: cit-c-basket-ttsnii, branch: tts}
  - {interaction_id: cit-c-basket-ssnii, branch: custody}
  - {interaction_id: cit-c-basket-depcost, branch: funding}
  - {interaction_id: cit-c-depcost-ttsnii}
  - {interaction_id: cit-a-svcnii-tts-nii}
  - {interaction_id: cit-a-svcnii-ss-nii}
  - {interaction_id: cit-a-svc-services-nii}
  - {interaction_id: cit-a-seg-services-revenue}
  - &id001 {interaction_id: cit-a-pretax-net-revenue}
  - &id002 {interaction_id: cit-a-ni-pretax-income}
- id: cit.path.usd_rates
  name: Citi policy rate to the segment cells
  entity_id: citigroup
  trigger: the Fed raises the policy rate
  endpoint: citigroup.net_income
  description: 'Parallel responses of one Fed move: USD deposit spreads widen in TTS and Wealth while deposit costs catch up by the beta (the
    company calls its USD book roughly neutral within twelve months), floating loans and card APRs reprice, Treasury cash earns more, and Markets
    NII falls while the desks earn it back in principal transactions (a counter-path that moves NII and NII ex-Markets apart, not revenue). m26
    is the reduced form on firm NII and is never added to these steps.'
  steps:
  - {interaction_id: cit-c-fed-depcost, branch: beta}
  - {interaction_id: cit-c-fed-ttsnii, branch: tts_spread}
  - {interaction_id: cit-c-fed-citigold, branch: wealth_spread}
  - {interaction_id: cit-c-fed-loanyield, branch: loans}
  - {interaction_id: cit-c-fed-usccnii, branch: cards}
  - {interaction_id: cit-c-fed-corpother, branch: treasury}
  - {interaction_id: cit-c-fed-mktsnii, branch: markets}
  - {interaction_id: cit-c-fed-nir-offset, branch: markets_offset}
  - {interaction_id: cit-c-depcost-ttsnii}
  - {interaction_id: cit-c-depcost-citigold}
  - {interaction_id: cit-c-loanyield-corplending}
  - {interaction_id: cit-a-svcnii-tts-nii}
  - {interaction_id: cit-a-svc-services-nii}
  - {interaction_id: cit-a-wealth-citigold-retail-banking}
  - {interaction_id: cit-a-bank-corporate-lending-revenue}
  - {interaction_id: cit-c-yield-usccnii}
  - {interaction_id: cit-a-uscc-uscc-nii}
  - {interaction_id: cit-a-ao-corporate-other-revenue}
  - {interaction_id: cit-a-mx-markets-nii-col}
  - {interaction_id: cit-a-seg-services-revenue}
  - {interaction_id: cit-a-seg-wealth-revenue}
  - {interaction_id: cit-a-seg-banking-revenue}
  - {interaction_id: cit-a-seg-uscc-revenue}
  - {interaction_id: cit-a-seg-all-other-revenue}
  - *id001
  - *id002
- id: cit.path.securities_reinvestment
  name: Citi securities reinvestment
  entity_id: citigroup
  trigger: securities mature while new-purchase yields differ from the book yield
  endpoint: citigroup.cet1_capital
  description: Existing securities -> cash released -> Treasury's reinvestment decision -> book yield -> Corporate/Other revenue -> All Other
    -> revenue -> earnings -> capital. The maturity ladder is not disclosed, so no new yield is applied to the whole book.
  steps:
  - {interaction_id: cit-c-maturities-purchases}
  - {interaction_id: cit-c-purchases-secyield}
  - {interaction_id: cit-c-secyield-corpother}
  - {interaction_id: cit-a-ao-corporate-other-revenue}
  - {interaction_id: cit-a-seg-all-other-revenue}
  - *id001
  - *id002
  - {interaction_id: cit-c-ni-cet1}
- id: cit.path.long_end
  name: Citi long-end yields to Treasury income and capital
  entity_id: citigroup
  trigger: long-end Treasury yields rise
  endpoint: citigroup.cet1_ratio
  description: 'One move, two parallel responses: new purchases earn more (income builds over years) and AFS securities mark down into AOCI and
    CET1 at once.'
  steps:
  - {interaction_id: cit-c-ust10-npy, branch: yield}
  - {interaction_id: cit-c-ust10-aoci, branch: marks}
  - {interaction_id: cit-c-npy-secyield}
  - {interaction_id: cit-c-secyield-corpother}
  - {interaction_id: cit-a-ao-corporate-other-revenue}
  - {interaction_id: cit-a-seg-all-other-revenue}
  - *id001
  - *id002
  - {interaction_id: cit-c-aoci-cet1}
  - {interaction_id: cit-c-ni-cet1}
  - {interaction_id: cit-c-cet1cap-ratio}
- id: cit.path.cross_border
  name: Citi cross-border flows to Services
  entity_id: citigroup
  trigger: world growth and trade pick up (US growth as the represented driver)
  endpoint: citigroup.net_income
  description: More cross-border activity earns payment and FX fees and brings operating deposits that earn the deposit spread. s19 (US GDP to
    Services revenue) is the reduced form and is never added to these steps.
  steps:
  - {interaction_id: cit-c-usgdp-xborder}
  - {interaction_id: cit-c-xborder-ttsnir, branch: fees}
  - {interaction_id: cit-c-xborder-svcdeps, branch: deposits}
  - {interaction_id: cit-c-svcdeps-ttsnii}
  - {interaction_id: cit-a-svcnir-tts-nir}
  - {interaction_id: cit-a-svcnii-tts-nii}
  - {interaction_id: cit-a-svc-services-nir}
  - {interaction_id: cit-a-svc-services-nii}
  - {interaction_id: cit-a-seg-services-revenue}
  - *id001
  - *id002
- id: cit.path.markets
  name: Citi volatility to Markets revenue
  entity_id: citigroup
  trigger: rate and FX volatility rises
  endpoint: citigroup.net_income
  description: Volatility lifts rates and FX flow and equity derivatives, but the same shock widens credit spreads (inventory marks), lowers equity
    levels (prime balances) and raises market-risk RWA; incentive pay takes a share. s16 is the reduced form on Markets revenue and is never added
    to these steps.
  steps:
  - {interaction_id: cit-c-vol-ratesfx, branch: rates_fx}
  - {interaction_id: cit-c-vol-equities, branch: equities}
  - {interaction_id: jpm-c-vol-spread, branch: spreads}
  - {interaction_id: jpm-c-vol-equityindex, branch: levels}
  - {interaction_id: cit-c-vol-rwa, branch: capital}
  - {interaction_id: cit-c-spread-spreadprod}
  - {interaction_id: cit-c-eq-equities}
  - {interaction_id: cit-a-fi-rates-currencies}
  - {interaction_id: cit-a-fi-spread-products}
  - {interaction_id: cit-a-mkts-fixed-income-markets}
  - {interaction_id: cit-a-mkts-equity-markets}
  - {interaction_id: cit-c-markets-comp}
  - {interaction_id: cit-a-exp-compensation-expense}
  - {interaction_id: cit-a-seg-markets-revenue}
  - {interaction_id: cit-a-pretax-operating-expenses}
  - *id001
  - *id002
  - {interaction_id: cit-c-rwa-ratio}
- id: cit.path.deals_banking
  name: Citi deal activity to Banking
  entity_id: citigroup
  trigger: deal and issuance activity rises
  endpoint: citigroup.net_income
  description: The fee wallet times Citi's share, with banker incentive pay as the offset.
  steps:
  - {interaction_id: cit-c-deals-ib}
  - {interaction_id: cit-a-bank-investment-banking-revenue}
  - {interaction_id: cit-c-ib-comp}
  - {interaction_id: cit-a-exp-compensation-expense}
  - {interaction_id: cit-a-seg-banking-revenue}
  - {interaction_id: cit-a-pretax-operating-expenses}
  - *id001
  - *id002
- id: cit.path.wholesale_credit
  name: Citi credit spreads to Banking and Markets
  entity_id: citigroup
  trigger: corporate credit spreads widen
  endpoint: citigroup.net_income
  description: 'One move, four parallel responses: CDS loan hedges gain at once, wholesale reserves build, loan spreads reprice at renewal, and
    credit inventory marks down. The hedge gain and the provision are a gross effect and its offset, both kept.'
  steps:
  - {interaction_id: cit-c-spread-hedges, branch: hedges}
  - {interaction_id: cit-c-spread-bankprov, branch: reserves}
  - {interaction_id: cit-c-spread-corplending, branch: pricing}
  - {interaction_id: cit-c-spread-spreadprod, branch: inventory}
  - {interaction_id: cit-a-bank-loan-hedges}
  - {interaction_id: cit-a-bank-corporate-lending-revenue}
  - {interaction_id: cit-a-seg-banking-revenue}
  - {interaction_id: cit-a-fi-spread-products}
  - {interaction_id: cit-a-mkts-fixed-income-markets}
  - {interaction_id: cit-a-seg-markets-revenue}
  - {interaction_id: cit-a-prov-banking-provision}
  - {interaction_id: cit-a-pretax-provision-for-credit-losses}
  - *id001
  - *id002
- id: cit.path.card_credit
  name: Citi consumer credit cycle (cards)
  entity_id: citigroup
  trigger: US unemployment rises
  endpoint: citigroup.net_income
  description: 'Two clocks: CECL reserves build at once on the outlook; losses arrive after delinquencies roll, faster in private label. Counter-paths:
    retail partners share private-label losses through lower partner payments, and Citi tightens underwriting.'
  steps:
  - {interaction_id: cit-c-unemp-usccreserve, branch: cecl}
  - {interaction_id: cit-c-unemp-delinq, branch: losses}
  - {interaction_id: cit-c-delinq-gpcc, branch: gpcc}
  - {interaction_id: cit-c-delinq-plcc, branch: plcc}
  - {interaction_id: cit-c-delinq-loans, branch: underwriting}
  - {interaction_id: cit-c-gpcc-usccnco}
  - {interaction_id: cit-c-plcc-usccnco}
  - {interaction_id: cit-c-nco-ncl}
  - {interaction_id: cit-c-plcc-partner}
  - {interaction_id: cit-a-usccprov-uscc-net-credit-losses}
  - {interaction_id: cit-a-usccprov-uscc-reserve-build}
  - {interaction_id: cit-a-prov-uscc-provision}
  - {interaction_id: cit-a-usccnir-card-rewards-partner}
  - {interaction_id: cit-a-uscc-uscc-nir}
  - {interaction_id: cit-a-seg-uscc-revenue}
  - {interaction_id: cit-a-pretax-provision-for-credit-losses}
  - *id001
  - *id002
- id: cit.path.card_growth
  name: Citi card balance growth and its reserve cost
  entity_id: citigroup
  trigger: card balances grow (acquisition marketing, a purchased portfolio)
  endpoint: citigroup.net_income
  description: Balances earn NII but need a day-one reserve, season into losses, and consume capital.
  steps:
  - {interaction_id: cit-c-loans-usccnii, branch: nii}
  - {interaction_id: cit-c-loans-reserve, branch: day_one}
  - {interaction_id: cit-c-loans-ncl, branch: losses}
  - {interaction_id: cit-c-uscc-rwa, branch: capital}
  - {interaction_id: cit-a-uscc-uscc-nii}
  - {interaction_id: cit-a-seg-uscc-revenue}
  - {interaction_id: cit-a-usccprov-uscc-reserve-build}
  - {interaction_id: cit-a-usccprov-uscc-net-credit-losses}
  - {interaction_id: cit-a-prov-uscc-provision}
  - {interaction_id: cit-a-pretax-provision-for-credit-losses}
  - *id001
  - *id002
- id: cit.path.card_spend
  name: Citi card spend to card fees, net of rewards
  entity_id: citigroup
  trigger: consumer card spending rises (prices or growth)
  endpoint: citigroup.net_income
  description: Interchange and rewards with partner payments move with the same purchases; the net is small and can be negative.
  steps:
  - {interaction_id: cit-c-cpi-spend}
  - {interaction_id: cit-c-spend-interchange, branch: interchange}
  - {interaction_id: cit-c-spend-rewards, branch: rewards}
  - {interaction_id: cit-a-usccnir-card-interchange}
  - {interaction_id: cit-a-usccnir-card-rewards-partner}
  - {interaction_id: cit-a-uscc-uscc-nir}
  - {interaction_id: cit-a-seg-uscc-revenue}
  - *id001
  - *id002
- id: cit.path.market_levels_fees
  name: Citi market levels to custody and wealth fees
  entity_id: citigroup
  trigger: equity markets rise
  endpoint: citigroup.net_income
  description: Assets under custody and client investment assets mark up and earn fees; prime balances grow.
  steps:
  - {interaction_id: cit-c-eq-auc, branch: custody}
  - {interaction_id: cit-c-eq-clientassets, branch: wealth}
  - {interaction_id: cit-c-eq-equities, branch: prime}
  - {interaction_id: cit-c-auc-ssnir}
  - {interaction_id: cit-c-clientassets-pb}
  - {interaction_id: cit-c-clientassets-citigold}
  - {interaction_id: cit-c-clientassets-waw}
  - {interaction_id: cit-a-svcnir-ss-nir}
  - {interaction_id: cit-a-svc-services-nir}
  - {interaction_id: cit-a-wealth-private-bank}
  - {interaction_id: cit-a-wealth-citigold-retail-banking}
  - {interaction_id: cit-a-wealth-wealth-at-work}
  - {interaction_id: cit-a-mkts-equity-markets}
  - {interaction_id: cit-a-seg-services-revenue}
  - {interaction_id: cit-a-seg-wealth-revenue}
  - {interaction_id: cit-a-seg-markets-revenue}
  - *id001
  - *id002
- id: cit.path.fx_translation
  name: Citi dollar strength to revenue, expenses and capital
  entity_id: citigroup
  trigger: the dollar strengthens against Citi's international currencies
  endpoint: citigroup.cet1_ratio
  description: 'One move, four parallel responses: international revenue and expenses translate into fewer dollars (a natural hedge), the CTA
    lowers AOCI and CET1, and non-USD RWA shrink (the ratio is hedged).'
  steps:
  - {interaction_id: cit-c-eur-fxbasket}
  - {interaction_id: cit-c-fxbasket-intlrev, branch: international}
  - {interaction_id: cit-c-fxbasket-services, branch: services}
  - {interaction_id: cit-c-fxbasket-markets, branch: markets}
  - {interaction_id: cit-c-fxbasket-banking, branch: banking}
  - {interaction_id: cit-c-fxbasket-wealth, branch: wealth}
  - {interaction_id: cit-c-fxbasket-opex, branch: expenses}
  - {interaction_id: cit-c-fxbasket-aoci, branch: cta}
  - {interaction_id: cit-c-fxbasket-rwa, branch: rwa}
  - {interaction_id: cit-a-seg-services-revenue}
  - {interaction_id: cit-a-seg-markets-revenue}
  - {interaction_id: cit-a-seg-banking-revenue}
  - {interaction_id: cit-a-seg-wealth-revenue}
  - {interaction_id: cit-a-pretax-operating-expenses}
  - *id001
  - *id002
  - {interaction_id: cit-c-aoci-cet1}
  - {interaction_id: cit-c-ni-cet1}
  - {interaction_id: cit-c-cet1cap-ratio}
  - {interaction_id: cit-c-rwa-ratio}
- id: cit.path.mexico
  name: Citi peso to Banamex revenue and capital
  entity_id: citigroup
  trigger: the peso weakens (USD/MXN rises)
  endpoint: citigroup.cet1_ratio
  description: Peso revenue translates into fewer dollars and the Banamex CTA deepens.
  steps:
  - {interaction_id: cit-c-mxn-mexico, branch: revenue}
  - {interaction_id: cit-c-mxn-aoci, branch: cta}
  - {interaction_id: cit-a-ao-mexico-consumer-revenue}
  - {interaction_id: cit-a-seg-all-other-revenue}
  - *id001
  - *id002
  - {interaction_id: cit-c-aoci-cet1}
  - {interaction_id: cit-c-ni-cet1}
  - {interaction_id: cit-c-cet1cap-ratio}
- id: cit.path.transformation
  name: Citi transformation spending to expenses
  entity_id: citigroup
  trigger: transformation spending changes (programs reach target state)
  endpoint: citigroup.net_income
  description: About half of transformation spending is temporary; as programs complete it falls away from technology and professional-services
    costs.
  steps:
  - {interaction_id: cit-c-transform-tech, branch: technology}
  - {interaction_id: cit-c-transform-other, branch: consultants}
  - {interaction_id: cit-a-exp-technology-expense}
  - {interaction_id: cit-a-exp-other-operating-expense}
  - {interaction_id: cit-c-opex-effratio}
  - {interaction_id: cit-a-pretax-operating-expenses}
  - {interaction_id: cit-a-ni-pretax-income}
- id: cit.path.investment_program
  name: Citi investment program and its payback
  entity_id: citigroup
  trigger: Citi pulls forward or adds growth investment
  endpoint: citigroup.net_income
  description: Investment raises compensation (severance, talent) and marketing now, adds card balances, and pays back in productivity savings
    later (a counter-path).
  steps:
  - {interaction_id: cit-c-invest-comp, branch: severance}
  - {interaction_id: cit-c-invest-other, branch: marketing}
  - {interaction_id: cit-c-invest-productivity, branch: payback}
  - {interaction_id: cit-c-invest-loans, branch: cards}
  - {interaction_id: cit-c-productivity-comp}
  - {interaction_id: cit-c-loans-usccnii}
  - {interaction_id: cit-a-exp-compensation-expense}
  - {interaction_id: cit-a-exp-other-operating-expense}
  - {interaction_id: cit-a-uscc-uscc-nii}
  - {interaction_id: cit-a-seg-uscc-revenue}
  - {interaction_id: cit-a-pretax-operating-expenses}
  - *id001
  - *id002
- id: cit.path.legacy_exits
  name: Citi Banamex separation and legacy exits
  entity_id: citigroup
  trigger: Citi deconsolidates Banamex (its ownership falls below control)
  endpoint: citigroup.cet1_ratio
  description: Deconsolidation removes Banamex revenue and RWA, recycles the CTA through earnings as a divestiture-related loss while releasing
    it from AOCI (capital roughly unchanged), and leaves stranded costs until they are cut.
  steps:
  - {interaction_id: cit-c-banamex-mexico, branch: revenue}
  - {interaction_id: cit-c-banamex-rwa, branch: rwa}
  - {interaction_id: cit-c-banamex-recon, branch: cta_recycling}
  - {interaction_id: cit-c-banamex-aoci, branch: cta_release}
  - {interaction_id: cit-c-banamex-stranded, branch: stranded}
  - {interaction_id: cit-c-mxnrev-mexico}
  - {interaction_id: cit-c-stranded-other}
  - {interaction_id: cit-a-ao-mexico-consumer-revenue}
  - {interaction_id: cit-a-seg-all-other-revenue}
  - {interaction_id: cit-a-seg-reconciling-items-revenue}
  - {interaction_id: cit-a-exp-other-operating-expense}
  - {interaction_id: cit-a-pretax-operating-expenses}
  - *id001
  - *id002
  - {interaction_id: cit-c-ni-cet1}
  - {interaction_id: cit-c-aoci-cet1}
  - {interaction_id: cit-c-cet1cap-ratio}
  - {interaction_id: cit-c-rwa-ratio}
- id: cit.path.capital_payout
  name: Citi capital and payout
  entity_id: citigroup
  trigger: earnings accrue
  endpoint: citigroup.cet1_ratio
  description: Earnings add to CET1 and free deducted DTA; dividends and buybacks return the excess over the target.
  steps:
  - {interaction_id: cit-c-ni-cet1, branch: retained}
  - {interaction_id: cit-c-ni-dta, branch: dta}
  - {interaction_id: cit-c-ni-div, branch: payout}
  - {interaction_id: cit-c-dta-cet1}
  - {interaction_id: cit-c-div-cet1}
  - {interaction_id: cit-c-cet1cap-ratio}
  - {interaction_id: cit-c-ratio-buyback}
  - {interaction_id: cit-c-buyback-cet1}
- id: cit.path.capital_requirement
  name: Citi capital requirement to buybacks
  entity_id: citigroup
  trigger: the CET1 requirement rises (stress buffer, G-SIB surcharge, a scheduled step-up)
  endpoint: citigroup.cet1_ratio
  description: A higher requirement raises the management target and leaves less excess to buy back.
  steps:
  - {interaction_id: cit-a-tgt-cet1-requirement}
  - {interaction_id: cit-c-target-buyback}
  - {interaction_id: cit-c-buyback-cet1}
  - {interaction_id: cit-c-cet1cap-ratio}
compositions:
- id: cit.comp.revenue_by_segment
  entity_id: citigroup
  view: reporting_segments
  basis: total revenues, net of interest expense, by reporting segment (managed) plus reconciling items
  unit: $bn/yr
  period: fiscal year ending December
  total: citigroup.net_revenue
  members: [citigroup.services_revenue, citigroup.markets_revenue, citigroup.banking_revenue, citigroup.wealth_revenue, citigroup.uscc_revenue,
    citigroup.all_other_revenue]
  residual: citigroup.reconciling_items_revenue
  note: 'The driven view: rates, activity and credit enter through the segment cells below it. Not the type view (cit.comp.revenue_by_type) or
    the regions view (cit.comp.revenue_by_region): never added to them. Reconciling items are divestiture-related impacts outside All Other''s
    managed basis.'
- id: cit.comp.services
  entity_id: citigroup
  view: reporting_segments
  basis: Services revenue by business and income type
  unit: $bn/yr
  period: fiscal year ending December
  total: citigroup.services_revenue
  members: [citigroup.services_nii, citigroup.services_nir]
  note: 'Services by income type: the two cells of the revenue matrix (cit.mx.revenue). An exact split.'
- id: cit.comp.services_nii
  entity_id: citigroup
  view: reporting_segments
  basis: Services NII by business
  unit: $bn/yr
  period: fiscal year ending December
  total: citigroup.services_nii
  members: [citigroup.tts_nii, citigroup.ss_nii]
  note: 'An exact split as reported: rates drive these lines.'
- id: cit.comp.services_nir
  entity_id: citigroup
  view: reporting_segments
  basis: Services non-interest revenue by business
  unit: $bn/yr
  period: fiscal year ending December
  total: citigroup.services_nir
  members: [citigroup.tts_nir, citigroup.ss_nir]
  note: 'An exact split as reported: flows and asset levels drive these lines.'
- id: cit.comp.markets
  entity_id: citigroup
  view: product
  basis: Markets revenue by product (incl. Markets NII)
  unit: $bn/yr
  period: fiscal year ending December
  total: citigroup.markets_revenue
  members: [citigroup.fixed_income_markets, citigroup.equity_markets]
  note: 'An exact split as reported: no residual.'
- id: cit.comp.fixed_income
  entity_id: citigroup
  view: product
  basis: Fixed Income Markets revenue by product
  unit: $bn/yr
  period: fiscal year ending December
  total: citigroup.fixed_income_markets
  members: [citigroup.rates_currencies, citigroup.spread_products]
  note: 'An exact split as reported: no residual.'
- id: cit.comp.banking
  entity_id: citigroup
  view: reporting_segments
  basis: Banking revenue by business, incl. gain or loss on loan hedges
  unit: $bn/yr
  period: fiscal year ending December
  total: citigroup.banking_revenue
  members: [citigroup.investment_banking_revenue, citigroup.corporate_lending_revenue, citigroup.loan_hedges]
  note: 'An exact split as reported: no residual. Loan hedges gain when spreads widen, before the provision for the same loans.'
- id: cit.comp.wealth
  entity_id: citigroup
  view: reporting_segments
  basis: Wealth revenue by business
  unit: $bn/yr
  period: fiscal year ending December
  total: citigroup.wealth_revenue
  members: [citigroup.citigold_retail_banking, citigroup.private_bank, citigroup.wealth_at_work]
  note: 'An exact split as reported: no residual.'
- id: cit.comp.uscc
  entity_id: citigroup
  view: reporting_segments
  basis: U.S. Consumer Cards revenue by income type
  unit: $bn/yr
  period: fiscal year ending December
  total: citigroup.uscc_revenue
  members: [citigroup.uscc_nii, citigroup.uscc_nir]
  note: 'An exact split as reported: no residual. NIR is negative: rewards and partner payments exceed the fees.'
- id: cit.comp.uscc_nir
  entity_id: citigroup
  view: product
  basis: U.S. Consumer Cards non-interest revenue by line
  unit: $bn/yr
  period: fiscal year ending December
  total: citigroup.uscc_nir
  members: [citigroup.card_interchange, citigroup.card_rewards_partner]
  residual: citigroup.uscc_other_fees
  note: Interchange less rewards and partner payments; the residual holds other fees.
- id: cit.comp.all_other
  entity_id: citigroup
  view: reporting_segments
  basis: All Other revenue by business, managed basis
  unit: $bn/yr
  period: fiscal year ending December
  total: citigroup.all_other_revenue
  members: [citigroup.mexico_consumer_revenue, citigroup.asia_consumer_revenue, citigroup.legacy_holdings_revenue]
  residual: citigroup.corporate_other_revenue
  note: Legacy Franchises (Mexico, Asia consumer, Legacy Holdings Assets) plus Corporate/Other as the residual.
- id: cit.comp.revenue_by_type
  entity_id: citigroup
  view: product
  basis: 'total revenues, net of interest expense: net interest income plus non-interest revenue'
  unit: $bn/yr
  period: fiscal year ending December
  total: citigroup.net_revenue
  members: [citigroup.net_interest_income, citigroup.noninterest_revenue]
  note: 'The passive view of the revenue matrix (cit.mx.revenue): firm NII and non-interest revenue are column totals reached from the segment
    cells, and reconcile to net revenue without driving it. m26 and cit-c-nonusd-nii size firm NII (summary links).'
- id: cit.comp.nii_balance_sheet
  entity_id: citigroup
  view: investment_assets
  basis: 'firm NII: interest income less interest expense'
  unit: $bn/yr
  period: fiscal year ending December
  total: citigroup.net_interest_income
  members: [citigroup.interest_income, citigroup.interest_expense]
  drives: false
  note: 'A reconciling view of firm NII (drives: false): interest income less interest expense, observed and reconciled, never driving firm NII
    (the matrix column does).'
- id: cit.comp.revenue_by_region
  entity_id: citigroup
  view: regions
  basis: 'total revenues by region: North America, International (four businesses), and All Other with reconciling items'
  unit: $bn/yr
  period: fiscal year ending December
  total: citigroup.net_revenue
  members: [citigroup.north_america_revenue, citigroup.international_revenue]
  residual: citigroup.legacy_corporate_revenue
  drives: false
  note: 'A reconciling view (drives: false): observed and reconciled, never driving net revenue. The dollar''s translation reaches the driving
    segments through summary links (the currency mix per segment is not disclosed). The residual is All Other (incl. Mexico) and reconciling items,
    not split by region.'
- id: cit.comp.pretax
  entity_id: citigroup
  view: reporting_segments
  basis: 'pretax income: revenue less operating expenses less provisions'
  unit: $bn/yr
  period: fiscal year ending December
  total: citigroup.pretax_income
  members: [citigroup.net_revenue, citigroup.operating_expenses, citigroup.provision_for_credit_losses]
  note: 'An identity: expenses and provisions are negative values.'
- id: cit.comp.net_income
  entity_id: citigroup
  view: reporting_segments
  basis: 'net income: pretax income less tax, noncontrolling interests and discontinued operations'
  unit: $bn/yr
  period: fiscal year ending December
  total: citigroup.net_income
  members: [citigroup.pretax_income, citigroup.income_tax]
  residual: citigroup.nci_and_discontinued
  note: An identity; the residual holds NCI and discontinued operations.
- id: cit.comp.net_income_by_segment
  entity_id: citigroup
  view: reporting_segments
  basis: net income by reporting segment
  unit: $bn/yr
  period: fiscal year ending December
  total: citigroup.net_income
  members: [citigroup.services_net_income, citigroup.markets_net_income, citigroup.banking_net_income, citigroup.wealth_net_income, citigroup.uscc_net_income]
  residual: citigroup.all_other_net_income
  drives: false
  note: 'A reconciling view (drives: false) of net income; the P&L bridge (cit.comp.net_income) drives it. The residual is All Other plus reconciling
    items.'
- id: cit.comp.expense
  entity_id: citigroup
  view: reporting_segments
  basis: operating expenses by type (negative values)
  unit: $bn/yr
  period: fiscal year ending December
  total: citigroup.operating_expenses
  members: [citigroup.compensation_expense, citigroup.technology_expense]
  residual: citigroup.other_operating_expense
  note: Transformation spending lands mostly in technology; the investment program in compensation (severance, talent) and marketing (in other).
- id: cit.comp.credit_costs
  entity_id: citigroup
  view: credit
  basis: provisions by segment (negative values)
  unit: $bn/yr
  period: fiscal year ending December
  total: citigroup.provision_for_credit_losses
  members: [citigroup.uscc_provision, citigroup.banking_provision, citigroup.all_other_provision]
  residual: citigroup.other_segment_provision
  note: Cards are most of the provision; Mexico consumer most of All Other's.
- id: cit.comp.uscc_provision
  entity_id: citigroup
  view: credit
  basis: 'USCC provision: net credit losses plus reserve build (allowance roll-forward)'
  unit: $bn/yr
  period: fiscal year ending December
  total: citigroup.uscc_provision
  members: [citigroup.uscc_net_credit_losses, citigroup.uscc_reserve_build]
  note: An identity of the allowance roll-forward (other items are negligible). Losses follow delinquencies; the reserve follows the CECL outlook
    and growth.
- id: cit.comp.cet1_target
  entity_id: citigroup
  view: capital
  basis: 'CET1 management target: the requirement plus a management buffer'
  unit: pct
  period: fiscal year ending December
  total: citigroup.cet1_target
  members: [citigroup.cet1_requirement, citigroup.cet1_management_buffer]
  note: An identity of management's stated policy.
- id: cit.comp.capital_sources_uses
  entity_id: citigroup
  view: capital
  basis: 'CET1 capital roll-forward: earnings in, distributions out, AOCI marks and DTA utilization (not an additive partition: flows into a stock)'
  unit: $bn
  total: citigroup.cet1_capital
  members: [citigroup.net_income, citigroup.common_dividends, citigroup.buybacks, citigroup.aoci, citigroup.dta_utilization]
  additive: false
  note: Capital accumulates. The method has no stock-flow link, so these are signed causal links (cit-c-ni-cet1, cit-c-div-cet1, cit-c-buyback-cet1,
    cit-c-aoci-cet1, cit-c-dta-cet1).
matrices:
- id: cit.mx.revenue
  entity_id: citigroup
  rows: cit.comp.revenue_by_segment
  columns: cit.comp.revenue_by_type
  drives: rows
  cells:
    citigroup.services_revenue: {citigroup.net_interest_income: citigroup.services_nii, citigroup.noninterest_revenue: citigroup.services_nir}
    citigroup.markets_revenue: {citigroup.net_interest_income: citigroup.markets_nii, citigroup.noninterest_revenue: citigroup.markets_nir}
    citigroup.banking_revenue: {citigroup.net_interest_income: citigroup.banking_nii, citigroup.noninterest_revenue: citigroup.banking_nir}
    citigroup.wealth_revenue: {citigroup.net_interest_income: citigroup.wealth_nii, citigroup.noninterest_revenue: citigroup.wealth_nir}
    citigroup.uscc_revenue: {citigroup.net_interest_income: citigroup.uscc_nii, citigroup.noninterest_revenue: citigroup.uscc_nir}
    citigroup.all_other_revenue: {citigroup.net_interest_income: citigroup.all_other_nii, citigroup.noninterest_revenue: citigroup.all_other_nir}
    citigroup.reconciling_items_revenue: {citigroup.net_interest_income: citigroup.reconciling_nii, citigroup.noninterest_revenue: citigroup.reconciling_nir}
  note: Citi reports each segment's NII and non-interest revenue. Rows (segments) drive net revenue; firm NII and non-interest revenue are column
    totals reached from the cells. Services and USCC rows are made of their cells; the other rows are driven by their businesses or products,
    so their cells' row links carry no number (they reconcile only).
identities:
- id: cit.id.nii_ex_markets
  entity_id: citigroup
  form: difference
  target: citigroup.nii_ex_markets
  of: citigroup.net_interest_income
  minus: [citigroup.markets_nii]
  basis: 'the guided KPI: firm NII less Markets NII'
  unit_check: $bn/yr = $bn/yr - $bn/yr
- id: cit.id.uscc_nii
  entity_id: citigroup
  form: product
  target: citigroup.uscc_nii
  factors: [citigroup.uscc_loans, citigroup.uscc_nii_yield]
  coefficient: 0.01
  unit_check: $bn/yr = $bn x % x 0.01
- id: cit.id.uscc_ncl
  entity_id: citigroup
  form: product
  target: citigroup.uscc_net_credit_losses
  factors: [citigroup.uscc_nco_rate, citigroup.uscc_loans]
  coefficient: -0.01
  unit_check: $bn/yr (negative) = -0.01 x % x $bn
- id: cit.id.uscc_nco
  entity_id: citigroup
  form: weighted_average
  target: citigroup.uscc_nco_rate
  weights: {citigroup.gpcc_nco_rate: 0.8, citigroup.plcc_nco_rate: 0.2}
  basis: loan-weighted card loss rate; synthetic round weights (the loan mix is bound locally; installment loans are left out)
  unit_check: '% = weights x %'
- id: cit.id.interchange
  entity_id: citigroup
  form: product
  target: citigroup.card_interchange
  factors: [citigroup.card_spend_volume, citigroup.interchange_rate]
  coefficient: 0.01
  unit_check: $bn/yr = $bn/yr x % x 0.01
- id: cit.id.rewards
  entity_id: citigroup
  form: product
  target: citigroup.card_rewards_partner
  factors: [citigroup.card_spend_volume, citigroup.rewards_rate]
  coefficient: -0.01
  unit_check: $bn/yr (negative) = -0.01 x $bn/yr x %
- id: cit.id.mexico
  entity_id: citigroup
  form: ratio
  target: citigroup.mexico_consumer_revenue
  numerator: [citigroup.mexico_revenue_mxn]
  denominator: [usd_mxn.rate]
  unit_check: $bn/yr = MXN bn/yr / (MXN per $)
- id: cit.id.efficiency
  entity_id: citigroup
  form: ratio
  target: citigroup.efficiency_ratio
  numerator: [citigroup.operating_expenses]
  denominator: [citigroup.net_revenue]
  coefficient: -100.0
  unit_check: '% = -100 x (negative expenses $bn/yr) / $bn/yr'
- id: cit.id.cet1_ratio
  entity_id: citigroup
  form: ratio
  target: citigroup.cet1_ratio
  numerator: [citigroup.cet1_capital]
  denominator: [citigroup.rwa]
