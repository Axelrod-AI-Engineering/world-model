interactions:
- id: cit-c-ecb-basket
  source: ecb.policy_rate
  target: citigroup.non_usd_rate_basket
  label: moves Citi's non-USD short rates
  calibration: uncalibrated
  note: 'not converted: a weighted average needs stated weights; Citi''s non-USD currency mix is not disclosed'
  transition:
    mechanism: A move in the ECB deposit rate (euro, the largest non-USD leg) moves the short rate earned on Citi's deposits and placements in
      that currency, one leg of the non-USD basket
    sign: +
    actor: central bank; Citi Treasury (local placements)
    business_unit: Services and Treasury (non-USD balances)
    condition: Citi holds deposits in that currency; the basket weight is that currency's share of non-USD balances
    condition_observable: local policy and interbank rates; Citi's non-USD rate disclosures (none by currency in the sources read)
    timing: {onset: same day, build: none, persistence: while the policy rate holds, recognition: interest income each quarter}
    evidence:
      existence: documented
      direction: inferred
      magnitude: unknown
      timing: inferred
      sources: [cit.r5, cit.r6, cit.v1, cit.pub]
    breaker: a small weight for that currency; other currencies (Latin America, other Asia) move the basket too and are not represented
    next_state: non-USD short-rate basket
    unresolved:
    - input: currency weights of non-USD deposits and NII
      status: not_disclosed_in_reviewed_sources
      searched: ['corpus: scripts/construction/inputs.py (12 files)', cit.v1, cit.wb, cit.r3, cit.r4, cit.r5, cit.r6, 'corpus: non-USD|non-dollar|currency',
        'corpus: interest rate exposure by currency']
      note: 'the client model names the 10-Q currency split as blocked; no source read gives weights; keyword candidates read: the client model
        marks it not disclosed or fills it with its own assumption, or the passage is about other banks or is qualitative'
