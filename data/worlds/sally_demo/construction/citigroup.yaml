- id: cit-c-basket-ttsnii
  source: citigroup.non_usd_rate_basket
  target: citigroup.tts_nii
  label: widens the non-USD deposit spread
  calibration: uncalibrated
  note: 'not converted: TTS NII is deposits times a deposit spread, but no spread level is disclosed to hold as a factor'
  transition:
    mechanism: Treasury and Trade Solutions holds large operating deposits in many currencies at low betas; when local short rates rise, the spread
      earned on them widens and TTS NII rises (the company describes its rate sensitivity as mainly non-USD, driven by Services)
    sign: +
    actor: Citi TTS (deposit pricing) and its corporate clients
    business_unit: 'Services: Treasury and Trade Solutions'
    geography: global ex US
    currency: EUR, JPY, GBP, Asian and Latin American currencies
    condition: operating balances are sticky and priced at low betas; the currency is one where Citi has deposits
    condition_observable: TTS NII and Services average deposits, quarterly
    timing: {onset: within the quarter, build: 1-2 quarters as placements reprice, persistence: while local rates hold, recognition: interest
        income each quarter}
    evidence:
      existence: documented
      direction: documented
