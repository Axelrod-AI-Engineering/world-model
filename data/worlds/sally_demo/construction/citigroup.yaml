# Citigroup: business construction (Oct 18). Values added to the citigroup entity (and one FX market, usd_mxn), links
# with their transitions, named paths, and compositions (model/construction.py). Generated from a builder script; structure
# and generic banking mechanisms only: priors are synthetic, round, order-of-magnitude levels that add up within each view,
# marked as such; dated client levels, citations and source bindings stay local (data/sally_data/construction/citigroup/).
# Reuses JPMorgan's macro values and links by id (us_economy.unemployment_rate, us_capital_markets.credit_spread,
# us_capital_markets.equity_index, jpm-c-vol-spread, jpm-c-vol-equityindex).
#
# Source ids in evidence.sources: cit.v1 (the client's macro-transmission company model, V1.0: segment history to 3Q26
# from the company supplement, guidance, sensitivities), cit.wb (sell-side company model workbook: history to Q2-2026 and
# the analyst's forecast), cit.co (company statements as recorded in cit.v1 and the broker notes; not read directly),
# cit.r1 to cit.r6 (broker notes), cit.x1 and cit.x2 (expert calls; no names recorded), cit.pub (public business and
# accounting knowledge).
#
# Views of net revenue: the segment tree (driven: rates, activity and credit enter its cells), the type view (NII plus
# non-interest revenue, reported; m26 enters firm NII) and the regions view (only the dollar enters it). They are never
# added to each other. Costs and charges are negative values, so every part adds to its total with a positive weight;
# accounting weights are scale_part / scale_total in native sd. Converted Oct 18: one driving view per total (the segment
# rows of the revenue matrix cit.mx.revenue; the type, regions, balance-sheet NII and segment net income views reconcile),
# identities (products, ratios, a difference, a weighted average) and the CET1 stock-flow, with derived weights; steps
# that fit no form say why in their `note`.

entities:
- id: usd_mxn
  name: USD/MXN
  kind: market
  category_tags: [MF]
  features: {market: fx}
  aliases: [USD/MXN, USDMXN, dollar-peso]
  description: 'The dollar priced in Mexican pesos. A higher rate is a weaker peso: peso revenue and capital translate into fewer dollars.'
  subentities:
  - id: usd_mxn.rate
    name: USD/MXN
    attribute_kind: fx_rate
    unit: MXN per $
    family: lognormal
    mean: 18.5
    scale: 0.06
    aliases: [peso, Mexican peso, USDMXN]
    features: {view: operating_state, basis: 'spot exchange rate, Mexican pesos per US dollar', prior: synthetic}
