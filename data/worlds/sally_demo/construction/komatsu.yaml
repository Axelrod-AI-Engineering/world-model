interactions:
- id: km-a-sales-cmu
  source: komatsu.cmu_sales
  target: komatsu.net_sales
  label: adds to
  edge_type: accounting
  effect: {mu: 0.918, sigma: 0.001}
  kernel: {delay_days: 0, lag_days: 1, duration_days: null}
  transition:
    mechanism: 'Identity: Komatsu construction, mining and utility equipment sales is one part of Komatsu net sales (net sales by segment, external
      customers, US GAAP); weight is its scale over the total''s'
    sign: +
    actor: accounting
    business_unit: net sales by segment, external customers, US GAAP
    condition: same period, perimeter and basis on both sides; never added to another view of the same total
    condition_observable: the reported reconciliation (parts plus residual and eliminations equal the total)
    timing: {onset: same reporting period, build: none, persistence: identity, recognition: quarterly results (cumulative over the fiscal year
        from April)}
    evidence:
      existence: documented
      direction: documented
      magnitude: model
      timing: documented
      sources: [km.wb]
    breaker: a change of segment or region definition (the FY3/27 region reclassification restated Europe and the Middle East)
    next_state: Komatsu net sales
