    mechanism: 'Funding-need branch: the finance book is funded with debt, so gross debt rises with the book; that is not industrial stress'
    sign: +
    actor: Komatsu finance subsidiaries (treasury)
    business_unit: Retail Finance
    condition: leverage of the book stable
    condition_observable: interest-bearing debt and finance assets
    observable: {name: retail finance debt, definition: interest-bearing debt, units: ¥bn, frequency: quarterly, proof_limits: the group's gross
        debt is mostly this}
    timing: {onset: with origination, build: none, persistence: contract term, recognition: balance sheet}
    evidence:
      existence: documented
      direction: inferred
      magnitude: unknown
      timing: unknown
      sources: [km.wb]
    breaker: securitization off balance sheet
    next_state: Komatsu retail finance debt
    unresolved:
    - *id018
- id: km-c-rfdebt-rfcosts
  source: komatsu.rf_debt
  target: komatsu.rf_interest_expense
  label: carries interest expense
  edge_type: identity
  identity: km.id.rf_interest
  transition:
    mechanism: More debt carries more interest expense at the funding cost
    sign: +
    actor: Komatsu finance subsidiaries
    business_unit: Retail Finance
    condition: funding cost as it is
    condition_observable: interest on the finance debt
    observable: {name: retail finance interest expense, definition: interest on the finance debt, units: ¥bn/yr, frequency: quarterly results,
      proof_limits: not reported separately in the material read}
    timing: {onset: as drawn, build: none, persistence: debt term, recognition: segment profit}
    evidence:
      existence: inferred
      direction: inferred
      magnitude: inferred
      timing: unknown
      sources: [km.wb]
    breaker: none (arithmetic at a given rate)
    next_state: Komatsu retail finance interest expense
    unresolved:
    - *id018
    - input: credit loss rate of the finance book
      status: not_disclosed_in_reviewed_sources
      searched: [km.wb, km.r1, km.r2, km.r3, km.r4, km.x1, km.x2, km.peer, 'corpus: scripts/construction/inputs.py (9 files)', 'corpus: credit
          loss', 'corpus: delinquen', 'corpus: allowance']
- id: km-c-semis-imo
  source: global_semiconductors.fab_equipment_spending
  target: komatsu.imo_sales
  label: orders light sources
  calibration: uncalibrated
  transition:
    mechanism: Chipmakers' fab-equipment spending orders lithography tools, which carry excimer-laser light sources (and their service)
    sign: +
    actor: chipmakers and lithography-tool makers
    business_unit: Industrial Machinery & Others
    condition: light-source share holds
    condition_observable: wafer-fab equipment spending; segment sales
    observable: {name: industrial machinery sales, definition: segment external sales, units: ¥bn/yr, frequency: quarterly results, proof_limits: presses
        and machine tools mixed in}
    timing: {onset: 1-3 quarters, build: quarters, persistence: with the chip cycle, recognition: net sales}
    evidence:
      existence: broker
      direction: inferred
      magnitude: unknown
      timing: unknown
      sources: [km.r1]
    breaker: auto-industry press demand moves the segment the other way
    next_state: Komatsu industrial machinery sales
    unresolved:
    - &id019
      input: industrial machinery sales sensitivity to semiconductor and manufacturing capex
      status: not_disclosed_in_reviewed_sources
      searched: [km.wb, km.r1, km.r2, km.r3, km.r4, km.x1, km.x2, km.peer, 'corpus: scripts/construction/inputs.py (9 files)', 'corpus: excimer',
        'corpus: semiconductor', 'corpus: light source']
      note: 'keyword candidates read: the workbook''s own builder''s assumptions (marked as not disclosed), not a disclosure'
- id: km-c-imo-profit
  source: komatsu.imo_sales
  target: komatsu.imo_segment_result
  label: adds profit
  calibration: uncalibrated
  transition:
    mechanism: Segment sales contribute segment profit at the contribution margin
    sign: +
    actor: Komatsu (IM&O)
    business_unit: Industrial Machinery & Others
    condition: costs as they are
    condition_observable: segment results
    observable: {name: industrial machinery segment profit, definition: as reported, units: ¥bn/yr, frequency: quarterly results, proof_limits: mix
        not disclosed}
    timing: {onset: same quarter, build: none, persistence: per unit, recognition: segment profit}
    evidence:
      existence: documented
      direction: documented
      magnitude: unknown
      timing: documented
      sources: [km.wb]
    breaker: mix toward low-margin presses
    next_state: Komatsu industrial machinery segment profit
    unresolved:
    - *id019
- id: km-c-nci
  source: komatsu.pretax_income
  target: komatsu.noncontrolling_interests
  label: minorities take their share
  calibration: uncalibrated
  transition:
    mechanism: Minority holders of consolidated subsidiaries take their share of those subsidiaries' profit (a larger negative)
    sign: '-'
    actor: accounting
    business_unit: group
    condition: the change arises in subsidiaries with minority holders
    condition_observable: net income attributable to non-controlling interests
    observable: {name: non-controlling interests, definition: as reported, units: ¥bn/yr, frequency: quarterly results, proof_limits: by subsidiary
        not disclosed}
    timing: {onset: same period, build: none, persistence: persistent, recognition: net income}
    evidence:
      existence: documented
      direction: documented
      magnitude: unknown
      timing: documented
      sources: [km.r1]
    breaker: the change arises in wholly-owned units
    next_state: Komatsu income attributable to non-controlling interests
    unresolved:
    - input: minority share by subsidiary
      status: not_disclosed_in_reviewed_sources
      searched: [km.wb, km.r1, km.r2, km.r3, km.r4, km.x1, km.x2, km.peer, 'corpus: scripts/construction/inputs.py (9 files)', 'corpus: minority',
        'corpus: non-controlling']
- id: km-c-tax
  source: komatsu.pretax_income
  target: komatsu.income_tax
  label: is taxed at the effective rate
  effect: {mu: -0.8215, sigma: 0.038}
  kernel: {delay_days: 0, lag_days: 1, duration_days: null}
  transition:
    mechanism: Income taxes are the effective rate times pretax income (a formula; the rate is an estimate)
    sign: '-'
    actor: accounting
    business_unit: group
    condition: effective rate stable
    condition_observable: effective tax rate
    observable: {name: income taxes, definition: as reported, units: ¥bn/yr, frequency: quarterly results, proof_limits: deferred items and one-offs
        move it}
    timing: {onset: same period, build: none, persistence: while the rate holds, recognition: income taxes}
    evidence:
      existence: documented
      direction: documented
      magnitude: documented
      timing: documented
      sources: [km.r1]
    breaker: tax-rate changes; deferred tax; one-offs
    next_state: Komatsu income taxes
    unresolved:
    - input: effective tax rate
      status: found_connected
      found_in: [km.r1]
      note: pretax income and taxes (broker table of company accounts); used for the calibration
paths:
- id: km.path.mining_capex
  name: Commodity prices and mining capex (hard rock)
  trigger: copper prices rise
  endpoint: komatsu.operating_profit
  description: 'Two clocks from one price: miners'' capex buys new equipment after quarters (orders, lead times), while fleet hours lift parts
    and service sooner and more steadily. Mining new equipment drops through at the broker''s rate (calibrated); the aftermarket at a higher,
    undisclosed margin. m32 (mining demand to operating profit) is the reduced form beside this path, never added to it.'
  steps:
  - {interaction_id: km-c-copper-capex, branch: capex}
  - {interaction_id: km-c-copper-hours, branch: utilization}
  - {interaction_id: km-c-capex-miningdemand}
  - {interaction_id: km-c-miningdemand-equipment}
  - {interaction_id: km-c-hours-miningparts, branch: parts}
  - {interaction_id: km-c-hours-miningservice, branch: service}
  - {interaction_id: km-c-mineq-profit}
  - {interaction_id: km-c-minparts-profit}
  - {interaction_id: km-c-minservice-profit}
  - {interaction_id: km-a-op-cmu}
  entity_id: komatsu
- id: km.path.coal_contractors
  name: Thermal coal and mining contractors (Indonesia, Australia)
  trigger: thermal-coal prices rise
  endpoint: komatsu.operating_profit
  description: Coal contractors buy fleets when coal earns more, and run them harder (overburden removal). The Asia mining leaf is the regional
    observable; the profit route runs through the product view only, so the region and product views are never both driven.
  steps:
  - {interaction_id: km-c-coal-capex, branch: fleet_purchases}
  - {interaction_id: km-c-coal-hours, branch: overburden}
  - {interaction_id: km-c-capex-miningdemand}
  - {interaction_id: km-c-miningdemand-equipment}
  - {interaction_id: km-c-hours-miningparts, branch: parts}
  - {interaction_id: km-c-hours-miningservice, branch: service}
  - {interaction_id: km-c-mineq-profit}
  - {interaction_id: km-c-minparts-profit}
  - {interaction_id: km-c-minservice-profit}
  - {interaction_id: km-a-op-cmu}
  entity_id: komatsu
- id: km.path.aftermarket
  name: Installed fleet, parts and service (mix)
  trigger: the installed mining fleet works more hours
  endpoint: komatsu.operating_profit
  description: Utilization drives the aftermarket; more aftermarket in the mix raises the segment margin. Revenue lands in the mining product
    view, profit in segment profit.
  steps:
  - {interaction_id: km-c-hours-miningparts, branch: parts}
  - {interaction_id: km-c-hours-miningservice, branch: service}
  - {interaction_id: km-a-minprod-parts, branch: parts_revenue}
  - {interaction_id: km-c-minparts-profit, branch: parts_margin}
  - {interaction_id: km-a-minprod-service, branch: service_revenue}
  - {interaction_id: km-c-minservice-profit, branch: service_margin}
  - {interaction_id: km-a-cmudem-mining}
  - {interaction_id: km-a-sales-cmu}
  - {interaction_id: km-a-op-cmu}
  entity_id: komatsu
- id: km.path.us_construction
  name: US construction, rental channel and dealer inventory
  trigger: US nonresidential construction (data centres, power, infrastructure) rises
  endpoint: komatsu.operating_profit
  description: End demand pulls dealer orders and draws dealer stock down; elevated stock cuts orders until it normalizes (a stock-flow the method
    holds only as signed links). North America construction sales drop through at the broker's US rate (calibrated).
  steps:
  - {interaction_id: km-c-nonres-nacon}
  - {interaction_id: km-c-retail-nacon, branch: reorders}
  - {interaction_id: 'km.sf.dealer_inventory:komatsu.na_dealer_retail_sales', branch: sell_through}
  - {interaction_id: km-c-inventory-nacon}
  - {interaction_id: 'km.sf.dealer_inventory:komatsu.north_america_construction_sales', branch: restock}
  - {interaction_id: km-a-conreg-north_america, branch: revenue}
  - {interaction_id: km-c-nacon-profit, branch: profit}
  - {interaction_id: km-a-cmudem-construction}
  - {interaction_id: km-a-sales-cmu}
  - {interaction_id: km-a-op-cmu}
  entity_id: komatsu
- id: km.path.us_rates
  name: US long rates and construction demand
  trigger: US 10-year yields rise
  endpoint: komatsu.operating_profit
  description: Residential and nonresidential responses are parallel branches of one rate move; the rental channel partly offsets (renting instead
    of buying), not represented as a value.
  steps:
  - {interaction_id: km-c-ust10-housing, branch: residential}
  - {interaction_id: km-c-ust10-nonres, branch: nonresidential}
  - {interaction_id: km-c-housing-nacon}
  - {interaction_id: km-c-nonres-nacon}
  - {interaction_id: km-c-retail-nacon}
  - {interaction_id: km-c-nacon-profit}
  - {interaction_id: km-a-op-cmu}
  entity_id: komatsu
- id: km.path.china_construction
  name: China property and construction
  trigger: China's property market stabilizes
  endpoint: komatsu.operating_profit
  description: China is a small market for Komatsu now (a few percent of CM&U sales). s45 and s46 (property to the global construction-demand
    index to operating profit) are the reduced form, never added to this path.
  steps:
  - {interaction_id: km-c-property-chinacon}
  - {interaction_id: km-a-conreg-china, branch: revenue}
  - {interaction_id: km-c-chinacon-profit, branch: profit}
  - {interaction_id: km-a-cmudem-construction}
  - {interaction_id: km-a-op-cmu}
  entity_id: komatsu
- id: km.path.price_cost
  name: Steel cost, pass-through and price realization
  trigger: steel prices rise
  endpoint: komatsu.operating_profit
  description: 'Cost inflation is absorbed or repriced (parallel branches); price realization drops through to profit, and loses some volume where
    competitors do not follow (counter-path). Gross effects are kept apart: never net the absorb and reprice branches before adding.'
  steps:
  - {interaction_id: km-c-steel-material}
  - {interaction_id: km-c-material-profit, branch: absorb}
  - {interaction_id: km-c-material-price, branch: reprice}
  - {interaction_id: km-c-price-profit, branch: price}
  - {interaction_id: km-c-price-nacon, branch: customer_response}
  - {interaction_id: km-c-retail-nacon}
  - {interaction_id: km-c-nacon-profit}
  - {interaction_id: km-a-op-cmu}
  entity_id: komatsu
- id: km.path.tariffs
  name: 'US tariffs: cost, pass-through and customer response'
  trigger: the US raises tariffs on imported machinery, parts or steel-derivative content
  endpoint: komatsu.operating_profit
  description: Regime to customs cost; cost to management response (reprice or absorb, parallel); price to customer response; to segment profit.
    The absorb branch is calibrated as the gross cost (a yen of tariff cost is a yen of segment cost before recovery).
  steps:
  - {interaction_id: km-c-tariff-cost}
  - {interaction_id: km-c-tariff-price, branch: reprice}
  - {interaction_id: km-c-tariff-profit, branch: absorb}
  - {interaction_id: km-c-price-profit, branch: price}
  - {interaction_id: km-c-price-nacon, branch: customer_response}
  - {interaction_id: km-c-retail-nacon}
  - {interaction_id: km-c-nacon-profit}
  - {interaction_id: km-a-op-cmu}
  entity_id: komatsu
- id: km.path.yen
  name: 'Yen: disclosed sensitivity and its channels'
  trigger: USD/JPY moves (a weaker yen)
  endpoint: komatsu.operating_profit
  description: 'm30 (operating income) and km-c-usdjpy-sales (net sales) carry the company''s disclosed per-yen sensitivities (calibrated). The
    transaction, translation and imported-input branches are their decomposition, uncalibrated: one calculation method at a time, never the aggregate
    plus its parts. EUR and AUD sensitivities are separate links (km-c-eurjpy-*, km-c-audjpy-*).'
  steps:
  - {interaction_id: m30, branch: disclosed_total}
  - {interaction_id: km-c-usdjpy-sales, branch: disclosed_sales}
  - {interaction_id: km-c-usdjpy-transaction, branch: transaction}
  - {interaction_id: km-c-usdjpy-translation, branch: translation}
  - {interaction_id: km-c-usdjpy-imports, branch: imported_inputs}
  - {interaction_id: km-c-material-profit}
  - {interaction_id: km-a-op-cmu}
  - {interaction_id: km-a-op-rf}
  entity_id: komatsu
- id: km.path.retail_finance_rates
  name: 'Retail finance: funding cost and repricing'
  trigger: US 2-year yields rise
  endpoint: komatsu.operating_profit
  description: Funding reprices as debt rolls; contract yields follow as the book turns over (a lag, so spreads compress first).
  steps:
  - {interaction_id: km-c-ust2-funding}
  - {interaction_id: km-c-funding-rfcosts, branch: funding}
  - {interaction_id: km-c-funding-yield, branch: repricing}
  - {interaction_id: km-c-yield-rfrev}
  - {interaction_id: km-a-rfcost-interest}
  - {interaction_id: km-a-rf-costs}
  - {interaction_id: km-a-rf-revenue}
  - {interaction_id: km-a-op-rf}
  entity_id: komatsu
- id: km.path.finance_book
  name: 'Retail finance: equipment sales, finance book and debt'
  trigger: more North American machines are sold on Komatsu finance
  endpoint: komatsu.operating_profit
  description: 'The book earns revenue and is funded with debt: consolidated debt rising with the finance book is not industrial stress.'
  steps:
  - {interaction_id: km-c-nacon-rfnew}
  - {interaction_id: 'km.sf.rf_assets:komatsu.rf_new_contracts'}
  - {interaction_id: km-c-rfassets-rfrev, branch: earning_book}
  - {interaction_id: km-c-rfassets-rfdebt, branch: funding_need}
  - {interaction_id: km-c-rfdebt-rfcosts}
  - {interaction_id: km-a-rfcost-interest}
  - {interaction_id: km-a-rf-revenue}
  - {interaction_id: km-a-rf-costs}
  - {interaction_id: km-a-op-rf}
  entity_id: komatsu
- id: km.path.industrial_machinery
  name: 'Industrial machinery: semiconductor capex'
  trigger: chipmakers raise wafer-fab equipment spending
  endpoint: komatsu.operating_profit
  description: Excimer-laser light sources follow lithography demand; presses follow carmakers' capex (not represented as a driver).
  steps:
  - {interaction_id: km-c-semis-imo}
  - {interaction_id: km-a-sales-imo, branch: revenue}
  - {interaction_id: km-c-imo-profit, branch: profit}
  - {interaction_id: km-a-op-imo}
  entity_id: komatsu
- id: km.path.fixed_costs
  name: Japanese wages and fixed costs
  trigger: Japanese wage settlements rise
  endpoint: komatsu.operating_profit
  description: Wages sit in fixed cost; the walk's fixed-cost line is the observable.
  steps:
  - {interaction_id: km-c-wage-fixed}
  - {interaction_id: km-c-fixed-profit}
  - {interaction_id: km-a-op-cmu}
  entity_id: komatsu
- id: km.path.group_bridge
  name: 'Group bridge: operating income to net income'
  trigger: operating income changes
  endpoint: komatsu.owners_net_income
  description: Pretax income by identity, tax at the effective rate (calibrated), minorities (uncalibrated) and the net-income identity.
  steps:
  - {interaction_id: km-a-pretax-op}
  - {interaction_id: km-c-tax, branch: tax}
  - {interaction_id: km-c-nci, branch: minorities}
  - {interaction_id: km-a-ni-pretax, branch: identity}
  - {interaction_id: km-a-ni-tax}
  - {interaction_id: km-a-ni-nci}
  entity_id: komatsu
compositions:
- id: km.comp.segment_sales
  view: reporting_segments
  basis: net sales by segment, external customers, US GAAP
  unit: ¥bn/yr
  total: komatsu.net_sales
  members: [komatsu.cmu_sales, komatsu.rf_revenue, komatsu.imo_sales]
  note: External sales by segment add exactly to net sales (intersegment sales excluded, so no eliminations line).
  entity_id: komatsu
  period: fiscal year ending March
- id: km.comp.segment_profit
  view: reporting_segments
  basis: 'operating income by segment: segment profit plus corporate, eliminations and other operating items'
  unit: ¥bn/yr
  total: komatsu.operating_profit
  members: [komatsu.cmu_segment_result, komatsu.rf_segment_result, komatsu.imo_segment_result]
  eliminations: komatsu.corporate_eliminations
  note: The view a business mechanism lands in. Corporate items, eliminations and other operating income or expense close it.
  entity_id: komatsu
  period: fiscal year ending March
- id: km.comp.cmu_by_demand
  view: product
  basis: CM&U sales by demand type (construction, mining)
  unit: ¥bn/yr
  total: komatsu.cmu_sales
  members: [komatsu.construction_sales, komatsu.mining_sales]
  note: 'An exact split. Mining earns about two-thirds of its sales in the aftermarket and carries the higher margin. Overlaps the regional view:
    never added to it.'
  entity_id: komatsu
  period: fiscal year ending March
- id: km.comp.construction_by_product
  view: product
  basis: construction sales by product (new equipment, after-sales parts, after-sales service)
  unit: ¥bn/yr
  total: komatsu.construction_sales
  members: [komatsu.construction_equipment_sales, komatsu.construction_parts_sales, komatsu.construction_service_sales]
  drives: false
  note: 'Reconciling: construction drivers act on the regional cells (km.comp.construction_by_region). Aftermarket by region is not disclosed.'
  entity_id: komatsu
  period: fiscal year ending March
- id: km.comp.mining_by_product
  view: product
  basis: mining sales by product (new equipment, after-sales parts, after-sales service)
  unit: ¥bn/yr
  total: komatsu.mining_sales
  members: [komatsu.mining_equipment_sales, komatsu.mining_parts_sales, komatsu.mining_service_sales]
  note: 'The driven mining view: new equipment follows miners'' capex (lagged); parts and service follow fleet hours (steadier).'
  entity_id: komatsu
  period: fiscal year ending March
- id: km.comp.cmu_by_region
  view: regions
  basis: CM&U sales by customer region
  unit: ¥bn/yr
  total: komatsu.cmu_sales
  members: [komatsu.japan_cmu_sales, komatsu.north_america_cmu_sales, komatsu.latin_america_cmu_sales, komatsu.europe_cis_cmu_sales, komatsu.china_cmu_sales,
    komatsu.asia_cmu_sales, komatsu.oceania_cmu_sales, komatsu.middle_east_africa_cmu_sales]
  note: 'Eight regions (Europe with CIS, Middle East with Africa). Customer location; Komatsu does not report regional profit. The passive view
    of the matrix km.mx.cmu_sales: reconciles, never drives.'
  entity_id: komatsu
  period: fiscal year ending March
- id: km.comp.construction_by_region
  view: regions
  basis: construction sales by customer region
  unit: ¥bn/yr
  total: komatsu.construction_sales
  members: [komatsu.japan_construction_sales, komatsu.north_america_construction_sales, komatsu.latin_america_construction_sales, komatsu.europe_cis_construction_sales,
    komatsu.china_construction_sales, komatsu.asia_construction_sales, komatsu.oceania_construction_sales, komatsu.middle_east_africa_construction_sales]
  note: 'The driving view of construction sales: regional construction drivers act on these cells.'
  entity_id: komatsu
  period: fiscal year ending March
- id: km.comp.mining_by_region
  view: regions
  basis: mining sales by customer region
  unit: ¥bn/yr
  total: komatsu.mining_sales
  members: [komatsu.japan_mining_sales, komatsu.north_america_mining_sales, komatsu.latin_america_mining_sales, komatsu.europe_cis_mining_sales,
    komatsu.china_mining_sales, komatsu.asia_mining_sales, komatsu.oceania_mining_sales, komatsu.middle_east_africa_mining_sales]
  drives: false
  note: 'Reconciling: mining is driven through the product view (equipment follows capex, the aftermarket fleet hours).'
  entity_id: komatsu
  period: fiscal year ending March
- id: km.comp.japan_by_demand
  view: regions
  basis: Japan CM&U sales by demand type
  unit: ¥bn/yr
  total: komatsu.japan_cmu_sales
  members: [komatsu.japan_construction_sales, komatsu.japan_mining_sales]
  note: 'Japan''s construction and mining sales: one row of the region x demand-type matrix (km.mx.cmu_sales).'
  entity_id: komatsu
  period: fiscal year ending March
- id: km.comp.north_america_by_demand
  view: regions
  basis: North America CM&U sales by demand type
  unit: ¥bn/yr
  total: komatsu.north_america_cmu_sales
  members: [komatsu.north_america_construction_sales, komatsu.north_america_mining_sales]
  note: 'North America''s construction and mining sales: one row of the region x demand-type matrix (km.mx.cmu_sales).'
  entity_id: komatsu
  period: fiscal year ending March
- id: km.comp.latin_america_by_demand
  view: regions
  basis: Latin America CM&U sales by demand type
  unit: ¥bn/yr
  total: komatsu.latin_america_cmu_sales
  members: [komatsu.latin_america_construction_sales, komatsu.latin_america_mining_sales]
  note: 'Latin America''s construction and mining sales: one row of the region x demand-type matrix (km.mx.cmu_sales).'
  entity_id: komatsu
  period: fiscal year ending March
- id: km.comp.europe_cis_by_demand
  view: regions
  basis: Europe and CIS CM&U sales by demand type
  unit: ¥bn/yr
  total: komatsu.europe_cis_cmu_sales
  members: [komatsu.europe_cis_construction_sales, komatsu.europe_cis_mining_sales]
  note: 'Europe and CIS''s construction and mining sales: one row of the region x demand-type matrix (km.mx.cmu_sales).'
  entity_id: komatsu
  period: fiscal year ending March
- id: km.comp.china_by_demand
  view: regions
  basis: China CM&U sales by demand type
  unit: ¥bn/yr
  total: komatsu.china_cmu_sales
  members: [komatsu.china_construction_sales, komatsu.china_mining_sales]
  note: 'China''s construction and mining sales: one row of the region x demand-type matrix (km.mx.cmu_sales).'
  entity_id: komatsu
  period: fiscal year ending March
- id: km.comp.asia_by_demand
  view: regions
  basis: Asia CM&U sales by demand type
  unit: ¥bn/yr
  total: komatsu.asia_cmu_sales
  members: [komatsu.asia_construction_sales, komatsu.asia_mining_sales]
  note: 'Asia''s construction and mining sales: one row of the region x demand-type matrix (km.mx.cmu_sales).'
  entity_id: komatsu
  period: fiscal year ending March
- id: km.comp.oceania_by_demand
  view: regions
  basis: Oceania CM&U sales by demand type
  unit: ¥bn/yr
  total: komatsu.oceania_cmu_sales
  members: [komatsu.oceania_construction_sales, komatsu.oceania_mining_sales]
  note: 'Oceania''s construction and mining sales: one row of the region x demand-type matrix (km.mx.cmu_sales).'
  entity_id: komatsu
  period: fiscal year ending March
- id: km.comp.middle_east_africa_by_demand
  view: regions
  basis: Middle East and Africa CM&U sales by demand type
  unit: ¥bn/yr
  total: komatsu.middle_east_africa_cmu_sales
  members: [komatsu.middle_east_africa_construction_sales, komatsu.middle_east_africa_mining_sales]
  note: 'Middle East and Africa''s construction and mining sales: one row of the region x demand-type matrix (km.mx.cmu_sales).'
  entity_id: komatsu
  period: fiscal year ending March
- id: km.comp.retail_finance
  view: financial_services
  basis: 'Retail Finance segment: revenue less funding, credit and other costs'
  unit: ¥bn/yr
  total: komatsu.rf_segment_result
  members: [komatsu.rf_revenue, komatsu.rf_costs]
  note: 'A nested bridge: revenue is also a part of the segment sales view (a different total). Costs are revenue less segment profit, held negative.'
  entity_id: komatsu
  period: fiscal year ending March
- id: km.comp.rf_costs
  view: financial_services
  basis: 'Retail Finance costs: interest expense (a deduction) and other costs'
  unit: ¥bn/yr
  total: komatsu.rf_costs
  members: [komatsu.rf_interest_expense]
  residual: komatsu.rf_other_costs
  note: Interest expense is held positive and deducted; credit costs and expenses are the residual (negative).
  entity_id: komatsu
  period: fiscal year ending March
- id: km.comp.cmu_profit_walk
  view: operating_state
  basis: CM&U segment profit change by factor (the company's walk)
  unit: ¥bn/yr
  total: komatsu.cmu_result_delta
  members: [komatsu.walk_fx, komatsu.walk_volume_mix, komatsu.walk_price_factor, komatsu.walk_variable_cost, komatsu.walk_fixed_cost]
  residual: komatsu.walk_other_factor
  drives: false
  note: 'The company''s y/y attribution of CM&U segment profit. Reconciling: the change itself is the difference identity km.id.cmu_result_delta
    (this year''s segment profit less last year''s), the price line is km.id.price_effect, and each other line is the observable of its mechanism.'
  entity_id: komatsu
  period: fiscal year ending March
- id: km.comp.pretax
  view: reporting_segments
  basis: 'pretax income: operating income plus non-operating items'
  unit: ¥bn/yr
  total: komatsu.pretax_income
  members: [komatsu.operating_profit]
  residual: komatsu.other_nonoperating
  note: Net interest and other non-operating items are the residual.
  entity_id: komatsu
  period: fiscal year ending March
- id: km.comp.net_income
  view: reporting_segments
  basis: 'net income: pretax income less taxes and minorities, plus equity in earnings of affiliates'
  unit: ¥bn/yr
  total: komatsu.owners_net_income
  members: [komatsu.pretax_income, komatsu.income_tax, komatsu.noncontrolling_interests]
  residual: komatsu.equity_method_income
  note: Taxes and minorities are negative values. The residual is equity in earnings of affiliates and other items, and absorbs differences between
    sources.
  entity_id: komatsu
  period: fiscal year ending March
identities:
- id: km.id.price_effect
  entity_id: komatsu
  form: product
  target: komatsu.walk_price_factor
  factors: [komatsu.price_realization, komatsu.cmu_sales]
  coefficient: 0.01
  unit_check: ¥bn/yr y/y = pct y/y x ¥bn/yr x 0.01
  basis: 'the walk''s selling-price line: price change times CM&U sales'
  note: 'approximation: the company applies the price change to the prior year''s sales; current sales stand in'
- id: km.id.cmu_result_delta
  entity_id: komatsu
  form: difference
  target: komatsu.cmu_result_delta
  of: komatsu.cmu_segment_result
  minus: [komatsu.cmu_prior_segment_result]
  basis: 'the walk''s total: this year''s CM&U segment profit less last year''s'
- id: km.id.rf_revenue
  entity_id: komatsu
  form: product
  target: komatsu.rf_revenue
  factors: [komatsu.rf_assets, komatsu.rf_contract_rate]
  coefficient: 0.01
  unit_check: ¥bn/yr = ¥bn x pct x 0.01
  basis: the book rate is defined as revenue over assets
- id: km.id.rf_interest
  entity_id: komatsu
  form: product
  target: komatsu.rf_interest_expense
  factors: [komatsu.rf_debt, komatsu.rf_funding_cost]
  coefficient: 0.01
  unit_check: ¥bn/yr = ¥bn x pct x 0.01
  basis: interest on the finance debt at its average funding cost
stock_flows:
- id: km.sf.dealer_inventory
  entity_id: komatsu
  stock: komatsu.na_dealer_inventory
  period_days: 365
  inflows: [komatsu.north_america_construction_sales]
  outflows: [komatsu.na_dealer_retail_sales]
  basis: 'dealer stock: Komatsu''s shipments in, dealers'' retail and rental-fleet sales out (an approximation: North America construction sales
    stand in for shipments to dealers)'
- id: km.sf.rf_assets
  entity_id: komatsu
  stock: komatsu.rf_assets
  period_days: 365
  inflows: [komatsu.rf_new_contracts]
  outflows: [komatsu.rf_collections]
  basis: 'the finance book: new contracts in, collections and lease run-off out'
matrices:
- id: km.mx.cmu_sales
  entity_id: komatsu
  rows: km.comp.cmu_by_demand
  columns: km.comp.cmu_by_region
  drives: rows
  cells:
    komatsu.construction_sales: {komatsu.japan_cmu_sales: komatsu.japan_construction_sales, komatsu.north_america_cmu_sales: komatsu.north_america_construction_sales,
      komatsu.latin_america_cmu_sales: komatsu.latin_america_construction_sales, komatsu.europe_cis_cmu_sales: komatsu.europe_cis_construction_sales,
      komatsu.china_cmu_sales: komatsu.china_construction_sales, komatsu.asia_cmu_sales: komatsu.asia_construction_sales, komatsu.oceania_cmu_sales: komatsu.oceania_construction_sales,
      komatsu.middle_east_africa_cmu_sales: komatsu.middle_east_africa_construction_sales}
    komatsu.mining_sales: {komatsu.japan_cmu_sales: komatsu.japan_mining_sales, komatsu.north_america_cmu_sales: komatsu.north_america_mining_sales,
      komatsu.latin_america_cmu_sales: komatsu.latin_america_mining_sales, komatsu.europe_cis_cmu_sales: komatsu.europe_cis_mining_sales, komatsu.china_cmu_sales: komatsu.china_mining_sales,
      komatsu.asia_cmu_sales: komatsu.asia_mining_sales, komatsu.oceania_cmu_sales: komatsu.oceania_mining_sales, komatsu.middle_east_africa_cmu_sales: komatsu.middle_east_africa_mining_sales}
  note: Region x demand type. Demand type drives CM&U sales (mining through the product view, construction through the regional cells); regions
    reconcile.
