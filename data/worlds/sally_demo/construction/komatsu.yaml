# Komatsu: business construction (Oct 18, construction skill v2, second round). Loaded by ConstructionSpec.load
# (engine/initialize.py) into sally_demo: values added to the komatsu entity, new market and policy entities (commodities,
# mining capex, US construction, US industrial tariffs, AUD/JPY, semiconductor equipment), links with their transitions,
# named paths and compositions. Readable view, gap register and completion report: docs/construction/komatsu.md.
#
# Structure and generic business mechanisms only. Priors are synthetic, round, order-of-magnitude levels with wide
# spread (features.prior: synthetic), set so every additive view adds up at the medians; they are not the company's
# figures. Dated levels, citations and source bindings stay local (data/sally_data/construction/komatsu/). Source ids in
# evidence.sources: km.wb (company model workbook: segment, region, product and walk history, guidance, disclosed
# sensitivities, the builder's assumptions kept apart), km.r1 and km.r2 (broker notes), km.r4 (a distributor note),
# km.x1 and km.x2 (expert calls on the US rental channel), km.peer (sector dashboards), km.pub (public knowledge).
#
# Costs and charges are negative values, so most parts add to their total with a positive weight (native sd over the
# total's); finance interest expense is held positive and deducted. Uncalibrated links carry mechanism and sign, no
# numbers. Oct 18 conversion: products and the walk's change are `identities:` (derived weights), dealer stock and the
# finance book are `stock_flows:`, region x demand type is a `matrices:` entry, reconciling views carry `drives: false`
# and uncalibrated accounting links, and dealer destocking has a threshold `state:`.

