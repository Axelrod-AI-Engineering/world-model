# Construction spec: entities and subentities (§14.1, §14.2).
# Each subentity gives a family, a prior, a scale (link space), and an attribute kind.
# A prior can be written in full ({family, mu, sigma} ...) or as `mean: <native value>`, in
# which case the prior's link-space sd is one scale and its link mean maps back to `mean`.
decision_variables: [federal_reserve.policy_stance, ecb.policy_stance]
entities:
  - id: interest_rates
    name: Interest rates
    kind: macro_factor
    description: "The price of borrowing. Central banks set short rates and markets set long-term yields; higher rates cool spending and investment."
    category_tags: [MF]
    aliases: [rates, policy rates, yields]
    subentities:
      - {id: interest_rates.us_policy_rate, name: US policy rate, attribute_kind: policy_rate, unit: pct,
         family: gaussian, prior: {family: gaussian, mu: 4.25, sigma: 0.25}, scale: 0.25, aliases: [fed funds rate]}
      - {id: interest_rates.euro_policy_rate, name: Euro area policy rate, attribute_kind: policy_rate, unit: pct,
         family: gaussian, prior: {family: gaussian, mu: 2.00, sigma: 0.25}, scale: 0.25}
      - {id: interest_rates.real_rate, name: Real interest rate, attribute_kind: real_rate, unit: pct,
         family: gaussian, prior: {family: gaussian, mu: 1.50, sigma: 0.25}, scale: 0.25}
      - {id: interest_rates.long_term_yields, name: Long-term yields, attribute_kind: bond_yield, unit: pct,
         family: gaussian, prior: {family: gaussian, mu: 4.20, sigma: 0.20}, scale: 0.20, aliases: [bond yields, treasury yields]}
  - id: credit_availability
    name: Credit availability
    kind: macro_factor
    description: "How easily households and firms can borrow. Banks pass on their funding costs and tighten lending when risks rise."
    category_tags: [MF]
    aliases: [credit, lending, bank lending]
    subentities:
      - {id: credit_availability.us_bank_funding_cost, name: US bank funding cost, attribute_kind: bank_funding_cost,
         unit: pct, family: gaussian, prior: {family: gaussian, mu: 4.60, sigma: 0.25}, scale: 0.25}
      - {id: credit_availability.euro_bank_funding_cost, name: Euro bank funding cost, attribute_kind: bank_funding_cost,
         unit: pct, family: gaussian, prior: {family: gaussian, mu: 2.40, sigma: 0.25}, scale: 0.25}
      - {id: credit_availability.lending_standards, name: Lending standards (net % tightening), attribute_kind: condition_index,
         unit: net pct, family: gaussian, prior: {family: gaussian, mu: 5.0, sigma: 10.0}, scale: 10.0}
      - {id: credit_availability.credit_growth, name: Credit growth, attribute_kind: growth_rate, unit: pct y/y,
         family: gaussian, prior: {family: gaussian, mu: 4.0, sigma: 1.0}, scale: 1.0}
  - id: debt_cycle
    name: Debt, fin. cycle
    kind: macro_factor
    description: "The slow build-up and paydown of debt. The more debt there is, the harder rate rises bite."
    category_tags: [MF]
    aliases: [debt, financial cycle, leverage]
    subentities:
      - {id: debt_cycle.household_debt, name: Household debt, attribute_kind: structural_level, unit: pct of income,
         family: gaussian, prior: {family: gaussian, mu: 95.0, sigma: 2.0}, scale: 2.0, aliases: [household debt level]}
      - {id: debt_cycle.credit_gap, name: Credit gap, attribute_kind: condition_index, unit: pp,
         family: gaussian, prior: {family: gaussian, mu: 0.0, sigma: 2.0}, scale: 2.0}
      - {id: debt_cycle.debt_service_ratio, name: Debt service ratio, attribute_kind: share, unit: share,
         family: beta, mean: 0.10, scale: 0.05}
  - id: dollar_fx
    name: Dollar, FX rates
    kind: market
    description: "The dollar's value against other currencies. A strong dollar squeezes everyone who borrowed in dollars."
    category_tags: [MF]
    aliases: [dollar, fx, exchange rates, currencies]
    subentities:
      - {id: dollar_fx.dollar_index, name: Dollar index, attribute_kind: fx_rate, unit: index,
         family: lognormal, mean: 100.0, scale: 0.03, aliases: [DXY]}
      - {id: dollar_fx.em_fx_volatility, name: EM FX volatility, attribute_kind: volatility, unit: vol pts,
         family: gamma, mean: 9.0, scale: 0.15}
  - id: capital_flows
    name: Capital flows
    kind: macro_factor
    description: "Money moving across borders into stocks, bonds, and loans. In a scare it rushes to safety and leaves emerging markets."
    category_tags: [MF]
    aliases: [capital flows, inflows, portfolio flows]
    subentities:
      - {id: capital_flows.us_inflows, name: US capital inflows, attribute_kind: capital_flow, unit: $bn/mo,
         family: gaussian, prior: {family: gaussian, mu: 80.0, sigma: 30.0}, scale: 30.0}
      - {id: capital_flows.em_portfolio_flows, name: EM portfolio flows, attribute_kind: capital_flow, unit: $bn/mo,
         family: gaussian, prior: {family: gaussian, mu: 10.0, sigma: 15.0}, scale: 15.0}
  - id: inflation
    name: Inflation
    kind: macro_factor
    description: "How fast prices rise. Energy and supply shocks push it up; central banks raise rates to bring it down."
    category_tags: [MF]
    aliases: [inflation, prices, CPI]
    subentities:
      - {id: inflation.headline_cpi, name: Headline CPI (% y/y), attribute_kind: inflation_rate, unit: pct y/y,
         family: gaussian, prior: {family: gaussian, mu: 2.8, sigma: 0.3}, scale: 0.3, aliases: [headline inflation, CPI]}
      - {id: inflation.core_cpi, name: Core CPI (% y/y), attribute_kind: inflation_rate, unit: pct y/y,
         family: gaussian, prior: {family: gaussian, mu: 3.0, sigma: 0.2}, scale: 0.2, aliases: [core inflation]}
  - id: consumer_spending
    name: Consumer spending
    kind: macro_factor
    description: "What households buy, the largest part of demand. It falls when credit tightens or confidence drops."
    category_tags: [SD]
    aliases: [consumers, households, consumption]
    subentities:
      - {id: consumer_spending.durable_goods_spending, name: Durable goods spending, attribute_kind: spending_flow,
         unit: $bn/mo, family: lognormal, mean: 180.0, scale: 0.03}
      - {id: consumer_spending.household_saving_rate, name: Household saving rate, attribute_kind: share, unit: share,
         family: beta, mean: 0.045, scale: 0.08, aliases: [saving rate]}
      - {id: consumer_spending.credit_financed_purchases, name: Credit-financed purchases, attribute_kind: spending_flow,
         unit: $bn/mo, family: gamma, mean: 40.0, scale: 0.05}
  - id: business_investment
    name: Business investment
    kind: macro_factor
    description: "What firms spend on equipment, buildings, and software. It answers to borrowing costs, input costs, and expected demand."
    category_tags: [SD]
    aliases: [investment, capex, business spending]
    subentities:
      - {id: business_investment.capex_growth, name: Capex growth, attribute_kind: growth_rate, unit: pct y/y,
         family: gaussian, prior: {family: gaussian, mu: 3.0, sigma: 1.5}, scale: 1.5}
      - {id: business_investment.new_orders, name: New orders, attribute_kind: sentiment_index, unit: index,
         family: gaussian, prior: {family: gaussian, mu: 50.0, sigma: 2.0}, scale: 2.0}
      - {id: business_investment.input_costs, name: Input costs, attribute_kind: cost_index, unit: index,
         family: lognormal, mean: 100.0, scale: 0.04}
  - id: cross_border_trade
    name: Cross-border trade
    kind: macro_factor
    description: "Goods and services that cross borders, and the finance behind them. Sanctions, controls, and crises can cut it fast."
    category_tags: [SD]
    aliases: [exports, imports, trade]
    subentities:
      - {id: cross_border_trade.trade_volume, name: Trade volume, attribute_kind: trade_flow, unit: index,
         family: lognormal, mean: 100.0, scale: 0.03}
      - {id: cross_border_trade.trade_finance_availability, name: Trade finance availability, attribute_kind: share,
         unit: share, family: beta, mean: 0.80, scale: 0.15}
  - id: gov_spending
    name: Gov. spending, taxes
    kind: macro_factor
    description: "What governments spend and tax. Deficits cushion shocks such as pandemics and disasters."
    category_tags: [SD]
    aliases: [government spending, fiscal policy, taxes]
    subentities:
      - {id: gov_spending.fiscal_deficit, name: Fiscal deficit, attribute_kind: structural_level, unit: pct GDP,
         family: gaussian, prior: {family: gaussian, mu: 6.0, sigma: 0.5}, scale: 0.5}
      - {id: gov_spending.health_spending, name: Health spending, attribute_kind: spending_flow, unit: $bn/qtr,
         family: lognormal, mean: 1200.0, scale: 0.03}
      - {id: gov_spending.relief_spending, name: Relief spending, attribute_kind: spending_flow, unit: $bn/qtr,
         family: gamma, mean: 20.0, scale: 0.2}
  - id: asset_prices
    name: Asset price swings
    kind: market
    description: "Prices of stocks and houses, and how much they swing. Booms feed borrowing; busts can start a crisis."
    category_tags: [SH]
    aliases: [stocks, equities, asset prices, house prices]
    subentities:
      - {id: asset_prices.equity_index, name: Equity index, attribute_kind: asset_price, unit: index,
         family: lognormal, mean: 5000.0, scale: 0.05, aliases: [stock market, S&P]}
      - {id: asset_prices.house_prices, name: House prices, attribute_kind: asset_price, unit: index,
         family: lognormal, mean: 320.0, scale: 0.02}
      - {id: asset_prices.equity_volatility, name: Equity volatility, attribute_kind: volatility, unit: vol pts,
         family: gamma, mean: 16.0, scale: 0.15, aliases: [VIX]}
  - id: financial_crises
    name: Financial crises
    kind: external_factor
    description: "Bank runs, defaults, and frozen markets. Stress spreads through credit and capital flows."
    category_tags: [SH]
    aliases: [banking crisis, financial crisis, bank stress, bank run]
    subentities:
      - {id: financial_crises.banking_stress, name: Banking stress, attribute_kind: stress_index, unit: index,
         family: gaussian, prior: {family: gaussian, mu: 0.0, sigma: 0.5}, scale: 0.5, aliases: [deposit outflows]}
      - {id: financial_crises.default_rate, name: Default rate, attribute_kind: share, unit: share,
         family: beta, mean: 0.03, scale: 0.15}
  - id: wars
    name: Wars, fragmentation
    kind: external_factor
    description: "Wars, sanctions, and the world splitting into blocs. They disrupt energy and supply chains and raise uncertainty."
    category_tags: [SH]
    aliases: [war, conflict, geopolitics, sanctions]
    subentities:
      - {id: wars.geopolitical_risk, name: Geopolitical risk, attribute_kind: uncertainty_index, unit: index,
         family: gamma, mean: 120.0, scale: 0.15}
      - {id: wars.sanctions_intensity, name: Sanctions intensity, attribute_kind: restriction_index, unit: index,
         family: gaussian, prior: {family: gaussian, mu: 0.0, sigma: 1.0}, scale: 1.0}
  - id: medical_crises
    name: Medical crises
    kind: external_factor
    description: "Epidemics and the lockdowns they bring. They stop work and spending, then reshape government budgets."
    category_tags: [SH]
    aliases: [pandemic, outbreak, epidemic]
    subentities:
      - {id: medical_crises.case_growth, name: Case growth, attribute_kind: growth_rate, unit: pct w/w,
         family: gaussian, prior: {family: gaussian, mu: 0.0, sigma: 5.0}, scale: 5.0}
      - {id: medical_crises.lockdown_stringency, name: Lockdown stringency, attribute_kind: share, unit: share,
         family: beta, mean: 0.02, scale: 0.5}
  - id: inequality_between
    name: Inequality between
    kind: macro_factor
    description: "Income gaps between rich and poor countries. They widen when dollar funding tightens and capital leaves emerging markets."
    category_tags: [DI]
    aliases: [global inequality, emerging market gap]
    subentities:
      - {id: inequality_between.cross_country_income_gap, name: Cross-country income gap, attribute_kind: structural_level,
         unit: ratio, family: gaussian, prior: {family: gaussian, mu: 10.0, sigma: 0.3}, scale: 0.3}
      - {id: inequality_between.em_growth_gap, name: EM growth gap, attribute_kind: growth_rate, unit: pp,
         family: gaussian, prior: {family: gaussian, mu: 2.0, sigma: 0.5}, scale: 0.5}
  - id: inequality_within
    name: Inequality within
    kind: macro_factor
    description: "How unequally income is shared inside a country. Over time it wears down trust and shapes politics."
    category_tags: [DI]
    aliases: [inequality, income inequality]
    subentities:
      - {id: inequality_within.gini, name: Gini coefficient, attribute_kind: share, unit: share,
         family: beta, mean: 0.39, scale: 0.02}
      - {id: inequality_within.top10_income_share, name: Top 10% income share, attribute_kind: share, unit: share,
         family: beta, mean: 0.46, scale: 0.03}
  - id: resources_energy
    name: Resources, energy
    kind: market
    description: "Oil, gas, and other commodities. A price spike raises costs across the economy and pushes up inflation."
    category_tags: [SC]
    aliases: [oil, energy, commodities, OPEC]
    subentities:
      - {id: resources_energy.oil_price, name: Oil price (Brent), attribute_kind: commodity_price, unit: $/bbl,
         family: lognormal, mean: 75.0, scale: 0.08, aliases: [Brent, crude, oil]}
      - {id: resources_energy.gas_price, name: Natural gas price, attribute_kind: commodity_price, unit: $/MMBtu,
         family: lognormal, mean: 3.5, scale: 0.12, aliases: [gas]}
  - id: supply_chains
    name: Supply chains
    kind: macro_factor
    description: "The networks that move parts and goods between firms. Bottlenecks show up as slower deliveries and dearer shipping."
    category_tags: [SC]
    aliases: [supply chains, shipping, logistics]
    subentities:
      - {id: supply_chains.delivery_times, name: Supplier delivery times, attribute_kind: duration_measure, unit: days,
         family: gamma, mean: 45.0, scale: 0.08}
      - {id: supply_chains.shipping_costs, name: Shipping costs, attribute_kind: cost_index, unit: index,
         family: lognormal, mean: 1500.0, scale: 0.10}
  - id: market_concentration
    name: Market concentration
    kind: macro_factor
    description: "How much of a market a few firms control. It shapes prices, innovation, and investment."
    category_tags: [SC]
    aliases: [concentration, market power]
    subentities:
      - {id: market_concentration.top4_share, name: Top-4 market share, attribute_kind: share, unit: share,
         family: beta, mean: 0.42, scale: 0.05}
  - id: productivity_tech
    name: Productivity, tech
    kind: macro_factor
    description: "Output per worker, and how fast new technology spreads. The main engine of long-run growth."
    category_tags: [SC]
    aliases: [productivity, technology, tech]
    subentities:
      - {id: productivity_tech.tfp_growth, name: TFP growth, attribute_kind: growth_rate, unit: pct y/y,
         family: gaussian, prior: {family: gaussian, mu: 1.0, sigma: 0.3}, scale: 0.3, aliases: [productivity growth]}
      - {id: productivity_tech.tech_capex, name: Tech capex, attribute_kind: spending_flow, unit: $bn/qtr,
         family: lognormal, mean: 300.0, scale: 0.05, aliases: [chip capex, semiconductor investment]}
  - id: labor_demographics
    name: Labor, demographics
    kind: macro_factor
    description: "How many people work or look for work, shaped by ageing and migration. It caps what the economy can produce."
    category_tags: [SC]
    aliases: [labor, jobs, employment, demographics]
    subentities:
      - {id: labor_demographics.labor_force_participation, name: Labor force participation, attribute_kind: share,
         unit: share, family: beta, mean: 0.625, scale: 0.02}
      - {id: labor_demographics.unemployment_rate, name: Unemployment rate, attribute_kind: share, unit: share,
         family: beta, mean: 0.042, scale: 0.05}
  - id: legal_regulatory
    name: Legal, regulatory
    kind: external_factor
    description: "Laws, regulation, and trade controls. Export controls can cut off sales of strategic goods overnight."
    category_tags: [DF]
    aliases: [regulation, export controls, trade rules]
    subentities:
      - {id: legal_regulatory.export_controls, name: Export controls, attribute_kind: restriction_index, unit: index,
         family: gaussian, prior: {family: gaussian, mu: 0.0, sigma: 1.0}, scale: 1.0, aliases: [export restrictions]}
      - {id: legal_regulatory.regulatory_burden, name: Regulatory burden, attribute_kind: restriction_index, unit: index,
         family: gaussian, prior: {family: gaussian, mu: 0.0, sigma: 1.0}, scale: 1.0}
  - id: geography
    name: Geography
    kind: external_factor
    description: "Distance, terrain, and location. It sets trade costs and barely changes, so it anchors everything else."
    category_tags: [DF]
    aliases: [geography, distance]
    subentities:
      - {id: geography.trade_distance_cost, name: Trade distance cost, attribute_kind: structural_level, unit: index,
         family: gaussian, prior: {family: gaussian, mu: 0.0, sigma: 1.0}, scale: 1.0}
  - id: institutions
    name: Institutions
    kind: external_factor
    description: "Rule of law, property rights, and independent central banks. Strong institutions make policy believable."
    category_tags: [DF]
    aliases: [institutions, rule of law]
    subentities:
      - {id: institutions.rule_of_law, name: Rule of law, attribute_kind: structural_level, unit: index,
         family: gaussian, prior: {family: gaussian, mu: 1.0, sigma: 0.1}, scale: 0.1}
      - {id: institutions.central_bank_independence, name: Central bank independence, attribute_kind: share,
         unit: share, family: beta, mean: 0.80, scale: 0.10}
  - id: culture_trust
    name: Culture, trust
    kind: external_factor
    description: "How much people trust each other and their institutions. Low trust makes cooperation and reform harder."
    category_tags: [DF]
    aliases: [trust, culture]
    subentities:
      - {id: culture_trust.social_trust, name: Social trust, attribute_kind: share, unit: share,
         family: beta, mean: 0.30, scale: 0.05}
  - id: climate_change
    name: Climate change
    kind: external_factor
    description: "Rising temperatures and the policies that answer them, such as carbon prices. A slow force that reshapes energy and investment."
    category_tags: [EN]
    aliases: [climate, warming, carbon]
    subentities:
      - {id: climate_change.temperature_anomaly, name: Temperature anomaly, attribute_kind: structural_level, unit: deg C,
         family: gaussian, prior: {family: gaussian, mu: 1.3, sigma: 0.05}, scale: 0.05}
      - {id: climate_change.carbon_price, name: Carbon price, attribute_kind: commodity_price, unit: $/t,
         family: lognormal, mean: 70.0, scale: 0.08}
  - id: disasters_weather
    name: Disasters, weather
    kind: external_factor
    description: "Storms, floods, droughts, and fires. Their losses hit output and bring relief spending."
    category_tags: [EN]
    aliases: [disasters, weather, storms]
    subentities:
      - {id: disasters_weather.disaster_losses, name: Disaster losses, attribute_kind: loss_flow, unit: $bn/qtr,
         family: gamma, mean: 60.0, scale: 0.3}
  - id: confidence
    name: Confidence
    kind: macro_factor
    description: "How optimistic households and firms feel. Confidence moves spending and hiring before the hard data do."
    category_tags: [EX]
    aliases: [confidence, sentiment]
    subentities:
      - {id: confidence.consumer_confidence, name: Consumer confidence, attribute_kind: sentiment_index, unit: index,
         family: gaussian, prior: {family: gaussian, mu: 100.0, sigma: 3.0}, scale: 3.0, aliases: [consumer sentiment]}
      - {id: confidence.business_confidence, name: Business confidence, attribute_kind: sentiment_index, unit: index,
         family: gaussian, prior: {family: gaussian, mu: 100.0, sigma: 3.0}, scale: 3.0}
  - id: policy_uncertainty
    name: Policy uncertainty
    kind: macro_factor
    description: "How unsure people are about future policy. When it is high, firms delay investment and hiring."
    category_tags: [EX]
    aliases: [uncertainty, policy uncertainty]
    subentities:
      - {id: policy_uncertainty.epu_index, name: Economic policy uncertainty, attribute_kind: uncertainty_index,
         unit: index, family: lognormal, mean: 150.0, scale: 0.10, aliases: [EPU]}
  # ---- demo additions -------------------------------------------------------------------------
  - id: federal_reserve
    name: Federal Reserve
    kind: agency
    description: "The US central bank. It sets the policy rate and tends to raise it when inflation runs hot."
    category_tags: [MF]
    features: {region: US, function: monetary_policy}
    aliases: [Fed, FOMC]
    subentities:
      - {id: federal_reserve.policy_stance, name: Fed policy decision (target rate), attribute_kind: policy_rate,
         unit: pct, family: gaussian, prior: {family: gaussian, mu: 4.25, sigma: 0.25}, scale: 0.25,
         aliases: [target rate, rate decision]}
      - {id: federal_reserve.balance_sheet, name: Fed balance sheet, attribute_kind: structural_level, unit: $tn,
         family: lognormal, mean: 6.8, scale: 0.02}
  - id: ecb
    name: European Central Bank
    kind: agency
    description: "The euro area's central bank. It sets the deposit rate for the euro area."
    category_tags: [MF]
    features: {region: EA, function: monetary_policy}
    aliases: [ECB]
    subentities:
      - {id: ecb.policy_stance, name: ECB policy decision (deposit rate), attribute_kind: policy_rate, unit: pct,
         family: gaussian, prior: {family: gaussian, mu: 2.00, sigma: 0.25}, scale: 0.25}
  - id: fed_chair
    name: Fed Chair (role)
    kind: person
    description: "Whoever chairs the Fed, as a role. A more hawkish chair leans the Fed toward higher rates."
    category_tags: [MF]
    aliases: [Fed Chair, chair]
    subentities:
      - {id: fed_chair.hawkishness, name: Hawkishness, attribute_kind: sentiment_index, unit: index,
         family: gaussian, prior: {family: gaussian, mu: 0.0, sigma: 1.0}, scale: 1.0}
  # -- Real actors (the user asked for concrete, tangible instances). Every number in the demo is
  # synthetic; the actors, their roles, and the links between them are real. DECISION: NVIDIA takes the
  # place of the plan's fictional Northwind Semiconductors (same role, same links e46-e48).
  - id: nvidia
    name: NVIDIA
    kind: company
    description: "Designs the GPUs most AI data centers run on. US export controls cap what it may sell in China."
    category_tags: [SC]
    features: {sector: semiconductors, region: US}
    aliases: [Nvidia, NVDA]
    subentities:
      - {id: nvidia.datacenter_revenue, name: NVIDIA data-center revenue, attribute_kind: revenue_flow, unit: $bn/qtr,
         family: lognormal, mean: 40.0, scale: 0.06}
      - {id: nvidia.china_revenue, name: NVIDIA China revenue, attribute_kind: revenue_flow, unit: $bn/qtr,
         family: lognormal, mean: 5.0, scale: 0.08, aliases: [NVIDIA China sales]}
      - {id: nvidia.gpu_share, name: NVIDIA AI-accelerator share, attribute_kind: share, unit: share,
         family: beta, mean: 0.85, scale: 0.15}
      - {id: nvidia.capex, name: NVIDIA capex, attribute_kind: spending_flow, unit: $bn/qtr,
         family: lognormal, mean: 1.0, scale: 0.08}
      - {id: nvidia.share_price, name: NVIDIA share price, attribute_kind: asset_price, unit: $,
         family: lognormal, mean: 140.0, scale: 0.08}
  - id: amd
    name: AMD
    kind: company
    description: "NVIDIA's main rival in AI accelerators; it gains share when NVIDIA is supply-constrained or shut out."
    category_tags: [SC]
    features: {sector: semiconductors, region: US}
    aliases: [Advanced Micro Devices]
    subentities:
      - {id: amd.gpu_share, name: AMD AI-accelerator share, attribute_kind: share, unit: share,
         family: beta, mean: 0.10, scale: 0.15}
      - {id: amd.datacenter_revenue, name: AMD data-center revenue, attribute_kind: revenue_flow, unit: $bn/qtr,
         family: lognormal, mean: 4.0, scale: 0.08}
      - {id: amd.share_price, name: AMD share price, attribute_kind: asset_price, unit: $,
         family: lognormal, mean: 150.0, scale: 0.08}
  - id: tsmc
    name: TSMC
    kind: company
    description: "Manufactures most of the world's advanced chips, including NVIDIA's and AMD's designs."
    category_tags: [SC]
    features: {sector: semiconductors, region: Taiwan}
    aliases: [Taiwan Semiconductor]
    subentities:
      - {id: tsmc.revenue, name: TSMC revenue, attribute_kind: revenue_flow, unit: $bn/qtr,
         family: lognormal, mean: 30.0, scale: 0.05}
      - {id: tsmc.capex, name: TSMC capex, attribute_kind: spending_flow, unit: $bn/qtr,
         family: lognormal, mean: 10.0, scale: 0.06}
      - {id: tsmc.foundry_share, name: TSMC foundry share, attribute_kind: share, unit: share,
         family: beta, mean: 0.65, scale: 0.1}
  - id: samsung
    name: Samsung Electronics
    kind: company
