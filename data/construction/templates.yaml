# Rules for the template translator (§7.4): typed theses such as "What if oil prices doubled
# next quarter?" and a fallback for market events with no fixture. A subject phrase maps to a
# subentity; a verb phrase gives the change; a timeframe sets when the change happens.
subjects:
  # real actors first, so "jet fuel" or "NVIDIA's China sales" win over the generic subjects
  - {pattern: "nvidia(?:'s)? china (?:sales|revenue)", subentity: nvidia.china_revenue}
  - {pattern: "nvidia(?:'s)? (?:shares|stock|share price)|nvidia", subentity: nvidia.share_price}
  - {pattern: "(?:opec plus|opec)(?: output| production| quotas?)?", subentity: opec_plus.quota}
  - {pattern: "jet fuel(?: prices?| costs?)?|fuel costs", subentity: delta.fuel_cost}
  - {pattern: "ai (?:capex|spending|investment)|hyperscaler (?:capex|spending)", subentity: microsoft.ai_capex}
  - {pattern: "(?:us )?chip (?:export )?rules", subentity: us_commerce.chip_rule_stringency}
  - {pattern: "(?:rare earth|critical mineral|mineral) (?:export )?curbs", subentity: china_mofcom.mineral_export_curbs}
  - {pattern: "regional bank deposits", subentity: regional_banks.deposits}
  - {pattern: "oil(?: prices?)?|brent|crude", subentity: resources_energy.oil_price}
  - {pattern: "(?:natural )?gas(?: prices?)?", subentity: resources_energy.gas_price}
  - {pattern: "(?:the )?fed(?:eral reserve)?|(?:us )?policy rates?|interest rates|rates", subentity: federal_reserve.policy_stance}
  - {pattern: "(?:the )?ecb", subentity: ecb.policy_stance}
  - {pattern: "stocks|equities|(?:the )?stock market|equity prices", subentity: asset_prices.equity_index}
  - {pattern: "export controls|export restrictions", subentity: legal_regulatory.export_controls}
  - {pattern: "inflation|cpi", subentity: inflation.headline_cpi}
  - {pattern: "(?:the )?dollar", subentity: dollar_fx.dollar_index}
  - {pattern: "bank(?:ing)? stress", subentity: financial_crises.banking_stress}
  - {pattern: "shipping costs", subentity: supply_chains.shipping_costs}
verbs:
  - {pattern: "(?:prices? )?(?:doubled|double|doubles)", mode: relative, delta: 1.0}
  - {pattern: "(?:halved|halve|halves|fell by half)", mode: relative, delta: -0.5}
  - {pattern: "(?:rose|rise|rises|jumped|jump|jumps|climbed|climb|increased|increase|went up|go up|surged|hiked|hike|raised|raise)s?(?: [a-z]+)? by (?P<num>[0-9.]+) ?(?P<unit>%|percent|bp|basis points|sd|standard deviations)?", sign: 1.0}
  - {pattern: "(?:fell|fall|falls|dropped|drop|drops|declined|decline|decreased|decrease|went down|go down|cut|cuts)s?(?: [a-z]+)? by (?P<num>[0-9.]+) ?(?P<unit>%|percent|bp|basis points|sd|standard deviations)?", sign: -1.0}
  - {pattern: "(?:held|hold|holds|stayed|stay) (?:steady|flat|unchanged)", mode: absolute, delta: 0.0}
  - {pattern: "(?:spiked|spike|spikes|soared|soar|soars|surged|surge|surges)", mode: standardized, delta: 2.0}
  - {pattern: "(?:crashed|crash|crashes|collapsed|collapse|collapses|plunged|plunge|plunges)", mode: standardized, delta: -2.0}
timeframes:
  - {pattern: "next quarter|in three months|in 3 months", days: 90}
  - {pattern: "next month|in a month", days: 30}
  - {pattern: "next year|in a year", days: 365}
  - {pattern: "next week", days: 7}
  - {pattern: "tomorrow|today|now", days: 0}
