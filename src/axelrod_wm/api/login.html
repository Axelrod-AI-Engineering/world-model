<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Axelrod World Model</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">
  <style>
    :root { --paper: #FBF8F2; --sheet: #FFFDF8; --ink: #2F2A25; --ink-2: #665E54; --ink-3: #93897C; --rule: #DDD3C4;
            --grid: #EEE7DB; --violet: #7C64C4; --violet-ink: #4A3590; --violet-fill: #DAD0F4; --down: #B83A2E; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background-color: var(--paper); color: var(--ink);
           font: 15px/1.5 "Instrument Sans", "Helvetica Neue", system-ui, sans-serif;
           background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
           background-size: 24px 24px; }
    main { width: 100%; max-width: 380px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 16px; padding: 30px 28px 26px;
           box-shadow: 0 12px 40px rgba(47, 42, 37, .10); }
    h1 { margin: 0; font: 800 30px/1.1 "Bricolage Grotesque", system-ui, sans-serif; letter-spacing: -.02em; }
    h1 span { font-weight: 600; color: var(--violet); }
    .lede { margin: 8px 0 22px; color: var(--ink-2); font-size: 14px; }
    label { display: block; font-weight: 600; font-size: 13px; margin: 14px 0 6px; }
    input { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 9px; background: #fff; color: var(--ink); }
    input:focus { outline: none; border-color: var(--violet); box-shadow: 0 0 0 3px rgba(124, 100, 196, .22); }
    button { width: 100%; margin-top: 22px; font: inherit; font-weight: 600; padding: 11px 14px; border: 0; border-radius: 9px;
             background: var(--violet); color: #fff; cursor: pointer; }
    button:hover { background: var(--violet-ink); }
    button:focus-visible { outline: 3px solid var(--violet-fill); outline-offset: 2px; }
    .err { margin: 0 0 4px; padding: 8px 10px; border-radius: 8px; background: #FBE9E6; color: var(--down); font-size: 13.5px; }
    .foot { margin: 18px 0 0; color: var(--ink-3); font-size: 12.5px; text-align: center; }
  </style>
</head>
<body>
  <main>
    <h1>Axelrod <span>World Model</span></h1>
    <p class="lede">Sign in to open your demo.</p>
    {{error}}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{next}}">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
    <p class="foot">Each login opens its own demo.</p>
  </main>
</body>
</html>
