<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Axelrod World Model</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="vendor/d3.v7.min.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body class="mode-learn">
  <!-- DECISION: the first view is the graph and one line of story; every panel opens on demand (the
       user asked for a much simpler screen). The plan's controls are all still here, one level down. -->
  <header id="topbar" role="toolbar" aria-label="Main controls">
    <div class="brand"><b>Axelrod</b><span>World Model</span></div>
    <!-- DECISION (restructure): one world model, two views. Learn is for backend users, who update it (every
         change vetted and committed); Predict is for everyone else, who pose theses and never change it. -->
    <div class="seg mode" role="group" aria-label="View">
      <button id="mode-learn" aria-pressed="true" title="Learn: backend users update the one world model. Every change is vetted and committed.">Learn</button>
      <button id="mode-predict" aria-pressed="false" title="Predict: pose theses against committed versions. Nothing you do here is learned.">Predict</button>
    </div>
    <div id="clock" title="Simulated date and state version">
      <span id="sim-date">—</span><span id="sim-version" class="mono">v—</span>
    </div>
    <div class="spacer"></div>
    <div class="actions">
      <!-- a model fed by imports (emily_demo): Import is the primary action, and Tutorial opens the small demo -->
      <button id="btn-import" class="primary learn-only import-only" aria-expanded="false" title="Import research your agent collected: each item is folded in on its date and waits for your review (I)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v7.5M4.8 6.8 8 10l3.2-3.2M3 12.5h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Import</button>
      <!-- a demo with examples (small_demo, prod_demo): Tutorial replaces Update and Step. In an imported model it
           opens the small demo's tutorial, and Back returns to the model -->
      <button id="btn-examples" class="learn-only examples-only" aria-expanded="false" title="The tutorial: each step isolates one part of the framework and stops at your review (E)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3.5h10M3 8h10M3 12.5h6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        Tutorial</button>
      <button id="btn-return" class="ghost learn-only hidden" title="Back to the model you came from"></button>
      <button id="btn-update" class="primary learn-only scripted-only" title="Request an update: collect news and data up to a date, then fold it in day by day (U)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Update</button>
      <div class="seg learn-only scripted-only" role="group" aria-label="Scripted demo">
        <button id="btn-step" title="Run the next scripted step of the demo (→)">Step <span aria-hidden="true">▸</span></button>
        <button id="btn-play" title="Play or pause the scripted demo (Space)" aria-pressed="false">Play</button>
      </div>
      <span id="step-label" class="mono muted learn-only scripted-only" title="Scripted demo progress">0 / 0</span>
    </div>
    <div class="spacer"></div>
    <!-- DECISION (Oct 8): the bar offers only what the moment needs: the primary action (Examples or Step in
         Learn, Ask in Predict), Review when something waits, and one menu for everything else. -->
    <nav class="tools" aria-label="Panels">
      <button id="btn-methods" class="tool" aria-expanded="false" title="How it works: learning, inference, the literature, and the implementation (H)">How it works</button>
      <!-- DECISION (Oct 11): two buttons that show only when their thing exists: the transmission grid of the staged
           ripple or the open forecast, and, in Predict, the briefs written so far -->
      <button id="btn-grid" class="tool hidden" aria-expanded="false" title="The transmission grid: input, each order, output, moving day by day; the canvas isolates it (G)">Transmission</button>
      <button id="btn-briefs-top" class="tool predict-only hidden" aria-expanded="false" title="A written reading of each forecast (B)">Briefs <span class="count" id="briefs-count-top">0</span></button>
      <button id="btn-ask" class="tool primary-ask predict-only" title="Ask a what-if question (pose a thesis) (Q)" aria-expanded="false">Ask</button>
      <button id="btn-review" class="tool learn-only idle" title="Review: what each change would commit, through the third-order ripple; approve all, some, or none" aria-expanded="false">Review <span class="count" id="review-count">0</span></button>
      <div class="menu-wrap">
        <button id="btn-menu" class="tool" aria-haspopup="menu" aria-expanded="false" title="Everything else">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span class="dot" aria-hidden="true"></span><span class="sr-only">Menu</span></button>
        <div id="menu-panel" class="menu-panel" role="menu" hidden>
          <button id="btn-inbox" class="tool" role="menuitem" aria-expanded="false" title="News and data the model has read">News <span class="count" id="inbox-count">0</span><kbd>N</kbd></button>
          <button id="btn-briefs" class="tool" role="menuitem" aria-expanded="false" title="A written reading of each forecast">Briefs <span class="count" id="briefs-count">0</span><kbd>B</kbd></button>
          <button id="btn-manual" class="tool learn-only" role="menuitem" title="Add an entity, values, or interactions from your own knowledge; no article needed">Add from your own knowledge</button>
          <button id="btn-ask-learn" class="tool learn-only" role="menuitem" title="Switch to Predict and ask a what-if question">Ask a what-if<kbd>Q</kbd></button>
          <button id="btn-checks" class="tool" role="menuitem" title="What the model is testing now, and when and how each check happens">Checks<kbd>C</kbd></button>
          <button id="btn-memory" class="tool" role="menuitem" aria-expanded="false" title="Long-term memory">Long-term memory<kbd>M</kbd></button>
          <button id="btn-console" class="tool learn-only" role="menuitem" aria-expanded="false" title="Console: the commit log of the world model (version control)">Console: the log<kbd>I</kbd></button>
          <hr>
          <button id="btn-admin" class="tool" role="menuitem" aria-expanded="false" title="Navigate the story, the map, the view, and settings">Admin and settings<kbd>,</kbd></button>
          <button id="btn-keys" class="tool" role="menuitem" title="Every keyboard shortcut">Keyboard shortcuts<kbd>?</kbd></button>
          <a id="btn-signout" class="tool hidden" role="menuitem" href="/logout" title="Sign out of this demo">Sign out</a>
        </div>
      </div>
    </nav>
  </header>

  <div id="update-strip" class="hidden" role="status" aria-live="polite"></div>

  <main id="stage">
    <div id="canvas" tabindex="0" aria-label="Causal graph. Right-click anything for options.">
      <svg id="graph-svg" role="img" aria-label="World model graph"></svg>
      <div id="caption" class="floating" aria-live="polite"><span class="step"></span><span class="text">Loading…</span><span class="walks"></span></div>
      <div id="walkthrough" class="floating walk hidden" role="region" aria-label="Walkthrough of the model's steps"></div>
      <div id="readonly-banner" class="floating hidden" role="status"></div>
      <div id="staged-banner" class="floating hidden" role="status"></div>
      <div id="empty-hint" class="floating hidden" role="note"></div>
      <div id="search-box" class="floating">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <label class="sr-only" for="search">Find or filter entities, values, interactions, and superentities</label>
        <input id="search" type="search" placeholder="Find or filter…  /" autocomplete="off">
      </div>
      <div id="canvas-controls" class="floating" role="toolbar" aria-label="Canvas">
        <div class="seg" role="group" aria-label="Detail">
          <button id="lvl-super" title="Close every superentity into one card (1)">Superentities</button>
          <button id="lvl-entity" title="Open superentities, close entities (2)">Entities</button>
          <button id="lvl-sub" title="Open every entity into its subentities (3)">Subentities</button>
          <button id="lvl-auto" aria-pressed="true" title="Detail follows zoom: zoom out for superentities, in for the values of what is in view (0)">Auto</button>
        </div>
        <!-- DECISION (Oct 11): a zoom slider in place of − and +; it learns the zooms a person settles at (graph/zoom-slider.js) -->
        <div id="zoom-slider" class="zoom-slider" role="group" aria-label="Zoom"></div>
        <div class="seg" role="group" aria-label="Fit">
          <button id="btn-fit" class="icon" title="Fit everything (F)" aria-label="Fit everything">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
        </div>
        <button id="btn-draw" class="learn-only" aria-pressed="false" title="Draw a proposed edge: drag from one node to another (D)">Draw</button>
      </div>
    </div>

    <aside id="left-panel" class="sheet-panel left" aria-label="News, review, and briefs" hidden>
      <header>
        <nav role="tablist" aria-label="News, review, and briefs">
          <button role="tab" data-ltab="inbox" aria-selected="true">News</button>
          <button role="tab" data-ltab="review" class="learn-only" aria-selected="false">Review <span class="count" id="review-count-tab">0</span></button>
          <button role="tab" data-ltab="briefs" aria-selected="false">Briefs <span class="count" id="briefs-count-tab">0</span></button>
        </nav>
        <button class="ghost win-max-btn" data-max type="button" aria-label="Full screen" title="Full screen (or back)">⤢</button><button class="close" data-close-panel="left" aria-label="Close">✕</button>
      </header>
      <section class="ltab active" id="ltab-inbox" role="tabpanel"><div id="inbox-body" class="body"></div></section>
      <section class="ltab" id="ltab-review" role="tabpanel"><div id="review-body" class="body"></div></section>
      <section class="ltab" id="ltab-briefs" role="tabpanel"><div id="briefs-body" class="body"></div></section>
    </aside>

    <aside id="right-panel" class="sheet-panel right" aria-label="Details" hidden>
      <header>
        <nav id="right-tabs" role="tablist" aria-label="Details">
          <button role="tab" data-tab="inspector" aria-selected="true">Inspect</button>
          <button role="tab" data-tab="thesis" aria-selected="false">Ask</button>
          <button role="tab" data-tab="forecast" aria-selected="false">Forecast</button>
          <button role="tab" data-tab="hypotheses" aria-selected="false">Hypotheses</button>
          <button role="tab" data-tab="decisions" aria-selected="false">Decisions</button>
        </nav>
        <button class="ghost win-max-btn" data-max type="button" aria-label="Full screen" title="Full screen (or back)">⤢</button><button class="close" data-close-panel="right" aria-label="Close">✕</button>
      </header>
      <div id="right-body">
        <section class="tabpanel active" id="tab-inspector" role="tabpanel"></section>
        <section class="tabpanel" id="tab-thesis" role="tabpanel"></section>
        <section class="tabpanel" id="tab-forecast" role="tabpanel"></section>
        <section class="tabpanel" id="tab-hypotheses" role="tabpanel"></section>
        <section class="tabpanel" id="tab-decisions" role="tabpanel"></section>
      </div>
    </aside>
  </main>

  <footer id="bottom">
    <button id="btn-activity" class="tool" aria-expanded="false" title="The phase the model is in now. Click for the pipeline: learning and inference phases">
      <span class="dot" aria-hidden="true"></span><span id="phase-now">idle</span></button>
    <div id="timeline">
      <div id="timeline-track"></div>
      <input id="scrubber" type="range" min="0" max="0" value="0" aria-label="Timeline" title="Drag back to see the model as it was then (read-only); Back to live returns">
    </div>
    <span id="scrub-label" class="mono muted">live</span>
    <button id="btn-live" class="hidden">Back to live</button>
    <div id="pipeline" class="hidden" aria-label="Pipeline phases"></div>
  </footer>

  <section id="drawer" aria-label="Memory drawer">
    <header role="tablist">
      <h2>Long-term memory</h2>
      <button data-mtab="object" role="tab" aria-selected="true" title="A taxonomy over entities and superentities. Classifies new objects and supplies priors.">Object generalizations</button>
      <button data-mtab="interaction" role="tab" aria-selected="false" title="A taxonomy over causal interactions. Classifies new interactions and supplies priors.">Interaction generalizations</button>
      <button data-mtab="entity_memories" role="tab" aria-selected="false" title="Each entity's own long-term memory, which affects how it is used later.">Entity memories</button>
      <button data-mtab="frontier" role="tab" aria-selected="false" title="Co-movements not yet admitted as causal; promoted once verified.">Correlation frontier</button>
      <button data-mtab="prior" role="tab" aria-selected="false" title="Summarized past days (episodes) and the explanations stored with them; recall draws analogs from them.">Prior states</button>
      <div class="spacer"></div>
      <button class="ghost win-max-btn" data-max type="button" aria-label="Full screen" title="Full screen (or back)">⤢</button><button id="drawer-close" class="close" aria-label="Close the memory drawer">✕</button>
    </header>
    <div class="body" id="drawer-body"></div>
  </section>

  <div id="menu-root"></div>
  <div id="tooltip" class="hidden" role="tooltip"></div>
  <div id="modal-root"></div>
  <div id="toast" aria-live="polite"></div>
</body>
</html>
