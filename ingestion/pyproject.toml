[project]
name = "axelrod-ingest"
version = "0.1.0"
description = "Axelrod ingestion: documents in, import bundles out. Parsing, chunking, rules-first extraction, and the data lakehouse with keyword, prefix, semantic, and graph search."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pypdfium2>=5.14",
    "openpyxl>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
semantic = [
    "fastembed>=0.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axelrod_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["axelrod_ingest"]

[tool.coverage.report]
show_missing = true
skip_covered = false
