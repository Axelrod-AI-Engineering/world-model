# Acme's object taxonomy: a synthetic test fixture. Institutions, economies, and markets; every company has a share price driven by its profit.
root: gen:obj:root
nodes:
- id: gen:obj:root
  name: World Model
  parent: null
- id: gen:obj:institutions
  name: Institutions
  parent: gen:obj:root
  signature:
    required:
      kind:
      - agency
      - company
      - person
- id: gen:obj:public_institutions
  name: Public institutions
  parent: gen:obj:institutions
  signature:
    required:
      kind:
      - agency
- id: gen:obj:central_bank
  name: Central banks
  parent: gen:obj:public_institutions
  signature:
    required:
      function:
      - monetary_policy
    any_of:
      attribute_kinds:
      - policy_rate
  instances:
  - federal_reserve
  - ecb
  - boj
  - pboc
- id: gen:obj:companies
  name: Companies
  parent: gen:obj:institutions
  signature:
    required:
      kind:
      - company
  defaults:
  - slot: share_price
    name: share price
    attribute_kind: asset_price
    unit: local ccy
    mean: 100.0
    scale: 0.08
    features:
      per_share: 'true'
  default_links:
  - source: operating_profit
    target: share_price
    label: drives
    effect: 0.5
    kernel:
      delay_days: 1
      lag_days: 21
      duration_days: null
    generalization: gen:int:asset_repricing
  - source: net_interest_income
    target: share_price
    label: drives
    effect: 0.5
    kernel:
      delay_days: 1
      lag_days: 21
      duration_days: null
    generalization: gen:int:asset_repricing
  - source: trading_revenue
    target: share_price
    label: drives
    effect: 0.4
    kernel:
      delay_days: 1
      lag_days: 21
      duration_days: null
    generalization: gen:int:asset_repricing
