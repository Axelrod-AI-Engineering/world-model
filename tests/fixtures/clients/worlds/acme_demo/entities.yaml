# Acme's world (acme_demo): a synthetic test fixture. Invented companies and a macro layer of energy, prices, rates, the dollar, and credit.
# Written from scratch for the tests; nothing here describes a real company, market view, or client.
decision_variables:
- central_bank.policy_rate
entities:
- id: crude_oil
  name: Crude oil
  kind: market
  description: 'Crude oil: price and supply. A sustained rise feeds headline inflation within a quarter, lifts freight, and weighs on growth after
    two.'
  category_tags: &id001
  - MF
  features:
    market: commodity
  aliases:
  - oil
  - crude
  - oil prices
  subentities:
  - id: crude_oil.price
    name: Crude oil price
    attribute_kind: commodity_price
    unit: $/bbl
    family: lognormal
    mean: 85.0
    scale: 0.08
    aliases:
    - oil price
    - crude price
    - price of crude
    - crude oil
  - id: crude_oil.supply
    name: Crude oil supply
    attribute_kind: production_flow
    unit: index
    family: lognormal
    mean: 100.0
    scale: 0.04
    aliases:
    - oil supply
    - oil output
    - crude supply
    - supply outage
- id: economy
