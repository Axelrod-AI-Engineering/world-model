- id: am-c-tariff-na
  source: us_vehicle_tariffs.effective_rate
  target: acme_motors.north_america_operating_income
  label: weighs on North America profit above a tariff rate
  state:
    threshold:
      value: us_vehicle_tariffs.effective_rate
      above: 10.0
  effect:
    mu: -0.3
    sigma: 0.08
  kernel:
    delay_days: 30
    lag_days: 120
    duration_days: null
  transition:
    mechanism: Tariffs raise landed cost; absorbed in margin until the rate passes a level
    sign: '-'
    evidence:
      existence: documented
      direction: documented
      magnitude: assumption
      timing: assumption
      sources:
      - acme.pub
- id: am-c-incentive-na
  source: acme_motors.inventory_days
  target: acme_motors.incentive_spend
  label: raises incentives as inventory builds
  calibration: uncalibrated
  transition:
    mechanism: Dealers carrying more days of supply need more incentive to move units
    sign: +
    unresolved:
    - input: incentive per unit by model
      status: not_disclosed_in_reviewed_sources
      searched:
      - acme.pub
      - 'corpus: incentive per unit'
- id: am-c-prod-sales
  source: acme_motors.japan_production
  target: acme_motors.vehicle_sales
  label: supplies units
  effect:
    mu: 0.3
    sigma: 0.1
  kernel:
    delay_days: 15
    lag_days: 60
    duration_days: null
- id: am-c-sales-profit
  source: acme_motors.vehicle_sales
  target: acme_motors.automotive_operating_income
  label: lifts automotive profit
  effect:
    mu: 0.5
    sigma: 0.1
  kernel:
    delay_days: 15
    lag_days: 60
    duration_days: null
paths:
- id: am.path.yen_profit
  name: Yen to automotive profit
  entity_id: acme_motors
  trigger: the yen weakens
  endpoint: acme_motors.operating_profit
  description: The exporter path.
  steps:
  - interaction_id: m29
- id: am.path.tariff
  name: Tariffs to North America profit
  entity_id: acme_motors
  trigger: US tariffs rise
  endpoint: acme_motors.north_america_operating_income
  active_when: once the effective rate passes 10 percent
  steps:
  - interaction_id: am-c-tariff-na
- id: am.path.units
  name: Production to profit
  entity_id: acme_motors
  trigger: Japan production rises
  endpoint: acme_motors.automotive_operating_income
  steps:
  - interaction_id: am-c-prod-sales
    branch: units
  - interaction_id: am-c-sales-profit
compositions:
- id: am.comp.segments
  entity_id: acme_motors
  view: reporting_segments
  basis: operating profit by segment
  unit: ¥bn/yr
  period: fiscal year ending March
  total: acme_motors.operating_profit
  members:
  - acme_motors.automotive_operating_income
  - acme_motors.financial_services_operating_income
  - acme_motors.other_operating_income
  eliminations: acme_motors.segment_eliminations
- id: am.comp.regions
  entity_id: acme_motors
  view: regions
  basis: operating profit by region
  unit: ¥bn/yr
  period: fiscal year ending March
  total: acme_motors.operating_profit
  drives: false
  members:
  - acme_motors.north_america_operating_income
  - acme_motors.japan_operating_income
  residual: acme_motors.other_regions_operating_income
identities:
- id: am.id.revenue
  entity_id: acme_motors
  form: product
  target: acme_motors.net_revenue
  factors:
  - acme_motors.vehicle_sales
  - acme_motors.revenue_per_unit
  coefficient: 1.0
  unit_check: ¥bn = k units x ¥m
