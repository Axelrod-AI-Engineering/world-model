# Acme Motors: business construction
# A synthetic test fixture: invented companies and round numbers. Nothing here describes a real company or client.
entities:
- id: us_vehicle_tariffs
  name: US vehicle tariffs
  kind: external_factor
  category_tags:
  - SH
  description: The tariff rate on imported vehicles, as an effective rate.
  features:
    region: US
  subentities:
  - id: us_vehicle_tariffs.effective_rate
    name: US effective vehicle tariff rate
    attribute_kind: rate
    unit: pct
    family: gaussian
    prior:
      family: gaussian
      mu: 12.0
      sigma: 4.0
    scale: 4.0
    aliases:
    - vehicle tariffs
    - auto tariffs
subentities:
- entity: acme_motors
  id: acme_motors.automotive_operating_income
  name: Acme Motors automotive operating income
