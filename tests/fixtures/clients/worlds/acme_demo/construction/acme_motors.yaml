interactions:
- id: am-a-seg-auto
  source: acme_motors.automotive_operating_income
  target: acme_motors.operating_profit
  label: adds to operating profit
  edge_type: accounting
  effect:
    mu: 0.975
    sigma: 0.001
  kernel:
    delay_days: 0
    lag_days: 1
    duration_days: null
  transition:
    mechanism: Acme Motors automotive operating income is one part of Acme Motors operating profit; the weight is its scale over the total's
    timing:
      onset: same reporting period
      build: none
      persistence: identity
      recognition: quarterly results
    evidence:
      existence: documented
      direction: documented
      magnitude: model
      timing: documented
      sources:
      - acme.pub
- id: am-a-seg-fs
  source: acme_motors.financial_services_operating_income
