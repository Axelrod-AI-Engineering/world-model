- id: ab-c-fed-depcost
  source: federal_reserve.policy_rate
  target: acme_bank.deposit_cost
  label: passes a share of a rate move to deposit rates
  state:
    asymmetry:
      falls:
        mu: 0.78
        sigma: 0.06
      rises:
        mu: 0.87
        sigma: 0.08
  kernel:
    delay_days: 30
    lag_days: 180
    duration_days: null
  transition:
    mechanism: The bank reprices deposits by a fraction of a policy-rate move
    sign: +
    evidence:
      existence: documented
      direction: documented
      magnitude: broker
      timing: broker
      sources:
      - acme.pub
    unresolved:
    - input: deposit beta by segment
      status: not_yet_reviewed
- id: ab-c-fed-loanyield
