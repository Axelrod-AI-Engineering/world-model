    duration_days: null
- id: ab-c-cap-buyback
  source: acme_bank.cet1_ratio
  target: acme_bank.buybacks
  label: releases buybacks above the requirement
  effect:
    mu: 0.4
    sigma: 0.1
  state:
    threshold:
      value: acme_bank.cet1_ratio
      above: 12.0
  kernel:
    delay_days: 30
    lag_days: 90
    duration_days: null
paths:
- id: ab.path.rates_nii
  name: Policy rate to loan income
  entity_id: acme_bank
  trigger: the Fed raises the policy rate
  endpoint: acme_bank.interest_income
  steps:
  - interaction_id: ab-c-fed-loanyield
  - interaction_id: ab.id.loan_income:acme_bank.loan_coupon
compositions:
- id: ab.comp.revenue_by_line
  entity_id: acme_bank
  view: product
  basis: net revenue by line
  unit: $bn/yr
  period: fiscal year ending December
  total: acme_bank.net_revenue
  members:
  - acme_bank.nii_ex_markets
  - acme_bank.markets_revenue
  - acme_bank.ib_fees
  residual: acme_bank.other_revenue
- id: ab.comp.revenue_by_segment
  entity_id: acme_bank
  view: reporting_segments
  basis: net revenue by segment
  unit: $bn/yr
  period: fiscal year ending December
  total: acme_bank.net_revenue
  drives: false
  members:
  - acme_bank.consumer_revenue
  - acme_bank.wholesale_revenue
  residual: acme_bank.corporate_revenue
- id: ab.comp.nii
  entity_id: acme_bank
  view: product
  basis: 'net interest income: interest income less interest expense'
  unit: $bn/yr
  period: fiscal year ending December
  total: acme_bank.net_interest_income
  members:
  - acme_bank.interest_income
  - acme_bank.interest_expense
identities:
- id: ab.id.loan_income
  entity_id: acme_bank
  form: product
  target: acme_bank.interest_income
  factors:
  - acme_bank.avg_loans
  - acme_bank.loan_coupon
  coefficient: 0.01
  unit_check: $bn = $bn x % x 0.01
- id: ab.id.cet1_ratio
  entity_id: acme_bank
  form: ratio
  target: acme_bank.cet1_ratio
  numerator:
  - acme_bank.cet1_capital
  denominator:
  - acme_bank.rwa
  coefficient: 100.0
  unit_check: '% = $bn / $bn x 100'
- id: ab.id.nii_ex_markets
  entity_id: acme_bank
  form: difference
  target: acme_bank.nii_ex_markets
  of: acme_bank.net_interest_income
  minus:
  - acme_bank.markets_nii
stock_flows:
- id: ab.sf.cet1
  entity_id: acme_bank
  stock: acme_bank.cet1_capital
  period_days: 365
  inflows:
  - acme_bank.net_income
  outflows:
  - acme_bank.dividends
  - acme_bank.buybacks
matrices:
- id: ab.mx.revenue
  entity_id: acme_bank
  rows: ab.comp.revenue_by_line
  columns: ab.comp.revenue_by_segment
