# Acme's ready-made questions: a synthetic test fixture (invented companies; derived by renaming, nothing here describes a real company or client).
theses:
- id: S-T1
  question: 'The BoJ hikes to 1.5% while the Fed holds: JGB yields rise and the yen strengthens. Who gains and who is squeezed?'
  mode: scaffolded
  horizon_days: 180
  targets:
  - dollar_yen.usd_jpy
  - jgbs.yield_30y
  - acme_re.operating_profit
  - acme_mutual.operating_profit
  - acme_motors.operating_profit
  - acme_machinery.operating_profit
  - acme_telecom.operating_profit
  target_groups:
  - kind: superentity
    ref: G2
  - kind: superentity
    ref: G3
  event:
    kind: hypothetical
    event_type: policy
    occurred_at: 2026-10-15 00:00:00+00:00
    ops:
    - op: change_value
      target:
        kind: concrete
        subentity_id: boj.policy_rate
      delta: 0.5
      mode: absolute
      persistence: step
      intervention: true
      window_days: 270
      at: 2026-10-15 00:00:00+00:00
