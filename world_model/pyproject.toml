[project]
name = "axelrod-world-model"
version = "0.1.0"
description = "Axelrod World Model v0: an evidence-backed, event-sourced causal world model with a browser demo."
requires-python = ">=3.11"
dependencies = [
    "axelrod-ingest",
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.6",
    "networkx>=3.2",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "typer>=0.12",
    "python-multipart>=0.0.9",
    "mcp>=2.2,<3",
    "pyjwt[crypto]>=2.8",
]

[project.scripts]
axelrod = "axelrod_wm.cli:app"

[project.optional-dependencies]
semantic = [
    "axelrod-ingest[semantic]",
]

[tool.uv.sources]
axelrod-ingest = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "openapi-spec-validator>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axelrod_wm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: long-running tests (full scenario runs)",
    "integration: end-to-end flows across the service, MCP, lakehouse, engine, and snapshots (tests/integration/service)",
]

[tool.coverage.run]
branch = true
source = ["axelrod_wm"]

[tool.coverage.report]
show_missing = true
skip_covered = false
