# The production demo's own superentities (Oct 11), applied on top of the oil world's seeds after it loads, so the oil
# demo itself is unchanged. They add depth to the hierarchy: superentities of superentities, three levels deep.
#   Global tightening    > Stagflation squeeze > Energy price shock, Credit tightening; Yen carry trade; Deposit flight
#   Tech decoupling      > Semiconductor complex > AI chip supply chain, Chip packaging chain, GPU, foundry, and server
#                          CPU rivalries; US-China tech rivalry
#   Oil to airlines      > Oil producers, Airlines
# Members and interactions are the union of the parts' plus the boundary interactions that join them.
