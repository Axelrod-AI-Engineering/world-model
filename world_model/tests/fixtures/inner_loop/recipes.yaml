# Recipes for the synthetic suite in this folder: every operation and every way a case is blocked. Invented.
TST-01-01:
  op: calc
  inputs:
    q1: {question: 'is (\d[\d,]*) for Q1'}
    h1: {question: 'and (\d[\d,]*) for the half-year'}
  compute: {Q2: h1 - q1}
  show: [q1]
  facts: {kind: derived}
  unknowns: [the third quarter]
  assumptions: [same basis]
  period: second quarter
  unit: million
  units: {q1: thousand}
  mechanism: a difference of cumulative figures

TST-01-02:
  op: calc
  inputs:
    price: {fixture: fixture_inputs.price}
    units: {fixture: fixture_inputs.units}
    deep: {fixture: fixture_inputs.nested.deep}
  compute: {revenue: units * price, share: deep / 8}
  hide: [share]
  scope: {entity: synthetic}
  currency: CU
  basis: stipulated
  no_baseline_reason: a stipulated fixture
  no_evidence_reason: the fixture supplies its own inputs

TST-01-03:
  op: calc
  inputs:
    prior: {excerpt: T-001, after: 'Revenue', index: 0}
    now: {excerpt: T-001, after: 'Revenue', index: 1}
    cost_now: {excerpt: T-001, after: 'Costs', index: 1}
    cost_prior_negated: {neg: {excerpt: T-001, after: 'Costs', index: 0}}
    two_segments: {sum: [{excerpt: T-001, after: 'Segment A', index: 0}, {excerpt: T-001, after: 'Segment B', index: 0}]}
    from_here: {excerpt: T-001, after: '300', inclusive: true, index: 1}
    second_total: {excerpt: T-001, after: 'Total', nth: 0, index: 0}
  compute: {growth: now - prior, margin: now + cost_now, segments: two_segments, flipped: cost_prior_negated, tail: from_here, total: second_total}
  period: first quarter
  unit: million

TST-01-04:
  op: calc
  inputs:
    start: {excerpt: T-001, pattern: '\((\w+ \d+, \d{4}) through', kind: date}
    iso: {excerpt: T-001, pattern: 'Issued (2030-04-10)', kind: date, group: 1}
    note: {excerpt: T-001, pattern: '(figures exclude Unit Z)', kind: text}
    dash: {excerpt: T-001, pattern: 'Dividend\s*\n\s*(＝|－)', kind: text}
  compute: {start: start, note: note, dash: dash}
  facts:
    window: {excerpt: T-001, pattern: 'through (\w+ \d+, \d{4})', kind: date}
    stated: true
    nothing: null
    count: 3
  baseline: {selected: synthetic baseline}

TST-01-05:
  op: calc
  inputs:
    available: {source_of: T-001, field: availability_date, kind: date}
    cutoff: {question: 'by (April 1, 2030)', kind: date}
    version: {source_of: T-001, field: version, kind: text}
  compute: {usable: available <= cutoff, late: available > cutoff, version: version}

TST-01-06:
  op: reconcile
  entity: co
  composition: c.seg
  parts:
    attr.a: {excerpt: T-001, after: 'Segment A', index: 0}
    attr.b: {excerpt: T-001, after: 'Segment B', index: 0}
    attr.r: {const: 0}
    attr.e: {excerpt: T-001, after: 'Elimination', index: 0}
  total: {excerpt: T-001, after: 'Total', index: 0}
  compute: {check: reported - row_sum}
  unit: million

TST-01-07:
  op: calc
  inputs: {one: {const: 1}, zero: {const: 0}}
  compute: {bad: one / zero}

TST-01-08:
  op: calc
  inputs: {other: {excerpt: T-002, after: 'Other', index: 0}}
  compute: {x: other}

