TST-05-01:
  op: calc
  inputs: {a: {const: 3.5}, b: {const: -2}}
  compute:
    m: min(a, 9)
    mx: max(a, b)
    ab: abs(b)
    s: sum(a, b, 1)
    r: round(a * 3, 1)
    r0: round(a)
    lst: "[a, b]"
    pair: "(a, b)"
    notb: not (a < b)
    cmp: 1 < a < 9
    cmp2: 1 < a < 2
    bo: a > 1 and b < 0
    bo2: a < 1 or b < 0
    ifx: 5 if a > 3 else 6
    ifx2: 5 if a > 4 else 6
    up: +b
    fd: 7 // 2
    md: 7 % 4
    pw: 2 ** 3
    neq: a != b
    eq: a == a
    ge: a >= 3.5
    le: a <= 3.5
    gt: a > b
  show: [a]
  facts: {words: some text, flag: true}

