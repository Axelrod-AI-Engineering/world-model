# Unit tests on every pull request and on main. Railway deploys main by itself (.railway/railway.ts); this only
# reports whether the tests pass.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.2"
      - run: uv sync --frozen
      - run: uv run pytest tests/unit

  # Oct 17: the whole suite (not the slow scenario runs) with line and branch coverage. The ingestion pipeline, the
  # lakehouse, and the outward API must stay fully covered; everything else may not fall below coverage-floor.json.
  coverage:
    runs-on: ubuntu-latest
    # Oct 19: the suite outgrew 75 minutes under coverage (API v1, the construction rounds, the golden harness)
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.2"
      - run: uv sync --frozen
      - run: >
          uv run pytest -p no:cacheprovider --cov=axelrod_wm --cov-branch --cov-report=json:coverage.json
          --cov-report=term --junitxml=junit.xml
      - if: always()
        run: uv run python scripts/coverage_gate.py coverage.json --junit junit.xml --summary "$GITHUB_STEP_SUMMARY"
