# Unit tests on every pull request and on main. Railway deploys main by itself (.railway/railway.ts); this only
# reports whether the tests pass.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.2"
      - run: uv sync --frozen
      - run: uv run pytest tests/unit
