# PR A (the moves): the same three job names the restructure ends with, with plain test runs. PR B replaces the bodies of
# `ingestion` and `world_model` with the per-member coverage gate and adds the checks to `repo`. At this point
# ingestion's tests still import the world model, so both members are installed.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ingestion:
    name: ingestion
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.2"
      - run: uv sync --frozen --all-packages
      - name: tests
        working-directory: ingestion
        run: uv run --frozen --package axelrod-ingest pytest -p no:cacheprovider

  world_model:
    name: world_model
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.2"
      - run: uv sync --frozen --all-packages
      - name: unit tests first, for a fast failure
        working-directory: world_model
        run: uv run --frozen --package axelrod-world-model pytest -p no:cacheprovider tests/unit
      - name: the full suite
        working-directory: world_model
        run: uv run --frozen --package axelrod-world-model pytest -p no:cacheprovider

  repo:
    name: repo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.2"
      - run: uv sync --frozen
      # scripts/video has errors from before the restructure; nothing else may add one
      - run: uv run --frozen ruff check . --extend-exclude scripts/video
      - run: uv run --frozen pytest -p no:cacheprovider tests
