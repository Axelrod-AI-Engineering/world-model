# Three parallel jobs on every pull request and on main, one per concern. Railway deploys main by itself
# (.railway/railway.ts); this only reports whether the tests pass.
#
#   ingestion    the ingestion member alone: it installs only axelrod-ingest, so it cannot lean on the world model, and its
#                own tests cover every line and branch of its own source
#   world_model  the world model member (with ingestion installed beside it), the same gate for its own source
#   repo         the workspace as a whole: lint, the repository-level tests, the docs' tables of contents and diagrams
#   deploy       the world model as Railway runs it (Oct 26): every failed deploy so far built fine and then failed to boot,
#                which the other jobs never do. It builds the Dockerfile's image and boots it (scripts/deploy/boot_check.py),
#                and runs the checks that a state saved by one process restores in another
#
# The gate is scripts/coverage_gate.py: every source file of a member at 100% lines and branches, from that member's own
# tests (no client data: CI has none, and the member's tests run against the synthetic client).
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ingestion:
    name: ingestion
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.2"
      - run: uv sync --frozen --package axelrod-ingest
      - name: tests with coverage
        working-directory: ingestion
        run: >
          uv run --frozen --package axelrod-ingest pytest -p no:cacheprovider --cov --cov-report=json:coverage.json
          --cov-report=term --junitxml=junit.xml
      - name: coverage gate
        if: always()
        run: >
          uv run --frozen --package axelrod-ingest python scripts/coverage_gate.py ingestion/coverage.json
          --member ingestion --junit ingestion/junit.xml --summary "$GITHUB_STEP_SUMMARY"

  world_model:
    name: world_model
    runs-on: ubuntu-latest
    # the suite outgrew 75 minutes under coverage (API v1, the construction rounds, the golden harness)
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.2"
      - run: uv sync --frozen --all-packages
      - name: unit tests first, for a fast failure
        working-directory: world_model
        run: uv run --frozen --package axelrod-world-model pytest -p no:cacheprovider tests/unit
      - name: the full suite with coverage
        working-directory: world_model
        run: >
          uv run --frozen --package axelrod-world-model pytest -p no:cacheprovider --cov --cov-report=json:coverage.json
          --cov-report=term --junitxml=junit.xml
      - name: coverage gate
        if: always()
        run: >
          uv run --frozen --package axelrod-world-model python scripts/coverage_gate.py world_model/coverage.json
          --member world_model --junit world_model/junit.xml --summary "$GITHUB_STEP_SUMMARY"

  repo:
    name: repo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.2"
      - run: uv sync --frozen
      # world_model/scripts/video has errors from before the restructure; nothing else may add one
      - run: uv run --frozen ruff check . --extend-exclude world_model/scripts/video
      - run: uv run --frozen pytest -p no:cacheprovider tests
      - run: uv run --frozen python scripts/docs/toc.py --check
      - run: uv run --frozen python scripts/docs/diagrams.py --check

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.2"
      - run: uv sync --frozen --all-packages
      # the bug class behind the Oct 26 restarts, first, because it is the fastest: every set in the state is written
      # sorted, and a state hashes and restores the same under any hash seed
      - name: restart safety
        working-directory: world_model
        run: >
          uv run --frozen --package axelrod-world-model pytest -p no:cacheprovider --no-cov
          tests/unit/repo/test_set_fields.py tests/integration/test_hashseed_determinism.py
      - uses: docker/setup-buildx-action@v3
      - name: build the image Railway builds
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: world-model:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: boot it as Railway does, then restart it twice
        run: python3 scripts/deploy/boot_check.py --image world-model:ci --summary "$GITHUB_STEP_SUMMARY"
